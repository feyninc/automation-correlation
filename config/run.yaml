  - {name: GPT-5.5, model: openai/gpt-5.5, family: openai, context_window: 1050000, compact_tokens: 270000, released: 2026-04-23, price: {input: 5, output: 30, cache_read: 0.5, long_above: 272000, long_input_x: 2, long_output_x: 1.5}}
