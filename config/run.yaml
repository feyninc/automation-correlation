# The run: tested models, judges, the simulated worker. Model strings are passed to Inspect AI as is.
# Prices: USD per million tokens on the route used. speed: from OpenRouter's model page (p50 time to first token,
# throughput): scripts/speed.py snapshots them into data/openrouter/speed-<date>.csv. batch: true sends a judge's calls
# through its provider's batch API (OpenAI's, at half price); grade with --no-batch for quick checks.
run:
  cadence_minutes: 5
  speed_file: data/openrouter/speed-week-2026-10-20.csv   # p50 TTFT and throughput, offline call timing
  seeds: 1                 # runs of each week; scripts/run.py --seeds overrides it
  max_tool_calls_per_tick: 25
  max_output_tokens_per_call: 16000
  compact_at: 0.8          # compact the conversation at this share of the model's context_window
  overnight: compact       # between days: compact (a checkpoint), clear (a fresh conversation), or custom
  overnight_function: ""   # with custom: "module:function", called as compaction.compact is
  send_arm: false
  professions: all
  snapshots: [2026-01-01, 2026-04-30, 2026-07-31]   # run: each lab's newest model on or before each date, and its latest
  eci_factor: {value: 1.0, source: "ECI wages and salaries, May 2025 to the run quarter; set on 2026-10-30 release"}

user_model:
  name: Gemini 4 Argon (simulated worker)
  model: openrouter/google/gemini-4-argon
  family: google
  price: {input: 2, output: 10, cache_read: 0.1}
  generate: {reasoning_effort: medium}
  model_args: {provider: {order: [google-vertex/global], allow_fallbacks: false}}

defaults:
  generate: {reasoning_effort: medium}

models:
  # OpenAI, on OpenAI's API
  - {name: GPT-5.2, model: openai/gpt-5.2, family: openai, context_window: 400000, released: 2025-12-11, price: {input: 1.75, output: 14, cache_read: 0.175}}
