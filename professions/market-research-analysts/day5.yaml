# Friday 2026-11-06. Readout to the Pricing Committee at 15:00. Before it: Corinne's deck comments (she wants a price
# recommendation), the 48-hour read, Finance's forecast, the Vantorra decision, the sign-off log, the follow-up
# email's audience. After it: public stats signed off for Grant, Monica and Owen, and Dana's regional aggregates.
#
# Arithmetic: 48 h registrations 167 = 98 + 41 + 17 + 11. Mountain West (valid): n = 57; Q16 agree 41 (71.9%);
# automation users 30 (52.6%); ERP change planned 30 (52.6%); mean close 7.5 days; tool satisfaction 1-2: 15 (26.3%).
# Vantorra at 3 seats: 3 x $225 x 12 = $8,100 (up to $8,667 with the 7% uplift).

documents:
  - id: doc-48h
    app: docs
    path: exports/hubspot-cf-launch-48h
    title: "HubSpot: CF-Launch-NA, 48 hours"
    format: csv
    at: "D5 10:00"
    author: c_hubspot
    content: |
      metric,value
      registrations_zoom,167
      form_submissions_by_utm_source_linkedin,98
      form_submissions_by_utm_source_hubspot_email,41
      form_submissions_by_utm_source_organic,17
      form_submissions_by_utm_source_other,11
      email_clicks_unique,486
      unsubscribes,44
      mqls_from_registrations,52
  - id: doc-blog-final
    app: docs
    path: content/blog/state-of-ap-2026-final
    title: "Blog final: The State of AP 2026"
    at: "D5 16:20"
    author: c_grant
    content: |
      # The State of AP 2026: what 400 finance leaders told us

      1. 64% of finance leaders say their AP team spends too much time on manual invoice entry (73% at companies
         without AP automation).
      2. Teams that use AP automation close their books 2.3 days faster on average (6.3 vs 8.6 days).
      3. ERP change is a trigger: 45% plan an ERP change in 2027.
      4. The pain isn't about size: it's about automation.

      Methodology: online survey of 400 US finance decision-makers at companies with $50M-$1B revenue, recruited from
      opt-in B2B panels, October 19-30, 2026; results are not weighted.

  - id: doc-press-final
    app: docs
    path: content/press/state-of-ap-2026-release-final
    title: "Press release final: State of AP 2026"
    at: "D5 16:15"
    author: c_monica
    content: |
      # Arbeline research: nearly two-thirds of mid-market finance teams are still buried in manual invoice entry

      DENVER, Nov. 6, 2026 -- A new survey of 400 U.S. finance decision-makers from Arbeline, the AP automation
      company, finds that 64% say their AP team spends too much time on manual invoice entry, rising to 73% at
      companies without AP automation, and that teams using AP automation close their books 2.3 days faster on
      average. 45% plan an ERP change in 2027.

      Methodology: online survey of 400 U.S. finance decision-makers at companies with $50 million to $1 billion in
      revenue, recruited from opt-in B2B panels, October 19-30, 2026, fielded by Penmore Research; results are not
      weighted.

