  - id: doc-utm
    app: docs
    path: campaigns/utm-conventions
    title: UTM conventions
    content: |
      # UTM conventions

      All lowercase. utm_source = the platform (linkedin, google, capterra, g2, hubspot_email); utm_medium = paid_social,
      cpc, review_site, email; utm_campaign = the campaign slug (e.g. close_faster_q4); utm_content = the asset.
      GA4 treats values as case-sensitive, so "LinkedIn" and "linkedin" are different sources.

  - id: doc-campaign-brief
    app: docs
    path: campaigns/close-faster/brief
    title: Close Faster campaign brief
    content: |
      # Close Faster (Q4 2026)

      Offer: on-demand webinar "Close in 5 days: what the fastest AP teams do" plus the ARB-AP26 report (after
      release). Launch Wednesday 11/4 10:00 MT: email to the North America subscribed list (HubSpot list "NA
      subscribed - finance roles", about 19,000), LinkedIn paid social (Larkspur & Vane), Google search.
      Registration page: arbeline.com/close-faster. Goal: 400 registrations in 30 days, 120 MQLs.
      Reads: 24 h and 48 h after launch to #close-faster (Leah).

  - id: doc-battlecard
    app: docs
    path: sales/battlecards/kitecount
    title: "Battlecard: Kitecount (rev. 2026-08-14)"
    author: c_hiro
    content: |
      # Battlecard: Kitecount (rev. 2026-08-14)

      Who: AP automation for small and lower mid-market companies; strong in construction and property management.
      Pricing: $45 per user per month, minimum 10 users; implementation $2,500.
      Where we win: approvals for multi-entity companies, ERP sync (NetSuite, Sage Intacct, Dynamics), payments.
      Where they win: price for small teams, fast setup.
      Landmine questions: "How do you price when invoice volume grows?"

