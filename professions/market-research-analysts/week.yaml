    title: Customer NPS program
    content: |
      # Customer NPS program

      Quarterly email survey to customer admins and approvers (Customer Success owns the program; Insights owns the
      method and the numbers). NPS = % promoters (9-10) minus % detractors (0-6), on all responses. Segments: SMB,
      mid-market, enterprise. Q3 2026 wave: 9/14-9/28.

