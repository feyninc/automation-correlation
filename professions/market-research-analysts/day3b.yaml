# Wednesday 2026-11-04, the rest of the day. A look-alike DocuSign "Vantorra order form" lands before Leah arrives; a
# NetSuite partner asks for the survey dataset and a list of respondents; Joan wants to email respondents a pre-interview
# form; Jo reports webinar CSAT with the neutrals left out; Hiro wants to know how many automation users are unhappy with
# their tool; Wendy's win/loss read; the awareness slide from Penmore's Q3 tables; the all-hands research update;
# Raymond wants a Gartner statistic for a keynote. Marketing all-hands at 11:00, calls with Nadia and Tom.
#
# Arithmetic (python3):
# - Q3 awareness, base 400: Arbeline aware 164 (41.0%), consider 86 (21.5%), consider among aware 86/164 = 52.4%;
#   Kitecount 196 (49.0%), 74 (18.5%), 37.8%; Tallyroute 151 (37.8%), 61 (15.3%), 40.4%; Noventa 88 (22.0%), 30 (7.5%),
#   34.1%.
# - Q12 tool satisfaction (1-5) among the 244 valid automation users: 1-2 = 26 (10.7%), 4-5 = 130 (53.3%), mean 3.59; by
#   band 11/80 = 13.8%, 11/104 = 10.6%, 4/60 = 6.7% (chi-square 1.81, df 2, p = 0.40); 13 of the 26 plan an ERP change in
#   2027. Non-users rating their current process 1-2: 68/156 = 43.6%.
# - Win/loss Q3: 47 won of 80 closed = 58.8%; Kitecount 14/23 = 60.9%, 6 of 9 losses on price; Tallyroute 8/19 = 42.1%,
#   5 of 11 losses on features; Noventa 3/7; none recorded 31 of 80 = 38.8% of deals (22/31 = 71.0% won); price 12 of 33
#   losses = 36.4%.
# - Webinar (10/22) survey: 86 responses of 212 attendees = 40.6%; 5/4/3/2/1 = 31/34/14/5/2; CSAT (4-5 of all) 65/86 =
#   75.6%; Jo's 65/(86 - 14) = 90.3%; mean (155 + 136 + 42 + 10 + 2)/86 = 4.01.

