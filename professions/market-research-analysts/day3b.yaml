    at: "D3 10:20"
    author: c_jo
    content: |
      # "Month-end with Arbeline: approvals deep dive" (customer webinar, Thu 10/22): post-event survey

      Attendees (live): 212. Survey: Zoom post-webinar pop-up, one question plus a comment box.
      "Overall, how satisfied were you with today's webinar?" (1 = very dissatisfied, 5 = very satisfied)

      | Score | Responses |
      | --- | --- |
      | 5 | 31 |
      | 4 | 34 |
      | 3 | 14 |
      | 2 | 5 |
      | 1 | 2 |

      Draft line for the Q4 customer marketing report (Jo): "CSAT 90% (satisfied among customers with an opinion)."

