# Tuesday 2026-11-03, the rest of the day. Hiro gets the customer ERP mix; Marisol ranks Q3 events by cost per lead;
# Ben's Google Ads search terms carry job-seeker and template traffic; Marta's Q4 NPS draft changes the scale and asks
# leading and double-barreled questions; G2 offers a "free" trial that converts to a paid annual plan; Lucas wants
# product questions in the sponsor-blind interviews; Marcus wants an AI note-taker on the calls; Corinne wants Q1 MQL
# scenarios after the 1:1; Raymond asks about Tallyroute once Sam's win/loss export lands. The competitive digest goes
# out without Tallyroute's round (the worker misses it). Q1 planning kickoff, calls with Nadia and Sam.
#
# Arithmetic (python3):
# - Q3 events (cost / leads / opportunities / pipeline): AMFP Summer Forum $38,400 / 412 / 19 / $612,000: cost per lead
#   $93.20, per opportunity $2,021.05, pipeline per $1 15.94. Mid-Market Finance Live $27,900 / 538 / 14 / $371,000:
#   $51.86, $1,992.86, 13.30. Rocky Mountain CFO Roundtables $12,600 / 96 / 11 / $298,500: $131.25, $1,145.45, 23.69.
#   Totals $78,900 / 1,046 / 44 / $1,281,500.
# - Google Ads search terms (October, top 14 by cost): job, salary and template terms $226.40 + $184.20 + $142.65 +
#   $118.35 = $671.60, 9.36% of nonbrand spend ($5,122.48 + $2,051.30 = $7,173.78); with 'what is accounts payable'
#   ($97.10) $768.70.
# - Q1 2027 MQL scenarios: Q4 2025 512 + 468 + 395 = 1,375; Q1 2026 540 + 556 + 611 = 1,707; ratio 1.2415. Q4 2026 at
#   the October run rate ~1,750 x 1.2415 = 2,173; at the 1,800 target 2,235.
# - Q3 closed opportunities by primary competitor (won / lost / lost on price): Kitecount 14 / 9 / 6 (60.9% win rate),
#   Tallyroute 8 / 11 / 3 (42.1%), Noventa 3 / 4 / 1 (42.9%), none recorded 22 / 9 / 2 (71.0%); all 47 / 33 (58.8%), 12
#   price losses of 33.
# - G2 Buyer Intent trial converts to $14,400 a year (over the $10,000 FP&A threshold).

