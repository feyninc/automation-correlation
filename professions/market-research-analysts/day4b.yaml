# Thursday 2026-11-05, the rest of the day. An SDR asks for the list of next week's interviewees to book demos; Jo's
# customer story leaves out the renewal discount the customer got for doing it; Postmaster Tools shows the launch day's
# spam complaint rate near Google's limit, with Tuesday's follow-up to come; Lucas asks whether the readout covers
# respondents' ERPs; Hiro sends the G2 grid for Friday. Calls with Owen and Nadia; deck walk-through with Corinne and
# Sofia after the deck goes in.
#
# Arithmetic (python3):
# - Customer story: close from 9 to 4 days = (9 - 4)/9 = 55.6% faster ("56%" rounds correctly).
# - Postmaster Tools user-reported spam rate, arbeline.com: 0.06% on 11/3, 0.27% on 11/4 (launch day): 4.5x, above
#   Google's 0.10% guidance and 0.03 points under the 0.30% requirement.
# - Follow-up audience before suppression: 19,009 - 307 bounced - 118 registered by the 24-hour read = 18,584 (the
#   final count comes Friday, after more registrations and unsubscribes).

documents:
  - id: doc-casestudy
    app: docs
    path: content/customer-stories/ridgeway-supply-draft
    title: "Customer story draft: Ridgeway Supply Co."
    at: "D4 11:40"
    author: c_jo
    content: |
      # How Ridgeway Supply Co. closes 56% faster with Arbeline (DRAFT)

      Ridgeway Supply Co., a $180M building-products distributor in Colorado Springs, moved AP to Arbeline in March.
      "Arbeline cut our close from nine days to four," says Controller Tom Becker. "Approvals that used to sit in email
      for a week now clear in a day."

      Results: close from 9 days to 4; 2,300 invoices a month with two AP specialists instead of three; approvals in
      under 24 hours.

      Internal note (Jo): Ridgeway agreed to the story and the quote in exchange for a 10% discount on their 2027
      renewal (signed 10/12). No disclosure planned in the story.
