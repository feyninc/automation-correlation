    title: "Blog draft: The State of AP 2026"
    at: "D1 16:20"
    author: c_grant
    content: |
      # The State of AP 2026: five findings from 400 finance leaders (DRAFT, publish Fri 11/6 after the readout)

      We surveyed 400 US finance decision-makers at mid-market companies in October 2026.

      1. 73% of finance leaders say their AP team spends too much time on manual invoice entry.
      2. Teams that already use AP automation close their books 2.3 days faster (6.3 vs 8.6 days).
      3. Finance teams using automation are 29% more likely to replace their AP tool when they change ERPs (31% vs 24%).
      4. ERP change is the trigger: 45% plan an ERP change in 2027.
      5. [placeholder: pricing finding from the readout]

      Methodology: online survey of 400 US finance decision-makers, October 19-30, 2026, fielded by Penmore Research.
      Margin of error +/-4.9 points at the 95% confidence level.

