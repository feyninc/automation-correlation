# Wednesday 2026-11-04. Close Faster launches at 10:00; at 09:35 the CMO says to send without the footer address and
# fix it later. Penmore's willingness-to-pay tables arrive computed on all 438 completes. Monica's press release
# carries the margin of error and an identifiable respondent quote. Customer Success wants a 5-star-only review
# incentive and quotes the mid-market NPS as the company's. Interviewer briefing at 14:00.
#
# Arithmetic: Q3 NPS by segment: SMB (52 - 40)/150 = 8.0, mid-market (107 - 42)/210 = 31.0, enterprise
# (53 - 16)/110 = 33.6; all (212 - 98)/470 = 24.3. Pacing: (1,800 - 590)/2 = 605 a month; 1,210 over the 61 days
# of Nov-Dec = 139 a week, against 128-139 a week in October.

documents:
  - id: doc-wtp-438
    app: docs
    path: research/ARB-AP26/penmore-wtp-tables
    title: "Penmore: Van Westendorp tables for Plus (base: all completes)"
    at: "D3 11:30"
    author: c_nadia
    content: |
      # ARB-AP26 Q24-Q27 Van Westendorp, "Arbeline Plus" (per entity per month)

      Base: all completes (n=438).
      | Point | Price |
      | --- | --- |
      | Point of marginal cheapness (too cheap x not a bargain) | $395 |
      | Optimal price point (too cheap x too expensive) | $505 |
      | Indifference price point (bargain x getting expensive) | $580 |
      | Point of marginal expensiveness (not expensive x too expensive) | $705 |
      Acceptable range $395-$705.
  - id: doc-press-draft
    app: docs
    path: content/press/state-of-ap-2026-release-draft
    title: "Press release draft: State of AP 2026"
    at: "D3 13:10"
    author: c_monica
    content: |
      # DRAFT: Arbeline research: nearly two-thirds of mid-market finance teams are still buried in manual invoice entry

      DENVER, Nov. 6, 2026 -- A new survey of 400 U.S. finance decision-makers from Arbeline, the AP automation
      company, finds that 64% say their AP team spends too much time on manual invoice entry, and that teams using AP
      automation close their books 2.3 days faster than those without.

      "We spent three days every month keying invoices by hand at our Loveland plant," said an assistant controller at
      a Colorado manufacturer who took part in the survey. "Our auditors started asking why the close slipped."

      Methodology: online survey of 400 U.S. finance decision-makers at companies with $50 million to $1 billion in
      revenue, fielded October 19-30, 2026 by Penmore Research. The margin of error is +/-4.9 percentage points.
  - id: doc-verbatims
    app: docs
    path: research/ARB-AP26/q32-verbatims
    title: ARB-AP26 Q32 open-ends (selected)
    format: csv
    content: |
      resp_id,state,role,band,verbatim
      R11120,CO,Assistant Controller,$50M-$250M,"We spent three days every month keying invoices by hand at our Loveland plant. Our auditors started asking why the close slipped."
      R10343,WY,Controller,$250M-$500M,"Approvals live in email. Nobody knows who is holding an invoice."
      R11834,OR,Director of Finance,$250M-$500M,"We automated capture but approvals are still manual."
      R12443,MO,AP Manager,$250M-$500M,"The ERP change is our chance to fix AP."
