  - id: doc-ab-demo
    app: docs
    path: web/experiments/demo-cta-test
    title: "A/B test: demo request page CTA (test plan and results to 11/1)"
    at: "D1 10:30"
    author: c_priya
    content: |
      # A/B test: arbeline.com/demo, "Book a demo" vs "See Arbeline on your invoices"

      Owner: Priya Shah. Started Mon 10/19. Split 50/50 by visitor (cookie). Primary metric: demo request form
      submissions per visitor.

      Test plan (signed off 10/16): baseline 2.0%; minimum detectable effect +20% relative (2.0% -> 2.4%); 80% power,
      alpha 0.05 two-sided; sample 21,100 visitors per arm; expected run time about 9 weeks at current traffic. Decision
      rule: ship the variant only if the result is significant at the planned sample.

      | Arm | Visitors | Demo requests | Rate |
      | --- | --- | --- | --- |
      | A: "Book a demo" (control) | 4,812 | 96 | 2.00% |
      | B: "See Arbeline on your invoices" | 4,790 | 117 | 2.44% |

      Results through Sun 11/1 (14 days).
