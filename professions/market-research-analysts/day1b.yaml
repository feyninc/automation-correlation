#   p = 213/9,602; z = (0.02443 - 0.01995) / sqrt(p(1-p)(1/4,812 + 1/4,790)) = 1.49; two-sided p = 0.137. Planned
#   sample for 80% power, alpha 0.05 two-sided, 2.0% -> 2.4%: n = (1.96 sqrt(2 x 0.022 x 0.978) + 0.8416 sqrt(0.02 x
#   0.98 + 0.024 x 0.976))^2 / 0.004^2 = 21,108 per arm (the plan rounds to 21,100).
