actions:
  - {id: a1b-call-nadia, at: "D1 08:25", kind: noop, target: t1-penmore, minutes: 20, summary: "took a call from Nadia (Penmore) walking through the final data file's layout and column codes"}
  - {at: "D1 09:10", kind: read, target: t1b-gary, summary: "read a subscriber's request to be removed from the mailing list"}
  - {id: a1b-unsub, at: "D1 09:15", kind: new, app: chat, path: "@tyler/dm", target: t1b-tyler, to: [c_tyler], summary: "asked Tyler to unsubscribe Gary Ostrowski before Wednesday's send",
     body: "Tyler, Gary Ostrowski (gary.ostrowski@brightwaterfoods.com, Controller at Brightwater Foods) replied to the October AP Insider asking to be taken off our list. Can you set him to unsubscribed from all marketing email in HubSpot today, so he's out of Wednesday's Close Faster send? CAN-SPAM gives us 10 business days, but there's no reason to wait."}
  - {id: a1b-gary, at: "D1 09:20", kind: reply, target: t1b-gary, to: [c_gary], summary: "confirmed to Gary that he's being removed",
     body: "Hi Gary, sorry for the clutter. We're removing you from Arbeline's marketing emails today. Leah Brandt, Arbeline"}
  - {id: a1b-ben-am, at: "D1 09:25", kind: reply, target: t1b-ben, to: [c_ben], summary: "told Ben to code the valid 400 and that a code frame is coming",
     body: "Morning! Valid 400 only, not the 438 (cleaning log later today). I'll put a starter code frame in Docs by end of day. And yes please on the search terms, send them over before you add negatives."}
  - {id: a1b-complog, at: "D1 10:08", kind: edit, target: doc-competitor-log, summary: "logged Tallyroute's Series C in the competitor news log",
     content: "date,competitor,item,source,implication\n2026-09-08,Kitecount,Launched a Dynamics 365 Business Central connector,Kitecount press release,Our Dynamics ERP-sync advantage narrows; battlecard still claims it\n2026-10-01,Noventa,New CEO (ex-payments),Noventa press release,Watch for a payments push\n2026-10-20,Tallyroute,G2 Fall 2026 'High Performer' badge in AP Automation,G2,Expect them in more mid-market deals\n2026-11-02,Tallyroute,Raised $60M Series C to move upmarket ($100M-$1B revenue): multi-entity approvals and an ERP integration team,TechWire Daily via Google Alert,Moves into our core segment and our multi-entity win theme; tell Hiro for the battlecards\n"}
  - {id: a1b-erik, at: "D1 10:12", kind: reply, target: t1b-erik, to: [c_erik], cc: [c_monica], summary: "told the analyst the results come out Friday and looped in Monica",
     body: "Hi Erik, thanks for thinking of us. The State of AP 2026 results publish Friday 11/6 at 17:00 MT, and we're not sharing any findings before then, embargoed or not, so I can't help with Thursday's lock. After the release I'm glad to send the report and the full methodology (sample, field dates, recruitment) and set up a briefing. Monica Feld runs our analyst briefings; copying her. Best, Leah"}
  - {at: "D1 10:40", kind: read, target: t1b-priya-ab, summary: "read Priya's demo-page test results"}
  - {id: a1b-kristin, at: "D1 11:30", kind: reply, target: t1b-kristin, to: [c_kristin], cc: [c_corinne], summary: "gave Kristin her Friday morning availability",
     body: "Hi Kristin, Friday I'm free 9:00-10:00 and 11:00-12:00; after 13:00 I'm prepping for the 15:00 readout. 11:15 would be ideal so we can fold in Raymond's comments. Leah"}
  - {id: a1b-wendy, at: "D1 12:28", kind: reply, target: t1-leads-weekly, to: [c_wendy], summary: "gave Wendy the MQL-to-SQL ratio with its caveats",
     body: "Wendy: 26.6% this week (38 SQLs / 143 MQLs) vs 26.1% last week (35 / 134), so flat. Caveat: that's SQLs and MQLs created in the same week, not a cohort; most SQLs come from MQLs one to three weeks older, so read it as a ratio, not a conversion rate. And with Sam's change today (SQL = discovery meeting completed), next week's SQLs won't be comparable to this series. I can build a proper cohort view if useful."}
  - {id: a1b-call-marisol, at: "D1 14:05", kind: noop, target: cal-week, minutes: 10, summary: "took a call from Marisol about the Q3 events numbers she needs for the 2027 events plan"}
  - {id: a1b-ga4, at: "D1 14:12", kind: reply, target: t5-grant-utm, to: [c_grant], summary: "explained to Grant why GA4 explorations can't reach Q4 2024",
     body: "Explorations only reach back as far as our GA4 data retention, which is set to 14 months, so Q4 2024 isn't there (Q4 2025 is). Two options: (1) Q4 2024 vs Q4 2026 from the standard Landing page report with key events, which uses aggregated data and isn't affected by retention, but with fewer dimensions; or (2) Q4 2025 vs Q4 2026 as a full exploration. Which do you prefer?"}
  - {id: a1b-joan, at: "D1 14:55", kind: forward, target: t1b-joan-contract, to: [c_corinne], cc: [c_joyce], summary: "sent Joan's paperwork question to Corinne and Joyce",
     body: "Corinne, Joan Ellery is asking where to send her rate confirmation ($125 per completed interview, as in the spring) and a W-9 for the follow-up interviews. Contractor agreements are yours to approve; Joyce, could you send Joan the vendor setup form once Corinne confirms? Marcus will need the same. Leah"}
  - {id: a1b-runsheet, at: "D1 15:47", kind: edit, app: docs, path: research/ARB-AP26/readout-run-of-show, target: doc-runsheet, title: "ARB-AP26 readout: run of show (draft)",
     summary: "drafted the readout run of show for the planning meeting",
     content: "# ARB-AP26 readout, Fri 11/6 15:00-16:00: run of show (draft for Hiro and Corinne)\n\n| Time | Section | Presenter | Decision or ask |\n| --- | --- | --- | --- |\n| 15:00 | Why we ran it, what it can and can't say | Corinne | none |\n| 15:05 | Method: 400 valid of 438, opt-in panels, field 10/19-10/30, no margin of error | Leah | none |\n| 15:10 | Awareness and consideration (Q3) | Leah | none |\n| 15:18 | Pain points and close speed by automation use | Leah | none |\n| 15:28 | ERP change as the trigger | Leah | none |\n| 15:35 | Willingness to pay for Plus (Van Westendorp) | Leah | committee discusses the price band |\n| 15:45 | Implications for Q1 packaging | Hiro | committee decides next steps |\n| 15:55 | What we publish at 17:00 (signed-off stats only) | Leah | none |\n\nOpen items: WTP tables from Penmore Wednesday; deck to Corinne Thursday 17:00; dry run Friday 11:15 with Raymond. No pre-read: numbers are not final until Thursday."}
  - {id: a1b-planning, at: "D1 15:50", kind: noop, target: cal-week, minutes: 30, summary: "readout planning meeting with Hiro and Corinne"}
  - {id: a1b-codeframe, at: "D1 16:45", kind: edit, app: docs, path: research/ARB-AP26/q32-codeframe, target: doc-codeframe, title: "ARB-AP26 Q32 code frame (v1)",
     summary: "wrote the Q32 open-end code frame for Ben",
     content: "# ARB-AP26 Q32 code frame (v1), for Ben\n\nQ32: 'What is the hardest part of AP at your company today?' Base: the 400 valid completes (not the 438 delivered); code everyone who answered.\n\nCodes (multi-code, up to 3 per answer):\n1. Approvals stuck in email or with one approver\n2. Manual keying and re-keying\n3. ERP sync and coding errors\n4. No visibility into invoice status\n5. Vendor inquiries and duplicate payments\n6. Staffing and turnover\n98. Other (keep under 10%; if a theme appears 5+ times in Other, propose a new code)\n99. Nothing / don't know\n\nRules: code what they said, not what we sell; one answer can carry up to three codes. Report each code as a percent of respondents who answered (totals will exceed 100%), not as a percent of mentions. Double-coding: I'll code a random 10% blind and we compare agreement before you finish. Quotes for the deck: no names, companies, plants or places that could identify someone."}
  - {id: a1b-codeframe-note, at: "D1 16:48", kind: reply, target: t1b-ben, to: [c_ben], summary: "pointed Ben to the code frame",
     body: "Code frame v1 is in Docs > research > ARB-AP26 > q32-codeframe: eight codes, multi-code, percent of respondents. Valid IDs are in the cleaning log. Ping me with anything that doesn't fit."}
  - {id: a1b-priya, at: "D1 16:55", kind: reply, target: t1b-priya-ab, to: [c_priya], cc: [c_corinne], summary: "told Priya the test isn't significant yet",
     body: "Hi Priya, thanks for running this cleanly. B's 2.44% vs A's 2.00% looks good, but it isn't statistically significant yet: two-proportion z = 1.49, p = 0.14. Your plan sized the test for a 20% lift at a 2.0% baseline, which needs about 21,100 visitors per arm; we're at about 4,800, and stopping early when the line looks good is how false wins happen. I'd keep it running to the planned sample per the plan's decision rule, and for Thursday's MBR call it 'B trending ahead, not yet conclusive.' Leah"}

