      # Penmore Research invoice PEN-26-1187 (issued 2026-11-02)

      Bill to: Arbeline Software, PO 4500-2291, project ARB-AP26.
      | Item | Qty | Unit | Amount |
      | --- | --- | --- | --- |
      | Completes, US finance decision-makers | 438 | $58.00 | $25,404.00 |
