  - {id: a2-q16, at: "D2 15:25", kind: reply, target: t2-hiro, to: [c_hiro], summary: "sent Hiro the Q16 splits",
     body: "Q16 (manual entry is a pain), valid n=400: 64.0% overall. Non-users 73.1% (114/156) vs users 58.2% (142/244), a real difference (p=0.002). By band: 60.3% / 64.5% / 69.3% from smallest to largest, but the band differences aren't significant. So the pain is about automation, not size. Tables in Docs > research > ARB-AP26 > tables-q16."}
