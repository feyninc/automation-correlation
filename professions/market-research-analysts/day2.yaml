  - id: doc-kitecount-pricing
    app: docs
    path: research/competitors/kitecount-pricing-2026-11
    title: Kitecount pricing page (captured 11/3)
    at: "D2 08:05"
    author: c_alerts
    content: |
      # Kitecount pricing (kitecount.com/pricing, captured 2026-11-03 08:00)

      New from November 2: "Pay for what you process."
      - Growth: $0.95 per invoice processed, unlimited users, minimum $500 a month.
      - Scale (over 5,000 invoices a month): contact sales.
      - Implementation: $2,500 one-time.
      Existing customers move to per-invoice pricing at their next renewal.
