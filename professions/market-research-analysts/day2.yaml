# Tuesday 2026-11-03. Penmore's invoice arrives billed on 438 completes. Kitecount changes its pricing. The agency asks
# for unreleased Q1 packaging. Hiro wants Q16 by automation use and band; Owen wants survey numbers for a prospect
# before anything is signed off. Leah sends the October accruals and answers Tom. 1:1 with Corinne at 13:00.
#
# Arithmetic: invoice 438 x $58 = $25,404.00; valid 400 x $58 = $23,200.00; credit $2,204.00. Q16 agree: users
# 142/244 = 58.2%, non-users 114/156 = 73.1%, total 256/400 = 64.0%; by band 88/146 = 60.3%, 107/166 = 64.5%,
# 61/88 = 69.3%. Kitecount for a team with 15 AP users and 1,200 invoices a month: old 15 x $45 = $675, new
# 1,200 x $0.95 = $1,140 (+69%).

