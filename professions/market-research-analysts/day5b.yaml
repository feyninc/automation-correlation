  - id: doc-tom-q1-plan
    app: docs
    path: vendors/larkspur/q1-2027-media-plan-draft
    title: "Larkspur & Vane: Q1 2027 paid media plan (draft v1)"
    at: "D5 09:50"
    author: c_tom
    content: |
      # Arbeline Q1 2027 paid media plan (draft v1)

      Allocation basis: October leads by channel. LinkedIn 64 (Campaign Manager, incl. 7-day view-through), Google Ads
      49, Capterra 22, G2 6 (from Arbeline's October numbers). LinkedIn delivered 45% of leads.
      Proposal: LinkedIn 55% of Q1 paid budget (up from about 48% of October spend), Google 30%, review sites 15%.
      Creative themes: Close Faster, State of AP 2026 findings (after release), month-end benchmarks.

