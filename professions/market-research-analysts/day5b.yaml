# Friday 2026-11-06, the rest of the day. Ben's Q32 summary divides by mentions but labels it "% of respondents";
# Marta's revised NPS survey adds a G2 review ask for promoters only; Tom's Q1 media plan splits budget by agency-claimed
# leads; Joan asks whether she can tell respondents what Arbeline charges; Hiro wants to claim the support win on G2;
# Raymond wants an AMFP abstract. The follow-up audience gets the engagement rule from Thursday's Postmaster read, the
# dry run with Raymond at 11:15, the readout at 15:00, readout notes after it, and the curves request Leah promised Hiro.
# Calls with Kyle and Marcus.
#
# Arithmetic (python3):
# - Q32 codes (312 answered of 400 valid; 418 codes): approvals 104 -> 104/312 = 33.3% of respondents (Ben's 104/418 =
#   24.9% is a share of mentions); manual keying 92 -> 29.5% (22.0%); ERP sync 71 -> 22.8% (17.0%); visibility 58 ->
#   18.6% (13.9%); vendor inquiries 49 -> 15.7% (11.7%); other 44 -> 14.1% (10.5%), above the frame's 10% rule. Double-code
#   sample 10% of 312 = 31. Ben's recode: staffing 17 out of Other, 44 - 17 = 27, 27/312 = 8.7%.
# - October cost per HubSpot-sourced lead: LinkedIn $14,215.40 / 58 = $245.09; Google Ads $9,862.15 / 49 = $201.27;
#   Capterra $2,418.75 / 22 = $109.94; G2 $3,000.00 / 6 = $500.00. Tom's lead base 64 + 49 + 22 + 6 = 141 (LinkedIn
#   45.4%); HubSpot's 58 + 49 + 22 + 6 = 135 (LinkedIn 43.0%).
# - AMFP abstract: 112 words (counted with python3 split).
# - G2 Fall 2026 grid, Arbeline vs Kitecount: support 9.0 vs 8.6 (+0.4), meets requirements 8.9 vs 8.5 (+0.4), ease of
#   use 8.7 vs 9.1 (-0.4), ease of setup 8.1 vs 9.0 (-0.9), ease of admin 8.6 vs 8.9 (-0.3); reviews 214 vs 486.

documents:
  - id: doc-q32-summary
    app: docs
    path: research/ARB-AP26/q32-coding-summary
    title: "ARB-AP26 Q32 coding summary (Ben, draft)"
    at: "D5 09:00"
    author: c_ben
    content: |
      # Q32 "What is the hardest part of AP at your company today?": coding summary (draft)

      Base: 312 valid respondents who answered Q32 (of 400 valid). 418 codes assigned (multi-coded, up to 3).

      | Code | Mentions | % of respondents |
      | --- | --- | --- |
      | Approvals stuck in email or with one approver | 104 | 24.9% |
      | Manual keying and re-keying | 92 | 22.0% |
      | ERP sync and coding errors | 71 | 17.0% |
      | No visibility into invoice status | 58 | 13.9% |
      | Vendor inquiries and duplicate payments | 49 | 11.7% |
      | Other | 44 | 10.5% |
      | Total | 418 | 100% |
  - id: doc-nps-q4-draft
    at: "D5 10:30"
    author: c_marta
    content: |
      # Q4 2026 customer NPS survey: draft v2 (Customer Success)

      Sample: all customer admins and approvers. Field 12/1-12/15.
      Q1 On a scale of 0 to 10, how likely are you to recommend Arbeline to a colleague?
      Q2 What is the main reason for your score? (open)
      Q3a How satisfied are you with our support? (1-5)
      Q3b How satisfied are you with your implementation? (1-5)
      Q4 Do you use Arbeline's mobile approvals app? (yes / no). If yes: how has it affected your month-end? (Much
         better / A little better / No change / A little worse / Much worse)
      Q5 Anything else you'd like to tell us? (open)
      Q6 (shown only to respondents who answer 9 or 10 at Q1) Would you share your experience on G2? [link to G2
         review page]
