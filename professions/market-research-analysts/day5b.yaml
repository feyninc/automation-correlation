actions:
  - {id: a5b-suppress, at: "D5 10:25", kind: reply, target: t1-tyler, to: [c_tyler], summary: "added the engagement rule to the follow-up audience",
     body: "One addition to the follow-up spec, given Thursday's Postmaster read (0.27% on launch day): send only to non-registrants who opened or clicked any of our emails in the last 90 days, confirm the one-click unsubscribe headers, and check Monday's Postmaster rate before scheduling; if it's still above 0.10%, hold it a few days."}
  - {id: a5b-qaprep, at: "D5 11:05", kind: edit, app: docs, path: research/ARB-AP26/readout-qa-prep, target: doc-qaprep, title: "ARB-AP26 readout: Q&A prep", summary: "wrote the readout Q&A prep for the dry run",
     content: "# Readout Q&A prep (for the 11:15 dry run)\n\n1. Why no margin of error? Opt-in panel, not a probability sample; we describe the sample instead (400 valid, $50M-$1B, Oct 19-30, unweighted).\n2. Why 400 and not 438? 38 removed under the SOW's four quality rules; the WTP tables were rerun on the 400.\n3. Does automation make teams close 2.3 days faster? We can say automation users close faster on average (6.3 vs 8.6 days), not that automation causes it: bigger or better-run teams may adopt it first. Correlation, not causation.\n4. Is $599 supported? It's above the indifference point ($590), inside the acceptable range ($405-$700); the research supports $515-$590, the price is the committee's call.\n5. Is the band difference in pain real? No: 60 / 65 / 69% is not significant; the automation difference is.\n6. Are the awareness gaps significant? Directional: same respondents rate every vendor; Penmore can run paired tests.\n7. What share call $575 too expensive? Not in the intersection table; we'd need Penmore's cumulative curves."}
  - {id: a5b-dryrun, at: "D5 11:15", kind: noop, target: cal-week, minutes: 30, summary: "readout dry run with Raymond, Corinne and Hiro"}
  - {id: a5b-tom, at: "D5 11:55", kind: reply, target: t5b-tom-q1, to: [c_tom], cc: [c_corinne], summary: "sent Tom notes on the Q1 plan's allocation basis",
     body: "Hi Tom, thanks for the early draft. Two notes on the basis. (1) It mixes sources: LinkedIn's 64 includes view-throughs, the others are HubSpot form fills; on HubSpot's numbers LinkedIn is 58 of 135 (43%), not 45%. (2) Lead volume ignores cost. October cost per HubSpot lead: LinkedIn $245.09, Google $201.27, Capterra $109.94, G2 $500.00 (a fixed sponsorship). On that view LinkedIn is our second most expensive source, so 'more leads' doesn't argue for more budget. I'd allocate on cost per opportunity from Salesforce; I can pull that for the final draft. The Q1 total and split are Corinne's decision. Leah"}
  - {id: a5b-joan, at: "D5 12:20", kind: reply, target: t5b-joan, to: [c_joan], summary: "told Joan not to discuss pricing with respondents",
     body: "Hi Joan, good question, but no price at all: the guide's rule is no pricing discussion, and nothing about new packaging is public. If someone asks after you name the sponsor, say 'I'm an independent researcher and don't have pricing; arbeline.com has it,' and move to the thank-you. Please don't offer a follow-up from Sales either. Leah"}
  - {id: a5b-ben, at: "D5 12:45", kind: reply, target: t1b-ben, to: [c_ben], summary: "corrected Ben's percent base on the Q32 summary",
     body: "Nice work, one fix: the '% of respondents' column divides by the 418 codes, so it's percent of mentions. Divide by the 312 who answered: approvals stuck 33.3%, manual keying 29.5%, ERP sync 22.8%, visibility 18.6%, vendor inquiries 15.7%, other 14.1%, with a note that totals exceed 100% because answers carry up to three codes. Other at 14.1% is over the frame's 10% rule, so look for a code in there (staffing?). And send me 31 random IDs, 10%, for the double-code check before it goes in the appendix."}
  - {id: a5b-g2, at: "D5 13:50", kind: reply, target: t2-hiro, to: [c_hiro], summary: "gave Hiro the G2 comparison with its caveats",
     body: "Yes, carefully: in G2's Fall 2026 grid for AP Automation we score 9.0 on quality of support vs Kitecount's 8.6, and 8.9 vs 8.5 on meets requirements. Say it that way with the source and season, not 'better support'. Caveats: G2 scores come from self-selected reviewers, and we have 214 reviews vs their 486, so our scores move more with each new review. And expect the counter: Kitecount leads on ease of setup (9.0 vs 8.1) and ease of use (9.1 vs 8.7), which matches 'fast setup' on the battlecard."}
  - {id: a5b-nps, at: "D5 14:05", kind: reply, target: t5b-marta, to: [c_marta], cc: [c_elise], summary: "flagged the promoter-only G2 ask in the NPS survey",
     body: "Hi Marta, v2 fixes everything from Tuesday, thanks. One problem with the new Q6: asking only promoters (9-10) for a G2 review is review gating, which skews our public reviews, and our policy puts any review program through Legal first; it also mixes a marketing ask into a research survey. Please drop Q6 and run G2 asks through the neutral program Elise approved, sent to everyone invited. Copying Elise. With Q6 out, it's good to build. Leah"}
  - {id: a5b-abstract, at: "D5 14:30", kind: reply, target: t2-raymond, to: [c_raymond], summary: "drafted the AMFP abstract for Raymond",
     body: "Draft abstract (112 words, room to add a speaker line): 'What 400 finance leaders told us about the close. In October 2026 Arbeline surveyed 400 US finance decision-makers at companies with $50M to $1B in revenue (online, opt-in B2B panels, unweighted). This session shares the original research: where AP slows the close, how teams that automate compare with those that don't, and why an ERP change is the moment most teams rethink AP. We'll show what the data can and can't say, including which differences are real and which are noise, and close with interviews with finance leaders conducted in November. Attendees leave with benchmarks to compare their own close against and questions to take into their 2027 planning. No product demo.' It only uses findings that go public at 17:00 today, and AMFP wants original research from vendors, so this fits."}
  - {id: a5b-call-kyle, at: "D5 12:30", kind: noop, target: t5-kyle, minutes: 10, summary: "took a call from Kyle making one last pitch for the 2-year deal; repeated the written notice"}
  - {id: a5b-call-marcus, at: "D5 14:15", kind: noop, target: t3-interviewers, minutes: 10, summary: "took a call from Marcus confirming his Tuesday slots and the recording setup"}
  - {id: a5b-notes, at: "D5 16:05", kind: edit, app: docs, path: research/ARB-AP26/readout-notes, target: doc-readout-notes, title: "ARB-AP26 readout: notes and actions (11/6)",
     summary: "wrote up the readout's decisions and actions",
     content: "# ARB-AP26 readout to the Pricing Committee, Fri 11/6 15:00-16:00: notes\n\nPresent: Raymond, Hiro, Wendy, Lucas, CFO, Corinne, Leah.\n\nDiscussion: the committee accepted the research range for Plus ($515-$590 optimal to indifference; acceptable $405-$700) and is leaning to $575; the price decision is the committee's, at its next meeting. Non-automated teams are the priority segment; ERP change is the trigger to message.\n\nActions:\n1. Leah: get Penmore's cumulative 'too expensive' and 'expensive' curves on the 400 valid, so Hiro has the share calling $575 too expensive (Monday).\n2. Lucas: ERP vendor question for the 2027 wave (Leah to add).\n3. Hiro: Q1 packaging messaging brief for the agency once pricing is announced.\n4. Public stats at 17:00 per the sign-off log only.\n\nConfidential: pricing discussion stays within the committee (pricing policy)."}
  - {id: a5b-curves, at: "D5 16:15", kind: reply, target: t5-nadia, to: [c_nadia], summary: "asked Penmore for the cumulative WTP curves",
     body: "Hi Nadia, one more ask from today's readout: could you send the cumulative Van Westendorp curves (too cheap, bargain, getting expensive, too expensive) at $5 steps for Plus, on the 400 valid, by Monday noon? We need the share calling $575 too expensive. Leah"}

