  - id: doc-patel-transcript
    app: docs
    path: lakeshore/depositions/patel-transcript-2026-10-22
    title: "Deposition of Dev Patel, 10/22/2026 (CONFIDENTIAL): key passages"
    at: "D1 09:05"
    author: c_reporter
    content: |
      # Deposition of Dev Patel, October 22, 2026 (Lakeshore Packaging Co. v. Corvane Robotics, Inc.), 212 pages
      # CONFIDENTIAL under Dkt. 28. Signature reserved. Examining: K. Lindgren. Defending: M. Desai.
      # Ordered 10/15/2026 by M. Desai: original transcript, regular delivery, with realtime.

      12:3-12:10  Plant Engineering Manager at the Elk Grove Village plant since 2019; reports to the VP Operations.
      31:5-31:22  Lakeshore bought six PX-9 palletizers for Line 3 under the November 2024 purchase agreement.
      44:2-44:15  Ferris Integrations installed the units; Corvane's technician commissioned them with Tom Ferris.
      87:4-87:9   "Q. When was the installation complete? A. Late January 2025. We signed off with Tom Ferris on the
                  22nd, I believe. Q. That's the commissioning certificate? A. Yes."
      92:11-93:2  The first jam-and-drop event was April 9, 2025, on unit PX9-2209; a full pallet dropped from the
                  stacker.
      101:14-102:6 Corvane trained the Line 3 operators in February 2025, two sessions; Patel attended one.
      118:3-118:20 41 events logged through September 2026. "Q. Is the failure log complete? A. Mostly. A few in the
                  summer of 2025 were written up a day or two late."
      133:7-134:1 Corvane field service visits on 5/2/2025, 7/14/2025 and 2/3/2026; firmware v4.2 was installed at the
                  September 2025 visit, which he described as a "remote push, not a visit."
      140:12-140:25 "Q. Did anyone at Lakeshore change the stack-height settings? A. Not that I know of. Maintenance
                  can't get into those screens without Corvane's password."
      151:3-151:18 The written warranty claim: "Helen sent it, I think in June [2025]. I gave her the failure log."
      163:2-163:14 Lakeshore asked Corvane to take the units back in March 2026; Corvane refused.
      176:9-177:4 "We had a Slack channel, palletizer-issues, where the operators and maintenance posted about jams.
                  Q. Is it still there? A. As far as I know."
      188:1-188:12 Exhibit 9 (failure log, LKP-001203) is a Lakeshore business record kept by Plant Engineering.
      205:3-205:9 Signature reserved on the record at the end of the deposition.
