     summary: "sent Docketing the Halsted post-judgment dates",
     body: "Please docket for Halsted v. Corbin, No. 1:24-cv-11873 (matter 48807-002), triggering document Dkt. 141 (judgment entered Mon 11/2/2026; Dkt. 140 findings attached). Counting under FRCP 6(a)(1), day 1 is Tue 11/3:\n- Corbin's last day for a Rule 59(b) or 59(e) motion (28 days): Mon 11/30/2026. Cannot be extended (FRCP 6(b)(2)).\n- Corbin's notice of appeal (FRAP 4(a)(1)(A), 30 days): Wed 12/2/2026 (resets if a timely Rule 59 motion is filed).\n- Our bill of costs (LR 54.1(a), 30 days; costs other than the clerk's are waived if late): Wed 12/2/2026.\n- Our time and work records and rates to Corbin before the fee motion (LR 54.3(d)(4), 21 days): Mon 11/23/2026.\n- Our fee motion under Supply Agreement section 14.3 (LR 54.3(b), 91 days): Mon 2/1/2027.\nNone falls on a weekend or holiday. Andrew, please confirm; Grace, the 11/23 records date comes first.", att: [doc-halsted-judgment]}
