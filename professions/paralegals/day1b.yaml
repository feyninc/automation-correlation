# Monday 2026-11-02, added volume. Tessa carries about 35 active matters for Andrew Hale's team; besides Lakeshore v.
# Corvane this week runs on: Pemberton Holdings LLC v. Ash Logistics, Inc. (Cook County, 2024 L 008812; bench trial
# Mon 11/16-Wed 11/18, Andrew; the trial management order sets 11/6, 11/9, 11/10, 11/12, 11/13); Halsted Medical
# Supply, Inc. v. Corbin Health Partners LLC (N.D. Ill. 1:24-cv-11873, judgment for Halsted entered today); Northgate
# Credit Union v. Delmar Title & Escrow, LLC (N.D. Ill. 1:25-cv-07720, summary judgment due 11/20); Vanterpool v.
# Mercer Fabrication, Inc. (N.D. Ill. 1:25-cv-04466, settled); and from Tuesday Quinlan Ag Equipment Co. v. Fairmont
# Grain Cooperative (N.D. Ill. 1:26-cv-05190). Today: the Halsted judgment's post-judgment dates, the Patel errata
# deadline, the client asking for Attorneys' Eyes Only documents, the outgoing production missing its confidentiality
# legends, a stipulation that says "without prejudice", the trial exhibit and witness lists, an interrogatory count.
#
# Computations (python3, datetime):
# - Halsted judgment entered Mon 11/2 (Dkt. 141). FRCP 6(a)(1): exclude 11/2. Rule 59(b)/(e), 28 days: Mon 11/30.
#   FRAP 4(a)(1)(A), 30 days: Wed 12/2. LR 54.1(a) bill of costs, 30 days: Wed 12/2. LR 54.3(d)(4) time records to
#   Corbin, 21 days: Mon 11/23. LR 54.3(b) fee motion, 91 days: Mon 2/1/2027. None lands on a weekend or holiday.
# - Patel read-and-sign: Midwest's notice that the transcript is available, Mon 11/2. FRCP 30(e)(1), 30 days: Wed 12/2.
# - Last day to serve written discovery in Lakeshore so responses are due by the 1/29/2027 close: email service
#   (FRCP 5(b)(2)(E)) adds no days under 6(d), so 1/29/2027 - 30 days = Wed 12/30/2026 (12/30 + 30 = Fri 1/29);
#   12/31 + 30 = Sat 1/30, which runs to Mon 2/1, after the close. By mail (+3): 12/27 + 30 + 3 = Fri 1/29, so Sun
#   12/27 at the latest, in practice Thu 12/24.
# - Second interrogatories: first set Nos. 1-16 (16) + draft Nos. 17-27 (11) = 27 > 25 (FRCP 33(a)(1)); No. 21 has
#   three discrete subparts, which would make 29.
# - LAKESHORE-VOL003: staged LKP-004120-LKP-011877 = 11877 - 4120 + 1 = 7,758 pages; VOL002 ended at LKP-004118, so
#   the volume should start at LKP-004119 and run to LKP-004119 + 7,758 - 1 = LKP-011876.
# - Whitford invoice WEG-2610-17: 4.5 + 3.0 + 1.0 + 2.5 + 3.5 = 14.5 hours x $450 = $6,525.00, not 15.5 hours /
#   $6,975.00 (difference 1.0 hour, $450.00).
# - Pemberton witness list: 75 + 45 + 30 + 60 + 40 = 250 minutes of direct (4 h 10 min).
# - Exhibit binders: the order's 2 sets for the court + 1 for Ames, plus Ben's 2 working sets = 5 sets of 22 tabs.

