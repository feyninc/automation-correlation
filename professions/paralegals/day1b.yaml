    title: "Deposition of Ray Doucet, 3/18/2026 (Pemberton v. Ash): key passages"
    content: |
      # Deposition of Ray Doucet, March 18, 2026, Pemberton Holdings LLC v. Ash Logistics, Inc. (138 pages)
      # Examining: V. Ames. Defending: A. Hale.

      8:4-8:19    Warehouse operations manager for Ash since 2017; responsible for the Bensenville facility.
      22:6-23:3   The move-in condition report (March 2019) noted "worn" levelers at doors 2, 4 and 7.
      41:2-41:15  On June 9, 2023 a forklift clipped the track of dock door 4 and knocked the door off its track; he
                  wrote the incident report the same day.
      42:1-42:12  Ash told Pemberton's property manager on June 12, 2023; Pemberton's letter followed on June 14.
      43:5-43:20  Kelso Door Service replaced the track and two panels on June 30, 2023 (invoice of July 2); "the door
                  worked fine after that."
      44:3-44:18  "Q. After the Kelso repair, how was door 4 maintained? A. Same as the others. Regular preventive
                  maintenance every quarter, written up in the dock maintenance log."
      45:1-45:9   Tom Wiley, then facilities supervisor, arranged and supervised the Kelso repair.
      61:4-61:22  Move-out walkthrough with Lyle Pemberton on April 29, 2025; all dock doors opened and closed.
      62:1-62:10  "He looked at the levelers and said, that's what twenty years of trucks does."
      63:14-64:2  Ash's facilities team took 412 photographs on April 28, 2025.
      88:3-88:19  He took photos of the door 4 damage on his phone in June 2023: "I think I still have them."
      90:2-90:8   "Q. Did you give those photos to your lawyers? A. I don't think anyone asked me for them."
      112:7-113:1 Ash spent about $48,000 on dock leveler repairs in 2024 (capital expenditure report).
