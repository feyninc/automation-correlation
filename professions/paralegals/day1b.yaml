  - id: doc-trial-order
    app: docs
    path: pemberton/pleadings/trial-management-order
    title: "Pemberton v. Ash: trial management order (entered 9/29/2026)"
    content: |
      # Pemberton Holdings LLC v. Ash Logistics, Inc., No. 2024 L 008812, Circuit Court of Cook County, Law Division
      # TRIAL MANAGEMENT ORDER (Judge Evelyn Marchetti, entered 9/29/2026)

      1. Bench trial begins Monday 11/16/2026 at 10:00 a.m. in Courtroom 2208, Richard J. Daley Center; three days are
         allotted.
      2. By 5:00 p.m. Friday 11/6/2026 each party shall serve on the other, by email, its exhibit list and witness list.
         Exhibit lists shall state for each exhibit its number (Plaintiff PX-, Defendant DX-), a description, its date,
         its Bates number or other identifier, and whether the party will offer or may offer it. Witness lists shall
         state each witness's name and city of residence, the subjects of the testimony, whether the witness will
         testify live or by deposition, and a good-faith estimate of the time for direct examination, with the party's
         total estimated time.
      3. No exhibit or witness not disclosed in discovery may be used at trial absent leave of Court.
      4. Objections to exhibits, stating the grounds, shall be served by 5:00 p.m. Tuesday 11/10/2026.
      5. By 12:00 p.m. Thursday 11/12/2026 each party shall deliver to Courtroom 2208 two sets of its pre-marked exhibits
         in tabbed binders with an index (one for the Court, one for the witness stand) and serve one set on opposing
         counsel. The parties shall file a joint statement of uncontested facts by the same time.
      6. Responses to the pending motions in limine are due Monday 11/9/2026. The Court will rule at the final pretrial
         conference, Friday 11/13/2026 at 9:30 a.m.
      7. Demonstrative exhibits shall be exchanged by 5:00 p.m. on the day before their intended use.
