     subject: "Halsted v. Corbin: findings and judgment",
     summary: "sent Pat Lund the findings and judgment",
     body: "Dear Ms. Lund,\n\nAt Andrew Hale's request, attached are the Court's Findings of Fact and Conclusions of Law (Dkt. 140) and the Judgment (Dkt. 141), both entered today, November 2, 2026. The Judgment is in Halsted's favor in the amount of $1,284,600.00, with post-judgment interest and costs.\n\nAndrew will call you this week to discuss next steps.\n\nBest regards,\nTessa Novak | Senior Litigation Paralegal | Ostrander Hale LLP | 312-555-0186", att: [doc-halsted-judgment]}
