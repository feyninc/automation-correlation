     body: "Please docket for Lakeshore v. Corvane (41822-003): Dev Patel's review and signature of his 10/22 deposition transcript. Trigger: Midwest Reporting's notice that the transcript is available, Mon 11/2/2026 (email attached below). FRCP 30(e)(1) allows 30 days after that notice: day 1 is Tue 11/3, day 30 is Wed 12/2/2026. Please add a reminder for Wed 11/25. Mira, please confirm."}
  - {id: a1b-dev-errata, at: "D1 10:12", kind: new, app: mail, path: sent/patel-transcript-review, target: m1b-dev-errata, to: [c_dev], cc: [c_mira],
     subject: "Your deposition transcript to review and sign",
     summary: "sent Dev the transcript and errata instructions",
     body: "Hi Dev,\n\nYour 10/22 deposition transcript is ready for you to review. I've put the transcript and the errata sheet in a Kiteworks folder for you (link to follow from Kiteworks); please don't forward it, since it is designated CONFIDENTIAL under the protective order.\n\nThe signed errata sheet is due back to the court reporter by Wed 12/2. On the sheet you list any change, the page and line, and the reason, and sign it; if there are no changes you sign that too. Before you note anything other than a typo or a misspelled name, please talk with Mira first. I'll send you a reminder the week of 11/23.\n\nThanks,\nTessa"}
