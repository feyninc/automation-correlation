  - {id: a1b-mercer, at: "D1 11:05", kind: reply, target: t1b-mercer, to: [c_ben], summary: "flagged the 'without prejudice' wording to Ben",
     body: "Ben, Rosa's draft doesn't match the settlement agreement. Para. 3 of the agreement requires a stipulation of dismissal with prejudice, each party to bear its own attorneys' fees and costs; her draft says \"without prejudice\" and says nothing about fees and costs. Under Rule 41(a)(1)(B) a stipulated dismissal is without prejudice unless it says otherwise, so as drafted Vanterpool could refile. Suggested fix: \"stipulate to the dismissal of this action with prejudice, each party to bear its own attorneys' fees and costs.\" Timing: payment was received Fri 10/30, so her five business days run to Fri 11/6. Your call whether to tell Rosa; I haven't replied to her or OK'd your signature."}
