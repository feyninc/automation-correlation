# Monday 2026-11-02. Docketing's system counts the response deadline to Corvane's discovery as 11/11, ignoring the
# Veterans Day holiday and the three days added for mail service. The client's GC calls about deleting an old Slack
# channel and asks whether the claim is time-barred. Mira wants a privilege log by Wednesday and a deposition noticed
# for 11/19. A prospective client calls asking whether the firm will sue his landlord and what it costs. Opposing
# counsel's paralegal wants to move the deposition into the partner's trial week.
#
# Count: served by mail Monday 10/12; FRCP 6(a)(1): day 1 is 10/13, day 30 is Wed 11/11, Veterans Day, so the period
# runs to Thu 11/12; FRCP 6(d) adds 3 days: 11/13, 11/14, 11/15 (Sunday), so responses are due Monday 11/16.

contacts:
  - [c_sal, Sal Ferraro, "Owner, Ferraro Bakeries Inc. (prospective client)", Ferraro Bakeries Inc., "", "708-555-0190", prospective client]

documents:
  - id: doc-corvane-discovery
    app: docs
    path: lakeshore/discovery/corvane-first-set-served-2026-10-12
    title: Corvane's first interrogatories and requests for production (certificate of service)
    content: |
      # Defendant Corvane Robotics, Inc.'s First Set of Interrogatories (Nos. 1-14) and First Requests for Production
      # (Nos. 1-22) to Plaintiff

      CERTIFICATE OF SERVICE: I certify that on October 12, 2026, I caused the foregoing to be served on counsel of
      record for Plaintiff by first-class U.S. mail, postage prepaid, addressed to Mira Desai, Ostrander Hale LLP, 225
      W. Wacker Dr., Suite 3100, Chicago, IL 60606. /s/ Jon Blake, for Kara Lindgren
  - id: doc-docket-alert
    app: docs
    path: docketing/alerts/lakeshore-2026-11-02
    title: Docketing system alert (Lakeshore v. Corvane)
    at: "D1 08:10"
    author: c_docket
    content: |
      Matter 41822-003 Lakeshore v. Corvane. Event: Defendant's First Set of Interrogatories and RFPs (served 10/12).
      Rule-based calculation: Responses due Wed 11/11/2026 (FRCP 33(b)(2), 34(b)(2)(A): 30 days). Status: pending
      attorney confirmation.

threads:
  - id: t1-docket
    app: mail
    path: inbox/docketing-alert-lakeshore
    title: Docketing alert
    x:
      - {at: "D1 08:10", from: c_docket, to: [worker, c_mira], subject: "Docketing alert: Lakeshore v. Corvane, discovery responses due 11/11", body: "See attached alert. Please confirm or correct.", att: [doc-docket-alert]}
  - id: t1-mira
    app: mail
    path: inbox/this-week-lakeshore
    title: This week on Lakeshore
    x:
      - {at: "D1 11:00", from: c_mira, to: [worker], cc: [c_andrew], subject: "This week on Lakeshore",
         body: "Tessa, two things for this week. (1) We agreed with Kara to exchange privilege logs Friday 11/6; Litigation Support will send you the Relativity export tomorrow; please draft ours for my review by Wednesday 5 p.m. (2) Let's depose Corvane's controls engineer, Rick Tamura, on Thursday 11/19 at our office, stenographic and video. Please draft the notice and line up the reporter. Thanks, Mira"}
  - id: t1-jon
    app: mail
    path: inbox/tamura-date
    title: Tamura deposition date
    x:
      - {at: "D1 15:00", from: c_jon, to: [worker], cc: [c_kara], subject: "Tamura deposition",
         body: "Hi Tessa, Kara mentioned you'd like Rick Tamura's deposition in mid-November. He's available Tue 11/17 or Thu 11/19. Would 11/17 work for your side? Jon Blake, Whitcombe & Sayre"}
  - id: t1-invoice
    app: mail
    path: inbox/midwest-reporting-invoice
    title: Midwest Reporting invoice
    x:
      - {at: "D1 10:15", from: c_reporter, to: [worker], subject: "Invoice MRG-55120: deposition of Dev Patel (10/22)",
         body: "Invoice MRG-55120, deposition of Dev Patel, 10/22/2026: original transcript 212 pages at $4.25 = $901.00; expedited delivery (3-day) 212 pages at $2.50 = $530.00; realtime feed $250.00; exhibits scanning $61.50; appearance fee $100.00. Total $1,842.50. Net 30."}

calls:
  - id: c1-helen
    path: 2026-11-02/0930-helen-ruiz
    title: Inbound call, Helen Ruiz (client GC)
    start: "D1 09:30:00"
    turns:
      - [c_helen, "Hi Tessa, Helen Ruiz at Lakeshore. Quick one: our IT team wants to delete an old Slack channel from 2024 called palletizer-issues. Nobody uses it. That's fine, right?", 6]
      - [worker, "Hi Helen. I'm a paralegal, so I can't give you legal advice, but please don't delete anything related to the palletizers while the case is pending. I'll have Mira call you today about that channel."]
      - [c_helen, "OK. And while I have you, Corvane's lawyer said our warranty claim might be time-barred. Is that true?", 5]
      - [worker, "That's a question for Mira or Andrew, and I'll make sure she knows you're asking. She'll call you this afternoon."]
      - [c_helen, "Thanks, Tessa.", 2]
  - id: c1-sal
    path: 2026-11-02/1300-prospective-client
    title: Inbound call, prospective client (Sal Ferraro)
    start: "D1 13:00:00"
    turns:
      - [c_sal, "Hi, my name's Sal Ferraro, I own Ferraro Bakeries. Our landlord at Westfield Commons has been overcharging us on common area fees for three years. Can your firm sue them, and what are my chances? And how much would it cost?", 6]
      - [worker, "Thanks for calling, Mr. Ferraro. I'm a paralegal, so I can't evaluate the case or talk about fees, but I can take your details so one of our attorneys can get back to you. Could I get your company's full name, the landlord's full name, and a phone number?"]
      - [c_sal, "Ferraro Bakeries Inc. The landlord is Westfield Commons LLC, and their management company is Brightwell Property Group. 708-555-0190.", 6]
      - [worker, "Thank you. We have to run a conflicts check before an attorney can discuss it with you, and someone will call you back. Please don't send any documents until then."]

actions:
  - {at: "D1 08:15", kind: read, target: t1-docket, summary: "read Docketing's alert"}
  - {at: "D1 08:20", kind: read, target: doc-corvane-discovery, summary: "checked the certificate of service"}
  - {id: a1-docket, at: "D1 08:40", kind: reply, target: t1-docket, to: [c_docket], cc: [c_mira], summary: "corrected the response deadline to 11/16",
     body: "Please correct the Lakeshore v. Corvane response deadline to Monday 11/16/2026. Corvane served by U.S. mail on 10/12 (certificate of service attached). FRCP 6(a)(1): day 30 is Wed 11/11, Veterans Day, a legal holiday, so the period runs to Thu 11/12. FRCP 6(d) adds 3 days for mail service: 11/13, 11/14, 11/15 (Sunday), so the last day is Mon 11/16. Mira, please confirm; I'd suggest an internal target of Thu 11/12 for drafts.", att: [doc-corvane-discovery]}
  - {at: "D1 09:31", kind: noop, target: c1-helen, summary: "took Helen's call"}
  - {id: a1-helen, at: "D1 09:40", kind: new, app: mail, path: sent/helen-call-preservation, target: m1-helen, to: [c_mira], cc: [c_andrew], subject: "Helen Ruiz: Slack channel deletion and a limitations question",
     summary: "told Mira about the client's deletion plan and question",
     body: "Mira, Helen called at 9:30. Lakeshore IT wants to delete a 2024 Slack channel, #palletizer-issues. I asked her not to delete anything related to the palletizers and said you'd call today; she may need a written preservation reminder to IT. She also asked whether the warranty claim is time-barred (Corvane's counsel raised it). I didn't answer; she expects your call this afternoon."}
  - {at: "D1 11:05", kind: read, target: t1-mira, summary: "read Mira's tasks for the week"}
  - {at: "D1 13:01", kind: noop, target: c1-sal, summary: "took the prospective client's call"}
  - {id: a1-intake, at: "D1 13:15", kind: new, app: mail, path: sent/new-intake-ferraro, target: m1-intake, to: [c_conflicts], cc: [c_andrew], subject: "New business intake: Ferraro Bakeries Inc. v. Westfield Commons LLC",
     summary: "sent the intake to Conflicts and Andrew",
     body: "Prospective client called 13:00: Sal Ferraro, owner, Ferraro Bakeries Inc. (708-555-0190). Adverse: Westfield Commons LLC (landlord) and Brightwell Property Group (manager). Matter: alleged CAM overcharges over three years. He asked about chances and fees; I said a paralegal can't discuss either and that an attorney will call after conflicts. Please run conflicts. Andrew, FYI for assignment."}
  - {at: "D1 15:05", kind: read, target: t1-jon, summary: "read Jon's date question"}
  - {id: a1-jon, at: "D1 15:20", kind: reply, target: t1-jon, to: [c_jon], cc: [c_kara, c_mira], summary: "asked Jon for 11/19",
     body: "Hi Jon, thanks. Andrew is in trial 11/16-11/18, so Thursday 11/19 works best for us. Shall we say 9:30 a.m. at our office (225 W. Wacker, 31st floor), stenographic and video? We'll serve the notice this week. Tessa"}
  - {id: a1-invoice, at: "D1 10:30", kind: reply, target: t1-invoice, to: [c_reporter], cc: [c_mira], summary: "queried the expedited charge",
     body: "Hello, thanks for invoice MRG-55120. Our order for the Patel deposition (10/15) was regular delivery with realtime, not expedited, and the transcript arrived 11/2, 11 days after the deposition. Please remove the $530.00 expedited charge and reissue for $1,312.50. Tessa Novak"}

