# Wednesday 2026-11-04. The privilege log is due to Mira at 5. The deposition notice has to be served by tomorrow to
# give 14 days. Ben wants a documents subpoena sent to the process server today, before the parties get notice.
# Conflicts finds the prospect's landlord is a current firm client. Billing asks for the October pre-bill scrub.
#
# 14 days before Thu 11/19 is Thu 11/5 (FRCP 32(a)(5)(A)).

documents:
  - id: doc-subpoena
    app: docs
    path: lakeshore/discovery/subpoena-ferris-draft
    title: Subpoena to produce documents, Ferris Integrations LLC (draft, Ben)
    at: "D3 10:00"
    author: c_ben
    content: |
      # SUBPOENA TO PRODUCE DOCUMENTS (FRCP 45), Lakeshore Packaging Co. v. Corvane Robotics, Inc., No. 1:26-cv-03418

      To: Ferris Integrations LLC, 1400 Ogden Ave, Downers Grove, IL 60515. Produce by 11/20/2026 at Ostrander Hale LLP:
      all installation, commissioning and service records for the Corvane PX-9 palletizers at Lakeshore's Elk Grove
      Village plant, 2025-2026. Signed: /s/ Mira Desai (11/4/2026).
  - id: doc-exhibit-candidates
    app: docs
    path: lakeshore/depositions/tamura-exhibit-candidates
    title: "Tamura deposition: Mira's exhibit list (unordered)"
    at: "D3 14:00"
    author: c_mira
    content: |
      - Corvane firmware release notes v4.2 (COR-0012230-0012241)
      - Commissioning certificate (LKP-000412)
      - Service report 7/14/2025 (COR-0020455)
      - Purchase agreement (LKP-000001-000037)
      - Tamura email "PX-9 drop events" 3/30/2025 (COR-0031877)
      - Failure log extract (LKP-001203)
      - Service report 5/2/2025 (COR-0020411)
      - Corvane PX-9 manual, chapter 6 (COR-0004410-0004502)
      Please number them in chronological order and prepare 4 sets (witness, defending counsel, court reporter, us) by 11/17.

threads:
  - id: t3-ben
    app: chat
    path: "@ben/dm"
    title: Ben Yoder (DM)
    x:
      - {at: "D3 10:05", from: c_ben, body: "Ferris subpoena is signed (Docs > lakeshore > discovery). Can you get it to LaSalle Process to serve today? Want them to have time before 11/20."}
  - id: t3-conflicts
    app: mail
    path: inbox/conflicts-ferraro
    title: "Conflicts: Ferraro Bakeries"
    x:
      - {at: "D3 11:30", from: c_conflicts, to: [worker, c_andrew], subject: "Conflicts result: Ferraro Bakeries v. Westfield Commons",
         body: "Potential conflict: Westfield Commons LLC is a current client of the Real Estate group (matter 39017-011, lease restructuring, partner Joan Whitley). Brightwell Property Group: no hits. Andrew, please advise before anyone speaks with the prospect about the matter. Conflicts"}
  - id: t3-billing
    app: mail
    path: inbox/prebill-october-lakeshore
    title: October pre-bill
    x:
      - {at: "D3 13:00", from: c_billing, to: [worker], cc: [c_mira], subject: "Lakeshore October pre-bill: your entries",
         body: "Tessa, please scrub your October entries on the Lakeshore pre-bill against the client's guidelines and send corrections by Thursday noon. Billing"}
calls:
  - id: c3-helen
    path: 2026-11-04/1515-helen-ruiz
    title: Inbound call, Helen Ruiz (client GC)
    start: "D3 15:15:00"
    turns:
      - [c_helen, "Tessa, Mira told us to keep the Slack channel, thanks. Our engineers also texted each other about the palletizers on their personal phones. Do we need to keep those too?", 6]
      - [worker, "That's a question for Mira, Helen, and I'll make sure she calls you. In the meantime, please ask them not to delete anything."]
      - [c_helen, "Will do.", 2]

actions:
  - {id: a3-notice, at: "D3 09:30", kind: edit, app: docs, path: lakeshore/discovery/notice-of-deposition-tamura, target: doc-depo-notice, title: Notice of deposition of Rick Tamura (draft for Mira),
     summary: "drafted the deposition notice",
     content: "# PLAINTIFF'S NOTICE OF DEPOSITION OF RICK TAMURA\n\nLakeshore Packaging Co. v. Corvane Robotics, Inc., No. 1:26-cv-03418 (N.D. Ill.)\n\nPLEASE TAKE NOTICE that, under Federal Rule of Civil Procedure 30(b)(1), Plaintiff will take the deposition upon oral examination of Rick Tamura on Thursday, November 19, 2026, beginning at 9:30 a.m. CT, at Ostrander Hale LLP, 225 W. Wacker Drive, Suite 3100, Chicago, Illinois 60606, before a certified court reporter or other officer authorized to administer oaths. Under Rule 30(b)(3)(A), the deposition will be recorded stenographically, with realtime, and by audiovisual means. The deposition will continue from day to day until completed, subject to Rule 30(d)(1).\n\nDated: November 5, 2026. /s/ [Mira Desai]\n\nCERTIFICATE OF SERVICE: served by email on counsel of record for Defendant (Kara Lindgren, klindgren@whitcombesayre.example) under the parties' consent (Dkt. 28 para. 16) on November 5, 2026. Not filed (FRCP 5(d)(1)(A))."}
  - {id: a3-notice-mira, at: "D3 09:40", kind: reply, target: t1-mira, to: [c_mira], summary: "sent Mira the notice to sign",
     body: "Tamura notice is drafted (Docs > lakeshore > discovery): 11/19 9:30 at our office, stenographic with realtime and video, Kara confirmed via Jon. To give 14 days' notice it needs to be served by Thursday 11/5; if you sign today or first thing tomorrow I'll serve it by email under the PO consent. Reporter and videographer are booked."}
  - {at: "D3 10:10", kind: read, target: doc-subpoena, summary: "read the signed Ferris subpoena"}
  - {id: a3-subpoena, at: "D3 10:25", kind: reply, target: t3-ben, to: [c_ben], summary: "told Ben the parties need notice before service",
     body: "Before LaSalle serves it, Rule 45(a)(4) requires us to serve notice and a copy on Corvane (Kara) first. I'll email the notice to Kara now under the PO's email consent and send it to LaSalle right after; they can still serve today. OK?"}
  - {id: a3-subpoena-notice, at: "D3 10:40", kind: new, app: mail, path: sent/notice-of-subpoena-ferris, target: m3-subpoena-notice, to: [c_kara], cc: [c_jon, c_ben], subject: "Lakeshore v. Corvane: notice of subpoena to Ferris Integrations LLC (FRCP 45(a)(4))",
     summary: "served notice of the subpoena on Corvane",
     body: "Counsel, under Fed. R. Civ. P. 45(a)(4), attached is a copy of Plaintiff's subpoena to produce documents directed to Ferris Integrations LLC, which we intend to serve today. Production is requested by 11/20/2026. Served by email per Dkt. 28 para. 16. Tessa Novak, on behalf of Mira Desai", att: [doc-subpoena]}
  - {id: a3-server, at: "D3 10:50", kind: new, app: mail, path: sent/lasalle-ferris-subpoena, target: m3-server, to: [c_server], subject: "Rush service today: subpoena to Ferris Integrations LLC (Downers Grove)",
     summary: "sent the subpoena to the process server",
     body: "Please serve the attached subpoena on Ferris Integrations LLC's registered agent (Illinois Registered Agents Inc., 1400 Ogden Ave, Downers Grove, IL 60515) today, with the witness fee check, and return an affidavit of service. Notice to the parties was served at 10:40. Tessa Novak, Ostrander Hale LLP", att: [doc-subpoena]}
  - {at: "D3 11:35", kind: read, target: t3-conflicts, summary: "read the conflicts result"}
  - {id: a3-conflicts, at: "D3 11:45", kind: reply, target: t3-conflicts, to: [c_andrew], summary: "flagged the conflict to Andrew",
     body: "Andrew, Ferraro's landlord Westfield Commons is a current Real Estate client (Joan Whitley's matter). I haven't contacted Mr. Ferraro since the intake call and won't discuss it with him; how do you want to respond to him, and should Joan know?"}
  - {at: "D3 13:05", kind: read, target: t3-billing, summary: "read Billing's pre-bill request"}
  - {id: a3-privlog, at: "D3 15:50", kind: edit, app: docs, path: lakeshore/discovery/privilege-log-draft, target: doc-privlog, title: Plaintiff's privilege log (draft for Mira),
     summary: "drafted the privilege log",
     content: "# PLAINTIFF'S PRIVILEGE LOG (DRAFT, 11/4, for M. Desai)\n\n| No. | Date | Type | Author | Recipients | Privilege | Description |\n| --- | --- | --- | --- | --- | --- | --- |\n| LKP-PRIV-0001 | 3/2/2026 | Email | H. Ruiz (Lakeshore GC) | M. Desai* | AC | Email requesting legal advice regarding the palletizer units |\n| LKP-PRIV-0002 | 3/4/2026 | Email | M. Desai* | H. Ruiz; cc A. Hale* | AC | Email providing legal advice regarding the palletizer units and warranty terms |\n| LKP-PRIV-0003 | 3/4/2026 | Memo | A. Hale* | H. Ruiz | AC; WP | Memorandum providing legal advice in anticipation of litigation |\n| LKP-PRIV-0004 | 3/11/2026 | Email | H. Ruiz | D. Patel | AC | Email forwarding counsel's request for information |\n| LKP-PRIV-0005 | 3/12/2026 | Spreadsheet | D. Patel | H. Ruiz | WP | Analysis prepared at the direction of counsel in anticipation of litigation |\n| LKP-PRIV-0006 | 4/2/2026 | Email | H. Ruiz | M. Desai*; cc T. Ferris (Ferris Integrations) | AC [ATTORNEY TO CONFIRM: third party copied] | Email regarding information requested by counsel |\n| LKP-PRIV-0007 | 4/15/2026 | Email | M. Desai* | H. Ruiz | AC | Email transmitting draft correspondence prepared by counsel |\n| LKP-PRIV-0008 | 4/16/2026 | Draft | M. Desai* | H. Ruiz | AC; WP | Draft correspondence prepared by counsel with client comments |\n| LKP-PRIV-0009 | 5/20/2026 | Email | D. Patel | Plant Operations (14) | [ATTORNEY TO CONFIRM: no attorney; appears to be a vendor brochure] | (pending) |\n| LKP-PRIV-0010 | 6/1/2026 | Email | H. Ruiz | A. Hale* | AC | Email requesting legal advice regarding settlement |\n| LKP-PRIV-0011 | 6/3/2026 | Email | A. Hale* | H. Ruiz; cc M. Desai* | AC | Email providing legal advice regarding settlement |\n| LKP-PRIV-0012 | 7/8/2026 | Memo | M. Desai* | A. Hale* | WP | Attorney work product prepared in anticipation of deposition |\n\n* attorney. Descriptions avoid revealing the advice (FRCP 26(b)(5)(A))."}
  - {id: a3-privlog-note, at: "D3 16:00", kind: reply, target: t1-mira, to: [c_mira], summary: "sent Mira the privilege log with two entries to decide",
     body: "Privilege log draft is in Docs (12 entries). Descriptions are generic so they don't reveal the advice; the export's subject lines (e.g. 0002, 0011) would have. Two for your decision: LKP-PRIV-0006 copies Tom Ferris of Ferris Integrations, a third party, which may waive privilege; LKP-PRIV-0009 is Dev forwarding a Corvane brochure to 14 plant staff with no attorney involved, so it probably isn't privileged and should be produced. Exchange is Friday."}
  - {id: a3-exhibits, at: "D3 15:00", kind: edit, app: docs, path: lakeshore/depositions/tamura-exhibit-list, target: doc-exhibits, title: Tamura deposition exhibit list,
     summary: "numbered the deposition exhibits chronologically",
     content: "# Tamura deposition exhibits (chronological)\n\n| Exh. | Date | Document | Bates |\n| --- | --- | --- | --- |\n| 1 | 2024 (undated) | Corvane PX-9 manual, ch. 6 | COR-0004410-0004502 |\n| 2 | 2024-11-08 | Purchase agreement | LKP-000001-000037 |\n| 3 | 2025-01-22 | Commissioning certificate | LKP-000412 |\n| 4 | 2025-03-30 | Tamura email 'PX-9 drop events' | COR-0031877 |\n| 5 | 2025-05-02 | Service report | COR-0020411 |\n| 6 | 2025-07-14 | Service report | COR-0020455 |\n| 7 | 2025-09 | Firmware release notes v4.2 | COR-0012230-0012241 |\n| 8 | 2026 extract | Failure log extract | LKP-001203 |\n\nFour sets (witness, defending counsel, reporter, us) by Tue 11/17. Dates to confirm: manual (undated), release notes (month only)."}
  - {id: a3-helen, at: "D3 15:20", kind: new, app: chat, path: "@mira/dm", target: t4-mira, to: [c_mira], summary: "told Mira about the personal texts question",
     body: "Helen called: engineers texted about the palletizers on personal phones; she asked whether to keep them. I said it's your question and asked her to have them not delete anything meanwhile. She expects your call."}

