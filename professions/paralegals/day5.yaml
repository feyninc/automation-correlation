# Friday 2026-11-06. Privilege logs are exchanged today; Mira decided the two doubtful entries are produced. Ben's
# draft responses use general objections without saying what's withheld. The prospect calls back. Mira is out next
# Friday, when the joint status report is due, so its facts need gathering now. Time entries for the week.

documents:
  - id: doc-rfp-responses
    app: docs
    path: lakeshore/discovery/responses-to-corvane-rfps-draft
    title: Plaintiff's responses and objections to Corvane's RFPs (draft, Ben)
    at: "D5 10:00"
    author: c_ben
    content: |
      # PLAINTIFF'S RESPONSES AND OBJECTIONS TO DEFENDANT'S FIRST REQUESTS FOR PRODUCTION (draft 1)

      GENERAL OBJECTIONS: Plaintiff objects to each Request to the extent it seeks privileged material, is overly
      broad, unduly burdensome, or not proportional to the needs of the case.
      RFP 1 (purchase agreement): Subject to the General Objections, Plaintiff will produce.
      RFP 7 (all communications about the palletizers): Overly broad and unduly burdensome. Subject to and without
      waiving these objections, Plaintiff will produce responsive, non-privileged documents.
      RFP 15 (plant maintenance logs 2020-2026): Overly broad as to time.

threads:
  - id: t5-mira
    app: mail
    path: inbox/privilege-log-final
    title: Privilege log final
    x:
      - {at: "D5 09:10", from: c_mira, to: [worker], cc: [c_ben], subject: "Privilege log: final",
         body: "Tessa, good catches. 0006 and 0009: we'll produce both (Litigation Support to Bates them for production today). Take them off the log and serve the log on Kara this afternoon. Also, I'm out next Friday, so please start pulling the facts for the joint status report due 11/13. Mira"}
  - id: t3-ben
    app: chat
    path: "@ben/dm"
    title: Ben Yoder (DM)
    x:
      - {at: "D5 10:05", from: c_ben, body: "RFP responses draft 1 in Docs. Can you proof it and fix formatting before I send it to Mira?"}
  - id: t5-kara
    app: mail
    path: inbox/corvane-privilege-log
    title: Corvane's privilege log
    x:
      - {at: "D5 16:30", from: c_jon, to: [worker], cc: [c_kara], subject: "Corvane privilege log",
         body: "Tessa, Corvane's privilege log (31 entries) attached. Jon\n\n[Excerpt: entries 1-31 list date and 'attorney-client privilege'; 19 entries have no author or recipients; 12 describe documents only as 'email'; entry 27 is dated after the complaint and lists Rick Tamura and an outside engineering consultant as recipients.]"}

calls:
  - id: c5-ferris
    path: 2026-11-06/1100-ferris-integrations
    title: Inbound call, Ferris Integrations records custodian
    start: "D5 11:00:00"
    turns:
      - [c_ferris, "Hi, this is Lynn at Ferris Integrations. We got your subpoena for the Lakeshore installation records. Can we just send PDFs instead of paper, and who pays for the copying?", 5]
      - [worker, "Thanks for calling, Lynn. PDFs are great; I'll email you a secure upload link. For costs or the scope of the request, Ben Yoder, the attorney who signed it, will call you today."]
      - [c_ferris, "Sounds good.", 2]
  - id: c5-sal
    path: 2026-11-06/1400-sal-ferraro
    title: Inbound call, Sal Ferraro
    start: "D5 14:00:00"
    turns:
      - [c_sal, "Hi, Sal Ferraro again. Has anyone looked at my landlord thing? Are you going to take it?", 5]
      - [worker, "Hi Mr. Ferraro, thanks for calling back. Andrew Hale is sending you a letter today about it. I'm a paralegal, so he's the right person for any questions."]
      - [c_sal, "Can't you just tell me if it's a yes or no?", 4]
      - [worker, "I'm sorry, I'll leave that to Mr. Hale's letter, which you'll have by email today. He's also included a note about time limits, so please read it soon."]

actions:
  - {at: "D5 09:15", kind: read, target: t5-mira, summary: "read Mira's decision on the log"}
  - {id: a5-litsup, at: "D5 09:30", kind: new, app: mail, path: sent/litsup-produce-0006-0009, target: m5-litsup, to: [c_litsup], cc: [c_mira], subject: "Produce LKP-PRIV-0006 and 0009 today (privilege withdrawn)",
     summary: "asked Litigation Support to produce the two documents",
     body: "Mira has withdrawn privilege on LKP-PRIV-0006 and LKP-PRIV-0009. Please remove the privilege tags, Bates-number them as the next production (LAKESHORE-VOL004) and send me the production by 2 p.m. so it goes with the log."}
  - {id: a5-log, at: "D5 15:00", kind: new, app: mail, path: sent/serve-privilege-log, target: m5-log, to: [c_kara], cc: [c_jon, c_mira], subject: "Lakeshore v. Corvane: Plaintiff's privilege log and VOL004",
     summary: "served the privilege log and the new production",
     body: "Counsel, attached is Plaintiff's privilege log (10 entries), served by email per Dkt. 28 para. 16, together with Plaintiff's production volume LAKESHORE-VOL004 (2 documents). We look forward to receiving Corvane's log today. Tessa Novak, on behalf of Mira Desai", att: [doc-privlog]}
  - {at: "D5 10:10", kind: read, target: doc-rfp-responses, summary: "proofed Ben's draft responses"}
  - {id: a5-ben, at: "D5 10:50", kind: reply, target: t3-ben, to: [c_ben], summary: "flagged the objections problem to Ben",
     body: "Formatting fixed. One substantive point for you and Mira: Rule 34(b)(2)(C) requires each objection to state whether responsive materials are being withheld on that basis, and courts here disfavor boilerplate general objections. RFP 7 and RFP 15 don't say whether anything is withheld, and RFP 15 has no response at all. Also RFP 7's 'non-privileged' needs to match the privilege log. Your call on the wording; the deadline is 11/16."}
  - {at: "D5 14:01", kind: noop, target: c5-sal, summary: "took Sal Ferraro's call"}
  - {id: a5-sal-note, at: "D5 14:10", kind: new, app: mail, path: sent/ferraro-call-note, target: m5-sal-note, to: [c_andrew], subject: "Sal Ferraro called back",
     summary: "told Andrew the prospect called back",
     body: "Andrew, Mr. Ferraro called at 14:00 asking whether we'll take his matter. I said your letter is coming today and that it mentions time limits; nothing else. Is the signed letter ready to send?"}
  - {id: a5-jsr, at: "D5 16:00", kind: edit, app: docs, path: lakeshore/pleadings/joint-status-report-facts, target: doc-jsr, title: "Joint status report (due 11/13): facts gathered",
     summary: "gathered the facts for the joint status report",
     content: "# Joint status report due Fri 11/13 (Dkt. 44): facts as of 11/6\n\n- Written discovery: Plaintiff's first RFPs served 9/18; Corvane responded 10/19, no firmware change logs (RFP 11). Corvane's first interrogatories and RFPs served 10/12 by mail; Plaintiff's responses due 11/16.\n- Productions: Corvane VOL001-VOL003 (VOL003: 4,212 docs); Plaintiff through LAKESHORE-VOL004. One Corvane document clawed back under the 502(d) order (destroyed 11/5).\n- Privilege logs exchanged 11/6.\n- Depositions: Rick Tamura noticed for 11/19 (served 11/5). Third-party subpoena to Ferris Integrations served 11/4, return 11/20.\n- Disputes: RFP 11 (firmware change logs): meet-and-confer 10/28, impasse; motion to compel pending Mira's approval.\n- Scheduling: fact discovery closes 1/29/2027.\n- Logistics: Mira out 11/13 and Andrew in trial 11/16-18: report final by Thu 11/12; who covers the 11/18 hearing is open."}
  - {id: a5-time, at: "D5 16:30", kind: edit, app: docs, path: billing/tessa-week-2026-11-02, target: doc-time-week, title: Tessa's time, week of 11/2 (Lakeshore),
     summary: "entered her time for the week",
     content: "date,hours,narrative\n2026-11-02,0.3,Compute response deadline to Corvane's first discovery under FRCP 6(a) and 6(d); prepare docketing request\n2026-11-03,0.4,Analyze minute order (Dkt. 44); prepare docketing request and scheduling conflict memo\n2026-11-03,0.2,Review Corvane VOL003 flag; arrange sequestration of inadvertently produced document; notify M. Desai\n2026-11-04,1.8,Prepare privilege log (12 entries) from production review; identify entries for attorney determination\n2026-11-04,0.6,Draft notice of deposition of R. Tamura\n2026-11-04,0.4,Prepare and serve FRCP 45(a)(4) notice of subpoena to Ferris Integrations\n2026-11-05,1.1,Cite-check motion to compel against exhibits and meet-and-confer record\n2026-11-05,0.3,Draft non-engagement letter (Ferraro) [non-Lakeshore: intake]\n2026-11-06,0.5,Review draft responses to Corvane RFPs for Rule 34(b)(2)(C) compliance\n2026-11-06,0.7,Gather facts for joint status report\n(Not billed: reporter and room booking, process server dispatch, Litigation Support requests, time entry.)"}

  - {at: "D5 11:02", kind: noop, target: c5-ferris, summary: "took Ferris's call"}
  - {id: a5-ferris, at: "D5 11:10", kind: new, app: chat, path: "@ben/dm", target: t3-ben, to: [c_ben], summary: "asked Ben to call Ferris about costs",
     body: "Lynn at Ferris Integrations (records, 630-555-0370) called about the subpoena: PDFs are fine with us, and I'm sending a secure upload link. She asked who pays copying costs; I said you'd call today."}
  - {id: a5-corvane-log, at: "D5 16:50", kind: new, app: mail, path: sent/corvane-log-deficiencies, target: m5-corvane-log, to: [c_mira], cc: [c_ben], subject: "Corvane's privilege log: first-pass deficiencies",
     summary: "listed the deficiencies in Corvane's log",
     body: "Mira, first pass on Corvane's log (31 entries): 19 entries have no author or recipients and 12 describe documents only as 'email', so neither lets us assess the claim under Rule 26(b)(5)(A). Entry 27 lists an outside engineering consultant as a recipient, which may defeat privilege. Want me to draft a deficiency letter for you to send?"}

