    app: docs
    path: lakeshore/discovery/corvane-30b6-notice-lakeshore
    title: "Corvane's Rule 30(b)(6) notice of deposition of Lakeshore (served 11/4)"
    at: "D3 12:30"
    author: c_kara
    content: |
      # DEFENDANT'S NOTICE OF RULE 30(b)(6) DEPOSITION OF PLAINTIFF LAKESHORE PACKAGING CO.

      Corvane will take the deposition of Lakeshore Packaging Co. through one or more designees under Fed. R. Civ. P.
      30(b)(6) on Wednesday, December 9, 2026 at 9:30 a.m., at Whitcombe & Sayre LLP, 233 S. Wacker Dr., Suite 6100,
      Chicago, recorded stenographically and by video. Matters for examination (Schedule A): (1) Lakeshore's document
      retention policies and practices since 2024, including Slack and text messages; (2) the purchase and installation
      of the PX-9 units; (3) acceptance and commissioning; (4) operator training; (5) maintenance of the PX-9 units; (6)
      the failure log; (7) changes to PX-9 settings; (8) communications with Corvane about defects; (9) the warranty
      claim; (10) Lakeshore's request that Corvane take back the units; (11) alternative palletizers considered; (12)
      damages claimed; (13) Lakeshore's collection of documents in this case; (14) Lakeshore's answers to Corvane's
      interrogatories. Served by email per Dkt. 28 para. 16 on November 4, 2026. /s/ Kara Lindgren
