  - {id: a3b-sof, at: "D3 12:42", kind: new, app: mail, path: sent/northgate-sof-redaction-sealing, target: m3b-sof, to: [c_grace], cc: [c_andrew],
     subject: "Northgate SOF exhibits: redactions and sealing",
     summary: "sent Grace the redaction and sealing plan for the summary judgment exhibits",
     body: "Grace, here's how I'd run the 11/20 exhibits.\n\nRule 5.2(a) redactions (in every version we file):\n- Ex. 7 (NGT-000233) and Ex. 8 (DEL-001602-001603): originator and beneficiary account numbers to the last four digits.\n- Ex. 12 (DEL-002210-002214): Ms. Holloway's birth date to the year only.\n- Ex. 14 (NGT-000301-000306): the borrower's Social Security number to the last four digits.\n\nDelmar CONFIDENTIAL material (PO Dkt. 39 para. 12, provisionally under seal): Exs. 4, 5, 8, 9, 10 (only pp. 40-58 are designated; we cite 41-44 and 57), 11 and 12. Our SOF paragraphs quoting them will need matching redactions.\n\nLR 26.2(c) steps, all on 11/20: (1) e-file the public versions of the motion, SOF and exhibits with the CONFIDENTIAL portions redacted, and an exhibit sheet marked 'Fully Redacted' for any exhibit sealed in full; (2) provisionally file the complete unredacted set under seal, with the proposed redactions highlighted (or an 'Under Seal' watermark for whole exhibits); (3) file the sealing motion before or with the provisional filing, item by item, and notice it promptly; under the PO Delmar then has 14 days to support sealing. Per LR 26.2(e) the copies we serve on Delmar are complete. Dkt. 112 says no paper courtesy copies.\n\nIf you agree I'll have Litigation Support build the redaction set today and QC it tomorrow."}
  - {id: a3b-dx-final, at: "D3 13:24", kind: edit, app: docs, path: pemberton/trial/defendants-trial-exhibit-list, target: doc-dx-list, title: "Defendant's trial exhibit list (final for the 11/6 exchange)",
