  - {id: a3b-disclosures, at: "D3 14:30", kind: edit, app: docs, path: fairmont/pleadings/first-filing-disclosures-draft, target: doc-fairmont-disclosures, title: "Fairmont: Rule 7.1 statement, LR 3.2 notification, appearance forms (drafts)",
     summary: "drafted Fairmont's disclosure statement and notification of affiliates",
     content: "# Quinlan Ag Equipment Co. v. Fairmont Grain Cooperative, No. 1:26-cv-05190 (N.D. Ill.): first-filing papers (drafts for A. Hale; file with the first appearance or pleading, on or before Thu 11/19)\n\n## 1. Defendant's Rule 7.1 disclosure statement\n(a)(1) Fairmont Grain Cooperative has no parent corporation, and no publicly held corporation owns 10% or more of its stock. [CONFIRM with Lorraine Becker]\n(a)(2) Citizenship (jurisdiction is diversity, 28 U.S.C. 1332(a)): Fairmont Grain Cooperative is a corporation organized under the laws of Illinois [CONFIRM: incorporated under the Illinois Agricultural Co-operative Act; articles requested] with its principal place of business in Mendota, Illinois, and is therefore a citizen of Illinois. [If Fairmont turns out not to be incorporated, its citizenship would follow its members; Andrew to review.]\n\n## 2. Notification of affiliates (LR 3.2)\nAn affiliate is any entity or individual owning, directly or indirectly, 5% or more of the party (LR 3.2(a)). Draft: After a diligent review, Fairmont Grain Cooperative has identified no affiliates. [CONFIRM from the member equity report that no member owns 5% or more.] File as a PDF and enter the affiliates in CM/ECF as prompted (LR 3.2(e)).\n\n## 3. Appearance forms (LR 83.16)\nOne form each for Andrew Hale and Ben Yoder (individual attorneys, not the firm), filed before or with the first document. Ben's N.D. Ill. bar number and Andrew's trial bar status to be filled from their profiles.\n\n## Timing\nRule 7.1(b)(1) and LR 3.2(d): with the first appearance, pleading or motion. Answer or Rule 12 motion due Thu 11/19."}
  - {id: a3b-lorraine, at: "D3 14:36", kind: new, app: mail, path: sent/fairmont-disclosure-questions, target: m3b-lorraine, to: [c_lorraine], cc: [c_andrew],
     subject: "A few facts for Fairmont's first court filing",
     summary: "asked Lorraine for the ownership facts the disclosures need",
     body: "Hi Lorraine,\n\nWith Fairmont's first filing, the court requires two short statements about who owns Fairmont. Could you tell me, or send the documents that show:\n1. How Fairmont is organized: is it incorporated, and under which Illinois statute? (A copy of the articles is ideal.)\n2. Whether any company is Fairmont's parent, and whether any publicly held company owns 10% or more of its stock.\n3. Whether any member, company or individual, owns 5% or more of Fairmont, directly or through another entity (a member equity report would answer this).\nWe need it by early next week; the filing is due Thursday 11/19.\n\nThanks,\nTessa Novak, paralegal to Andrew Hale"}
