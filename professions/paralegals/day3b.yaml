sclosure) | May offer |\n| DX-20 | Pemberton's answers to Ash's first interrogatories | 2/3/2026 | served 2/3/2026 | May offer |\n| DX-21 | L. Pemberton Dep. Ex. 14, Calder bid comparison | 5/12/2026 | PEM-001215-001219 | May offer |\n| DX-22 | Ash dock safety audit | 9/12/2023 | ASH-002200-002214 | May offer |\n| DX-23 | Kelso Door Service work orders, dock door 4 | 2023-2025 | ASH-001881-001884 | Will offer |\n\n21 exhibits: will offer 10, may offer 11. DX-16 and DX-17 withdrawn (numbers kept). Every Bates range is within the produced volumes (production index). Defendant reserves the right to use any exhibit on Plaintiff's list and demonstratives exchanged under para. 7."}
