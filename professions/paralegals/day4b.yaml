  - {id: a4b-fairmont, at: "D4 13:45", kind: edit, app: docs, path: fairmont/pleadings/first-filing-disclosures-draft, target: doc-fairmont-disclosures, title: "Fairmont: Rule 7.1 statement, LR 3.2 notification, appearance forms (final drafts)",
     summary: "finalized Fairmont's disclosure drafts with Lorraine's facts",
     content: "# Quinlan Ag Equipment Co. v. Fairmont Grain Cooperative, No. 1:26-cv-05190 (N.D. Ill.): first-filing papers (final drafts for A. Hale; file with the first appearance or pleading, on or before Thu 11/19)\n\n## 1. Defendant Fairmont Grain Cooperative's Rule 7.1 disclosure statement\n(a)(1) Fairmont Grain Cooperative has no parent corporation, and no publicly held corporation owns 10% or more of its stock.\n(a)(2) Jurisdiction is based on diversity (28 U.S.C. 1332(a)). Fairmont Grain Cooperative is a corporation incorporated in Illinois in 1947 under the Illinois Agricultural Co-operative Act, with its principal place of business in Mendota, Illinois. It is a citizen of Illinois.\n\n## 2. Notification of affiliates (LR 3.2)\nAfter a diligent review, Fairmont Grain Cooperative has identified no affiliates. (Source: member equity report, 612 members, largest holding 1.2%, below LR 3.2(a)'s 5%. Fairmont's 30% interest in Prairie Rail Terminal LLC is an interest Fairmont holds, not ownership of Fairmont, so it is not reported.) File as a PDF and enter 'none' in CM/ECF as prompted.\n\n## 3. Appearance forms (LR 83.16)\nAndrew Hale and Ben Yoder, one form each, filed before or with the first document.\n\nAndrew to review and sign; Ben to file with the answer or Rule 12 motion."}
  - {id: a4b-fairmont-andrew, at: "D4 13:48", kind: reply, target: m3b-lorraine, to: [c_andrew], summary: "sent Andrew the finalized Fairmont disclosures",
     body: "Andrew, Lorraine's facts are in: incorporated in Illinois in 1947 under the Agricultural Co-operative Act, principal place of business Mendota, no parent, no public holder, largest member 1.2%. The 7.1 statement (with the (a)(2) citizenship statement for diversity) and the LR 3.2 notification ('no affiliates') are final drafts in Docs > fairmont. Fairmont's 30% of Prairie Rail Terminal isn't an affiliate because LR 3.2 counts owners of the party, not its investments. Appearance forms for you and Ben are ready to go with the 11/19 filing."}
