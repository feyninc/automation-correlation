  - {id: a4b-binder, at: "D4 09:55", kind: edit, app: docs, path: pemberton/trial/doucet-witness-binder-index, target: doc-doucet-binder, title: "Ray Doucet witness binder: index (for Tue 11/10 prep)",
     summary: "built Ray Doucet's witness binder index",
     content: "# Ray Doucet witness binder (Pemberton v. Ash), index for A. Hale, prep Tue 11/10 9:30\n\nTab A: Deposition of Ray Doucet, 3/18/2026 (Joy's excerpts by topic, full transcript behind).\n\n| Tab | Exhibit | Ray's connection | Deposition cites |\n| --- | --- | --- | --- |\n| B | DX-1 Industrial lease (3/1/2019), with Exhibit D rules | operated the facility under it | 8:4-19 |\n| C | DX-3 Move-in condition report (3/4/2019) | 'worn' levelers at doors 2, 4, 7 | 22:6-23:3 |\n| D | DX-5 Ash incident report, door 4 (6/9/2023) | he wrote it the same day | 41:2-15 |\n| E | DX-4 Pemberton letter re door 4 (6/14/2023) | received after Ash's 6/12 notice | 42:1-12 |\n| F | DX-6 Kelso invoice (7/2/2023) | repair of 6/30/2023 | 43:5-20 |\n| G | DX-23 Kelso work orders, door 4 (2023-2025) | repair and later service | 43:5-20; 44:3-18 |\n| H | DX-7 Dock maintenance log (2021-2025) | quarterly preventive maintenance after the repair | 44:3-18 |\n| I | DX-11 Move-out photographs (4/28/2025) | his facilities team took them | 63:14-64:2 |\n| J | DX-12 His email to L. Pemberton re walkthrough (4/29/2025) | author | 61:4-22; 62:1-10 |\n| K | DX-10 Arlo move-out inspection (4/30/2025) | Pemberton's inspection the day after the walkthrough | 61:4-22 |\n| L | DX-18 2024 capex report, dock levelers | about $48,000 of leveler repairs in 2024 | 112:7-113:1 |\n\nNot in the binder: DX-17 photos (withdrawn; never produced; he testified he still has them, 88:3-19 and 90:2-8, so Andrew may want to cover what he says if asked). Pemberton's exhibits that mention Ray to be added after Friday's exchange."}
  - {id: a4b-facts, at: "D4 10:30", kind: reply, target: t3-ben, to: [c_ben], summary: "flagged errors in Ames's proposed uncontested facts",
     body: "Ames's paras. 1-12 against our record: para. 2 says the lease is dated March 1, 2018; DX-1 is dated March 1, 2019 (and the move-in report is 3/4/2019). Para. 7 says Kelso repaired door 4 on July 2, 2023; that's the invoice date (DX-6); Ray testified the repair was June 30, 2023 (Doucet Dep. 43:5-20). Para. 6 says the forklift 'struck dock door 4'; Ray's testimony and DX-5 say it clipped the door's track, so you may want our wording. Paras. 3, 5 and 8-12 match the exhibits (DX-2, DX-3, DX-8, DX-10, DX-12, DX-13, DX-14); paras. 1 and 4 aren't covered by our exhibits. Your call on the edits."}
  - {id: a4b-sof, at: "D4 10:57", kind: reply, target: t4b-grace-sof2, to: [c_grace], cc: [c_andrew], summary: "flagged the paragraph and page limits to Grace",
     body: "Two procedural limits: (1) LR 56.1(d)(5): a movant's statement of material facts may not exceed 80 numbered paragraphs without the court's permission, and v2 has 86, so either trim 6 or ask leave before 11/20. (2) LR 7.1: no brief over 15 pages without prior approval of the court, and the memorandum is at 17; if you seek leave, a brief over 15 pages also needs a table of contents with page numbers and a table of cases. Both need leave before the filing, so a motion for leave would need to go in early next week. Your and Andrew's call which to cut."}
