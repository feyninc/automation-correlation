    at: "D4 10:15"
    author: c_litsup
    content: |
      # NGT SOF exhibits, redaction set 1 (Rule 5.2), with sealed versions

      | Page | Content | Redactions applied |
      | --- | --- | --- |
      | Ex. 7, NGT-000233 | Northgate wire confirmation: originator account, beneficiary account, amount $742,500.00, 3/14/2025 | 2 (originator and beneficiary account numbers to last four) |
      | Ex. 8, DEL-001602 | Delmar outgoing wire record, page 1: originator account, beneficiary account | 2 (both to last four) |
      | Ex. 8, DEL-001603 | Delmar outgoing wire record, page 2: wire confirmation block (beneficiary name, beneficiary account number, ABA routing number) | 0 |
      | Ex. 12, DEL-002210 | Holloway training record, page 1: date of birth | 1 (to year) |
      | Ex. 14, NGT-000302 | IC3 complaint, page 2: borrower's Social Security number | 1 (to last four) |

      Sealed versions: proposed redactions highlighted for Exs. 4, 5, 8, 9, 10 (pp. 40-58), 11, 12. "Fully Redacted"
      exhibit sheets prepared for Exs. 4, 5, 9, 11 and 12 per Grace. Files: NGT SOF exhibits redacted v1.zip (Kiteworks).
  - id: doc-fitz-decl
    app: docs
    path: northgate/sj/fitzgerald-declaration-draft
    title: "Declaration of Owen Fitzgerald (draft 2, with Owen's redline)"
    at: "D4 10:30"
    author: c_grace
    content: |
      # DECLARATION OF OWEN FITZGERALD (draft 2; Owen's redline of 11/4 not yet accepted)

      1. I am Associate General Counsel of Northgate Credit Union. I make this declaration from personal knowledge and
         Northgate's business records.
      4. On March 10, 2025, Northgate sent closing instructions to Delmar Title & Escrow, LLC. (Ex. 2.)
      5. On March 12, 2025, Northgate issued a payoff letter in the amount of $742,500.00. (Ex. 6.)
      6. On March 13, 2025, Northgate wired $742,500.00 to the account stated in the instructions Delmar sent. (Ex. 7.)
      7. Delmar's closer called the telephone number in the spoofed email on March 13, 2025. (Ex. 5.)
      9. Northgate's loss from the diverted wire is $742,050.00. [Owen's redline: "$742,500.00"]
      10. Northgate reported the fraud to the FBI's Internet Crime Complaint Center on March 17, 2025. (Ex. 14.)
      I declare under penalty of perjury that the foregoing is true and correct. Executed on ______, 2026.
      ______________ Owen Fitzgerald
  - id: doc-mil3-response
    app: docs
    path: pemberton/motions/response-to-mil-3-draft
    title: "Ash's response to Pemberton's MIL No. 3 (draft 2, Ben)"
    at: "D4 13:30"
    author: c_ben
    content: |
      # DEFENDANT'S RESPONSE TO PLAINTIFF'S MOTION IN LIMINE NO. 3 (draft 2, B. Yoder)

      p. 2: On June 9, 2023, a forklift clipped the track of dock door 4. (Doucet Dep. 41:2-15; DX-5.) Ash notified
      Pemberton three days later (id. 42:1-12; DX-4), and Kelso Door Service repaired the door on June 13, 2023
      (Doucet Dep. 43:5-20; DX-6). After the repair, door 4 received "routine preventive maintenance every quarter."
      (Doucet Dep. 42:3-18; DX-7.) Tom Wiley arranged and supervised the repair. (Id. 45:1-9.)
      p. 3: At move-out, Lyle Pemberton attributed the leveler wear to "twenty years of trucks." (Doucet Dep.
      62:1-10.) The 2023 incident and repair are therefore relevant to the condition of door 4 in April 2025.

