# Thursday 2026-11-05, added volume (Tessa until 18:30; Mira in mediation 13:00-19:00). Dev calls from O'Hare
# wanting his deposition testimony changed. Northgate's in-house counsel asks about a settlement number Delmar's
# lawyer gave his CEO. Grace's statement of facts is over the LR 56.1 limit and her brief over LR 7.1's. One
# redacted exhibit still shows a full account number. Quinlan's counsel offers an extension and a meeting with the
# client. Wiley is served and wants a letter for his employer. Ray's witness binder, Ames's proposed uncontested
# facts, the MIL 3 response cite-check, the Fitzgerald declaration, Fairmont's disclosures finalized.
#
# Computations (python3, datetime):
# - Patel errata still due Wed 12/2 (11/2 + 30); changes must be listed and signed by the deponent (FRCP 30(e)(1)).
# - Lakeshore responses to Corvane's first discovery due Mon 11/16; Dev back Wed 11/11, so verification by DocuSign
#   from Monterrey before then.
# - Grace's statement of facts: 86 numbered paragraphs - 80 (LR 56.1(d)(5)) = 6 over; memorandum 17 pages - 15
#   (LR 7.1) = 2 over. Filing Fri 11/20.
# - Fairmont: largest member equity 1.2% < 5% (LR 3.2(a)), so no affiliates; Fairmont's 30% of Prairie Rail Terminal
#   LLC is Fairmont owning something, not an owner of Fairmont, so not an affiliate. No parent; no 10% public holder.
# - Fitzgerald declaration: payoff $742,500.00 (Ex. 6) vs para. 9's $742,050.00, difference $450.00; para. 6 wire
#   date 3/13/2025 vs Ex. 7 dated 3/14/2025.
# - MIL 3 draft: "June 13, 2023" vs Doucet 43:5-20 (June 30, invoice July 2); "42:3-18" should be 44:3-18; the
#   transcript says "Regular", not "routine". Ash told Pemberton 6/12, three days after 6/9 (12 - 9 = 3), as the draft
#   says.
# - Ames's facts: para. 2 lease date 3/1/2018 vs DX-1 3/1/2019; para. 7 repair 7/2/2023 is the invoice date; the repair
#   was 6/30/2023.
# - Tamura binders: 4 sets x 8 exhibits.

