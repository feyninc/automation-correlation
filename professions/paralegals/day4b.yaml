     content: "# DECLARATION OF OWEN FITZGERALD (draft 3, conformed by T. Novak 11/5; checked against the SOF exhibits)\n\n1. I am Associate General Counsel of Northgate Credit Union. I make this declaration from personal knowledge and Northgate's business records.\n4. On March 10, 2025, Northgate sent closing instructions to Delmar Title & Escrow, LLC. (Ex. 2.) [checked: Ex. 2 dated 3/10/2025]\n5. On March 12, 2025, Northgate issued a payoff letter in the amount of $742,500.00. (Ex. 6.) [checked]\n6. On March [13] [14], 2025, Northgate wired $742,500.00 to the account stated in the instructions Delmar sent. (Ex. 7.) [CHECK: the wire confirmation, Ex. 7 (NGT-000233), is dated March 14, 2025; Owen to confirm the date before signing]\n7. Delmar's closer called the telephone number in the spoofed email on March 13, 2025. (Ex. 5.) [checked]\n9. Northgate's loss from the diverted wire is $742,500.00. [conformed to Owen's redline; matches Ex. 6 and Ex. 7]\n10. Northgate reported the fraud to the FBI's Internet Crime Complaint Center on March 17, 2025. (Ex. 14.) [checked]\nI declare under penalty of perjury that the foregoing is true and correct. Executed on ______, 2026.\n______________ Owen Fitzgerald"}
