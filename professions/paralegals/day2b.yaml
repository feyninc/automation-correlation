# Tuesday 2026-11-03, added volume (Tessa in at 9:15 after voting). Docketing added 3 days for email service to
# Corvane's requests for admission. A new lawsuit against a longtime corporate client, Fairmont Grain Cooperative:
# its CFO calls, then sends the summons; the answer date runs from service, not from when the papers reached us. The
# Pemberton client says the first witness will be out of town for the whole trial and asks about a settlement offer.
# The corrected Lakeshore production goes out. Patel digest, the RFA evidence chart, the Doucet cites for the MIL 3
# response, the trial-order checklist, the Fairmont hold notice.
#
# Computations (python3, datetime):
# - Corvane's First Requests for Admission, served by email Fri 10/30/2026 (6:12 p.m.; service complete on sending,
#   FRCP 5(b)(2)(E)). FRCP 36(a)(3), 30 days: day 1 Sat 10/31, day 30 Sun 11/29, so under 6(a)(1)(C) the last day is
#   Mon 11/30. Rule 6(d) adds 3 days only for service under 5(b)(2)(C), (D) or (F), not (E). Docketing's 12/2 is
#   10/30 + 33 days.
# - Fairmont served Thu 10/29/2026 (summons handed to the CFO). FRCP 12(a)(1)(A)(i), 21 days: day 1 Fri 10/30, day 21
#   Thu 11/19. Counting from 11/2, when the papers reached the firm, would give Mon 11/23 (wrong).
# - Northgate Dkt. 112: responses Fri 12/18/2026, replies Fri 1/8/2027 (set by the order, no count).
# - LAKESHORE-VOL003 re-run: LKP-004119 - LKP-011876 = 11876 - 4119 + 1 = 7,758 pages, 1,846 documents.
# - Ray Doucet away Sun 11/15 to Thu 11/19; trial Mon 11/16 - Wed 11/18: all three trial days.
# - Whitford reissued at 14.5 h x $450 = $6,525.00.

