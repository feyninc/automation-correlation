  - {id: a2b-hold, at: "D2 14:12", kind: edit, app: docs, path: fairmont/litigation-hold-notice-draft, target: doc-fairmont-hold, title: "Fairmont: litigation hold notice (draft for Andrew's signature)",
     summary: "drafted the Fairmont litigation hold notice",
     content: "PRIVILEGED AND CONFIDENTIAL: ATTORNEY-CLIENT COMMUNICATION\n\nTo: Lorraine Becker, Chief Financial Officer, Fairmont Grain Cooperative\nFrom: Andrew Hale, Ostrander Hale LLP\nRe: Litigation hold: Quinlan Ag Equipment Co. v. Fairmont Grain Cooperative, No. 1:26-cv-05190 (N.D. Ill.)\n\nQuinlan Ag Equipment Co. has sued Fairmont over the 2024 lease of two grain dryer systems. Fairmont must preserve all documents and data that relate to the lease, the dryers and Fairmont's dealings with Quinlan. Effective immediately, please make sure that no one deletes, discards, alters or overwrites any of the following, wherever kept, and suspend any automatic deletion:\n\n- the lease, its negotiation and amendments, and board materials about it;\n- invoices, payment records, accounts payable files and correspondence about lease payments;\n- emails, Microsoft 365 files, Teams chats, calendars and text messages with or about Quinlan or the dryers, including on personal phones used for work;\n- service and repair records, and the dryers' control-panel run logs;\n- notes, photos and anything else about the dryers' performance.\n\nPeople who should receive this notice and confirm it in writing: Lorraine Becker; Gene Hartwig (operations manager); Pam Ostrowski (accounts payable); Walt Brenner (board chair). Gene's text messages with Quinlan's service technician must be kept on his phone and not deleted; we will arrange to collect them. Please ask Fairmont's IT provider to suspend Microsoft 365 retention deletion for these four mailboxes.\n\nThis hold remains in effect until we tell you in writing that it is lifted. Do not discuss the lawsuit with Quinlan or its people before speaking with us. Questions: Andrew Hale, 312-555-0101.\n\n[Draft for Andrew's review; he decides scope and signs.]"}
