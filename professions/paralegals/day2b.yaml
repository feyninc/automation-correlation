  - {id: a2b-rfa-chart, at: "D2 16:50", kind: edit, app: docs, path: lakeshore/discovery/rfa-evidence-chart, target: doc-rfa-chart, title: "Corvane RFAs 1-12: what the record shows (for Mira)",
     summary: "charted the record against Corvane's RFAs",
     content: "# Corvane's First RFAs (Nos. 1-12): record chart (T. Novak, 11/3, for M. Desai). Responses due Mon 11/30.\nFacts only; admit, deny or object is Mira's call.\n\n| RFA | Subject | What the record shows | Need from client |\n| --- | --- | --- | --- |\n| RFA 1 | Installation complete 1/22/2025 | Commissioning certificate LKP-000412 (\"installation complete and accepted: January 22, 2025\", signed by D. Patel); Patel Dep. 87:4-9 (\"late January 2025 ... the 22nd\"). Conflict: Dev's draft answer to Interrogatory 6 (today) says March 2025. | Dev, through Mira |\n| RFA 2 | Accepted 1/22/2025 | LKP-000412 says \"complete and accepted\". Whether signing it was acceptance under the purchase agreement is a legal question. | Mira |\n| RFA 3 | Section 7.2 excludes operator misuse | Purchase agreement LKP-000001-000037, section 7.2 (text to quote in the response). | none |\n| RFA 4 | No written defect notice before 5/1/2025 | First Corvane field service visit 5/2/2025 (COR-0020411); first drop event 4/9/2025 (Patel 92:11-93:2); Tamura's own email \"PX-9 drop events\" of 3/30/2025 (COR-0031877) shows Corvane knew of drop events in March. No Lakeshore written notice before May found in our production. | Helen: any written notice in April 2025? |\n| RFA 5 | Lakeshore changed stack-height settings | Patel Dep. 140:12-25: not to his knowledge; screens need Corvane's password. | Dev / maintenance |\n| RFA 6 | Failure log records 41 events | LKP-001203; Patel Dep. 118:3-20 (41 through September 2026; some entries late); Dev's draft answer No. 8 (41). | none |\n| RFA 7 | Field service 5/2/2025 | COR-0020411; Patel Dep. 133:7-134:1. | none |\n| RFA 8 | Firmware v4.2 installed September 2025 | Patel Dep. 133:7-134:1 (remote push, September 2025); release notes COR-0012230-0012241 (AEO). | none |\n| RFA 9 | No written rejection within 30 days of installation | Patel Dep. 163:2-14: take-back request March 2026. Nothing earlier found. | Helen |\n| RFA 10 | Operator training February 2025 | Patel Dep. 101:14-102:6. | none |\n| RFA 11 | LKP-000412 is a true copy | Produced from Lakeshore's files; Patel Dep. 87:4-9 identifies it. | none |\n| RFA 12 | First written warranty claim 6/2/2025 | Patel Dep. 151:3-18 (\"I think in June\"); the letter itself is not in our production index. | Helen: the letter and its date |\n\nFLAG: RFA 1 and Dev's Interrogatory 6 answer must not contradict each other; raise before he verifies."}
  - {id: a2b-checklist, at: "D2 17:20", kind: edit, app: docs, path: pemberton/trial/trial-order-checklist, target: doc-trial-checklist, title: "Pemberton: trial management order checklist",
     summary: "built the trial-order compliance checklist",
