calls:
  - id: c2b-lorraine
    path: 2026-11-03/0945-lorraine-becker
    title: Inbound call, Lorraine Becker (Fairmont Grain CFO)
    start: "D2 09:45:00"
    turns:
      - [c_lorraine, "Hi, this is Lorraine Becker, CFO at Fairmont Grain in Mendota. Phil Granger told me to call Andrew Hale. We've been sued by Quinlan Ag, the company that leases us our grain dryers. A man handed me papers last Thursday. What do we do, and how long do we have?", 6]
      - [worker, "Thanks for calling, Lorraine. I'm Tessa Novak, Andrew's paralegal, so I can't advise you, but Andrew will call you today. Could you email me a scan of everything you were handed, and tell me the date and time you received it?"]
      - [c_lorraine, "I can do that this morning. Should I just call Dale Quinlan and try to work it out? We've known each other for years.", 5]
      - [worker, "That's a question for Andrew, and I'll ask him to call you before you talk to anyone at Quinlan. In the meantime, please keep every email, text and file about the dryers and the lease."]
      - [c_lorraine, "Will do. Thank you, Tessa.", 2]
  - id: c2b-carla
    path: 2026-11-03/1330-carla-benedetti
    title: Inbound call, Carla Benedetti (Ash Logistics GC)
    start: "D2 13:30:00"
    turns:
      - [c_carla, "Tessa, it's Carla. About Ray: he booked a family trip months ago. He flies to Phoenix on Sunday the 15th and comes back the 19th, so he'd miss the whole trial. Can't he just skip it? You have his deposition.", 6]
      - [worker, "Thanks for telling me, Carla. Whether Ray testifies live or some other way is Andrew's decision, and he'll want to know today because Ray is our first witness. Could you email me his exact travel dates and times, and whether the flights can be changed?"]
      - [c_carla, "Sure. And while I have you: Pemberton's lawyer offered 185,000 dollars to settle. Andrew said our odds are decent. Should we take it?", 5]
      - [worker, "That's a decision for you and Andrew. I'm a paralegal, so I can't advise on settlement, but I'll ask Andrew to call you about the offer today."]
      - [c_carla, "OK, thanks.", 2]

