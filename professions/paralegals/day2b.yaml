     subject: "Forensic export: Lakeshore #palletizer-issues Slack channel",
     summary: "arranged the forensic export of the client's Slack channel",
     body: "Please arrange a forensic export of Lakeshore's #palletizer-issues Slack channel with their IT contact, Priyanka Shah (pshah@lakeshorepkg.example): full history from creation, with threads, edits, deletions where available, files and member list, through Slack's export tools run by Lakeshore IT with your team on the call. Please document the chain of custody (who ran it, when, hash values) and load it to the Lakeshore Relativity workspace as its own custodian source, not for review until Mira says. Helen has confirmed the deletion is paused and retention is off."}
