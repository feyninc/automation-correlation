  - id: doc-corvane-rfas
    app: docs
    path: lakeshore/discovery/corvane-first-rfas-served-2026-10-30
    title: "Corvane's first requests for admission (served 10/30 by email)"
    content: |
      # Defendant Corvane Robotics, Inc.'s First Requests for Admission to Plaintiff (Nos. 1-12)

      1. Admit that installation of the PX-9 units at Lakeshore's Elk Grove Village plant was complete on January 22,
         2025.
      2. Admit that Lakeshore accepted the PX-9 units on January 22, 2025.
      3. Admit that section 7.2 of the Purchase Agreement excludes from warranty coverage damage caused by operator
         misuse.
      4. Admit that Lakeshore did not notify Corvane in writing of any defect in the PX-9 units before May 1, 2025.
      5. Admit that Lakeshore personnel changed the PX-9 stack-height settings after installation.
      6. Admit that the failure log produced as LKP-001203 records 41 events.
      7. Admit that Corvane performed field service on the PX-9 units on May 2, 2025.
      8. Admit that firmware release v4.2 was installed on the PX-9 units in September 2025.
      9. Admit that Lakeshore did not reject the PX-9 units in writing within 30 days after installation.
      10. Admit that Lakeshore's operators received Corvane's PX-9 operator training in February 2025.
      11. Admit that the document produced as LKP-000412 is a true and correct copy of the commissioning certificate.
      12. Admit that Lakeshore first asserted a warranty claim in writing on June 2, 2025.

      CERTIFICATE OF SERVICE: served on counsel of record for Plaintiff by email under Dkt. 28 para. 16 on October 30,
      2026. /s/ Kara Lindgren
