    at: "D2 16:15"
    author: c_ames
    content: |
      # PROPOSED JOINT STATEMENT OF UNCONTESTED FACTS (Plaintiff's draft, 24 paragraphs), paragraphs 1-12

      1. Pemberton Holdings LLC owns the warehouse at 820 Thorndale Avenue, Bensenville, Illinois (the "Premises").
      2. Ash Logistics, Inc. leased the Premises from Pemberton under an Industrial Lease dated March 1, 2018.
      3. The parties amended the lease on February 15, 2022.
      4. The lease term ended on April 30, 2025, and Ash vacated the Premises in April 2025.
      5. A move-in condition report for the Premises is dated March 4, 2019.
      6. On June 9, 2023, a forklift operated by an Ash employee struck dock door 4 at the Premises.
      7. Kelso Door Service repaired dock door 4 on July 2, 2023.
      8. Pemberton sent Ash a notice of default dated January 10, 2025.
      9. Representatives of Pemberton and Ash walked through the Premises on April 29, 2025.
      10. Arlo Building Consultants inspected the Premises for Pemberton on April 30, 2025.
      11. Calder Construction prepared a restoration estimate dated June 5, 2025.
      12. Pemberton retained Ash's security deposit, as shown in its accounting dated June 20, 2025.

