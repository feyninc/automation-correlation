  - {id: a2b-digest, at: "D2 12:35", kind: edit, app: docs, path: lakeshore/depositions/patel-digest, target: doc-patel-digest, title: "Patel deposition digest (for Mira)",
     summary: "digested the Patel transcript by topic",
     content: "# Deposition of Dev Patel (10/22/2026): page-line digest by topic (T. Novak, 11/3, for M. Desai)\nCONFIDENTIAL under Dkt. 28. Signature reserved; errata due 12/2.\n\n## Background\n- 12:3-10: Plant Engineering Manager at Elk Grove Village since 2019.\n- 31:5-22: six PX-9 units for Line 3 under the November 2024 purchase agreement.\n\n## Installation and acceptance\n- 44:2-15: Ferris installed; Corvane's technician commissioned with Tom Ferris.\n- 87:4-9: installation complete \"late January 2025 ... signed off with Tom Ferris on the 22nd\"; confirms the commissioning certificate (LKP-000412). FLAG: consistent with LKP-000412 (January 22, 2025) and with Corvane's RFAs 1-2; worth confirming with Dev before he verifies his interrogatory answers or signs his errata.\n\n## Training\n- 101:14-102:6: Corvane trained Line 3 operators in February 2025 (two sessions).\n\n## Failures\n- 92:11-93:2: first jam-and-drop event April 9, 2025, unit PX9-2209.\n- 118:3-20: 41 events logged through September 2026. FLAG: \"a few in the summer of 2025 were written up a day or two late\" (completeness of the log).\n- 188:1-12: failure log (Ex. 9, LKP-001203) is a business record kept by Plant Engineering.\n\n## Service and firmware\n- 133:7-134:1: Corvane service visits 5/2/2025, 7/14/2025, 2/3/2026; firmware v4.2 installed September 2025 by remote push.\n- 140:12-25: nobody at Lakeshore changed the stack-height settings \"that I know of\"; maintenance can't reach those screens without Corvane's password (bears on RFA 5 and the misuse defense).\n\n## Warranty notice and rejection\n- 151:3-18: written warranty claim sent by Helen, \"I think in June [2025]\"; he gave her the failure log. FLAG: date uncertain; Helen to confirm (RFA 12).\n- 163:2-14: Lakeshore asked Corvane to take the units back in March 2026; Corvane refused.\n\n## Slack\n- 176:9-177:4: operators and maintenance posted about jams in the palletizer-issues Slack channel, \"still there as far as I know\" (now preserved; export being arranged).\n\n## Signature\n- 205:3-9: signature reserved on the record."}
  - {id: a2b-ap, at: "D2 13:09", kind: new, app: mail, path: sent/ap-midwest-mrg-55120r, target: m2b-ap, to: [c_accounting], cc: [c_mira],
     subject: "Please pay: Midwest Reporting MRG-55120R, $1,312.50 (41822-003)",
     summary: "sent the corrected Midwest invoice to Accounts Payable",
     body: "Please pay Midwest Reporting Group invoice MRG-55120R (reissued), $1,312.50, deposition of Dev Patel 10/22/2026, matter 41822-003 Lakeshore v. Corvane, cost code deposition transcripts. Approved by Mira Desai today. The original MRG-55120 ($1,842.50) is void; please don't pay it."}
