    app: docs
    path: lakeshore/discovery/dev-patel-answers-4-9
    title: Dev Patel's draft answers, interrogatories 4-9
    at: "D2 15:30"
    author: c_dev
    content: |
      No. 4 (identify each PX-9 unit): six units, serials PX9-2207 to PX9-2212, Line 3.
      No. 5 (who operated them): Line 3 operators, shifts A-C; maintenance by Lakeshore Plant Engineering.
      No. 6 (date installation was completed): March 2025.
      No. 7 (first failure): the first jam-and-drop event was April 9, 2025.
      No. 8 (failures since): 41 logged events (failure log).
