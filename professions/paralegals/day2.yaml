      LKP-PRIV-0011,2026-06-03,email,Andrew Hale,Helen Ruiz,Mira Desai,AC,"Re: Settlement authority: recommended range"
      LKP-PRIV-0012,2026-07-08,memo,Mira Desai,Andrew Hale,,WP,"Deposition outline: Rick Tamura (draft)"
