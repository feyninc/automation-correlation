    author: c_docket
    content: |
      MINUTE entry before the Honorable Marion Castellanos: Status hearing set for 11/18/2026 at 9:30 a.m. in
      courtroom 1919, in person. The parties shall file a joint status report on discovery progress, including any
      disputes, by 11/13/2026. Mailed notice. (Dkt. 44, entered 11/3/2026)
