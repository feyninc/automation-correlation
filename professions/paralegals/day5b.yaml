     content: "# Halsted v. Corbin, No. 1:24-cv-11873: bill of costs (draft for A. Hale; file with the clerk and serve by Wed 12/2/2026, LR 54.1(a); costs other than the clerk's are waived if late)\n\n## Claimed (28 U.S.C. 1920)\n| 1920 | Item | Amount |\n| --- | --- | --- |\n| (1) fees of the clerk | Civil filing fee, 12/9/2024 ($350 filing fee + $55 administrative fee) | $405.00 |\n| (2) transcripts | Deposition of D. Faber (Corbin COO): original, 186 pages at $4.25 | $790.50 |\n| (2) transcripts | Faber: court reporter appearance fee (LR 54.1(b)) | $100.00 |\n| (2) transcripts | Deposition of L. Ng (Corbin CFO): original, 142 pages at $4.25 | $603.50 |\n| (2) transcripts | Ng: court reporter appearance fee (LR 54.1(b)) | $100.00 |\n| (4) copies | Trial exhibit copies, 2,140 pages at $0.10 | $214.00 |\n| (3) witnesses | Attendance fee, R. Alcott, check No. 48817 (28 U.S.C. 1821(b), $40 a day; no mileage) | $40.00 |\n| | Total claimed | $2,253.00 |\n\n## Not claimed\n| Item | Amount | Why |\n| --- | --- | --- |\n| Faber expedited delivery surcharge | $372.00 | LR 54.1(b): transcript costs limited to the regular copy rate |\n| Faber realtime feed | $250.00 | not part of the original or one copy (LR 54.1(b)) |\n| Ng rough draft | $142.00 | same |\n| Westlaw research | $1,180.00 | not a cost under 1920 |\n| JAMS mediator's fee | $3,600.00 | not a cost under 1920 |\n| Courier | $86.00 | not a cost under 1920 |\n| Attorney parking and meals | $64.00 | not a cost under 1920 |\n| Total not claimed | $5,694.00 | |\n\nTotal on file $7,947.00 = $2,253.00 + $5,694.00. To check before filing: that $4.25 a page does not exceed the Judicial Conference regular copy rate and the appearance fees are within the published rates on the court's website (LR 54.1(b)); the Faber and Ng transcripts were 'necessarily obtained' (both used at trial)."}
  - {id: a5b-costs-note, at: "D5 09:05", kind: reply, target: t5b-grace-costs, to: [c_grace], cc: [c_andrew], summary: "sent the bill of costs draft to Grace and Andrew",
     body: "Bill of costs draft is in Docs > halsted > post-judgment: $2,253.00 claimed under 28 U.S.C. 1920 (filing fee, the two original deposition transcripts and reporter appearance fees, trial exhibit copies, one witness fee), and $5,694.00 of Joy's list left out (expedited, realtime and rough-draft charges, which LR 54.1(b) limits to the regular copy rate, plus Westlaw, mediator, courier and meals). One thing to confirm: that $4.25 a page is within the Judicial Conference rate on the court's site. Filing deadline Wed 12/2."}
