# Friday 2026-11-06, added volume. The Pemberton exhibit and witness lists go to Ames by 5:00, and Pemberton's lists
# arrive with two exhibits never produced. The Halsted bill of costs and the LR 54.3 time summary. Grace's motion for
# leave is filed on her signature. The Mercer case is dismissed. Mira finalizes the interrogatory answers and Dev must
# verify from Mexico, which needs 28 U.S.C. 1746(1)'s wording. Next week's deadlines memo. Tessa's time on the other
# matters.
#
# Computations (python3):
# - Halsted bill of costs (Joy's 14 invoices, total $7,947.00). Taxable under 28 U.S.C. 1920 and LR 54.1(b): clerk's
#   filing fee $405.00 ($350 + $55); Faber original transcript 186 x $4.25 = $790.50 and appearance fee $100.00; Ng
#   original 142 x $4.25 = $603.50 and appearance fee $100.00; trial exhibit copies 2,140 x $0.10 = $214.00; witness
#   attendance fee $40.00 (28 U.S.C. 1821(b)). Sum 405 + 790.50 + 100 + 603.50 + 100 + 214 + 40 = $2,253.00.
#   Excluded: expedited 186 x $2.00 = $372.00; realtime $250.00; rough draft 142 x $1.00 = $142.00; Westlaw $1,180.00;
#   JAMS $3,600.00; courier $86.00; parking and meals $64.00. Sum $5,694.00; 2,253 + 5,694 = 7,947. Due Wed 12/2.
# - Halsted time detail (LR 54.3(d)(1), (d)(4), records to Corbin by Mon 11/23): Hale 318.4 h x $625 = $199,000.00;
#   Desai 96.2 x $480 = $46,176.00; Liu 512.7 - 14.5 written off = 498.2 x $395 = $196,789.00; Novak 141.5 - 12.4
#   clerical = 129.1 x $185 = $23,883.50; Okafor 88.9 - 9.6 clerical = 79.3 x $185 = $14,670.50. Hours 1,157.7, not
#   sought 36.5, sought 1,121.2; amount sought $480,519.00.
# - Pemberton's list: fact discovery closed 7/31/2026; PX-14 (dated 9/30/2026) and PX-17 (photos of 10/14/2026) carry
#   no Bates and postdate the close. 9 PX numbers duplicate DX exhibits (PX-1, 3, 4, 5, 7, 9, 10, 11, 12).
# - Next week: Mon 11/9, Tue 11/10, Wed 11/11 (Veterans Day, courts closed), Thu 11/12, Fri 11/13; trial Mon 11/16;
#   Tamura and Fairmont answer Thu 11/19; Northgate SJ Fri 11/20; Halsted fee records Mon 11/23; RFA responses Mon 11/30;
#   Patel errata and Halsted bill of costs Wed 12/2.
# - Ilic deposition noticed for Thu 12/3/2026 at 9:30.

