     body: "Next week, from the docket and the trial order:\n- Mon 11/9: Pemberton MIL responses due (Ben); edits to Ames's uncontested facts due (Ben); Binder PDFs to Office Services 10 a.m. (Tessa); Dr. Marsh prep 2:00 (Andrew).\n- Tue 11/10: Corvane's Dkt. 46 extension motion presented 9:15 (Mira); Ray prep 9:30 and Sandra prep 1:30 (Andrew); binders delivered noon for QC (Tessa, Joy); objections to Pemberton's exhibits due 5:00 (Ben; PX-14 and PX-17 not produced).\n- Wed 11/11: Veterans Day, federal and state courts closed (firm open).\n- Thu 11/12: binders to Courtroom 2208 and joint statement of uncontested facts by noon (Tessa, Ben); Lakeshore draft responses to Corvane's first discovery to Mira (internal); Lakeshore 30(b)(6) conference with Kara 2:00 (Mira); Pat Lund's board call with Andrew (time pending).\n- Fri 11/13: Pemberton final pretrial conference 9:30 (Andrew); Lakeshore joint status report due (Dkt. 44), final by Thu since Mira is out at CLE.\nThen: Pemberton trial Mon 11/16-Wed 11/18 (Lakeshore status hearing Wed 11/18 9:30 needs coverage); Lakeshore responses due Mon 11/16; Tamura deposition and Fairmont answer Thu 11/19; Northgate summary judgment Fri 11/20; Halsted fee records to Corbin Mon 11/23; Lakeshore RFA responses Mon 11/30; Patel errata and Halsted bill of costs Wed 12/2; Ilic deposition Thu 12/3."}
