  - {id: a5b-fees, at: "D5 12:00", kind: edit, app: docs, path: halsted/post-judgment/lr-54-3-time-summary, target: doc-halsted-fees, title: "Halsted: LR 54.3 time summary (for Grace)",
     summary: "summarized the Halsted time detail for the fee exchange",
     content: "# Halsted v. Corbin: time summary for the LR 54.3(d) exchange (records and rates to Corbin by Mon 11/23; fee motion by Mon 2/1/2027)\nSource: Billing export, 11/6. Rates are Halsted's engagement rates.\n\n| Timekeeper | Hours billed | Not sought | Hours sought | Rate | Amount sought |\n| --- | --- | --- | --- | --- | --- |\n| A. Hale (partner) | 318.4 | 0.0 | 318.4 | $625 | $199,000.00 |\n| M. Desai (senior associate) | 96.2 | 0.0 | 96.2 | $480 | $46,176.00 |\n| G. Liu (associate) | 512.7 | 14.5 (written off as duplicative) | 498.2 | $395 | $196,789.00 |\n| T. Novak (paralegal) | 141.5 | 12.4 (no charge, clerical) | 129.1 | $185 | $23,883.50 |\n| J. Okafor (paralegal) | 88.9 | 9.6 (no charge, clerical) | 79.3 | $185 | $14,670.50 |\n| Total | 1,157.7 | 36.5 | 1,121.2 | | $480,519.00 |\n\nFor Andrew and Grace to decide:\n- LR 54.3(d)(1) requires us to say which hours we will and will not seek: the 36.5 hours above were not charged to Halsted, so I've left them out.\n- The 63 narratives Billing flagged as describing advice or strategy may be redacted before the records go to Corbin (LR 54.3(d)(1) allows redaction for privilege and work product); I haven't redacted anything.\n- LR 54.3(d)(2) also requires rate support (records of rates paid in comparable work).\nThe records exchange is LR 54.3(d)(4)'s 21 days from the 11/2 judgment: Mon 11/23."}
  - {id: a5b-fees-note, at: "D5 12:05", kind: new, app: mail, path: sent/halsted-fee-summary, target: m5b-fees, to: [c_grace], cc: [c_andrew],
     subject: "Halsted: LR 54.3 time summary for the 11/23 exchange",
     summary: "sent Grace the Halsted time summary",
     body: "Grace, the time summary is in Docs > halsted > post-judgment: 1,157.7 hours billed, 36.5 not sought (Grace's written-off duplicative time and the paralegals' no-charge clerical time), 1,121.2 hours sought, $480,519.00 at Halsted's rates. Billing flagged 63 narratives that describe advice or strategy; those need Andrew's review for redaction before anything goes to Corbin on 11/23. Nothing has been sent to Hannah Price."}
