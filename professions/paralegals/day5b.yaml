     content: "# Plaintiff's exhibit list (served 11/6) checked against the production index (T. Novak, for B. Yoder). Objections due Tue 11/10, 5:00 p.m. (Trial Management Order para. 4). Grounds are Ben's call.\n\n## Not produced in discovery (para. 3)\n- PX-14 Calder revised restoration estimate, 9/30/2026: no Bates; dated after fact discovery closed 7/31/2026; not in either production.\n- PX-17 Photographs of dock doors, 10/14/2026: no Bates; taken after the close; not produced. (Also: the Premises were vacated in April 2025, so these show the doors after 18 months of someone else's use.)\n\n## Same document as one of ours (possible joint exhibits)\nPX-1 = DX-1; PX-3 = DX-4; PX-4 = DX-8; PX-5 = DX-10; PX-7 = DX-13; PX-9 = DX-12; PX-10 = DX-15; PX-11 = DX-14; PX-12 = DX-7 (9 exhibits).\n\n## Checked, Bates within produced volumes\nPX-2 (PEM-000020-000026), PX-6 (PEM-001161-001199), PX-8 (PEM-001220-001248), PX-13 (PEM-002400-002461), PX-15 (ASH-003913). PX-16 Haas report served 8/15/2026.\n\n## Witnesses\nLyle Pemberton, Linda Haas, Gary Kolb (Calder estimator): Kolb is new to our witness tracking; Ben to check whether Pemberton disclosed him in discovery. Pemberton's total estimate 180 minutes against our 250."}
