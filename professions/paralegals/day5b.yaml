  - {id: a5b-px, at: "D5 15:00", kind: edit, app: docs, path: pemberton/trial/px-list-objections-worksheet, target: doc-px-worksheet, title: "Pemberton's exhibit list: worksheet for Ben's objections (due Tue 11/10)",
