# Friday 2026-11-06, the rest of the desk. Benavides accepts 70%; Lone Star pays the Delgado subrogation in full;
# Shelby Graves signs the owner-retained form; Ruth Olsen's invoice; Paul's draft mediation statement has four
# problems; SIU wants the Danner statement; Wade holds the Lyle number until the EOBs arrive; Ana Lucero's bills; a new
# deer claim; the Simmons closing note, the TDECU payoff letter, the Q4 self-audit and next week's diary before the
# 16:00 review with Wade.
#
# Computations (python3; business days skip weekends and 11/11):
# - Benavides: 70% x $9,318.00 = $6,522.60, payable to him alone (no lien; repaired at his expense).
# - Delgado: Lone Star paid 100% of $7,425.00; deductible refund 100% x $500 = $500.00.
# - Graves owner-retained: $6,880 - $500 - $1,310 = $5,070.00; signed form and title 11/6 -> pay by 11/16 (fifth business day; 11/11 is a Texas holiday).
# - Olsen: invoice $2,186.40 (paid by the insured) - $250 = $1,936.40, to Ruth Olsen; accepted 11/6 -> by 11/16.
# - Nunez: TDECU payoff $5,140.00 good through 11/16; payment due by 11/16 (accepted 11/6), the payoff letter's last day, so Maribel issues it by 11/13.
# - Lucero (LR-26-116955): ER $1,960.00 + PT 24 visits x $190.00 = $4,560.00 + orthopedic consult $380.00 = $6,900.00
#   medical (uninsured, so billed = incurred) + wages $1,150.00 = $8,050.00.
# - Devin's LR-26-118303: claimant 40% at fault -> not barred (not above 50%); 60% x $4,250.00 = $2,550.00.
# - Biggs (LR-26-118344): deer = comprehensive, $500 deductible (collision would be $1,000); notice 11/6 -> acknowledge
#   by 11/21.
# - Garza draft statement: medicals should be paid or incurred $19,870 (not billed $31,460); surgery 11/12/2025 (not
#   12/11/2025); the insured's statement says sun glare, not texting; the $32,000 authority must not be in it.

