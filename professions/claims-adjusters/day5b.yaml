      - [c_delgado, "The whole five hundred? That's great. Thank you!", 3]

  - id: c5b-olsen
    path: 2026-11-06/1140-ruth-olsen
    title: Inbound call, Ruth Olsen (insured, LR-26-118297)
    start: "D5 11:40:00"
    turns:
      - [c_olsen, "Hi, it's Ruth Olsen. I sent the invoice this morning. I paid the shop with my card. When do I get the money?", 4]
      - [worker, "Thank you, Ms. Olsen. The invoice matches the approved estimate, two thousand one hundred eighty-six dollars and forty cents. Since you've already paid the shop, we'll pay you directly: one thousand nine hundred thirty-six dollars and forty cents after your deductible, by November 13th."]
      - [c_olsen, "Perfect. Thank you for being so quick.", 3]

