     content: "# LR-26-116955 (Ana Lucero, unrepresented): BI evaluation, 11/6\n\nLoss 4/11/2026, rear-ended by our insured; liability accepted.\nInjuries: cervical and lumbar strain; X-rays negative; no surgery or injections.\nTreatment: ER 4/11; orthopedic consult 4/16; 24 PT visits 4/20-11/3; released 11/4 (goals met). Seven months of PT is long for strains but continuous, with no gaps.\nSpecials: ER $1,960.00 + orthopedic $380.00 + PT $4,560.00 = $6,900.00. Uninsured, self-pay: the billed amounts are what she owes, so paid or incurred is $6,900.00 (Civ. Prac. & Rem. Code 41.0105). Wages $1,150.00 (46 h at $25). Economic total $8,050.00.\nRange: $10,500-$13,500.\nReserve: $9,500 is below the range; raising to $13,500 (within my reserve authority).\nNext: call her Monday; settlement within my $15,000 authority."}
