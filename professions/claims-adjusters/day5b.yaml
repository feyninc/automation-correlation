    path: 2026-11-06/1445-harold-biggs
    title: Inbound call, Harold Biggs (insured, deer)
    start: "D5 14:45:00"
    turns:
      - [c_biggs, "Harold Biggs. I hit a deer last night on 2484 near Salado. The front's smashed and it's leaking coolant. Is that collision or what? I've got five hundred on comprehensive and a thousand on collision.", 5]
      - [worker, "I'm sorry, Mr. Biggs. Are you all right? I have your claim, LR-26-118344, and this call confirms we've received it. Hitting a deer is covered under your comprehensive coverage, so the five-hundred-dollar deductible applies, not the collision deductible."]
