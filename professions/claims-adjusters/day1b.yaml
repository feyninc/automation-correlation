calls:
  - id: c1b-flores
    path: 2026-11-02/0950-yesenia-flores
    title: Outbound call, Yesenia Flores (claimant, LR-26-118294)
    start: "D1 09:50:00"
    turns:
      - [c_flores, "Hello?", 3]
      - [worker, "Hi, is this Yesenia Flores? This is Maribel Ochoa with Leon River Mutual. I'm handling the claim for Saturday's accident with our insured, Marcus Bell, on Loop 363. Is now a good time?"]
      - [c_flores, "Yes. My neck has been killing me since Saturday. I went to urgent care on Sunday. Are you going to pay for my doctor bills? And my bumper is pushed in.", 6]
      - [worker, "I'm sorry you're hurting. I'm still gathering the facts and will be talking with our insured, so I can't tell you today what we'll pay. Please keep every bill and record. Your own health insurance, or the personal injury protection on your auto policy if you have it, can pay your medical bills now; that doesn't affect your claim with us."]
      - [c_flores, "Okay. What do you need from me?", 4]
      - [worker, "I'd like to take a short recorded statement about how the accident happened. Do I have your permission to record? If now isn't good, we can do it tomorrow. I'll also need photos of your car and the urgent care paperwork, and I'll have an appraiser look at the bumper."]
      - [c_flores, "Tomorrow is better. Can you call me at ten?", 3]
      - [worker, "Tomorrow at ten works. I'll email you my contact information and a medical authorization form today."]

  - id: c1b-kaufman
    path: 2026-11-02/1040-brenda-kaufman
    title: Outbound call, Brenda Kaufman (insured, LR-26-118292)
    start: "D1 10:40:00"
    turns:
      - [c_kaufman, "This is Brenda.", 3]
      - [worker, "Hi Ms. Kaufman, this is Maribel Ochoa, your adjuster at Leon River Mutual for the claim you reported this morning, LR-26-118292. I'm calling to confirm we've received it and to get the details. Can you tell me what happened?"]
      - [c_kaufman, "I backed out of a spot in the parking garage at work on Friday night and hit a concrete post. The hatch is dented and the bumper is cracked. Do I have to take it to a particular shop?", 6]
      - [worker, "No, the choice of shop is yours. Belton Collision is one of our direct-repair shops if you'd like a recommendation; they can handle the estimate with us directly. Your collision coverage applies, with a five-hundred-dollar deductible. Please send me photos and let me know which shop you choose."]
      - [c_kaufman, "I'll use Belton then. Do I get a rental car?", 4]
      - [worker, "Your policy doesn't include transportation expense coverage, so a rental would be at your own cost. Enterprise can still give you our customer rate."]

  - id: c1b-olsen
    path: 2026-11-02/1415-ruth-olsen
    title: Inbound call, Ruth Olsen (insured, LR-26-118297)
    start: "D1 14:15:00"
    turns:
      - [c_olsen, "Hi, this is Ruth Olsen. Someone cut the catalytic converter off my Prius in my driveway Saturday night. I filed online this morning. Is that covered? It sounds like a motorcycle now.", 6]
      - [worker, "I'm sorry, Ms. Olsen, that's an awful thing to wake up to. I've got your claim, LR-26-118297, and this call confirms we've received it. Theft of a part like the converter falls under your comprehensive coverage, which has a two-hundred-fifty-dollar deductible. Did you file a police report?"]
      - [c_olsen, "Yes, Temple police came out. Can I take it to my own mechanic? I don't know your shops.", 5]
      - [worker, "Yes, you choose the repair shop. Have your mechanic send me the estimate before they order the part, with the police report number. I'll also need a couple of photos of the underside if they can take them."]
      - [c_olsen, "And can I get a rental? I need the car for work.", 4]
      - [worker, "Your policy doesn't carry transportation expense coverage, so I can't pay for a rental. The car is usually safe to drive short distances while you wait, but ask your mechanic first."]

