  - "Caseload of roughly 100-140 pending claims per desk adjuster: Rising Medical Solutions 2019 benchmark, as given in the expansion brief (the report itself was not reachable to re-check; used only for scale, no need or trap turns on it): https://www.risingms.com/"
  - "Texas Insurance Code 1952.301 (insurer may not limit choice of repair facility; third-party claimants too): https://texas.public.law/statutes/tex._ins._code_section_1952.301"
  - "Texas Insurance Code 1952.152 and 1952.153 (PIP required unless rejected in writing; $2,500 minimum): https://texas.public.law/statutes/tex._ins._code_section_1952.153"
  - "Texas Insurance Code 1952.156 (PIP benefits paid within 30 days of satisfactory proof): https://texas.public.law/statutes/tex._ins._code_section_1952.156"
  - "Texas Insurance Code 1952.104 (UM: actual physical contact required for an unknown motorist): https://texas.public.law/statutes/tex._ins._code_section_1952.104"
  - "Texas Insurance Code 542.056(d) (the extension notice is subsection (d), not (b)): https://texas.public.law/statutes/tex._ins._code_section_542.056"
  - "Texas Insurance Code 542.055(c) (an oral acknowledgment must be recorded with date, manner and content): https://texas.public.law/statutes/tex._ins._code_section_542.055"
  - "Texas Insurance Code 542.057 (pay within 5 business days of notice, or of the claimant's act): https://texas.public.law/statutes/tex._ins._code_section_542.057"
  - "Texas Insurance Code 701.051 (fraud reports to TDI within 30 days): https://texas.public.law/statutes/tex._ins._code_section_701.051"
  - "Texas Civil Practice and Remedies Code 33.001 and 33.012 (proportionate responsibility; barred above 50%): https://texas.public.law/statutes/tex._civ._practice_and_remedies_code_section_33.012"
  - "Texas Civil Practice and Remedies Code 41.0105 (medical expenses limited to amounts paid or incurred): https://texas.public.law/statutes/tex._civ._practice_and_remedies_code_section_41.0105"
  - "Texas Civil Practice and Remedies Code 16.003 (two-year limitations, personal injury and property): https://texas.public.law/statutes/tex._civ._practice_and_remedies_code_section_16.003"
  - "Texas Transportation Code 501.0925 (insurer's title application no earlier than the 30th day after payment, after two written notices): https://texas.public.law/statutes/tex._transp._code_section_501.0925"
  - "TxDMV, certified copy of a lost title (Form VTR-34; $2 by mail, $5.45 in person at a Regional Service Center): https://www.txdmv.gov/motorists/buying-or-selling-a-vehicle/get-a-copy-of-your-title"
  - "TDI, My car was totaled (owner keeps the car: the insurer subtracts the salvage value; salvage title): https://www.tdi.texas.gov/tips/car-totaled.html"
  - "TDI, Auto insurance guide (companies can't require you to use a shop on their list): https://www.tdi.texas.gov/pubs/consumer/cb020.html"

