     content: "# LR-26-118294: insured's statement (Marcus Bell), by phone 11/2 12:00, recorded with permission\n\nLoss 10/31 about 14:15, Loop 363 westbound at the Midway Dr light, Temple. Traffic stopped for the light; insured looked down at his phone's navigation and rear-ended claimant Yesenia Flores (2019 Nissan Sentra) at about 10 mph. No police report; exchanged information. Claimant said her neck hurt; she drove away. Insured's 2017 F-150: front bumper scuffs, no claim for his own damage.\nLiability: clear (rear-end, inattention admitted).\nCoverage: policy LRM-A-4485519 in force; BI 30/60, PD 25 (Texas minimum); insured driving his own vehicle.\nNext: claimant statement 11/3 10:00; appraisal of claimant's bumper; medical authorization out 11/2."}
