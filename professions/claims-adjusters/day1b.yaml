  - id: doc-garza-file
    app: docs
    path: claims/LR-25-109884-summary
    title: "Claim LR-25-109884 (Garza v. Kemp, in suit): file summary"
    content: |
      Insured: Travis Kemp (policy LRM-A-4390025), BI limits 50/100.
      Loss: 2025-06-21, FM 2305 at Old Waco Rd, Belton. Insured ran the stop sign and struck Rosalinda Garza's car on
      the driver's side; CR-3 cites the insured (disregarded stop sign). Liability: clear.
      Injuries: right shoulder partial-thickness rotator cuff tear; arthroscopic repair 2025-11-12; 16 weeks PT.
      Medical billed $31,460.00; paid or incurred $19,870.00 (provider adjustments by her health plan). Lost wages
      $3,150.00.
      Suit: Garza v. Kemp, Bell County Court at Law No. 1, filed 2026-06-30; defense Paul Whitaker (Whitaker & Lowe).
      Plaintiff deposed 10/21. Insured's recorded statement taken 2025-06-24 (in ClaimCenter): low sun in his eyes, he
      did not see the stop sign until too late; no phone use. Scene photos (14) and the CR-3 in ClaimCenter documents.
      Reserve: BI $28,000 (set by Wade 7/2026).

  - id: doc-fry-file
    app: docs
    path: claims/LR-26-118077-summary
    title: "Claim LR-26-118077 (Benavides v. Fry): file summary"
