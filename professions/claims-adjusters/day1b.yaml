# Monday 2026-11-02, the rest of the desk. Maribel carries 127 open claims (Rising Medical Solutions' 2019 benchmark
# puts a desk adjuster's pending caseload at roughly 100-140), so most of the day's mail is about claims other than the
# week's big arcs: three new assignments from the weekend, a third-party property damage claimant who has been told
# (wrongly) that she must use our direct-repair shop, a PIP bill that exhausts the limit, the Garza suit going to
# mediation, a claimant's medical records to evaluate, the Graves total loss valuation, and the automated ClaimCenter,
# CCC, payments, rental and glass traffic that fills an adjuster's inbox.
#
# Computations (python3; business days skip weekends and Texas holidays 11/11, 11/26, 11/27):
# - Acknowledgment due (Ins. Code 542.055, 15 days from notice): Kaufman LR-26-118292 and Olsen LR-26-118297, notice
#   11/2 -> 11/2 + 15 days = 11/17.
# - Devin's LR-26-118121: all items 10/28 -> 15 business days: 10/29, 10/30, 11/2, 11/3, 11/4, 11/5, 11/6, 11/9,
#   11/10, 11/12 (11/11 skipped), 11/13, 11/16, 11/17, 11/18, 11/19 -> 11/19 (11/18 if Veterans Day is counted).
# - Morris PIP (LR-26-118040): limit $2,500; paid $1,180.00 on 10/30; remaining 2,500 - 1,180 = $1,320.00. New bill
#   $1,640.00 received 11/2 -> pay $1,320.00, 1,640 - 1,320 = $320.00 not covered; pay by 11/2 + 30 days = 12/2
#   (Ins. Code 1952.156).
# - Villa (LR-26-117563) specials: ER $2,140.00 + chiropractic 18 visits $3,960.00 (12 visits $2,640.00 7/22-8/28,
#   6 visits $1,320.00 10/14-10/30) + MRI $1,850.00 = $7,950.00. Gap in treatment 8/28 -> 10/14 = 47 days.
# - Graves total loss (LR-26-118170): ACV $6,880 - $500 deductible = $6,380 (no lien).
# - Raman (LR-26-118158) is third-party property damage: no deductible; her choice of shop (Ins. Code 1952.301(b)).
# - Nunez payoff letter: $5,140.00 good through 11/16, per diem $1.12 after that.
# - Garza (LR-25-109884): mediation proposed Wed 12/9 or Thu 12/10; disclosures due 11/13.
# - Calls with minutes today: 11 calls the assistant cannot hear (3-10 min each) and the team meeting (30 min).

