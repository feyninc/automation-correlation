    correct: "Investigate first; no commitment on payment; her own coverage pays now."
    severity: medium
  - id: tr1b-drp
    title: Telling the claimant she must use the direct-repair shop
    kind: stale_info
    evidence: [t1b-raman, pol-guidelines-2]
