    evidence: [doc-morris-pip, doc-dec-open]
    check: {all: [{to_includes: c_finance}, {mentions_any: [LR-26-118040, Morris]}, {number_equals: {value: 1640}}, {not: {number_equals: {value: 1320}}}]}
    correct: "Pay $1,320, what remains of the $2,500 limit."
