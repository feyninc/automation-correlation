     body: "Mr. Kemp, just bring a photo ID and plan to be there most of the day; mediations often run into the afternoon. You won't need documents, and you won't have to speak to the other side directly; the mediator goes back and forth between rooms. Mr. Whitaker's office will call you beforehand to walk you through it, and Wade Hollister and I will be there for Leon River. Maribel Ochoa"}
  - {id: a4b-lyle-eval, at: "D4 10:30", kind: edit, app: docs, path: claims/LR-26-117383-demand-evaluation, target: doc-lyle-eval, title: "LR-26-117383 (Lyle v. Keller): demand evaluation",
     summary: "evaluated the Lyle demand package",
     content: "# LR-26-117383: demand evaluation, 11/5\n\nDemand: $45,000 for a full release of Norma Keller (Ortiz Law), open 30 days from receipt 11/5: lapses Sat 12/5; our working deadline Fri 12/4.\nLiability: clear (insured ran the light at W Adams Ave; cited).\nInjuries (records enclosed): cervical and thoracic strain; right wrist fracture (distal radius, non-displaced), splinted; 12 weeks PT; released 10/2.\nSpecials: billed $18,200.00; paid or incurred not yet documented (need the EOBs, Civ. Prac. & Rem. Code 41.0105). Wages $2,240.00.\nRange: $28,000-$35,000 (unchanged from the 11/3 reserve review); reserve $35,000.\nRecommendation: counter in the mid $20,000s with Wade's authority after the EOBs; request them from Ortiz now. Report to the 12/2 committee if not resolved by 11/25."}

  - {id: a4b-villa-eval, at: "D4 14:35", kind: edit, app: docs, path: claims/LR-26-117563-medical-evaluation, target: doc-villa-eval,
     summary: "updated the Villa evaluation with the paid amounts and 2024 records",
     content: "# LR-26-117563: medical records review (Sergio Villa), updated 11/5\n\nRepresented by Monique Hart (Hart Law Firm). Loss 7/18/2026, rear-ended by our insured; liability accepted.\n\n| Provider | Dates | Billed | Paid (BCBS EOB) |\n| --- | --- | --- | --- |\n| Harker Heights Emergency Center | 7/18 | $2,140.00 | $1,284.00 |\n| Killeen Spine & Chiropractic, 18 visits | 7/22-8/28, 10/14-10/30 | $3,960.00 | $2,376.00 |\n| Central Texas Imaging (lumbar MRI) | 10/20 | $1,850.00 | $912.40 |\n| Total | | $7,950.00 | $4,572.40 |\n\nRecoverable medical expenses are limited to the $4,572.40 actually paid or incurred (Civ. Prac. & Rem. Code 41.0105).\nPrior history: 9 chiropractic visits 3/4-5/2/2024 for low back pain after a lifting injury, discharged with intermittent symptoms.\nGap: 47 days (8/28-10/14) with no care; the lumbar complaint and MRI follow the gap and match the 2024 condition. Cervical strain (7/18-8/28 care) is related to our loss; the lumbar treatment after 10/14 is likely an aggravation at most, and arguably the prior condition.\nNext: evaluate on the demand, weighting the cervical course (7/18-8/28) and discounting post-gap lumbar care. Reserve $10,000 remains adequate."}

