# a new-business theft with SIU indicators; defense counsel's invoice against the litigation guidelines; Claims Data's
# CAT coding check; Wade's Garza authority; supplements on Raman, Kaufman and Ybarra; the Conner UMPD estimate; Calvin
# Wu's payoff title arrives; the agent asks for Simmons's injuries; Yesenia Flores calls despite having a lawyer;
# Allison Pruitt asks for diminished value and mentions a warning light the worker doesn't follow up.
#
# Computations (python3; business days skip weekends and 11/11):
# - Lyle demand $45,000, received 11/5, open 30 days -> 11/5 + 30 = Sat 12/5 (working deadline Fri 12/4). Specials
#   $18,200 = 36% of the $50,000 limit; the time limit alone triggers the same-day report.
# - Whitaker & Lowe invoice: fees billed 2.4 x 185 = 444.00 + 0.5 x 185 = 92.50 + 1.2 x 95 = 114.00 + 3.6 x 185 =
#   666.00 + 4.5 x 150 = 675.00 + 2.0 x 150 = 300.00 + 0.3 x 185 = 55.50 = $2,347.00; expenses $612.40 + $86.00 =
#   $698.40; total $3,045.40. Allowed: 444.00 + 0.2 x 185 = 37.00 + 0 + 1.0 x 185 = 185.00 + 675.00 + 150.00 (half
#   rate) + 55.50 = $1,546.50 fees + $612.40 transcript = $2,158.90. Reductions $886.50 (55.50 + 114.00 + 481.00 +
#   150.00 + 86.00).
# - Raman supplement: 3.5 h x $62 = $217.00 + 2.5 h x $62 = $155.00 + materials 2.5 h x $38 = $95.00 + tax 8.25% x 95
#   = $7.84 -> $474.84; new total 2,884.88 + 474.84 = $3,359.72. Rental 8 days x $43.99 = $351.92.
# - Kaufman supplement: $236.40 + 3.0 h x $58 = $174.00 + materials 1.5 h x $36 = $54.00 + tax 8.25% x (236.40 +
#   54.00) = $23.96 -> $488.36; new total 3,400.40 + 488.36 = $3,888.76 (deductible already applied).
# - Conner (UMPD): body 10 h x $58 = $580.00 + refinish 9 h x $58 = $522.00 + materials 9 h x $36 = $324.00 + parts
#   $176.40 + $64.75 + tax 8.25% x (241.15 + 324.00) = $46.62 -> $1,713.77 - $250 = $1,463.77. Accepted 11/5 ->
#   pay by 11/13 (11/6, 11/9, 11/10, 11/12, 11/13).
# - Wu: title and lien release received 11/5 -> pay by 11/13 (Ins. Code 542.057(b)); $9,912.00 RBFCU, $3,938.00 Wu.
# - Danner (LR-26-118331): policy effective 10/28, theft 11/4 night = 7 days later; notice 11/5 -> acknowledge by 11/20.
# - Ybarra supplement 2: $388.48 + $116.00 + $108.00 = $612.48.

