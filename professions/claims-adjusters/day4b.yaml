     body: "Hi Ms. Pruitt, I'm glad the car looks good. I understand the frustration about its history report. Your policy pays for direct loss to your car up to the lesser of its actual cash value or the cost to repair it; it doesn't pay diminished value, the loss in market value after a proper repair. Because this was a single-vehicle accident (the guardrail on SH 36), there's no other driver's insurance to make that claim against. Maribel Ochoa"}
