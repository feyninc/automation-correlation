      - [c_wu, "Finally. Thank you.", 3]

  - id: c4b-flores
    path: 2026-11-05/1540-yesenia-flores
    title: Inbound call, Yesenia Flores (represented claimant)
    start: "D4 15:40:00"
    turns:
      - [c_flores, "Hi, it's Yesenia Flores. My lawyer is so slow. Can you just tell me how much you'll give me for my neck? I want to get this over with.", 5]
