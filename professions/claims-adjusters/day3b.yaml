calls:
  - id: c3b-graves
    path: 2026-11-04/0910-shelby-graves
    title: Inbound call, Shelby Graves (total loss, LR-26-118170)
    start: "D3 09:10:00"
    turns:
      - [c_graves, "Hi Maribel, it's Shelby Graves. I got your letter about the Ranger. I'd like to keep it; my brother can fix it. How does that work and what would I get?", 5]
      - [worker, "You can keep it. The settlement would be the actual cash value of six thousand eight hundred eighty dollars, less your five-hundred-dollar deductible, less the salvage value of one thousand three hundred ten dollars, so five thousand seventy dollars. The truck would get a salvage title, and it has to be repaired and re-titled before it goes back on the road."]
      - [c_graves, "That's fine. What do I need to do?", 3]
      - [worker, "Sign the owner-retained salvage form I'll email you this morning and send me the title. Please have the truck moved from Bell County Towing this week; we'll pay their storage through Friday. We pay within five business days after we receive the signed form and title."]
      - [c_graves, "Okay. I'll get it done.", 3]

  - id: c3b-benavides
    path: 2026-11-04/1145-luis-benavides
    title: Inbound call, Luis Benavides (claimant, LR-26-118077)
    start: "D3 11:45:00"
    turns:
      - [c_benavides, "This is Luis Benavides. I got your letter. Thirty percent my fault? That lady wasn't even looking at me. And what are Mr. Fry's policy limits? I want to see what he told you, too.", 6]
      - [worker, "I understand you disagree, Mr. Benavides. We based the percentage on the police report, which estimated your speed at forty-eight in a thirty-five, and on an independent witness who described the same thing. If you have anything that shows otherwise, like dash camera video or another witness, send it to me and I'll review it."]
      - [c_benavides, "I don't have video. So what are his limits? I have a right to know who I'm dealing with.", 4]
      - [worker, "I can't share our insured's policy information or his statement without his written consent. What I can tell you is that his coverage is enough for your damages, so the limit doesn't change what we've offered."]
      - [c_benavides, "Fine. I'll think about it and call you.", 3]

  - id: c3b-hughes
    path: 2026-11-04/1635-darnell-hughes
    title: Inbound call, Darnell Hughes (title, LR-26-117829)
    start: "D3 16:35:00"
    turns:
      - [c_hughes, "Hi, Darnell Hughes. I got your letter about the title for my Altima. I've looked everywhere. I think it was in the glove box when the car was stolen.", 5]
      - [worker, "That happens a lot, Mr. Hughes. You can get a certified copy from TxDMV with Form VTR-34. It's two dollars by mail, or five dollars and forty-five cents in person at a TxDMV Regional Service Center. When you have it, sign it as the seller and mail it to me with the power of attorney."]
      - [c_hughes, "Can't you just do it without me?", 3]
      - [worker, "If we don't have it by November 13th, we can apply for a title in our name, since we've now sent you two written requests, but that takes longer. Either way, your settlement is already paid; this just completes the transfer."]
      - [c_hughes, "Okay, I'll mail the form this week.", 3]

