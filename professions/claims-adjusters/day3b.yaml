     body: "Ms. Hart, I acknowledge your representation of Yesenia Flores on claim LR-26-118294 and will communicate only through your office. Our appraiser has written her 2019 Sentra at $1,220.53 (copy attached); we can resolve the property damage now if you'd like, separately from the injury claim. On your requests: our practice is to disclose our insured's policy limits, his statement or his employment details only with his written consent. I'm asking Mr. Bell for his consent and will let you know. Please send Ms. Flores's medical records and bills when available, or a signed authorization naming your office. Maribel Ochoa, Leon River Mutual", att: [doc-flores-est]}
  - {id: a3b-bell-consent, at: "D3 16:32", kind: new, app: mail, path: sent/bell-consent-request, target: m3b-bell, to: [c_bell], subject: "Your claim LR-26-118294: the other driver has an attorney",
     summary: "told Marcus Bell the claimant is represented and asked about consent",
     body: "Dear Mr. Bell, Ms. Flores has hired an attorney, Monique Hart, for her injury claim from the October 31 accident. We are handling the claim and will defend you. Her attorney has asked for your policy limits. We don't share them without your written consent; sharing them can sometimes help settle a claim within your coverage. Please let me know in writing whether you consent, and call me if you'd like to talk it through first. If you receive any court papers, send them to me the same day. Maribel Ochoa, Leon River Mutual, 254-555-0180"}
