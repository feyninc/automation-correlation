  - {id: a3b-jennings-timeline, at: "D3 15:58", kind: edit, app: docs, path: claims/LR-26-118052-tdi-timeline, target: doc-jennings-timeline, title: "LR-26-118052 (Jennings): claim timeline for Compliance (TDI complaint)",
     summary: "wrote the Jennings timeline for Compliance",
     content: "# LR-26-118052 (Earl Jennings): timeline for Compliance, 11/4\n\n| Step | Date | Ch. 542 deadline | Met |\n| --- | --- | --- | --- |\n| Notice of claim (FNOL by phone) | 10/5 | | |\n| Acknowledged, investigation begun, items requested (phone and letter) | 10/6 | 10/20 (15 days, 542.055) | yes |\n| Belton Collision inspection; estimate $4,912.40 | 10/9 | | |\n| All items received (estimate, photos, signed statement) | 10/14 | | |\n| Parts backorder (tailgate), shop ETA 10/30 | 10/20 | | |\n| Accepted in writing: $4,912.40 less $500 deductible = $4,412.40 | 10/30 | 11/4 (15 business days, 542.056) | yes |\n| Paid, CK-7719984 $4,412.40 to Mr. Jennings and Belton Collision | 11/2 | 11/6 (5 business days, 542.057) | yes |\n\nRental: the policy's transportation expense coverage pays up to $30 a day, $900 maximum, beginning 24 hours after the loss. Mr. Jennings chose a full-size car at $33.50 a day (RA 54877, 10/6 to 11/3, 28 days, $938.00). We pay 28 x $30.00 = $840.00, under the $900 maximum; the $98.00 balance is the rate above $30 a day. His coverage was not cut off; the daily limit applied from the first day.\nThe time to repair was driven by the parts backorder, not by claim handling; every statutory step was met."}

