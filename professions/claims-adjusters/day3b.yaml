     body: "Enterprise Temple: please open a direct-bill rental for Lydia Conner on LR-26-118305 (she's at your 31st St counter now). Transportation expense coverage: up to $30 a day, $900 maximum; any amount above $30 a day is hers. Her car goes into Temple Auto Collision tomorrow. Sorry for the delay. Maribel Ochoa"}
