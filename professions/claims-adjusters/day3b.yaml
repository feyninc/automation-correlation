     body: "Inbound 11/4 11:45. Claimant disputes 30% fault. Explained basis (CR-3 estimated 48 in a 35; independent witness). Invited any new evidence; he has no video. He asked for the insured's limits and statement: declined without the insured's written consent; told him coverage is sufficient for his damages. He will consider the $6,522.60 offer and call back."}
  - {id: a3b-kaufman-accept, at: "D3 12:05", kind: new, app: mail, path: sent/kaufman-acceptance, target: m3b-kaufman-accept, to: [c_kaufman], cc: [c_shop], subject: "Your claim LR-26-118292: accepted",
     summary: "accepted the Kaufman claim in writing",
     body: "Dear Ms. Kaufman, we accept your collision claim. Belton Collision's estimate of $3,400.40 (liftgate, bumper cover and reinforcement) is approved. After your $500 deductible, we will pay $2,900.40, payable to you and Belton Collision Center, by Thursday, November 12 (within 5 business days; Veterans Day is not a business day). You'll pay Belton the $500 deductible when you pick up the car. If Belton finds more damage during the repair, they'll send me a supplement. Maribel Ochoa, Leon River Mutual"}
  - {id: a3b-kaufman-pay, at: "D3 12:08", kind: new, app: mail, path: sent/payment-request-118292, target: m3b-kaufman-pay, to: [c_finance], subject: "Payment: LR-26-118292 (Kaufman), $2,900.40",
     summary: "requested the Kaufman payment",
     body: "Please issue $2,900.40 on LR-26-118292 (collision, Brenda Kaufman), payable jointly to Brenda Kaufman and Belton Collision Center: estimate $3,400.40 less the $500 deductible. Accepted in writing 11/4; due by 11/12 (5 business days, 11/11 excluded). Maribel"}
  - {id: a3b-garza-auth, at: "D3 12:50", kind: new, app: mail, path: sent/garza-authority-request, target: m3b-garza-auth, to: [c_wade], cc: [c_rena], subject: "Authority request: Garza v. Kemp (LR-25-109884), mediation 12/9",
     summary: "asked Wade for $32,000 mediation authority on Garza",
     body: "Wade, request for settlement authority of $32,000 for the 12/9 mediation in Garza v. Kemp (Bell County Court at Law No. 1). Liability: clear (insured ran the stop sign at FM 2305 and Old Waco Rd; cited). Injuries: right shoulder partial rotator cuff tear, arthroscopic repair 11/12/2025, 16 weeks PT. Medical: billed $31,460, but recovery is limited to paid or incurred, $19,870 (Civ. Prac. & Rem. Code 41.0105); lost wages $3,150; economic total $23,020. Plaintiff's demand $48,000, within the 50/100 limits. Paul's verdict range in Bell County: $24,000-$38,000; she presented well at deposition. My evaluation: $26,000-$34,000. I recommend authority of $32,000, opening near $18,000. Reserve is $28,000; I'd raise it to $32,000 with the authority. This is above my $15,000 authority, so it needs your approval. Maribel"}
