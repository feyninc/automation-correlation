  - {id: a3b-ruben, at: "D3 14:50", kind: edit, app: docs, path: claims/LR-26-117922-witness-statement-summary, target: doc-ruben-statement, title: "LR-26-117922 (Mendez): witness statement summary, Ruben Mendez",
     summary: "summarized Ruben Mendez's statement",
     content: "# LR-26-117922: witness statement (Ruben Mendez), by phone 11/4 14:30, recorded with permission\n\nRelationship: claimant's cousin. Says he was driving behind the claimant, northbound on S General Bruce Dr at Central Ave, 9/14 about 19:30; says the claimant's light was green and our insured turned left in front of him.\nConflicts: the claimant's own recorded statement (9/16) says he was alone at the light with no cars behind him and that his cousin arrived after the crash. The CR-3 lists no witnesses; the officer's diagram and our insured's statement put the claimant entering on red. Ruben could not say what color the light was for our insured or where his own car stopped.\nAssessment: an interested witness whose position conflicts with the claimant's earlier account; does not outweigh the CR-3 and the insured's statement. Recommend maintaining the denial, with the reasons in writing, and inviting any other evidence (traffic camera, other witnesses)."}

