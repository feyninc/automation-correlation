  - {id: a3b-delgado, at: "D3 13:55", kind: reply, target: t3b-sandra, to: [c_sandra], summary: "recommended rejecting Lone Star's 80% offer",
     body: "Sandra, I'd reject the 80%. Liability is 100% theirs: the dash cam shows Rosa stopped at a red light on Loop 363 for about 6 seconds before Pope hit her, and the CR-3 cites Pope for failure to control speed. Nothing supports a sudden stop on a yellow. Please counter at the full $7,425.00, which includes Rosa's $500 deductible, and send Craig the clip. If they won't move, let's file intercompany arbitration. If we took 80%, Rosa would get back only $400 of her deductible, and I don't think the facts justify that."}
