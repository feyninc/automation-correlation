  - {id: a3b-jennings-rental, at: "D3 14:50", kind: reply, target: t3b-enterprise-jennings, to: [c_rental], summary: "approved the covered part of the Jennings rental",
     body: "Enterprise Temple, on RA 54877 (LR-26-118052, Earl Jennings) Leon River Mutual will pay $840.00: 28 days at the policy's $30.00 per day (transportation expense, $900 maximum). The remaining $98.00, the difference between the $33.50 full-size rate he chose and $30.00 a day, is Mr. Jennings's. I'm explaining it to him as well. Maribel Ochoa"}
