# Wednesday 2026-11-04, the rest of the desk (Maribel in 09:00-17:00). Shelby Graves keeps her totaled Ranger; Devin's
# first lienholder total loss letter has two errors; Luis Benavides disputes the 30% and asks for the insured's limits;
# Lone Star offers 80% on the Delgado subrogation despite the dash cam; Enterprise's final invoice on the Jennings rental
# and the TDI timeline Compliance asked for; Kaufman's estimate; Hart now represents Yesenia Flores and wants the
# insured's limits and statement; the Garza authority request; a rental Maribel said she would set up and didn't.
#
# Computations (python3; business days skip weekends and 11/11):
# - Graves owner-retained: $6,880 - $500 - $1,310 salvage = $5,070.
# - Estes (Devin's LR-26-118189): ACV $9,450 - $1,000 comprehensive deductible (not $500) = $8,450; Ally payoff
#   $6,210.00 -> Gloria Estes $2,240.00. Devin's draft: $9,450 - $500 = $8,950 to the insured alone.
# - Delgado: Lone Star offers 80% x $7,425.00 = $5,940.00 (insured's share would be 80% x $500 = $400). Recommend 100%.
# - Jennings rental RA 54877: 10/6-11/3 = 28 days at $33.50 = $938.00; coverage $30/day x 28 = $840.00 (under the
#   $900 maximum); insured owes 938 - 840 = $98.00.
# - Jennings 542 timeline: notice 10/5 -> acknowledge by 10/20 (done 10/6); all items 10/14 -> decide by 11/4
#   (accepted 10/30); pay within 5 business days of 10/30 -> 11/6 (paid 11/2).
# - Kaufman: parts $2,085.10 + labor 14.5 h x $58 = $841.00 + materials 7.5 h x $36 = $270.00 + waste $10.00 + tax
#   8.25% x (2,085.10 + 270.00) = $194.30 -> $3,400.40 - $500 = $2,900.40. Accepted 11/4 -> pay by 11/12
#   (11/5, 11/6, 11/9, 11/10, 11/12; 11/11 skipped).
# - Garza: paid or incurred $19,870 + lost wages $3,150 = $23,020 economic; counsel's verdict range $24,000-$38,000;
#   Maribel's evaluation $26,000-$34,000; authority requested $32,000 (above her $15,000, below $50,000: Wade).
# - Flores Sentra (Angela): parts $418.00 + $74.50 = $492.50; labor 9.5 h x $58 = $551.00; materials 3.5 h x $36 =
#   $126.00; tax 8.25% x (492.50 + 126.00) = $51.03 -> $1,220.53.

