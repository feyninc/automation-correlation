# Monday 2026-11-02. A time-limited policy-limits demand on a liability claim, expiring Friday 17:00, with billed
# medicals above the limit. A hail total loss with a lienholder. One hail claim's photos predate the storm, and the
# same vehicle had a 2025 hail claim with another carrier. Seven hail claims need acknowledgment.
#
# Total loss: CCC base $8,420 + condition $150 - mileage $310 = ACV $8,260 - $1,000 deductible = $7,260; lienholder
# payoff $5,140, so $5,140 to the credit union and $2,120 to Carla. Demand: billed specials $41,850 against the $30,000
# BI limit.

documents:
  - id: doc-demand
    app: docs
    path: claims/LR-26-117730-stowers-demand
    title: "Keel Injury Law: time-limited demand (Simmons v. Prewitt)"
    at: "D1 08:30"
    author: c_attorney
    content: |
      Re: Kayla Simmons / your insured Dale Prewitt / claim LR-26-117730.
      Ms. Simmons will settle all claims against your insured for the bodily injury policy limit of $30,000.00 in
      exchange for a full release of Dale Prewitt. This offer expires Friday, November 6, 2026 at 5:00 p.m. Central.
      Enclosed: medical bills and records. Billed to date: $41,850.00 (Baylor Scott & White ER $6,420.00; Temple
      Imaging MRI $3,980.00; Central Texas Spine (consults) $2,150.00; ProMotion PT, 14 weeks $9,300.00; recommended
      epidural injections, estimate $20,000.00). Lost wages: $4,600.00.
  - id: doc-ccc
    app: docs
    path: claims/LR-26-118204-ccc-valuation
    title: CCC valuation, LR-26-118204 (2014 Toyota Corolla LE)
    at: "D1 09:30"
    author: c_appraiser
    content: |
      2014 Toyota Corolla LE, 127,400 miles. Base value (5 comparables, Central Texas): $8,420. Condition adjustment
      +$150 (above-average interior). Mileage adjustment -$310. Actual cash value: $8,260. Repair estimate (hail,
      PDR not possible, panels and glass): $9,140, exceeding ACV: total loss.
      Lienholder: Texas Dow Employees Credit Union, payoff as of 11/2: $5,140.00.
  - id: doc-iso
    app: docs
    path: claims/LR-26-118281-iso-and-photos
    title: "LR-26-118281 (Ostrowski): photo metadata and ISO ClaimSearch"
    at: "D1 13:00"
    author: c_appraiser
    content: |
      Insured's 6 photos: EXIF capture dates 2026-05-19 (all six), camera iPhone 13. Storm date of loss claimed:
      2026-10-29.
      ISO ClaimSearch: same VIN, hail claim 2025-04-02 with Brazos Valley Insurance, paid $3,870 (owner Glen
      Ostrowski), no repair record on file.

threads:
  - id: t1-keel
    app: mail
    path: inbox/simmons-demand
    title: Time-limited demand, Simmons
    x:
      - {at: "D1 08:30", from: c_attorney, to: [worker], subject: "Time-limited policy limits demand: Kayla Simmons, LR-26-117730",
         body: "Ms. Ochoa, please see the attached demand, which expires Friday 11/6 at 5:00 p.m. Brandon Keel", att: [doc-demand]}
  - id: t1-trent
    app: mail
    path: inbox/ostrowski-photos
    title: Ostrowski photos
    x:
      - {at: "D1 13:00", from: c_appraiser, to: [worker], subject: "LR-26-118281: something's off", body: "Maribel, see the attached. Trent", att: [doc-iso]}

calls:
  - id: c1-carla
    path: 2026-11-02/1100-carla-nunez
    title: Inbound call, Carla Nunez (hail total loss)
    start: "D1 11:00:00"
    turns:
      - [c_insured2, "Hi, this is Carla Nunez. The appraiser said my Corolla is totaled from the hail. What happens now and how much will I get? I still owe on it.", 6]
      - [worker, "I'm sorry about your car, Ms. Nunez. The valuation puts its actual cash value at eight thousand two hundred sixty dollars. After your one-thousand-dollar deductible, the settlement is seven thousand two hundred sixty. Your credit union's payoff is five thousand one hundred forty, so that goes to them first and the remaining two thousand one hundred twenty comes to you."]
      - [c_insured2, "That seems low. Can I see how you got that?", 5]
      - [worker, "Absolutely. I'm emailing you the full valuation report today. If you find comparable cars for sale that you think we missed, send them to me and I'll review them. You also have the right to an appraisal under your policy if we can't agree."]

actions:
  - {at: "D1 08:35", kind: read, target: t1-keel, summary: "read the time-limited demand"}
  - {id: a1-escalate, at: "D1 09:00", kind: new, app: mail, path: sent/simmons-demand-escalation, target: m1-escalate, to: [c_wade, c_rena], subject: "Policy-limits demand, time-limited to Fri 11/6 5 p.m.: LR-26-117730 (Simmons v. Prewitt)",
     summary: "escalated the time-limited demand",
     body: "Wade, Rena: Keel Injury Law demands the $30,000 BI limit for Kayla Simmons in exchange for a full release of our insured, Dale Prewitt; the offer expires Friday 11/6 at 5:00 p.m. CT. Liability is clear (insured rear-ended her, cited). Billed and estimated specials $41,850 (incl. $20,000 estimated injections) plus $4,600 lost wages: well above the limit. This looks like a demand an ordinarily prudent insurer would accept (Stowers). I recommend tendering limits. Reserve is $12,000; I'm requesting an increase to $30,000 (above my authority). Can we take it to Wednesday's large loss committee? Copies of the demand and records are in the file."}
  - {id: a1-excess, at: "D1 09:30", kind: new, app: mail, path: sent/prewitt-excess-letter, target: m1-excess, to: [c_insured1], subject: "Your claim LR-26-117730: settlement demand above your policy limit",
     summary: "sent the insured an excess letter",
     body: "Dear Mr. Prewitt, we've received a demand from the attorney for Kayla Simmons offering to settle her injury claim against you for your $30,000 bodily injury limit, with a full release of you, if accepted by Friday, November 6 at 5:00 p.m. Her claimed damages exceed your limit, so you could be personally responsible for any amount above it if the claim isn't settled. We are reviewing the demand promptly and will let you know our decision before the deadline. You may consult a personal attorney at your own expense. Please call me with any questions. Maribel Ochoa, Leon River Mutual, 254-555-0180"}
  - {id: a1-calendar, at: "D1 09:35", kind: update, target: cal-maribel, summary: "calendared the demand deadline (Fri 11/6 17:00) with a Thursday reminder"}
  - {at: "D1 09:40", kind: read, target: doc-ccc, summary: "reviewed the Nunez valuation"}
  - {at: "D1 11:01", kind: noop, target: c1-carla, summary: "took Carla's call"}
  - {id: a1-carla, at: "D1 11:20", kind: new, app: mail, path: sent/nunez-total-loss-offer, target: m1-carla, to: [c_insured2], subject: "Your total loss settlement, claim LR-26-118204",
     summary: "sent Carla the settlement offer and valuation",
     body: "Dear Ms. Nunez, as discussed, your 2014 Toyota Corolla LE is a total loss (repair estimate $9,140 exceeds its value). Actual cash value $8,260 (CCC valuation attached: base $8,420, condition +$150, mileage -$310), less your $1,000 deductible: $7,260. Texas Dow Employees Credit Union's payoff of $5,140 is paid to them; $2,120 to you. To accept, sign the attached title and power of attorney forms; we pay within 5 business days of acceptance. If you disagree, send comparable listings and I'll review them, or either of us may request appraisal under your policy. Your rental is covered up to $30 a day (maximum $900). Maribel Ochoa", att: [doc-ccc]}
  - {at: "D1 13:05", kind: read, target: t1-trent, summary: "read Trent's note on the Ostrowski photos"}
  - {id: a1-siu, at: "D1 13:30", kind: new, app: mail, path: sent/siu-referral-118281, target: m1-siu, to: [c_siu], cc: [c_wade], subject: "SIU referral: LR-26-118281 (Ostrowski), hail 10/29",
     summary: "referred the Ostrowski claim to SIU",
     body: "Referral: LR-26-118281, Glen Ostrowski, 2016 Nissan Altima, hail claimed for 10/29. Indicators: all six photos he submitted have EXIF capture dates of 5/19/2026; ISO ClaimSearch shows a 2025-04-02 hail claim on the same VIN paid by Brazos Valley ($3,870) with no repair record. I haven't raised either with the insured. I'll keep handling (acknowledgment and an in-person inspection request) unless you advise otherwise. Maribel"}
  - {id: a1-acks, at: "D1 15:30", kind: edit, app: docs, path: claims/hail-acknowledgments-2026-11-02, target: doc-acks, title: "Hail claim acknowledgments sent 11/2",
     summary: "sent acknowledgment and request letters for the hail queue",
     content: "# Acknowledgments sent 11/2 (Ins. Code 542.055, within 15 days of notice)\n\n| Claim | Notice | Ack due | Sent | Requested |\n| --- | --- | --- | --- | --- |\n| LR-26-118211 Morales | 10/29 | 11/13 | 11/2 | photos, inspection appointment |\n| LR-26-118227 Whitfield | 10/30 | 11/14 (Sat) | 11/2 | shop estimate (Belton Collision) |\n| LR-26-118266 Byrd | 10/31 | 11/15 (Sun) | 11/2 | photos, inspection appointment |\n| LR-26-118281 Ostrowski | 11/2 | 11/17 | 11/2 | in-person inspection at our drive-in center (SIU referred) |\n| LR-26-118290 Reyes | 11/2 | 11/17 | 11/2 | photos, inspection appointment |\nAlready complete: LR-26-118204 Nunez (all items 11/2), LR-26-118240 Dunham (estimate 11/3 expected)."}

