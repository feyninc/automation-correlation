# - Hughes title: paid 9/24 -> 30th day 10/24 (passed); one written request (10/1) in the file, so the second goes out
#   11/3 before the Total Loss Unit applies (Transp. Code 501.0925(b)); Maribel gives him to Fri 11/13.
# - Raman estimate: parts $1,233.20 + labor 17.5 h x $62 = $1,085.00 + paint materials 7 h x $38 = $266.00 +
#   calibration $165.00 + hazardous waste $12.00 + tax 8.25% of (1,233.20 + 266.00) = $123.68 -> $2,884.88. Rental 7
#   days x $43.99 = $307.93.
# - Olsen estimate: $1,640.00 + $186.40 + 2.5 h x $120 = $300.00 + $60.00 = $2,186.40 - $250 = $1,936.40.
