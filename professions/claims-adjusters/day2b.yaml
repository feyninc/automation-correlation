     body: "Outbound 11/3 12:35, recorded with the witness's permission (stated on the recording). Independent witness Janet Kowalczyk, northbound left-turn lane behind our insured. Light turned yellow; insured began his left turn; claimant's pickup southbound at an estimated 50 mph in a 35, did not slow; insured halfway across when struck. Claimant entered on yellow; red just after impact. Claimant said at the scene he was trying to make the light. Consistent with the CR-3 (unsafe speed, Unit 2). Supports shared fault."}
  - {id: a2b-liability, at: "D2 13:00", kind: edit, app: docs, path: claims/LR-26-118077-liability-analysis, target: doc-fry-liability, title: "LR-26-118077 (Benavides v. Fry): liability analysis",
     summary: "wrote the liability analysis",
     content: "# LR-26-118077: liability analysis, 11/3\n\nEvidence: CR-3 (Unit 1 Fry failed to yield turning left, cited; Unit 2 Benavides unsafe speed, est. 48 mph in a 35); independent witness Kowalczyk (recorded 11/3: claimant about 50 mph, did not slow, entered on yellow, said he was trying to make the light); insured's and claimant's statements (10/12, 10/13); scene diagram (Enclave past the centerline at impact).\nAnalysis: a left-turning driver must yield to oncoming traffic, so the insured bears the larger share. The claimant's speed, about 13-15 mph over the limit on a yellow, contributed.\nDecision: insured 70%, claimant 30%. The claimant is not more than 50% responsible, so his damages are reduced by 30% (Civ. Prac. & Rem. Code 33.001, 33.012).\nDamages: repair $8,940.00 + rental 9 days x $42.00 = $378.00, total $9,318.00. Offer 70% = $6,522.60. Within my authority.\nNext: liability letter to the claimant and the insured today; reserve $9,318 reduced to $6,522.60."}
  - {id: a2b-benavides, at: "D2 13:20", kind: new, app: mail, path: sent/benavides-liability-decision, target: m2b-benavides, to: [c_benavides], subject: "Your claim LR-26-118077: our liability decision",
     summary: "sent Luis Benavides the 70/30 liability decision and offer",
     body: "Dear Mr. Benavides, we have finished our investigation of the October 9 accident at S 31st St and W Avenue H. Our insured, Wendell Fry, was turning left and should have yielded to you, and we accept that he is mostly responsible. The police report and an independent witness also put your speed well above the 35 mph limit as you entered on a yellow light, which contributed to the crash. We have assigned 70% of the responsibility to our insured and 30% to you. Under Texas law your damages are reduced by your share. Your damages are $9,318.00 (repairs $8,940.00 and rental, 9 days at $42.00, $378.00). We offer 70%, $6,522.60. If you have evidence we haven't seen, such as dash camera video or another witness, please send it and I'll review it. If you carry collision coverage, your own insurer may pay the remaining part of your repair, less your deductible. Maribel Ochoa, Leon River Mutual, 254-555-0180"}
  - {id: a2b-fry, at: "D2 13:28", kind: new, app: mail, path: sent/fry-liability-update, target: m2b-fry, to: [c_fry], subject: "Your claim LR-26-118077: update",
     summary: "told Wendell Fry how the claim against him is being resolved",
     body: "Dear Mr. Fry, we've completed our investigation of the October 9 accident. Based on the police report and an independent witness, we've found you 70% responsible and Mr. Benavides 30% (his speed contributed), and we've offered to pay 70% of his damages under your property damage coverage, which is well within your $50,000 limit. You don't need to do anything. If Mr. Benavides or anyone else contacts you about the accident, please refer them to me, and send me any court papers right away. Maribel Ochoa, Leon River Mutual, 254-555-0180"}
