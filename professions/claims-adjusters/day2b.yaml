actions:
  - {id: a2b-pip-letter, at: "D2 08:02", kind: new, app: mail, path: sent/morris-pip-exhausted, target: m2b-pip-letter, to: [c_morris], subject: "Your PIP benefits on claim LR-26-118040",
     summary: "told Denise Morris her PIP limit is exhausted",
     body: "Dear Ms. Morris, we received Central Texas Orthopedic & Rehab's bill for your visits from October 12 to 28 ($1,640.00). Your personal injury protection (PIP) coverage has a $2,500 limit. We paid $1,180.00 to Baylor Scott & White on October 30, and we are paying the remaining $1,320.00 to Central Texas Orthopedic & Rehab this week. With that payment your PIP limit has been exhausted, so we can't pay further medical bills under PIP for this accident. The remaining $320.00 of this bill, and any future treatment, should be submitted to your health insurance. Please call me with any questions. Maribel Ochoa, Leon River Mutual, 254-555-0180"}
  - {id: a2b-graves-offer, at: "D2 08:28", kind: new, app: mail, path: sent/graves-total-loss-offer, target: m2b-graves-offer, to: [c_graves], subject: "Your total loss settlement, claim LR-26-118170", att: [doc-graves-ccc],
     summary: "sent Shelby Graves the total loss offer",
     body: "Dear Ms. Graves, I'm sorry about your Ranger. The repair estimate ($7,960) is more than the truck's value, so it is a total loss. The CCC valuation (attached) puts its actual cash value at $6,880 (base $7,020, condition -$140). Less your $500 collision deductible, the settlement is $6,380.00, payable to you (there is no lienholder). To accept, sign and mail the title and the enclosed power of attorney; we pay within 5 business days of acceptance, and we'll move the truck from Bell County Towing to Copart so you aren't charged storage. If you'd prefer to keep the truck, call me before Wednesday: the settlement would be reduced by its salvage value and it would need a salvage title. If you disagree with the value, send me comparable listings and I'll review them; either of us may also request appraisal under your policy. Maribel Ochoa, Leon River Mutual, 254-555-0180"}
