  - {id: a2b-conner-note, at: "D2 08:50", kind: update, target: c2b-conner, summary: "wrote the case note for the Conner call",
     body: "Inbound 11/3 08:40. Acknowledged the claim by phone (Ins. Code 542.055(c)). Parked 2021 Civic on N 5th St struck overnight 11/2 by an unknown vehicle that left; red paint transfer, driver side scraped. Physical contact, so handled under UMPD ($250 deductible) rather than collision ($1,000). TPD report 26-032140. Transportation expense applies ($30/day, $900 max). Insured choosing shop; photos and estimate requested. Written acknowledgment to follow."}
  - {id: a2b-conner-ack, at: "D2 08:56", kind: new, app: mail, path: sent/conner-acknowledgment, target: m2b-conner-ack, to: [c_conner], subject: "Your claim LR-26-118305: acknowledgment and what we need",
     summary: "sent Lydia Conner the written acknowledgment",
     body: "Dear Ms. Conner, this confirms that we received your claim on November 3 for the damage to your parked 2021 Honda Civic by a driver who left the scene, and we have begun our investigation. Because the other vehicle made contact with yours, the claim is being handled under your uninsured motorist property damage coverage, with a $250 deductible. To complete it we need: photos of the damage, the Temple police report (26-032140), and your shop's estimate. Your transportation expense coverage pays up to $30 a day, to a maximum of $900. Maribel Ochoa, Leon River Mutual, 254-555-0180"}
