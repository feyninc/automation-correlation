# Computations (python3):
# - Reserve audit: LR-26-117463 paid in full 9/30 -> close ($2,400 -> $0). LR-26-117600: $5,612.00 + $890.00 =
#   $6,502.00 - $1,000 deductible = $5,502.00 (from $3,000). LR-26-117637: ACV $14,350.00 - $500 = $13,850.00 (from
