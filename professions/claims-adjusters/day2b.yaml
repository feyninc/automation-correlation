     summary: "summarized the Flores recorded statement",
     content: "# LR-26-118294: claimant's statement (Yesenia Flores), by phone 11/3 10:00, recorded with permission\n\nStopped at the Loop 363 / Midway Dr red light 10/31 about 14:15 when struck from behind by a pickup (our insured, Marcus Bell). Consistent with the insured's account. Seat belt on; no airbag deployment; head went back and forward. Drove home; neck pain worse that evening. Urgent care Sunday 11/1 (cervical strain, muscle relaxant, follow up with PCP). No prior neck injuries or claims reported. Employed as a dental assistant; missed Monday 11/2. Health insurance: none stated; no PIP on her own policy (she rejected it, she thinks).\nProperty: 2019 Sentra, rear bumper pushed in; photos received 11/3.\nLiability: clear.\nNext: appraisal; medical records via the signed authorization."}
