# Wednesday 2026-11-04. The committee approves tendering the limit; acceptance must reach the attorney before Friday
# 17:00 and the insured gets the news. Payments' duplicate report flags the Dunham payment twice. Glen Ostrowski calls
# for a status. SIU asks for an inspection before any decision.

documents:
  - id: doc-dupes
    app: docs
    path: claims/payments-duplicate-report-2026-11-04
    title: Claims Payments, possible duplicates (11/4)
    format: csv
    at: "D3 13:00"
    author: c_finance
    content: |
      claim,payee,amount,issued,check
      LR-26-118240,Ray Dunham & Belton Collision Center,3880.00,2026-11-04,CK-7720115
      LR-26-118240,Belton Collision Center,3880.00,2026-11-04,CK-7720131

threads:
  - id: t3-rena
    app: mail
    path: inbox/committee-simmons
    title: Committee decision
    x:
      - {at: "D3 10:45", from: c_rena, to: [worker], cc: [c_wade], subject: "Committee: accept the Simmons demand",
         body: "Maribel, committee approved accepting the $30,000 limits demand. Please send written acceptance to Keel today, request a release limited to Dale Prewitt, and make sure the Baylor lien is handled. Payment authority $30,000 approved. Rena"}
  - id: t3-siu
    app: mail
    path: inbox/siu-118281
    title: SIU on LR-26-118281
    x:
      - {at: "D3 15:00", from: c_siu, to: [worker], subject: "Re: SIU referral LR-26-118281",
         body: "Thanks Maribel, good referral. Please schedule an in-person inspection at the drive-in center and request the 2025 Brazos Valley estimate and any repair invoices from the insured. Don't discuss our concerns with him. No decision until we report. SIU"}
  - id: t3-trent
    app: mail
    path: inbox/morales-estimate
    title: Morales estimate
    x:
      - {at: "D3 16:00", from: c_appraiser, to: [worker], subject: "LR-26-118211 (Morales) estimate",
         body: "Inspected Ivan Morales's 2021 F-150 today: hail damage to roof, hood, cab and bed panels; roof skin replacement plus PDR. Estimate $17,400.00, deductible $1,000. Photos and estimate in the file. Trent"}

calls:
  - id: c3-glen
    path: 2026-11-04/1400-glen-ostrowski
    title: Inbound call, Glen Ostrowski
    start: "D3 14:00:00"
    turns:
      - [c_glen, "Yeah, Glen Ostrowski, claim for my Altima from the hail last week. When am I getting paid? I sent you the photos already.", 5]
      - [worker, "Thanks for calling, Mr. Ostrowski. I've got your photos. The next step is an in-person inspection at our drive-in center in Temple; could you bring the car in this Friday or Monday?"]
      - [c_glen, "Why do you need to see it? The photos show the dents.", 4]
      - [worker, "We inspect most hail claims in person to write an accurate estimate. It takes about twenty minutes. Monday at ten?"]

contacts:
  - [c_glen, Glen Ostrowski, insured (policy LRM-A-4480137), Leon River Mutual policyholder, gostrowski@gmail.example, "254-555-0450", insured (hail claim under SIU review)]

actions:
  - {at: "D3 10:00", kind: noop, target: cal-maribel, summary: "large loss committee"}
  - {at: "D3 10:50", kind: read, target: t3-rena, summary: "read Rena's decision"}
  - {id: a3-accept, at: "D3 11:15", kind: reply, target: t1-keel, to: [c_attorney], cc: [c_wade], summary: "accepted the demand in writing",
     body: "Mr. Keel, Leon River Mutual accepts your client's demand dated November 2, 2026: we will pay the $30,000.00 bodily injury limit in full settlement of Kayla Simmons's claims against our insured, Dale Prewitt, in exchange for a full release of Mr. Prewitt. We received notice of Baylor Scott & White's hospital lien ($3,210.00, filed 9/28/2026); the settlement payment will include the lienholder as a payee unless you provide a release of the lien before funding. Please send the release for review; payment will issue within 5 business days of receiving it. Maribel Ochoa"}
  - {id: a3-insured, at: "D3 11:30", kind: new, app: mail, path: sent/prewitt-settled, target: m3-insured, to: [c_insured1], subject: "Your claim LR-26-117730: settlement accepted",
     summary: "told the insured the claim is settling within limits",
     body: "Dear Mr. Prewitt, good news: we have accepted Ms. Simmons's offer to settle her claim against you for your $30,000 policy limit, with a full release of you. Once the release is signed and payment made, you will have no further exposure for this claim. Please call me with any questions. Maribel Ochoa"}
  - {at: "D3 13:05", kind: read, target: doc-dupes, summary: "read the duplicate payment report"}
  - {id: a3-dupe, at: "D3 13:20", kind: reply, target: m2-dunham-pay, to: [c_finance], summary: "reported the duplicate Dunham check",
     body: "CK-7720131 ($3,880.00 to Belton Collision only) on LR-26-118240 is a duplicate of CK-7720115 (joint payee, the correct one). Please void CK-7720131 before it's cashed; if it has cleared, recover it from Belton Collision. Maribel"}
  - {at: "D3 14:01", kind: noop, target: c3-glen, summary: "took Glen Ostrowski's call"}
  - {at: "D3 15:05", kind: read, target: t3-siu, summary: "read SIU's instructions"}
  - {id: a3-glen, at: "D3 15:20", kind: new, app: mail, path: sent/ostrowski-inspection, target: m3-glen, to: [c_glen], subject: "Claim LR-26-118281: inspection Monday 11/9 10:00",
     summary: "confirmed Glen's inspection and requested documents",
     body: "Dear Mr. Ostrowski, thank you for scheduling your inspection at our drive-in center (2210 S 31st St, Temple) on Monday, November 9 at 10:00 a.m. To complete our review, please also send any estimate or repair invoices for your vehicle's hail claim with Brazos Valley Insurance in April 2025. Maribel Ochoa"}
  - {id: a3-morales, at: "D3 16:20", kind: new, app: mail, path: sent/morales-authority, target: m3-morales, to: [c_wade], subject: "Authority request: LR-26-118211 (Morales) $16,400",
     summary: "asked Wade for authority on the Morales payment",
     body: "Wade, LR-26-118211 (Ivan Morales, 2021 F-150, hail): field estimate $17,400 (roof skin replacement plus PDR, photos in file); payment $16,400 after the $1,000 deductible, over my $15,000 authority. Coverage confirmed (comprehensive, in force, hail 10/29). All items now received (11/4), so the decision is due 11/30. OK to approve?"}

needs:
  - id: n3-accept
    title: Accept the demand in writing before the deadline
    kind: reply
    task: 21445
    from: "D3 10:45"
    due: "D5 17:00"
    evidence: [t3-rena, doc-demand, doc-lien]
    ref: a3-accept
    check: {all: [{to_includes: c_attorney}, {mentions_any: [accepts, accept]}, {number_equals: {value: 30000}}, {mentions_any: [lien]}]}
    must: ["Unconditional acceptance of the demand's terms, the release of the insured, the lien handled as a payee or release, payment timing"]
    must_not: ["Adds conditions beyond the demand that could void the acceptance"]
    minutes: [25, "a formal letter (estimate)"]
    intent: "Before Friday 5."
  - id: n3-insured
    title: Tell the insured it's settling within limits
    kind: follow_up
    task: 21421
    from: "D3 10:45"
    due: "D3 17:00"
    evidence: [t3-rena, m1-excess]
    ref: a3-insured
    check: {all: [{to_includes: c_insured1}, {mentions_any: [accepted, settle]}, {mentions_any: [release]}]}
    must: ["Accepted within limits, full release, no further exposure once signed"]
    minutes: [8, "a short letter"]
    intent: "He's been worried."
  - id: n3-dupe
    title: Report the duplicate payment
    kind: reconcile
    task: 21439
    from: "D3 13:00"
    due: "D3 17:00"
    evidence: [doc-dupes, m2-dunham-pay]
    ref: a3-dupe
    check: {all: [{to_includes: c_finance}, {mentions_any: [CK-7720131]}, {mentions_any: [void, duplicate]}]}
    must: ["Which check is the duplicate and why; void or recover"]
    minutes: [5, "a duplicate check"]
    intent: "$3,880 out the door twice."
  - id: n3-glen-line
    title: Schedule the inspection without tipping off the insured
    kind: call_line
    task: 21422
    evidence: [c3-glen, t3-siu]
    ref: c3-glen.2
    check: {all: [{target: c3-glen}, {action_in: [say]}, {mentions_any: [inspection]}]}
    must: ["Next step is an in-person inspection; neutral"]
    must_not: ["Mentions the photo dates or the 2025 claim"]
    minutes: [0.3, "a spoken line"]
    intent: "Neutral."
  - id: n3-glen-why
    title: A neutral reason for the inspection
    kind: call_line
    task: 21422
    evidence: [c3-glen, t3-siu]
    ref: c3-glen.4
    check: {all: [{target: c3-glen}, {action_in: [say]}, {mentions_any: [accurate, estimate, most hail claims]}]}
    must: ["Routine reason; a specific time"]
    must_not: ["Accuses him"]
    minutes: [0.3, "a spoken line"]
    intent: "Routine."
  - id: n3-glen-docs
    title: Confirm the inspection and request the 2025 records
    kind: follow_up
    task: 21433
    from: "D3 15:00"
    due: "D4 17:00"
    evidence: [t3-siu, doc-iso]
    ref: a3-glen
    check: {all: [{to_includes: c_glen}, {mentions_any: [inspection]}, {mentions_any: [Brazos Valley, "2025"]}]}
    must: ["Inspection confirmed; the prior-claim records requested, neutrally"]
    minutes: [8, "a letter"]
    intent: "Per SIU."
  - id: n3-morales
    title: Get authority for a payment above her limit
    kind: escalate
    task: 21426
    from: "D3 16:00"
    due: "D4 12:00"
    evidence: [t3-trent, pol-guidelines]
    ref: a3-morales
    check: {all: [{to_includes: c_wade}, {number_equals: {value: 16400}}, {mentions_any: ["15,000", authority]}]}
    must: ["$17,400 - $1,000 = $16,400, above $15,000: supervisor approves; coverage and deadline noted (11/30)"]
    must_not: ["Pays it herself"]
    minutes: [8, "an authority request"]
    intent: "Over my limit."

