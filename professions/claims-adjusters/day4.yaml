# Thursday 2026-11-05. Carla disputes the total loss value with three listings; CCC re-runs with the two that are truly
# comparable. Keel sends a release that would release more than the insured. Wade wants the hail queue's statutory
# deadlines for the huddle.
#
# CCC re-run: ACV $8,610; settlement $8,610 - $1,000 = $7,610; credit union $5,140; Carla $2,470.

contacts:
  - [c_byrd, Tasha Byrd, insured (policy LRM-A-4466018), Leon River Mutual policyholder, tbyrd@outlook.example, "", insured (hail claim)]

documents:
  - id: doc-comps
    app: docs
    path: claims/LR-26-118204-insured-comparables
    title: "Carla Nunez's comparables (LR-26-118204)"
    at: "D4 09:00"
    author: c_insured2
    content: |
      1. 2014 Toyota Corolla LE, 118,200 miles, Temple dealer, asking $9,450.
      2. 2014 Toyota Corolla S Plus, 92,000 miles, Waco dealer, asking $9,900.
      3. 2014 Toyota Corolla LE, 131,000 miles, private seller, Killeen, asking $8,950.
  - id: doc-ccc2
    app: docs
    path: claims/LR-26-118204-ccc-rerun
    title: "CCC re-run with insured comparables 1 and 3"
    at: "D4 15:00"
    author: c_appraiser
    content: |
      Re-run including the insured's comparables 1 and 3 (same trim, similar mileage; dealer and private asking prices
      adjusted to typical selling price). Comparable 2 excluded (S Plus trim, 35,000 fewer miles). New base $8,770;
      condition +$150; mileage -$310. Actual cash value $8,610.
  - id: doc-release
    app: docs
    path: claims/LR-26-117730-release-draft
    title: "Keel's draft release (Simmons)"
    at: "D4 11:00"
    author: c_attorney
    content: |
      RELEASE. For $30,000.00, Kayla Simmons releases Dale Prewitt and Leon River Mutual Insurance Company from all
      claims arising from the 8/14/2026 collision, EXCEPT that this release does not release any claim against Leon
      River Mutual for underinsured motorist benefits or for bad faith, which are expressly reserved. Claimant will
      satisfy all liens from the proceeds and indemnify the releasees. Funds payable to "Keel Injury Law IOLTA".

threads:
  - id: t4-carla
    app: mail
    path: inbox/nunez-comps
    title: Comparables
    x:
      - {at: "D4 09:00", from: c_insured2, to: [worker], subject: "My Corolla is worth more", body: "Maribel, here are three cars for sale near me, all more than your number. Carla", att: [doc-comps]}
  - id: t4-keel
    app: mail
    path: inbox/simmons-release
    title: Simmons release
    x:
      - {at: "D4 11:00", from: c_attorney, to: [worker], subject: "Release for Simmons", body: "Attached. Please fund by Friday. Brandon", att: [doc-release]}
  - id: t4-wade
    app: chat
    path: "@wade/dm"
    title: Wade Hollister (DM)
    x:
      - {at: "D4 12:30", from: c_wade, body: "for the 2pm huddle, can you list your hail claims with their 542 deadlines (ack and decision)?"}
  - id: t4-byrd
    app: mail
    path: inbox/byrd-photos
    title: Byrd photos
    x:
      - {at: "D4 10:00", from: c_appraiser, to: [worker], subject: "LR-26-118266 (Byrd): photo estimate",
         body: "Tasha Byrd's photos (received this morning) show 6 small dents on the hood. Photo estimate $420.00 (PDR). Her deductible is $500. Trent"}

actions:
  - {at: "D4 09:05", kind: read, target: t4-carla, summary: "reviewed Carla's comparables"}
  - {id: a4-ccc, at: "D4 09:30", kind: new, app: mail, path: sent/ccc-rerun-request, target: m4-ccc, to: [c_appraiser], subject: "LR-26-118204: re-run CCC with insured comps",
     summary: "asked for a CCC re-run with the valid comparables",
     body: "Trent, please re-run Carla Nunez's valuation including her comparables 1 (LE, 118k, Temple) and 3 (LE, 131k, Killeen). Comp 2 is an S Plus with 35,000 fewer miles, so not comparable. Today if you can."}
  - {at: "D4 11:05", kind: read, target: doc-release, summary: "read Keel's draft release"}
  - {id: a4-release, at: "D4 11:40", kind: new, app: mail, path: sent/release-to-counsel, target: m4-release, to: [c_rena], cc: [c_defense, c_wade], subject: "Simmons release: three problems before funding",
     summary: "flagged the release terms to Rena and counsel",
     body: "Rena, Paul: Keel's draft release has three problems against the demand we accepted (full release of Dale Prewitt for $30,000): (1) it reserves bad-faith and UIM claims against us; (2) it makes funds payable to the IOLTA only, while we have notice of Baylor's $3,210 hospital lien; (3) it adds an indemnity, which is fine for us. I'd ask Keel to remove the reservation (or confirm the insured is fully released regardless) and add Baylor as a payee or provide a lien release. Deadline pressure is theirs now since we accepted Wednesday, but I want this settled before Friday. Paul, could you look today?"}
  - {at: "D4 12:35", kind: read, target: t4-wade, summary: "read Wade's request"}
  - {id: a4-deadlines, at: "D4 13:30", kind: edit, app: docs, path: claims/hail-542-deadlines, target: doc-deadlines, title: "Hail claims: Ins. Code 542 deadlines (11/5)",
     summary: "listed the hail claims' statutory deadlines",
     content: "# Hail claims: Ins. Code 542 deadlines (as of 11/5)\n\n| Claim | Notice | Ack (15 days) | All items | Decide by (15 business days) | Status |\n| --- | --- | --- | --- | --- | --- |\n| LR-26-118204 Nunez | 10/29 | done 11/2 | 11/2 | 11/24 | offer made 11/2; value dispute, re-run today |\n| LR-26-118211 Morales | 10/29 | done 11/2 | pending | 15 bus. days after items | inspection 11/6 |\n| LR-26-118227 Whitfield | 10/30 | done 11/2 | 11/2 (estimate) | 11/24 | accepted, supplement approved 11/3 |\n| LR-26-118240 Dunham | 10/30 | done 11/2 | 11/3 | 11/25 | accepted 11/3; paid 11/4 (duplicate voided) |\n| LR-26-118266 Byrd | 10/31 | done 11/2 | pending | | photos requested |\n| LR-26-118281 Ostrowski | 11/2 | done 11/2 | pending | | SIU; inspection 11/9; if not decided in time, send the 542.056(b) notice |\n| LR-26-118290 Reyes | 11/2 | done 11/2 | pending | | photos requested |\nBusiness days skip weekends and Texas holidays (Veterans Day 11/11, 11/26-27)."}
  - {at: "D4 15:05", kind: read, target: doc-ccc2, summary: "read the CCC re-run"}
  - {id: a4-carla, at: "D4 15:30", kind: reply, target: t4-carla, to: [c_insured2], summary: "sent Carla the revised offer",
     body: "Dear Ms. Nunez, thank you for the listings. We re-ran the valuation including your first and third cars, which match your car's trim and mileage; the second is a higher trim (S Plus) with 35,000 fewer miles, so it isn't comparable. The new actual cash value is $8,610 (report attached), so the settlement is $7,610 after your deductible: $5,140 to Texas Dow Employees Credit Union and $2,470 to you. If you still disagree, either of us may request appraisal under your policy. Maribel Ochoa", att: [doc-ccc2]}
  - {id: a4-byrd, at: "D4 10:30", kind: new, app: mail, path: sent/byrd-decision, target: m4-byrd, to: [c_byrd], subject: "Your hail claim LR-26-118266",
     summary: "explained Byrd's claim falls under her deductible",
     body: "Dear Ms. Byrd, thank you for the photos. Your claim is covered: the hail damage to your hood is a covered comprehensive loss. The repair estimate is $420.00 (paintless dent repair, estimate attached), which is less than your $500 deductible, so there is no payment on this claim. If you find more damage, or a shop's estimate is higher, send it to me and I'll review it. Maribel Ochoa"}

