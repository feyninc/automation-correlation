# Tuesday 2026-11-03. Pre-con call at 10. Roberta approves captioning; Lakes needs confirmation by noon. Session 3B's
# speaker drops out and the backup must be confirmed, the agenda and PDH record updated. The AV revision takes the AV
# order over budget and over the director's signing limit. The hotel's BEO confirmation has the reception at the
# contracted count instead of the guarantee. The room-block amendment arrives for signature.
#
# AV: revised order $26,850 (budget $24,500; +$2,350 for the captioning monitor, a lav mic and a laptop adapter); over
# $10,000, so the Executive Director signs.

documents:
  - id: doc-beo-confirm
    app: docs
    path: conference-2026/henley-beo-confirmation
    title: Henley BEO confirmation (Simone, 11/3)
    at: "D2 09:00"
    author: c_simone
    content: |
      Confirmed for Thursday 11/5: BEO 8812 breakfast guarantee 360 (set 371); BEO 8813 lunch guarantee 380 (set 392;
      31 V, 9 GF, 4 VG, 2 nut allergy); BEO 8814 reception guarantee 350 (set 361).
  - id: doc-av-revision
    app: docs
    path: conference-2026/meridian-av-order-rev2
    title: Meridian AV order, revision 2
    at: "D2 13:00"
    author: c_av
    content: |
      Original order (signed 9/14 by Roberta Lang): $24,500. Revision 2 adds: 55" confidence monitor in Salon 1 for
      captioning ($1,150), wireless lavalier for session 3B ($450), USB-C to HDMI adapters x 4 ($120), labor
      ($630). Revised total $26,850. Signature required on the revised order.
  - id: doc-amendment
    app: docs
    path: conference-2026/henley-amendment-1
    title: Henley amendment 1 (cutoff extension)
    at: "D2 09:30"
    author: c_paul
    content: |
      Amendment 1 to the group sales agreement: the room block cutoff is extended to Wednesday 11/4, 12:00 noon ET at
      the group rate of $189. All other terms, including attrition (80%, cumulative, less resold rooms), unchanged.
      No additional cost. Signature: group's authorized signatory.

threads:
  - id: t2-leon
    app: mail
    path: inbox/re-captioning
    title: "Re: Captioning"
    x:
      - {at: "D2 08:30", from: c_leon, to: [worker], subject: "Re: Captioning for the Fall conference?", body: "Thank you so much! A monitor near my seat works best; my tablet battery won't last the day. Leon"}
  - id: t1-roberta
    x:
      - {at: "D2 09:05", from: c_roberta, body: "yes on captioning from contingency. good call."}
  - id: t2-raj
    app: mail
    path: inbox/raj-cancel
    title: Session 3B
    x:
      - {at: "D2 11:30", from: c_speaker3b, to: [worker], subject: "So sorry: I can't present Thursday",
         body: "Harper, I've come down with something and my doctor says no travel this week. I'm so sorry to cancel session 3B. My slides are attached if someone can use them. Raj"}
  - id: t2-av
    app: mail
    path: inbox/meridian-rev2
    title: Meridian AV revision 2
    x:
      - {at: "D2 13:00", from: c_av, to: [worker], subject: "Revised AV order (rev 2) for signature", body: "Hi Harper, rev 2 with the captioning monitor, the lav and adapters. Please sign and return today so we can pull equipment. Dana", att: [doc-av-revision]}
  - id: t2-paul
    app: mail
    path: inbox/henley-amendment
    title: Henley amendment
    x:
      - {at: "D2 09:30", from: c_paul, to: [worker], cc: [c_roberta], subject: "Amendment 1: cutoff extension", body: "As discussed, attached. Please sign and return. Paul", att: [doc-amendment]}
  - id: t2-bus
    app: mail
    path: inbox/shuttle-confirmation
    title: Shuttle confirmation
    x:
      - {at: "D2 15:00", from: c_bus, to: [worker], subject: "Shuttle confirmation, Thu 11/5",
         body: "Confirming 1 x 56-passenger coach, Henley to Huntington Place parking, 06:30-09:00 and 16:00-18:30, $1,800. Please confirm the number of coaches. Motor City Coaches"}

actions:
  - {at: "D2 09:10", kind: read, target: doc-beo-confirm, summary: "checked the BEO confirmation"}
  - {id: a2-beo, at: "D2 09:20", kind: reply, target: t1-simone, to: [c_simone], summary: "corrected the reception guarantee",
     body: "Thanks Simone, breakfast and lunch are right. One correction: the reception (BEO 8814) guarantee is 315, not 350 (350 is the contracted count); please set 325. Could you send a corrected confirmation?"}
  - {id: a2-amendment, at: "D2 09:40", kind: reply, target: t2-paul, to: [c_paul], cc: [c_roberta], summary: "sent the amendment to Roberta to sign",
     body: "Thanks Paul. Roberta, the amendment only extends the cutoff to Wednesday noon at no cost; it's within your signing authority. Could you sign and return it to Paul today?"}
  - {at: "D2 10:00", kind: noop, target: cal-harper, summary: "pre-con call with the Henley and Meridian AV"}
  - {id: a2-cart, at: "D2 10:30", kind: new, app: mail, path: sent/cart-confirm, target: m2-cart, to: [c_cart], subject: "Confirmed: CART captioning Thu 11/5 ($1,225)",
     summary: "confirmed the captioner",
     body: "Confirming CART for Thursday 11/5 at the Henley, 08:30-15:45 (lunch unbilled) plus the closing panel, $1,225 per your quote. The attendee prefers captions on a monitor at his seat; Meridian AV is providing a 55-inch confidence monitor in Salon 1 and the Ballroom feed. Please arrive by 08:00; your contact on site is me, 734-555-0160. Harper"}
  - {id: a2-leon, at: "D2 10:35", kind: reply, target: t2-leon, to: [c_leon], summary: "confirmed Leon's captioning",
     body: "Great, done: live captions on a monitor at a reserved seat (front left) in the Ballroom for the keynote and closing panel, and in Salon 1 for 1A-4A. Find me at registration and I'll show you your seats. Harper"}
  - {at: "D2 11:35", kind: read, target: t2-raj, summary: "read Raj's cancellation"}
  - {id: a2-raj, at: "D2 11:45", kind: reply, target: t2-raj, to: [c_speaker3b], summary: "thanked Raj",
     body: "Raj, please feel better; no apology needed. We'll take care of 3B. Harper"}
  - {id: a2-karen, at: "D2 12:00", kind: new, app: mail, path: sent/backup-speaker-3b, target: m2-karen, to: [c_backup], subject: "Could you present session 3B on Thursday?",
     summary: "asked the backup speaker to present 3B",
     body: "Karen, our 3B speaker has had to cancel. You kindly agreed to be our backup: could you present 'Retro-commissioning chiller plants in K-12 buildings' in 3B, Thursday 13:30-14:30, Salon 2? Same honorarium ($500) and complimentary registration. I'll need a title, a 50-word abstract and learning objectives by Wednesday 10:00 for the app and PDH records. Harper"}
  - {at: "D2 13:05", kind: read, target: t2-av, summary: "read Meridian's revised order"}
  - {id: a2-av, at: "D2 13:30", kind: new, app: mail, path: sent/av-rev2-signature, target: m2-av, to: [c_gwen], cc: [c_roberta], subject: "Signature needed today: Meridian AV revision 2 ($26,850)",
     summary: "sent the AV revision to the Executive Director to sign",
     body: "Gwen, Meridian's revised AV order is $26,850 (original $24,500, signed by Roberta), adding the captioning monitor for our hard-of-hearing attendee ($1,150), a lav mic for the 3B replacement ($450), adapters and labor. It's over the $10,000 limit, so it needs your signature, today if possible so they can pull gear. The $2,350 increase comes from contingency (with captioning, $3,575 of the $5,000 used). Harper"}
  - {at: "D2 15:05", kind: read, target: t2-bus, summary: "read the shuttle confirmation"}
  - {id: a2-bus, at: "D2 15:20", kind: reply, target: t2-bus, to: [c_bus], summary: "confirmed the shuttle",
     body: "Confirmed: one 56-passenger coach is right for the 20-minute loop (we expect about 140 riders across each window). $1,800 matches our quote. Driver contact on the day: Eli Brooks, 734-555-0162. Harper"}

