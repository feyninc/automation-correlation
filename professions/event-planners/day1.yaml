# Monday 2026-11-02. Final F&B guarantees are due at noon; the room block cuts off at 17:00 with pickup short of the
# 80% attrition floor. An attendee who is hard of hearing asks for captioning. The platinum sponsor wants the attendee
# list. The hotel's sales manager calls about the block.
#
# Guarantees (412 registered at 08:00): breakfast 412 x 78% = 321.4 -> 322, floor 360 -> 360; lunch 412 x 92% =
# 379.0 -> 380 (above the 360 floor) -> 380; reception 412 x 64% = 263.7 -> 264, floor 315 -> 315. Cost: 360 x $38 +
# 380 x $52 + 315 x $64 = $53,600; + 24% service $12,864; + 6% tax $3,987.84 = $70,451.84 (budget $72,000).
# Rooms: 152 of 220 room-nights picked up; floor 176; shortfall 24 x $189 = $4,536 before resale credit.

documents:
  - id: doc-reg
    app: docs
    path: conference-2026/registration-summary-2026-11-02
    title: Cvent registration summary, Mon 11/2 08:00
    at: "D1 08:00"
    author: c_eli
    content: |
      Registered: 412 (members 351, non-members 38, speakers 15, exhibitor staff counted separately: 41).
      Dietary: vegetarian 31, gluten-free 9, vegan 4, nut allergy 2.
      Accessibility: 1 wheelchair seating request (Joanne Pike); 1 captioning request (Leon Price, see email).
      share_with_exhibitors = yes: 286; no: 126.
      Hotel pickup (Henley report 08:00): Wed 11/4 79 rooms, Thu 11/5 73 rooms = 152 room-nights of 220.
  - id: doc-cart-quote
    app: docs
    path: conference-2026/lakes-captioning-quote
    title: Lakes Captioning quote (CART)
    at: "D1 11:20"
    author: c_cart
    content: |
      CART (real-time captioning), on site, Thursday 11/5: $175.00 per hour, 2-hour minimum, 7 hours (08:30-15:45 with
      the lunch break unbilled): $1,225.00. Display on a confidence monitor or streamed to the attendee's tablet.
      Confirm by Tuesday 12:00 to guarantee a captioner.

threads:
  - id: t1-simone
    app: mail
    path: inbox/henley-guarantees
    title: Guarantees due today
    x:
      - {at: "D1 08:10", from: c_simone, to: [worker], subject: "Reminder: final guarantees due today at noon",
         body: "Good morning Harper! Final counts for Thursday's breakfast, lunch and reception are due by noon today, with any dietary counts. Simone, Henley Detroit"}
  - id: t1-leon
    app: mail
    path: inbox/captioning-request
    title: Captioning request
    x:
      - {at: "D1 09:20", from: c_leon, to: [worker], subject: "Captioning for the Fall conference?",
         body: "Hello, I'm registered for Thursday. I'm hard of hearing and I struggle with presentations in large rooms. Is captioning available for the keynote and sessions? I'll mostly be in the energy track (1A, 2A, 3A, 4A). Thank you, Leon Price, PE"}
  - id: t1-tom
    app: mail
    path: inbox/ameridrive-list
    title: Attendee list
    x:
      - {at: "D1 10:30", from: c_sponsor, to: [worker], subject: "Attendee list for our platinum package",
         body: "Hi Harper, as platinum sponsor we'd love the full attendee list with emails and phone numbers today so our reps can set up meetings before Thursday. Thanks! Tom, Ameridrive"}
  - id: t1-roberta
    app: chat
    path: "@roberta/dm"
    title: Roberta Lang (DM)
    x:
      - {at: "D1 13:30", from: c_roberta, body: "how's the block looking? if we're short, what's our exposure?"}

calls:
  - id: c1-paul
    path: 2026-11-02/1500-paul-andreou
    title: Inbound call, Paul Andreou (Henley group sales)
    start: "D1 15:00:00"
    turns:
      - [c_paul, "Hi Harper, Paul at the Henley. Cutoff's at five today and you're at 152 room-nights. Do you want me to hold the block past cutoff, or release it?", 5]
      - [worker, "Thanks Paul. The attrition floor is 176, so we're 24 short. Could you hold the remaining rooms at the group rate through Wednesday noon? We'll push members today, and anything you resell from the block should come off the shortfall."]
      - [c_paul, "I can extend to Wednesday noon at the group rate. Resold rooms count, as the contract says. I'll send it in writing.", 5]
      - [worker, "Perfect, please send the amendment to me and Roberta; she'll sign it."]

contacts:
  - [c_leon, Leon Price, "Attendee (PE, Wayne County)", member, lprice@waynecounty.example, "", attendee]

actions:
  - {at: "D1 08:15", kind: read, target: doc-reg, summary: "pulled the registration summary"}
  - {id: a1-guarantees, at: "D1 10:00", kind: reply, target: t1-simone, to: [c_simone], cc: [c_roberta], summary: "sent the Henley the final guarantees",
     body: "Hi Simone, final guarantees for Thursday 11/5: breakfast (BEO 8812) 360; lunch (BEO 8813) 380; reception (BEO 8814) 315. Dietary for lunch: 31 vegetarian, 9 gluten-free, 4 vegan, 2 nut allergies (please label plates); breakfast to include gluten-free and vegan options. One wheelchair seating space at a Ballroom table near the front. Thanks! Harper"}
  - {id: a1-guarantee-note, at: "D1 10:05", kind: edit, app: docs, path: conference-2026/guarantee-worksheet, target: doc-guarantee-ws, title: Guarantee worksheet (11/2),
     summary: "recorded the guarantee worksheet",
     content: "# Guarantee worksheet, Mon 11/2 (412 registered at 08:00)\n\n| Function | Show rate | Expected | Floor (90%) | Guarantee | Hotel sets (3% over) | Price | Food cost |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| Breakfast | 78% | 322 | 360 | 360 | 371 | $38 | $13,680 |\n| Lunch | 92% | 380 | 360 | 380 | 392 | $52 | $19,760 |\n| Reception | 64% | 264 | 315 | 315 | 325 | $64 | $20,160 |\nSubtotal $53,600; service charge 24% $12,864; tax 6% $3,987.84; total $70,451.84 (budget $72,000). Breakfast and reception are at the contract floor, so we pay for more than we expect to serve there."}
  - {at: "D1 09:25", kind: read, target: t1-leon, summary: "read Leon's captioning request"}
  - {id: a1-cart-req, at: "D1 09:45", kind: new, app: mail, path: sent/cart-request, target: m1-cart, to: [c_cart], subject: "CART captioning request: Thursday 11/5, Henley Hotel Detroit",
     summary: "asked Lakes Captioning for a quote",
     body: "Hello, we need on-site CART captioning on Thursday 11/5 at the Henley Hotel Detroit for an attendee who is hard of hearing: the keynote (08:30, Ballroom) and sessions 1A, 2A, 3A and 4A (Salon 1), plus the closing panel (16:00). Can you quote and confirm availability? Harper Quinn, GLSFE"}
  - {id: a1-leon, at: "D1 09:50", kind: reply, target: t1-leon, to: [c_leon], summary: "told Leon captioning is being arranged",
     body: "Hi Leon, thank you for letting us know. We're arranging live (CART) captioning for the keynote, the energy-track sessions 1A-4A and the closing panel. Would captions on a monitor at your seat or streamed to a tablet work better for you? We'll save you a seat with a clear view. I'll confirm the details by Tuesday. Harper"}
  - {id: a1-cart-budget, at: "D1 11:40", kind: new, app: chat, path: "@roberta/dm", target: t1-roberta, to: [c_roberta], summary: "asked Roberta to approve the captioning cost",
     body: "Captioning for Leon Price (hard of hearing, energy track): Lakes Captioning quotes $1,225 (7 hours at $175). Not in the budget; I'd take it from the $5,000 contingency. OK? They need confirmation by Tuesday noon."}
  - {at: "D1 10:35", kind: read, target: t1-tom, summary: "read Tom's list request"}
  - {id: a1-tom, at: "D1 11:00", kind: reply, target: t1-tom, to: [c_sponsor], cc: [c_mark], summary: "offered the sponsor only opted-in contacts",
     body: "Hi Tom, happy to help Ameridrive connect. Under our privacy policy we share only registrants who opted in to exhibitor contact: 286 of 412 so far, with name, company, title and email (no phone numbers). Marcus will send that file securely today, and the rest of your platinum benefits (lead scanner, reception signage) are on track."}
  - {id: a1-mark, at: "D1 11:05", kind: new, app: mail, path: sent/ameridrive-opted-in-list, target: m1-mark, to: [c_mark], subject: "Ameridrive: opted-in attendee list",
     summary: "asked Marcus to send the opted-in list",
     body: "Marcus, please send Ameridrive (Tom Becker) the share_with_exhibitors = yes registrants (286 as of 08:00): name, company, title, email only, through the secure share. Thanks!"}
  - {at: "D1 13:35", kind: read, target: t1-roberta, summary: "read Roberta's question"}
  - {id: a1-roberta, at: "D1 13:50", kind: reply, target: t1-roberta, to: [c_roberta], summary: "gave Roberta the attrition exposure",
     body: "Block: 152 room-nights picked up of 220; the 80% floor is 176, so we're 24 short. Worst case $4,536 (24 x $189), less anything the Henley resells. I'm asking Paul to hold the rooms at the group rate past cutoff, and Eli's sending a 'book by Wednesday' email to registrants without a room this afternoon."}
  - {at: "D1 15:01", kind: noop, target: c1-paul, summary: "took Paul's call"}
  - {id: a1-members, at: "D1 15:30", kind: new, app: mail, path: sent/eli-book-rooms-email, target: m1-eli, to: [c_eli], subject: "Room block push: email registrants without a room",
     summary: "asked Eli to email registrants about the hotel",
     body: "Eli, please email registrants who don't have a Henley reservation (Cvent: hotel = none, excluding Detroit-area members) today: the group rate of $189 is extended to Wednesday 11/4 at noon; link to the booking page. Keep it short."}

