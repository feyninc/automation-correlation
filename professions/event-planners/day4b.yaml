calls:
  - id: c4b-bus
    path: 2026-11-05/0750-motor-city-dispatch
    title: Inbound call, Motor City Coaches dispatch
    start: "D4 07:50:00"
    turns:
      - [c_bus, "Harper, Motor City dispatch. Our coach on your loop has a coolant leak; the driver pulled over on Jefferson with nobody aboard. A replacement can be at Huntington Place in about thirty-five minutes.", 6]
      - [worker, "Thanks for calling right away. Please send the replacement straight to the Huntington Place stop, at no added cost to us under our $1,800 order."]
      - [c_bus, "Understood, no charge. About twenty people are waiting there now.", 4]
      - [worker, "Then the replacement's first run is about 08:25, so they'll reach the Ballroom just after the 08:30 keynote starts. I'll tell them in the app and have the door volunteer scan them in."]
  - id: c4b-paul
    path: 2026-11-05/0950-paul-andreou
    title: Inbound call, Paul Andreou (Henley group sales)
    start: "D4 09:50:00"
    turns:
      - [c_paul, "Harper, Paul. Last night a guest named Dwayne Fisher arrived with a confirmation from 'Conference Housing Services' that we've never heard of. We had no reservation, so the night manager put him in a room at our rack rate. He says he's with your conference. What do you want us to do?", 6]
      - [worker, "He's one of our registrants. Please move him to the group rate of $189 for both nights, Wednesday and Thursday, and count both room-nights in our pickup."]
      - [c_paul, "Can do. Anything else?", 3]
      - [worker, "Could you send me the confirmation he was given? We warned registrants on Monday, and I'll report the company. Please tell him not to give them anything more and to call his card issuer."]

