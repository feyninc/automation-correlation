# Thursday 2026-11-05, the conference, beyond the printer jam, lunch count, the gluten-free plate and the captions.
# Harper is on site 06:30-19:00, mostly walking rooms, the floor and the functions. The shuttle coach breaks down
# before the keynote. The Henley finds a registrant who booked through the housing scam. A walk-in, a lost badge,
# an attendee who feels faint near booth 12 (and Owen wanting to post about it), a cold Salon 2, a moved sponsor
# banner and an exhibitor who wants to pack up early. The day closes with a recap for Roberta and Gwen.
#
# Shuttle: replacement 35 minutes after 07:50 = 08:25 at Huntington Place, about 10 minutes to the Henley, so the
# 20 riders reach the Ballroom just after the 08:30 keynote start.
# Rooms: the scam victim (Dwayne Fisher) stays Wed and Thu; moved to the $189 group rate and counted, he takes final
# pickup from 171 (Wed 91, Thu 80) to 173 (Wed 92, Thu 81), as the folio shows Friday.
# Walk-in non-member: $545 (pol-registration). The most PDH: 5.25.

