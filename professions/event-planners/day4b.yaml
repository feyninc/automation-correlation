     content: "# Incident report, Thursday 11/5 (internal: events team, Roberta, Henley Security)\n\n- Who: Ron Whitcomb, member, Wyandotte Municipal Services.\n- When and where: 11:20, Grand Foyer near booth 12.\n- What: felt faint. Volunteer Sean McAllister called Henley Security dispatch (313-555-0499) at 11:21; Eli Brooks posted to the on-site channel.\n- Response: Henley Security arrived about 11:24 with the AED (not used). He was alert and talking and declined EMS transport. He rested in the first aid room with security.\n- Outcome: left at 12:10; a colleague drove him home. No injury; no hotel property involved.\n- Follow-up: Harper to call him Friday. No details shared outside the events team, Roberta and Henley Security; Owen asked not to post.\n- Henley Security's report number to be added when Mr. Hayes sends it."}
