  - id: n3-volunteers
    title: Volunteer briefing
    kind: doc
    task: 1226
    from: "D3 08:00"
    due: "D3 18:00"
    evidence: [doc-agenda, doc-reg, pol-events]
    ref: a3-volunteers
    check: {all: [{mentions_any: [badge, scan]}, {mentions_any: [PDH]}, {mentions_any: [Leon, captioning]}]}
    must: ["Roles and times, badge scanning for PDH, accessibility seating, escalation contacts"]
    minutes: [25, "a briefing doc"]
    intent: "They need it before 6:30."
  - id: n3-wine
    title: No outside alcohol
    kind: reply
    task: 1210
    from: "D3 15:30"
    due: "D3 18:00"
    evidence: [t3-exhibitor, doc-hotel-contract]
    ref: a3-wine
    check: {all: [{to_includes: c_eli}, {mentions_any: [license, "outside alcohol"]}]}
    must: ["Not allowed under the hotel's license; offer a sponsored bar"]
