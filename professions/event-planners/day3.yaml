    from: "D3 09:40"
    due: "D3 17:00"
    evidence: [doc-session-picks, doc-karen]
    ref: a3-3b-notice
    check: {all: [{to_includes: c_eli}, {number_equals: {value: 44}}, {mentions_any: [app]}]}
    must: ["App updated; the 44 told; they can switch"]
    minutes: [4, "a request"]
    intent: "No surprises."
  - id: n3-pickup
    title: Final attrition exposure
    kind: reconcile
    task: 1217
    from: "D3 12:10"
    due: "D3 17:00"
    evidence: [t3-paul, doc-hotel-contract]
    ref: a3-pickup
    check: {all: [{to_includes: c_roberta}, {number_equals: {value: 171}}, {number_equals: {value: 945}}]}
    must: ["171 vs 176: 5 short, at most $945 less resale"]
    minutes: [3, "a quick update"]
    intent: "Much better."
  - id: n3-keynote
    title: A fallback for the late keynote
    kind: reply
    task: 1214
    from: "D3 14:20"
    due: "D3 17:00"
    evidence: [t3-keynote, doc-agenda]
    ref: a3-keynote
    check: {all: [{to_includes: c_keynote}, {mentions_any: [car, driver]}, {mentions_any: [swap, plan B, "16:00"]}]}
