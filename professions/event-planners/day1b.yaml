    content: |
      # Events pipeline 2026-27 (Harper Quinn; status at Fri 10/30)

      ## Winter Webinar Series (Zoom Webinars), 12:00-13:00 ET, 1.0 PDH each
      - Wed 12/9: Dr. Hannah Cole (Purdue), cooling tower water treatment. Wed 1/13: Luis Romero, PE (Wayne State),
