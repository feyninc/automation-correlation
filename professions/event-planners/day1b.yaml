  - {id: a1b-pirate-rob, at: "D1 09:05", kind: reply, target: t1b-pirate-fwd, to: [c_lakeshore], cc: [c_jada], summary: "warned Rob the housing offer is a scam",
     body: "Rob, thanks for checking: that isn't us. GLSFE has no housing provider, and 'Conference Housing Services' has nothing to do with us or the Henley. Please don't give them a card number. The only way to get the group rate ($189) is the Henley's booking link in your exhibitor kit or by calling the Henley's reservations line; the rate is extended to Wednesday 11/4 at noon. If you've already sent them anything, call your card issuer. Harper"}
  - {id: a1b-pirate-owen, at: "D1 10:10", kind: new, app: chat, path: "@owen/dm", target: t1b-owen, to: [c_owen], summary: "asked Owen to warn registrants and exhibitors about the housing scam",
     body: "Owen, a company called 'Conference Housing Services' is emailing our exhibitors (and me) claiming to be our official housing provider, offering Henley rooms at $159 for a card number. Can you send a short warning to all registrants and all 18 exhibitors today: we have no housing provider; book only through the Henley link or the Henley's reservations line at the $189 group rate (extended to Wed noon); never give a card to anyone else. Put the same note at the top of the app."}
  - {id: a1b-proof, at: "D1 10:25", kind: reply, target: t1b-print, to: [c_print], summary: "sent Wolverine the proof corrections",
     body: "Mike, thanks. Corrections to proof v1: (3) keynote is 8:30 a.m., not 8:00. (4) The energy track (1A-4A) is in Salon 1, not Salon 2; O&M stays Salon 2, Safety Salon 3. (6) and the program's sponsor page: add Huron Valve & Controls under Gold, beside Polaris. Please send proof v2 with these fixed."}
  - {id: a1b-polaris, at: "D1 11:15", kind: reply, target: t1b-jada-polaris, to: [c_jada], cc: [c_polaris], summary: "sent Polaris neutral recognition copy",
     body: "Jada, Priya: we're glad to have Polaris as a gold sponsor. Recognition has to be acknowledgment, not advertising, so the payment stays a qualified sponsorship payment under the IRS rules (26 CFR 1.513-4): no qualitative or comparative claims ('#1', 'best-in-class') and no discounts or calls to buy ('save 10%', 'ask us at booth 3'). Proposed copy: 'Polaris Building Automation: building automation and BAS integration for plants and campuses. polarisba.example. Booth 3.' Priya, if that works, Wolverine has it today. A member offer can run as a paid ad in the app; Jada can price that."}
  - {id: a1b-kessler, at: "D1 15:55", kind: reply, target: t1b-kessler, to: [c_kessler], cc: [c_jada], summary: "told Kessler the propane demo isn't permitted",
     body: "Doug, thanks for the heads-up, and as we discussed: the Henley doesn't permit propane or any open flame in the Foyer without a Detroit Fire Marshal permit applied for through the hotel 30 days ahead, so a live-fire demo isn't possible this year. The unfired display unit, a video loop on your monitor, or the boiler's controls running on your 20A outlet are all fine. Let's plan the permit early for 2027 if you'd like to fire it then. Harper"}
  - {id: a1b-coi, at: "D1 16:10", kind: new, app: mail, path: sent/brightpath-coi, target: m1b-coi, to: [c_brightpath], cc: [c_jada], subject: "Booth 11: certificate of insurance needed before Wednesday move-in",
     summary: "asked BrightPath for its certificate of insurance",
     body: "Hi Carmen, thanks for the arrival time. We still need BrightPath's certificate of insurance before you can move in on Wednesday: commercial general liability of at least $1,000,000 per occurrence, naming Henley Hotel Detroit and GLSFE as additional insureds. Could your broker send it to me by Wednesday 10:00? The hotel won't let a booth set without it. Harper"}
  - {id: a1b-amberline, at: "D1 16:15", kind: reply, target: t1b-amberline, to: [c_amberline], summary: "asked Amberline for its breakout capacities",
     body: "Jen, thank you for the proposal. One gap before we compare: what do Lakeview A, B and C seat theater-style, and can each hold 130? Our energy-track sessions are drawing over 100 each this year. Could you also confirm the reception space fits 18 tabletop booths plus 350 guests? We'll be in touch about a site visit after our review. Harper"}
  - {id: a1b-hannah, at: "D1 11:45", kind: reply, target: t1b-hannah, to: [c_hannah], cc: [c_ben], summary: "sent Hannah the webinar set-up and paperwork",
     body: "Hi Hannah, thanks! It's a Zoom Webinar: you'll get a panelist link (not the attendee link) a week ahead. Practice run: Wed 12/2, 12:00-12:30, same link, to check audio, video and screen share. On the day, please join at 11:40. Slides by Fri 12/4 so we can load a backup copy. For the $250 honorarium: please sign the speaker agreement Ben sent in DocuSign and send a W-9 to Nadia Ferris in Finance (nferris@glsfe.org); payment follows the webinar. Harper"}
  - {id: a1b-kbyg, at: "D1 13:15", kind: reply, target: t1b-owen-kbyg, to: [c_owen], cc: [c_eli], summary: "corrected the know-before-you-go draft",
     body: "Owen, three fixes: registration and breakfast open at 7:00, not 7:30; the shuttle runs every 20 minutes (06:30-09:00 and 16:00-18:30), not every 30; and the most PDH anyone can earn is 5.25 (keynote 0.75, four sessions, closing panel 0.5), not 6. Please also add a line that captioning and other accommodations are available on request, and the housing-scam warning. Otherwise good to go."}
  - {id: a1b-cfp, at: "D1 12:50", kind: edit, app: docs, path: spring-summit-2027/cfp-slate, target: doc-cfp-slate, title: Spring Summit 2027 CFP slate (for the committee),
     summary: "built the Spring Summit slate of eight",
     content: "# Spring Summit 2027: proposed slate (8 CFP slots)\n\nMethod: mean of the three scores; at most one per company; at least two per track; ties by the higher lowest score.\n\n| Rank | ID | Title | Company | Track | Mean | Lowest |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | SS27-04 | Retro-commissioning air handlers in 90 days | Lakeland Energy Partners | Energy | 4.67 | 4 |\n| 2 | SS27-44 | Cybersecurity for building automation | Polaris Building Automation | O&M | 4.67 | 4 |\n| 3 | SS27-18 | Planner-scheduler roles that stick | Midland Polymers | O&M | 4.33 | 4 |\n| 4 | SS27-22 | Vibration routes for small teams | Huron Valve & Controls | O&M | 4.33 | 4 |\n| 5 | SS27-36 | Legionella water management plans | Calder Water Treatment | Safety | 4.33 | 4 |\n| 6 | SS27-13 | Chiller sequencing on a zero budget | Columbus State Facilities | Energy | 4.00 | 4 |\n| 7 | SS27-28 | Lockout/tagout audits that find things | Buckeye Safety Group | Safety | 3.67 | 3 |\n| 8 | SS27-25 | Work orders from mobile: a year in | OhioHealth Plant Operations | O&M | 3.67 | 3 |\n\nNot selected under the one-per-company rule: SS27-11 (Lakeland, 4.33) and SS27-19 (Huron, 4.00). A straight top 8 would have had two each from Lakeland and Huron and only one Safety session.\nTracks: Energy 2, O&M 4, Safety 2.\nAlternates, in order: SS27-31, SS27-33, SS27-40 (Safety, 3.33), SS27-07 (Calder, already selected)."}
  - {id: a1b-slides, at: "D1 13:55", kind: new, app: mail, path: sent/missing-slides, target: m1b-slides, to: [c_spk_1c, c_spk_2a, c_spk_4a, c_spk_4c], cc: [c_av], subject: "Slides for Thursday",
     summary: "chased the four speakers whose slides are missing",
     body: "Hi Dev, Maria, Greg and Nina: we don't have your slides yet for Thursday (1C, 2A, 4A and 4C). Could you send them by Tuesday 11/3 at 5 p.m.? Meridian AV loads everything on their laptops Wednesday, and late files are hard to test. A USB copy on the day is a good backup. Thank you! Harper"}
  - {id: a1b-tom-note, at: "D1 11:56", kind: update, target: c1b-tom, summary: "case note on Tom's call",
     body: "Tom Becker (Ameridrive) asked for the full list with phone numbers for platinum. Declined under the privacy policy: only the 286 opted-in contacts, name/company/title/email, already sent by Marcus. Pointed him to his two lead retrieval licenses and the reception signage. He accepted."}
  - {id: a1b-lennox-note, at: "D1 14:56", kind: update, target: c1b-lennox, summary: "case note on Ashley's call",
     body: "Lennox (Spring Summit): offering 80% attrition on 150 room-nights at $179; contract coming Tue. Asked for 75%, cumulative, resale credit, F&B minimum sized to 250. Told her Gwen signs (over $10,000) after Roberta and I agree terms; asked her to hold the dates to 11/13."}
  - {id: a1b-lennox, at: "D1 15:35", kind: new, app: mail, path: sent/lennox-terms, target: m1b-lennox, to: [c_lennox], cc: [c_roberta], subject: "Spring Summit 2027: terms for the draft contract",
