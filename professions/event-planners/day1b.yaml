  - id: c1b-lennox
    path: 2026-11-02/1450-ashley-brandt
    title: Inbound call, Ashley Brandt (The Lennox Columbus, Spring Summit)
    start: "D1 14:50:00"
    turns:
      - [c_lennox, "Hi Harper, Ashley Brandt at the Lennox. Good news: my revenue manager will do eighty percent attrition on the Spring Summit block, the hundred and fifty room-nights at one seventy-nine. I'll send the contract tomorrow. Can you get it signed by Friday? I have another group asking about April twelfth to fourteenth.", 6]
      - [worker, "Thanks, Ashley. We need 75% attrition, measured cumulatively, with credit for any rooms you resell, and an F&B minimum that matches what 250 people will actually eat. Please build that into the draft."]
