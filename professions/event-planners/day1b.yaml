      ## Indiana Chapter Plant Engineering Seminar, Thu 1/21/2027, Indianapolis
      - Half day, 08:00-12:30; about 80 expected (Diane Kowal would like 100 seats). Chapter budget: $6,000 expense;
        member $85. Venue: Ardmore Hotel Indianapolis, proposal due 11/2. Contracts for chapter events are signed by
        the Director of Events (chapter officers do not sign).

      ## Spring Facilities Summit 2027, Tue-Wed 4/13-14/2027, Columbus
      - The Lennox Hotel Columbus (chosen 10/16). About 250 expected. Draft block: Mon 4/12 60, Tue 4/13 90 rooms at
        $179. Contract terms in negotiation; the Lennox holds the dates to 11/13.
      - 16 sessions: 8 invited, 8 from the call for proposals (46 received, 14 shortlisted; committee picks the slate
        Mon 11/2). Program chair: Frank Delgado, PE.

      ## Fall Technical Conference 2027, Thu 11/4/2027 (rooms Wed 11/3 and Thu 11/4)
      - RFP sent 10/5 to the Henley Detroit (rebid), Amberline Grand Rapids and the Corrigan Toledo; responses due
