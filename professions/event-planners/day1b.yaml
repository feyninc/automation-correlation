      # Amberline Grand Rapids: proposal for GLSFE, Thu Nov 4, 2027

      Rooms: 110 Wed 11/3 and 110 Thu 11/4 at $179 single/double, plus tax. Cutoff 30 days before arrival.
      Attrition: 80% of the block, cumulative; no credit for resold rooms.
      Function space: Grand River Ballroom (rounds for 450); three breakout rooms (Lakeview A, B, C); pre-function
      foyer for tabletop exhibits and a reception. Meeting room rental waived with the F&B minimum.
      F&B minimum: $60,000 before service charge (23%) and tax. Guarantees 72 hours before; the guarantee may not be
      lower than 90% of the contracted count.
      Concessions: one complimentary room per 40 room-nights picked up; 10% off audiovisual from our in-house provider.
      Offer held to Fri 11/20, 2026.
