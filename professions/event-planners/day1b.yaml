# Monday 2026-11-02, the rest of the day. Besides guarantees and the room block, the conference's last-week detail:
# a housing scam aimed at exhibitors and registrants, the signage proof, a sponsor's recognition copy that reads as
# advertising, an exhibitor's propane demo, a missing certificate of insurance, slides still missing from four
# speakers and the know-before-you-go email. The pipeline runs beside it: the Spring Summit 2027 call-for-proposals
# slate for the 14:00 committee call and the Lennox contract terms, the first 2027 Fall RFP response, the Indiana
# chapter seminar proposal and the December webinar. Calls: Ameridrive on the attendee list, the Lennox on attrition,
# a member charged the non-member rate.
#
# Spring Summit slate (doc-cfp-scores; 8 slots; mean of three scores, at most one per company, at least two per track,
# ties by the higher lowest score): ranked SS27-04 and SS27-44 4.67; SS27-11, SS27-18, SS27-22, SS27-36 4.33; SS27-13,
# SS27-19 4.00; SS27-25 and SS27-28 3.67 (lowest 3); the rest 3.33. A plain top 8 (04, 44, 11, 18, 22, 36, 13, 19)
# has two Lakeland (04, 11), two Huron (22, 19) and one Safety. Dropping 11 and 19 and taking the next two (25, 28,
# tied at 3.67/3) gives 04, 44, 18, 22, 36, 13, 28, 25: Energy 2 (04, 13), O&M 4 (44, 18, 22, 25), Safety 2 (36, 28).
# Lennox block: Mon 4/12 60 + Tue 4/13 90 = 150 room-nights x $179 = $26,850; at 80% the floor is 120, at 75% 112.5.
# Holt: paid non-member $545, member rate $395: refund $150. Guest reception ticket at cost: $64 x 1.24 x 1.06 =
# $84.12. Lunch guest ticket: $52 x 1.24 x 1.06 = $68.35.
# Most PDH a registrant can earn Thursday: keynote 0.75 + four session blocks x 1.0 + closing panel 0.5 = 5.25.
# Indiana seminar (Ardmore): breakfast $32 + break $14 = $46 a head; 80 x $46 = $3,680, below the $4,500 minimum
# (short $820); the minimum is met at 4500 / 46 = 97.8 -> 98 people.

