  - {id: a3b-acceptance, at: "D3 10:40", kind: edit, app: docs, path: spring-summit-2027/acceptance-letter, target: doc-acceptance, title: Spring Summit 2027 acceptance letter (draft), summary: "drafted the Spring Summit acceptance letter",
     content: "# Spring Facilities Summit 2027: acceptance letter (for the 8 accepted proposals; Ben merges names and titles in Oxford Abstracts)\n\nSubject: Accepted: your session at the Spring Facilities Summit, April 13-14, 2027\n\nCongratulations: the program committee has accepted your proposal for the GLSFE Spring Facilities Summit, Tuesday-Wednesday, April 13-14, 2027, at The Lennox Hotel Columbus. Out of 46 proposals, yours is one of 8 selected.\n\n- Your session: 60 minutes, about 45 of presentation and 15 of discussion, so attendees earn 1.0 PDH. We'll confirm the day and time by December 18.\n- Complimentary registration for the lead presenter; co-presenters register at the member rate.\n- Please confirm by Friday, November 20 by signing the speaker agreement we'll send by DocuSign, and complete the speaker form (bio, three learning objectives) by Friday, December 4.\n- Slides are due Monday, March 29, 2027, two weeks before the Summit.\n- Sessions are educational: no product promotion or pricing in the presentation.\n- Hotel: the GLSFE group rate of $179 at the Lennox; booking link with your agreement. Travel is at your own expense.\n\nQuestions: Harper Quinn, Senior Events Manager, 734-555-0160. Thank you for sharing your work with our members.\nFrank Delgado, PE, Program Chair, and the Spring Summit program committee"}
