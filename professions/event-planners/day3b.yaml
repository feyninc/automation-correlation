# Wednesday 2026-11-04, the rest of load-in day. Morning in Ann Arbor, then the drive to the Henley. Meridian offers a
# handheld mic for the Ballroom (not needed: the D5 invoice bills one anyway). The printed programs still list Raj
# Mehta, so Wolverine offers a rush insert and easel. Gwen wants to say "record attendance". The Lennox agrees to 75%
# cumulative attrition with resale credit and a $37,500 minimum but not the cancellation schedule. The Ardmore
# counters at $3,800. Calder wants GLSFE to pay its package handling. Henley security asks for the emergency plan.
# The ASL quote comes in. BrightPath's certificate does not arrive by 10:00 (missed; it turns up at 13:40).
#
# Printing: $3,780 + $385 rush ($185 easel + $200 inserts) = $4,165, under the $4,200 line.
# Lennox with a $37,500 minimum: anticipated revenue $26,850 + $37,500 = $64,350; 50% = $32,175 at signing as
# drafted (the 180-day date, 10/14/2026, has passed; 90 days before arrival is Tue 1/12/2027); 25% = $16,087.50.
# Ardmore counter $3,800: $120 above 80 x $46 = $3,680; with 22% service $4,636 before tax and the $425 AV, under
# $10,000, so Roberta signs.
# ASL (Signs of Michigan): team of two at $95 an hour each, 2-hour minimum: webinar 2 x $95 x 2 = $380; practice
# 2 x $95 x 1 = $190; total $570.
# Calder package handling: 12 boxes x $15 = $180, the exhibitor's charge.
# Hosted wine at booth 1: $46 a bottle x 1.24 x 1.06 = $60.46 all-in; bartender $150 + 6% tax = $159.

documents:
  - id: doc-henley-2027-rfp
    app: docs
    path: fall-2027-site-selection/henley-detroit-proposal
    title: Henley Hotel Detroit proposal, Fall Technical Conference 2027
    at: "D3 11:00"
    author: c_paul
    content: |
      # Henley Hotel Detroit: proposal for GLSFE, Thu Nov 4, 2027

      Rooms: 110 Wed 11/3 and 110 Thu 11/4 at $199, plus tax. Cutoff 21 days before arrival.
      Attrition: 80% of the block, cumulative, less rooms the hotel resells (as in 2026).
      Function space: Ballroom A-C (rounds for 450); Salon 1 (130 theater), Salon 2 and Salon 3 (90 theater each; 2 and
      3 combine for 180); Grand Foyer for 18 tabletop booths and a reception for 350.
      F&B minimum: $70,000 before the 24% service charge and 6% tax. Guarantees 3 business days before; not lower than
      90% of the contracted count (we can discuss 85% for breakfast).
      Concessions: one complimentary room per 40 room-nights; returning-group rate held if signed by 12/15.
      Offer held to Mon 11/30, 2026.
  - id: doc-asl-quote
    app: docs
    path: webinars-2026-27/signs-of-michigan-quote
    title: Signs of Michigan Interpreting quote (Dec 9 webinar)
    at: "D3 10:20"
    author: c_asl
    content: |
      Remote ASL interpreting (Zoom). Assignments over 60 minutes or with dense technical content are staffed with a
      team of two. Rate $95.00 per interpreter per hour, 2-hour minimum per assignment; prep calls 1-hour minimum.
      Wed 12/9, 11:40-13:00 webinar: 2 interpreters x $95 x 2 hours = $380.00. Wed 12/2 tech check: 2 x $95 x 1 hour =
      $190.00. Total $570.00. Interpreters assigned: Rachel Monroe, NIC, and Dan Ortiz, NIC. Please send slides by 12/4.

