  - {id: a3b-lennox-asks, at: "D3 09:30", kind: new, app: mail, path: sent/lennox-draft-1-comments, target: m3b-lennox, to: [c_lennox], cc: [c_roberta], subject: "Spring Summit 2027: comments on draft 1",
