calls:
  - id: c3b-dana
    path: 2026-11-04/0905-dana-kowalski
    title: Inbound call, Dana Kowalski (Meridian AV)
    start: "D3 09:05:00"
    turns:
      - [c_av, "Morning Harper, got your note on Salon 1. The screen we have works fine for a hundred and thirty, and I'll move the second projector over, no charge. While I have you: do you want a wireless handheld in the Ballroom for Q and A? It's two twenty-five.", 6]
      - [worker, "Great, thank you, Dana. Please confirm in writing that the Salon 1 change is at no added cost, and keep the captioning monitor front left."]
      - [c_av, "Will do. And the handheld?", 3]
      - [worker, "No handheld, thanks: the keynote and the panel are on lavs, and Q&A comes in through the app. Revision 2 stays at $26,850."]
  - id: c3b-print
    path: 2026-11-04/1030-mike-dziedzic
    title: Inbound call, Mike Dziedzic (Wolverine Print & Sign)
    start: "D3 10:30:00"
    turns:
      - [c_print, "Harper, Mike at Wolverine. The programs are printed with Raj Mehta in 3B. I can do a one-page insert with the new session and the 3B easel, delivered to the Henley by four today. It's a rush: one eighty-five for the easel and two hundred for the inserts, three eighty-five total. Want me to go?", 6]
      - [worker, "Please email the $385 quote to me and Roberta Lang; she approves changes to the order, and I'll get you her answer within the hour so you still make four."]
      - [c_print, "Okay. What exactly goes on them?", 3]
      - [worker, "Session 3B, 1:30 to 2:30, Salon 2: 'Retro-commissioning chiller plants in K-12 buildings,' Karen Liu, PE, Detroit Public Schools Community District, replacing Raj Mehta. The abstract is in the email I'm sending you."]
  - id: c3b-gwen
    path: 2026-11-04/1120-gwen-holloway
    title: Inbound call, Gwen Holloway (Executive Director)
    start: "D3 11:20:00"
    turns:
      - [c_gwen, "Harper, quick one for my remarks. Owen's first draft said a record four hundred fifty. Can I say record attendance?", 5]
      - [worker, "Please don't: we have 412 registered, and with 41 exhibitor staff it's 453 people in the building, but I can't confirm it's a record. 'More than 400 engineers' is accurate."]
      - [c_gwen, "Fine. And PDH, people can get six?", 3]
      - [worker, "Up to 5.25: the keynote is 0.75, each of the four session blocks 1.0 and the closing panel 0.5, and only with a badge scan at each door."]
  - id: c3b-lennox
    path: 2026-11-04/1640-ashley-brandt
    title: Inbound call, Ashley Brandt (The Lennox Columbus)
    start: "D3 16:40:00"
    turns:
      - [c_lennox, "Harper, good news: seventy-five percent, cumulative, with credit for resold rooms, and the F and B minimum at thirty-seven five. But the cancellation schedule is our corporate standard; I can't change it. Can Gwen sign tomorrow?", 6]
      - [worker, "That's real progress, thank you. But as drafted we'd owe 50% of $64,350, that's $32,175, from the day we sign, because the 180-day date passed on October 14. We need 25% from signing until January 12."]
      - [c_lennox, "I'll take it to my GM. If he agrees, what's next?", 4]
      - [worker, "Send draft 2 with all of it. Roberta reviews it and Gwen Holloway signs, and we'll turn it around within two business days, inside your November 13 hold."]

