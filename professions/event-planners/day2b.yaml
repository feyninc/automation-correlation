  - {id: a2b-press, at: "D2 14:30", kind: reply, target: t2b-owen-release, to: [c_owen], cc: [c_gwen], summary: "corrected the press release",
     body: "Owen, thanks for checking. Two fixes: we have 412 registered attendees (Eli's 450-plus badge count includes 41 exhibitor staff), and we can't support 'record', so please say 'more than 400 facility and plant engineers'. And Raj Mehta has had to cancel: session 3B is now Karen Liu, PE, of the Detroit Public Schools Community District, on retro-commissioning chiller plants in K-12 buildings. The rest is accurate. It's fine to say attendees can earn up to 5.25 PDH."}
