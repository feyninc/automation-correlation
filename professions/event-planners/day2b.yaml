# Tuesday 2026-11-03, the rest of the day. The Lennox's draft contract for the Spring Summit arrives with
# night-by-night attrition at 80%, no resale credit, an F&B minimum sized for 280 and a cancellation schedule whose
# first tier has already passed. The Indiana chapter president wants to sign the Ardmore proposal herself. The board
# president adds an award to lunch. A volunteer drops out; an attendee adds a severe sesame allergy; a Deaf member
# asks for an ASL interpreter for the December webinar; Owen's press release overstates attendance; the budget is
# reforecast once the AV revision is in; the run of show and Gwen's talking points are written. The Corrigan Toledo
# proposal asks for a site visit (missed).
#
# Lennox draft: room revenue 150 x $179 = $26,850; F&B minimum $42,000 (280 x $150 package); anticipated revenue
# $68,850. Arrival Mon 4/12/2027: 180 days before is 10/14/2026 (passed), 90 days before is 1/12/2027; today is 160
# days out, so from signing the exposure is 50% x $68,850 = $34,425 (100% from 1/12). Attrition at 80% = 120
# room-nights; at 75% = 112.5. F&B at 250 x $150 = $37,500; anticipated revenue then $64,350.
# Ardmore: 80 x ($32 + $14) = $3,680; minimum $4,500 met at 98 people (4500/46 = 97.8); $820 short at 80.
# Award guests: 3 x $68.35 = $205.05 (lunch $52 x 1.24 x 1.06 = $68.3488).
# Reforecast: F&B $70,451.84 + AV $26,850 + captioning $1,225 + shuttle $1,800 + speakers $9,800 + printing $3,780 =
# $113,906.84 against $119,100 including the $5,000 contingency ($5,193.16 under). Over: AV +$2,350, captioning
# +$1,225 = $3,575 from contingency ($1,425 left). Under: F&B $1,548.16, shuttle $1,800, printing $420 = $3,768.16.
# Pickup Tuesday 16:00: 163 room-nights (Wed 85, Thu 78); Monday 152, Wednesday noon 171.

documents:
  - id: doc-lennox-contract
    app: docs
    path: spring-summit-2027/lennox-group-agreement-draft-1
    title: The Lennox Hotel Columbus group agreement, draft 1 (Spring Summit 2027)
    at: "D2 09:15"
    author: c_lennox
    content: |
      # The Lennox Hotel Columbus: group sales agreement, draft 1
      Group: GLSFE Spring Facilities Summit. Dates: arrive Monday, April 12, 2027; depart Wednesday, April 14, 2027.

      1. Rooms: Mon 4/12 60, Tue 4/13 90 (150 room-nights) at $179 single/double, plus applicable taxes. Cutoff Friday,
         March 12, 2027.
      2. Attrition: the group agrees to use at least 80% of the rooms contracted on each night. Shortfall on any night
         is billed at the group rate.
      3. Food and beverage minimum: $42,000 before the 25% service charge and tax (280 attendees at our two-day
         conference package of $150 per person).
      4. Meeting space: Buckeye Ballroom and four breakout rooms, Tue 4/13-Wed 4/14. Rental $6,000, waived if the F&B
         minimum is met.
      5. Cancellation by the group, as a percentage of anticipated revenue ($68,850: rooms $26,850 plus the F&B
         minimum): more than 180 days before arrival 25%; 179 to 90 days 50%; 89 days or fewer 100%.
      6. Deposit: $5,000 on signing, applied to the master account.
      7. Force majeure: either party may terminate without liability if an act of God, war, terrorism, government
         order, disaster or epidemic makes the event illegal or impossible.
      8. This offer is held until Friday, November 13, 2026. Signature: the group's authorized signatory.
  - id: doc-press-release
    app: docs
    path: conference-2026/press-release-draft
    title: Press release draft (Owen)
    at: "D2 10:50"
    author: c_owen
    content: |
      FOR RELEASE WEDNESDAY, NOVEMBER 4, 2026
      Record 450 facility engineers gather in Detroit for GLSFE Fall Technical Conference

      ANN ARBOR, Mich. A record 450 facility and plant engineers from Michigan, Ohio and Indiana will gather Thursday,
      November 5 at the Henley Hotel Detroit for the Great Lakes Society of Facility Engineers' Fall Technical
      Conference. Dr. Alicia Fernandez of the University of Michigan opens with "Decarbonizing campus energy."
      Sessions include Raj Mehta of Thermaline Systems on chiller plant optimization and Kevin Lindqvist of Michigan
      Tech on decarbonization roadmaps. Attendees earn professional development hours toward license renewal. Eighteen
      exhibitors, led by platinum sponsor Ameridrive Controls, will be on the floor.
      "Our members keep Great Lakes buildings and plants running," said Executive Director Gwen Holloway.
      Media contact: Owen Pratt, 734-555-0157.
  - id: doc-corrigan-rfp
    app: docs
    path: fall-2027-site-selection/corrigan-toledo-proposal
    title: The Corrigan Hotel Toledo proposal, Fall Technical Conference 2027
    at: "D2 13:15"
    author: c_corrigan
    content: |
      # The Corrigan Hotel Toledo: proposal for GLSFE, Thu Nov 4, 2027

      Rooms: 110 Wed 11/3 and 110 Thu 11/4 at $159, plus tax. Cutoff 21 days before arrival.
      Attrition: 75% of the block, cumulative, less any rooms the hotel resells.
      Function space: Maumee Ballroom (rounds for 420); Maumee A, B and C, 140 theater each; Riverside Foyer, 20
      tabletop booths plus a reception for 400.
      F&B minimum: $52,000 before service charge (22%) and tax. Guarantees 3 business days before; not lower than 85% of
      the contracted count.
      Concessions: one complimentary room per 45 room-nights; complimentary Wi-Fi in meeting space; welcome
      reception support from Destination Toledo.
      Site visit: we would like to host you Thursday 11/12 or Friday 11/13. Offer held to Fri 11/27, 2026.
