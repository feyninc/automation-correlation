  - {id: a2b-photo, at: "D2 15:00", kind: reply, target: t1b-photo, to: [c_photo], cc: [c_owen], summary: "sent Renee the shot list",
     body: "Renee, shot list for Thursday: (1) keynote at 8:30, Dr. Alicia Fernandez and a full Ballroom from the back; (2) registration at 7:00; (3) every booth with its staff, and Ameridrive's booth 1 and its reception signage for our platinum sponsor; (4) one shot in each Salon during sessions 1 and 3; (5) the Facility Engineer of the Year award at 12:40 at lunch, Walt Brennan with Maureen Lacey and her family; (6) the closing panel at 4:00; (7) the reception at 4:30. Please avoid anyone with a no-photo sticker on their badge, and don't single out attendees using accommodations (captioning, wheelchair seating) without asking them. Harper"}
  - {id: a2b-reforecast, at: "D2 15:40", kind: edit, app: docs, path: conference-2026/budget-reforecast-2026-11-03, target: doc-reforecast, title: Fall conference budget reforecast (11/3),
     summary: "reforecast the conference budget after AV revision 2",
     content: "# Fall Technical Conference budget reforecast, Tue 11/3\n\n| Line | Budget | Forecast | Variance | Basis |\n| --- | --- | --- | --- | --- |\n| F&B incl. service and tax | $72,000 | $70,451.84 | -$1,548.16 | guarantees 360/380/315 |\n| AV | $24,500 | $26,850.00 | +$2,350.00 | Meridian rev 2 (Gwen signing) |\n| Captioning | $0 | $1,225.00 | +$1,225.00 | Lakes CART quote |\n| Shuttle | $3,600 | $1,800.00 | -$1,800.00 | one coach confirmed |\n| Speaker fees and travel | $9,800 | $9,800.00 | $0 | Karen Liu's $500 replaces Raj Mehta's |\n| Printing and signage | $4,200 | $3,780.00 | -$420.00 | Wolverine WPS-26-1187 |\n| Contingency | $5,000 | | | $3,575 committed (AV + captioning), $1,425 left |\n| Total expense | $119,100 | $113,906.84 | -$5,193.16 | |\n\nThe lines over budget (AV, captioning: $3,575) are covered by contingency; the lines under budget save $3,768.16, so even without contingency we're $193.16 under. Award guests at lunch (3 x $68.35 = $205.05) would come from contingency if Roberta approves. Not yet known: actual F&B (billed on the greater of guarantee or actual), any attrition charge (at most $189 x shortfall after Wednesday noon), on-site extras."}
  - {id: a2b-remarks, at: "D2 16:15", kind: edit, app: docs, path: conference-2026/gwen-welcome-talking-points, target: doc-remarks, title: Gwen's welcome remarks (talking points),
     summary: "drafted Gwen's welcome talking points",
     content: "# Welcome remarks, Thursday 8:20 (3 minutes)\n\n- Welcome: more than 400 facility and plant engineers registered (412) from Michigan, Ohio and Indiana; 18 exhibitors in the Foyer.\n- Thanks: platinum sponsor Ameridrive Controls (reception at 4:30); gold sponsors Huron Valve & Controls and Polaris Building Automation; silver, lanyard and coffee break sponsors on the board; the Henley team (Simone Ward, Paul Andreou) and Meridian AV.\n- Speakers: Dr. Alicia Fernandez next; thanks to Karen Liu, PE, who stepped into session 3B this week.\n- PDH: up to 5.25 today. Your badge must be scanned at the door of every session; no scan, no credit. Certificates by email next week.\n- Housekeeping: the app has your schedule and the Wi-Fi; live captions are available in the Ballroom and Salon 1; lunch at noon in Ballroom A-C with the Facility Engineer of the Year award at 12:40; the shuttle back to Huntington Place runs from 4:00.\n- Coming up: Winter Webinar Series from Dec 9; Spring Facilities Summit, April 13-14 in Columbus."}
  - {id: a2b-jordan, at: "D2 16:25", kind: reply, target: t2b-pollard, to: [c_jordan], cc: [c_advisor, c_eli], summary: "briefed the replacement volunteer",
     body: "Jordan, thank you for stepping in! Thursday 11/5 at the Henley Hotel Detroit: check in at registration at 06:30 for your badge, shirt and radio. You'll work the registration desk until 09:30, then scan badges at the Salon 1 door for every session (that's how attendees get PDH credit). Lunch is provided. Please come to the volunteer orientation Wednesday at 17:30 in Salon 3, and sign the volunteer release DocuSign Ray mentioned. Park at Huntington Place and take our shuttle. Eli Brooks (734-555-0162) is your contact on the day. Harper"}
  - {id: a2b-apex-note, at: "D2 16:05", kind: update, target: c2b-apex, summary: "case note on Matt Ferrante's call",
     body: "Apex Compressed Air (Matt Ferrante) asked for a table Thursday. Declined: 18 booths on the Fire Marshal-approved floor plan, nothing in the Foyer, aisles or registration. Introducing him to Jada for coffee break or app recognition and 2027 booths."}
  - {id: a2b-apex, at: "D2 16:10", kind: new, app: mail, path: sent/apex-intro, target: m2b-apex, to: [c_apex, c_jada], subject: "Introduction: Apex Compressed Air and GLSFE sponsorships",
     summary: "introduced Apex to Jada",
     body: "Matt, Jada: as promised. Matt, thanks for your interest in Thursday; the exhibit floor is full under the hotel's approved plan. Jada Reyes runs our sponsorships and can talk with you about recognition options this week and about booths for 2027 before they go on sale. Jada, Apex would like to be first in line. Harper"}
  - {id: a2b-lennox-review, at: "D2 16:20", kind: edit, app: docs, path: spring-summit-2027/lennox-contract-review, target: doc-lennox-review, title: Lennox draft 1 review (for Roberta),
     summary: "reviewed the Lennox draft contract for Roberta",
     content: "# Lennox Hotel Columbus, draft 1: review for Roberta (11/3)\n\nValue: rooms 150 x $179 = $26,850; F&B minimum $42,000; anticipated revenue $68,850. Over $10,000, so Gwen signs.\n\n| Clause | Draft 1 | Problem | Ask |\n| --- | --- | --- | --- |\n| 2 Attrition | 80% of each night | Night by night, not cumulative; no resale credit; 80% = 120 room-nights | 75% cumulative over the block (112.5, so 113), less rooms they resell (Ashley's revenue manager is reviewing) |\n| 3 F&B minimum | $42,000 (280 x $150) | Sized for 280; we expect 250 | $37,500 (250 x $150); anticipated revenue becomes $64,350 |\n| 5 Cancellation | 25% >180 days, 50% 179-90, 100% <90 | Arrival 4/12/2027: the 180-day date was 10/14/2026, already past. From signing we'd owe 50% = $34,425 if we cancelled; 100% from 1/12/2027 | 25% from signing to 1/12/2027, 50% to 2/11/2027 (60 days), 100% after |\n| 7 Force majeure | Illegal or impossible only | Doesn't cover a major drop in attendance from an outside event | Add 'inadvisable or commercially impracticable' and a pro rata attrition release |\n| 6 Deposit | $5,000 on signing | Fine | Keep |\n| 8 Hold | to 11/13 | Fine | Keep |\n\nRecommendation: send these asks to Ashley tomorrow; sign only once attrition, the minimum and the cancellation schedule are fixed. Roberta reviews; Gwen signs."}
  - {id: a2b-ros, at: "D2 17:15", kind: edit, app: docs, path: conference-2026/run-of-show, target: doc-run-of-show, title: Run of show, Thursday 11/5,
     summary: "wrote the run of show for Thursday",
     content: "# Run of show, Thursday 11/5 (Henley Hotel Detroit)\n\n| Time | What | Where | Owner |\n| --- | --- | --- | --- |\n| 06:00 | Meridian crew call; rooms on | all | Dana |\n| 06:30 | Shuttle loop starts (every 20 min to 09:00); volunteers check in | Huntington Place / registration | Eli |\n| 07:00 | Registration and breakfast (BEO 8812, 360) | Grand Foyer | Eli, Simone |\n| 07:00 | Booths staffed | Grand Foyer | exhibitors |\n| 08:00 | CART captioner Beth Ann Rourke arrives; audio feeds from Meridian | Ballroom, Salon 1 | Harper, Dana |\n| 08:15 | Keynote mic check (lav, video with sound) | Ballroom | Dana |\n| 08:20 | Gwen's welcome (3 min) | Ballroom | Gwen |\n| 08:30 | Keynote, Dr. Alicia Fernandez | Ballroom | Harper |\n| 09:30 | Sessions 1A (Salon 1, captions), 1B, 1C | Salons 1-3 | volunteers scan badges |\n| 10:30 | Coffee break (Great Lakes Chiller Service) | Grand Foyer | Simone |\n| 10:45 | Sessions 2A, 2B, 2C | Salons 1-3 | |\n| 12:00 | Lunch (BEO 8813, 380; sesame plate for Priti Desai; 3 award guests) | Ballroom A-C | Simone |\n| 12:40 | Facility Engineer of the Year: Walt Brennan presents to Maureen Lacey (5 min, lectern mic) | Ballroom | Harper, Renee |\n| 13:30 | Sessions 3A, 3B (Karen Liu, lav), 3C | Salons 1-3 | |\n| 14:45 | Sessions 4A, 4B, 4C | Salons 1-3 | |\n| 16:00 | Closing panel, Frank Delgado moderating (4 lavs) | Ballroom | Frank |\n| 16:00 | Shuttle loop restarts (to 18:30) | Henley | Eli |\n| 16:30 | Exhibit reception (BEO 8814, 315), Ameridrive banner | Grand Foyer | Simone, Jada |\n| 18:00 | Reception ends; exhibitor move-out | Grand Foyer | Jada |\n| 18:30 | Last shuttle; AV strike | | Dana |\n\nContacts: Harper 734-555-0160, Eli 734-555-0162, Simone 313-555-0410, Dana 313-555-0420, Motor City dispatch 313-555-0450."}

