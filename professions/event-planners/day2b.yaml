    start: "D2 11:10:00"
    turns:
      - [c_brennan, "Harper, Walt Brennan. I'd like to present the Facility Engineer of the Year award to Maureen Lacey at lunch on Thursday, five minutes or so. Can we fit it in? And her family would like to come.", 6]
      - [worker, "Congratulations to Maureen. Yes: let's do it at 12:40, once plates are down, five minutes at the Ballroom lectern. I'll have Meridian keep the lectern mic live and ask Renee to get the photo."]
      - [c_brennan, "Wonderful. Her husband and two kids, so three. Can they eat with us?", 3]
      - [worker, "Of course. Guest lunch tickets are at our cost, $68.35 each with the service charge and tax. I'll ask Roberta today whether we can host the three as our guests, and I'll seat them with Maureen near the front."]
  - id: c2b-karen
    path: 2026-11-03/1345-karen-liu
    title: Inbound call, Karen Liu (3B replacement speaker)
    start: "D2 13:45:00"
    turns:
      - [c_backup, "Hi Harper, Karen Liu. I got your email, and yes, I'll do 3B. My talk is really about forty-five minutes. Is that all right? And should I use any of Raj's slides?", 5]
      - [worker, "Thank you, Karen, you're saving us. For the session to stay at 1.0 PDH it needs a full 60 minutes of instruction, so plan about 45 minutes of talk and 15 of questions and discussion, ending at 14:30."]
      - [c_backup, "I can do that. And Raj's slides?", 3]
      - [worker, "Please use your own; his were on a different topic. I just need your title, a 50-word abstract and three learning objectives by Wednesday at 10 for the app and the PDH record."]
  - id: c2b-apex
    path: 2026-11-03/1600-matt-ferrante
    title: Inbound call, Matt Ferrante (Apex Compressed Air)
    start: "D2 16:00:00"
    turns:
      - [c_apex, "Harper, Matt Ferrante with Apex Compressed Air. Jada says you're sold out, but we'd really like to be there Thursday. We just need a six-foot table, even by registration. We'll pay whatever a booth costs.", 6]
      - [worker, "I appreciate it, Matt, but the 18 booths are on the floor plan the Detroit Fire Marshal approved for the Foyer, and I can't add a table there, in the aisles or by registration."]
      - [c_apex, "Is there anything at all we can do?", 3]
      - [worker, "Jada Reyes handles sponsorships; there may be a way to recognize Apex at the coffee break or in the app, and she can put you first in line for 2027 booths. I'll introduce you by email today."]

