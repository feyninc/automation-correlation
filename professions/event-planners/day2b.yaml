     body: "Hi Priti, thank you for telling us. I've asked the Henley's catering manager to add a severe sesame allergy under your name: your lunch will be prepared separately and labeled, and the banquet captain will bring it to you by name. They're also checking the breakfast and reception items. Please find me at registration so I can introduce you to the captain."}
