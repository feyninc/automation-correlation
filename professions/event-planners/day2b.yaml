    path: 2026-11-03/0840-diane-kowal
    title: Inbound call, Diane Kowal (Indiana chapter president)
    start: "D2 08:40:00"
    turns:
      - [c_diane, "Harper, Diane Kowal, Indiana chapter. The Ardmore proposal looks great and I'd like to lock in the Meridian Room for a hundred people. Brian says I can sign it this week as chapter president. Can I go ahead?", 6]
      - [worker, "Thanks, Diane, it's a good room. One thing first: breakfast and the break come to $46 a head, so the $4,500 minimum only works out at 98 people. At the 80 we expect, we'd pay the minimum anyway, $820 more than we'd eat."]
      - [c_diane, "Oh. So what do we do?", 4]
      - [worker, "I'll ask Brian to set the minimum at $3,680, that's 80 people at $46, with the room still waived. And please don't sign it: chapter contracts are signed by Roberta Lang, our Director of Events, so I'll send it to her once the terms are right."]
