    path: conference-2026/badge-scans-karla-ostrowski
    title: Badge scans, Karla Ostrowski
    format: csv
    at: "D5 11:00"
    author: c_eli
    content: |
      session,scanned_in
      Keynote,08:24
      1A,09:28
      2A,10:47
      3A,13:31
      Closing panel,16:02

