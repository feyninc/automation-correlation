# Friday 2026-11-06. The Henley's master folio bills breakfast at the set count and the reception at the contracted
# count. Meridian bills a microphone that wasn't used. An attendee asks for 6.5 PDH. Thank-yous, the survey and the
# post-event report. The 2027 site-selection grid is due to Roberta.
#
# Folio: correct breakfast 360 (greater of guarantee 360 and actual 344), lunch 389 (actual over the 380 guarantee),
# reception 315 (greater of 315 and actual 281): $54,068 + 24% $12,976.32 + 6% $4,022.66 = $71,066.98. Billed (371,
# 389, 350): $74,560.65; overbilled $3,493.67. Attrition: 173 room-nights final; floor 176; 3 short, 2 resold: $189.
# PDH for Karla Ostrowski: keynote 0.75 + 1A + 2A + 3A (1.0 each) + closing 0.5 = 4.25.

documents:
  - id: doc-folio
    app: docs
    path: conference-2026/henley-master-folio
    title: Henley master folio (draft)
    at: "D5 08:30"
    author: c_simone
    content: |
      Group GLSFE, master folio, F&B 11/5:
      Breakfast BEO 8812: 371 x $38.00 = $14,098.00 (actual served 344)
      Lunch BEO 8813: 389 x $52.00 = $20,228.00 (actual served 389)
      Reception BEO 8814: 350 x $64.00 = $22,400.00 (actual served 281)
      F&B subtotal $56,726.00; service charge 24% $13,614.24; Michigan sales tax 6% $4,220.41; F&B total $74,560.65.
      Rooms: final pickup 173 room-nights (Wed 92, Thu 81); attrition floor 176; shortfall 3; resold 2; attrition
      charge 1 x $189.00.
  - id: doc-av-invoice
    app: docs
    path: conference-2026/meridian-invoice
    title: Meridian AV invoice
    at: "D5 09:00"
    author: c_av
    content: |
      Order rev 2: $26,850.00. Additional on site: 1 x wireless handheld mic, Ballroom, $225.00. Total $27,075.00.
