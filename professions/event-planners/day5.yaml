  - id: t4-site
    app: chat
    path: "#fall-conference-onsite"
    title: "#fall-conference-onsite"
    x:
      - {at: "D5 09:05", from: c_eli, body: "fyi Meridian left an extra handheld on the ballroom lectern yesterday but nobody used it, the keynote and panel were on lavs"}
  - id: t5-karla
    app: mail
    path: inbox/pdh-certificate
    title: PDH certificate
    x:
      - {at: "D5 11:00", from: c_karla, to: [worker], subject: "PDH certificate",
         body: "Hi, I attended the whole day yesterday. Could you issue my certificate for 6.5 PDH? I need it for my Michigan renewal. Karla Ostrowski, PE"}

contacts:
  - [c_karla, Karla Ostrowski, "Attendee (PE)", member, kostrowski@ostrowskieng.example, "", attendee]

actions:
  - {at: "D5 08:35", kind: read, target: doc-folio, summary: "checked the folio against the contract"}
  - {id: a5-folio, at: "D5 09:30", kind: reply, target: t1-simone, to: [c_simone], cc: [c_paul], summary: "disputed the folio's F&B counts",
     body: "Simone, thank you for a great day. Two corrections to the F&B on the master folio, per the contract (billed at the greater of guarantee or actual): breakfast should be 360 (guarantee; 344 served), not the 371 set; the reception should be 315 (guarantee; 281 served), not 350. Lunch at 389 is right. Corrected F&B: $54,068.00 + service $12,976.32 + tax $4,022.66 = $71,066.98, vs $74,560.65 billed ($3,493.67 less). The attrition charge of 1 x $189 matches. Could you reissue the folio?"}
  - {at: "D5 09:10", kind: read, target: doc-av-invoice, summary: "checked Meridian's invoice"}
  - {id: a5-av, at: "D5 09:40", kind: reply, target: t2-av, to: [c_av], summary: "disputed the unordered microphone",
     body: "Dana, thanks for great support yesterday. The extra handheld ($225) wasn't on rev 2 and wasn't requested or used (the keynote and panel were on lavs). Please reissue at the rev 2 total of $26,850.00."}
  - {at: "D5 10:00", kind: noop, target: cal-harper, summary: "post-con call with the Henley"}
  - {at: "D5 11:05", kind: read, target: doc-scans, summary: "checked Karla's badge scans"}
  - {id: a5-karla, at: "D5 11:20", kind: reply, target: t5-karla, to: [c_karla], summary: "issued Karla's PDH certificate for 4.25",
     body: "Hi Karla, thank you for coming! Your certificate is attached for 4.25 PDH, based on your badge scans: keynote (0.75), 1A, 2A and 3A (1.0 each) and the closing panel (0.5). We don't have scans for sessions 4A-4C; if you attended one, tell me which and I'll check with the room volunteer. Meals, breaks and the exhibit reception don't earn PDH."}
  - {id: a5-thanks, at: "D5 12:30", kind: new, app: mail, path: sent/speaker-thanks, target: m5-thanks, to: [c_keynote, c_backup], cc: [c_roberta], subject: "Thank you",
     summary: "thanked the keynote and the replacement speaker",
     body: "Alicia and Karen, thank you both. Alicia, you made it after a 23:40 landing and the room was full; Karen, you stepped into 3B on two days' notice and 44 people heard about an 18% chiller-plant saving. Honoraria are processing this week. Harper"}
  - {id: a5-report, at: "D5 15:00", kind: edit, app: docs, path: conference-2026/post-event-report, target: doc-report, title: Fall Technical Conference 2026 post-event report (draft),
     summary: "drafted the post-event report",
     content: "# Fall Technical Conference 2026: post-event report (draft)\n\nAttendance: 401 checked in of 412 registered (97.3%), plus 41 exhibitor staff.\nF&B served vs guarantee: breakfast 344 / 360; lunch 389 / 380; reception 281 / 315. Our show-rate method underestimated lunch (92% assumed; 94.4% of registrants ate) and the floor cost us 16 breakfasts and 34 receptions. Next year: negotiate a lower floor for breakfast and the reception (80%).\nRooms: 173 room-nights of 220 (78.6%); attrition charge $189 after resale.\nBudget: F&B $71,066.98 (budget $72,000, after the folio correction); AV $26,850 (budget $24,500); captioning $1,225 (unbudgeted); contingency used $3,575 of $5,000.\nAccessibility: captioning for one attendee, freeze fixed by a wired feed in 3 minutes; wheelchair seating provided.\nIssues: badge printer jam at 07:25 (pre-printed badges), unlabeled GF plate at table 14, Salon 1 reset to 130 seats.\nSurvey: going out Monday; results in two weeks."}

