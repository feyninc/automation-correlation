  - id: doc-agenda
    app: docs
    path: conference-2026/agenda
    title: Conference agenda (Thursday 11/5)
    content: |
      07:00 Registration and breakfast (Grand Foyer)
      08:30-09:15 Keynote: Dr. Alicia Fernandez, "Decarbonizing campus energy" (Ballroom) [0.75 PDH]
      09:30-10:30 Sessions 1A, 1B, 1C [1.0 PDH each]
      10:45-11:45 Sessions 2A, 2B, 2C [1.0 PDH]
      12:00-13:15 Lunch
      13:30-14:30 Sessions 3A, 3B ("Chiller plant optimization", Raj Mehta), 3C [1.0 PDH]
      14:45-15:45 Sessions 4A, 4B, 4C [1.0 PDH]
