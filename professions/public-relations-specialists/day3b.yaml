calls:
  - id: c3b-shauna
    path: 2026-11-04/1132-kneb-thursday
    title: Media line call, Shauna Pettit (KNEB 10), Thursday's event
    start: "D3 11:32:00"
    turns:
      - [c_shauna, "Erin, Shauna at KNEB. Got your advisory. Will Dr. Ellison take questions afterward, and is the Governor taking questions?", 5]
      - [worker, "Dr. Ellison will do interviews after the program, until about eleven-fifteen. The Governor plans to take a few questions too; her press office, Jamal Ortiz, has the details."]
      - [c_shauna, "And what's the news? Just between us, so I can pitch it to my producer.", 5]
      - [worker, "I can't share it before ten a.m. Thursday, and nothing's off the record with me. It's worth the crew, and you'll have the release the minute we start."]
      - [c_shauna, "Fair enough. We'll be there.", 2]
  - id: c3b-nate
    path: 2026-11-04/1715-ap-hold-for-release
    title: Media line call, Nate Okoye (AP), embargo timing
    start: "D3 17:15:00"
    turns:
      - [c_nate, "Erin, Nate. I'm writing ahead so the story's ready. Can I move it to members at 9:55 marked hold for release, so it's in place at ten?", 6]
      - [worker, "Please don't. Our embargo agreement is with you, and moving it to members before ten puts it in newsrooms that haven't agreed to anything. Please move it at ten a.m. Central."]
      - [c_nate, "OK. Just to be sure, that's ten Central, eleven Eastern?", 3]
      - [worker, "Right: ten a.m. Central, eleven a.m. Eastern. The clocks just changed, so check your system's time zone."]
      - [c_nate, "Got it. Thanks, Erin.", 2]

