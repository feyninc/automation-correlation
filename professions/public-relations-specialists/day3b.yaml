     body: "Celeste, Steven: Ben would like to send managers short talking points at 7 a.m. tomorrow, after the Ledger story posts at 6:30. Draft below uses only the approved statement; please OK or edit by 6:45 a.m.\n\nIf your staff ask about today's Prairie Ledger story:\n- Federal privacy law does not allow us to confirm whether someone was a patient or to discuss anyone's care, and that applies to all of us: please don't discuss any patient, even with colleagues who weren't involved, and don't post about it.\n- We take every concern about care seriously, and when a concern is raised we review it carefully.\n- Our emergency department is busier than ever, and we've hired 22 emergency nurses since July. Thank your teams.\n- If a reporter or anyone from the media contacts you, refer them to the media line, 402-555-0110. If a family member raises a concern, connect them with Patient Relations, 402-555-0190.\n- Keep everything (emails, messages, notes) related to the story; don't delete anything.\n\nErin"}
