| consented details only; move at 10 a.m. CT | closed |\n| 11/4 | KNEB 10 | Shauna Pettit | Thursday availability; 'just between us' | Ellison to 11:15, Governor via Jamal; nothing before 10 | closed |\n| 11/4 | WKLN 7 | assignment desk | rally; Council member Dunleavy | approved union line; no information | closed |\n| 11/4 | Business Journal | Victor Pollard | Hollis settlement rumor | no comment on legal matters | closed |"}

