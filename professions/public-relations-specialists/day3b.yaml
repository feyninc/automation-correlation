# Wednesday 2026-11-04, the rest of the day: four embargoed briefings, CEO prep, the Governor's advance walk-through
# and the rally. KNEB fishes for Thursday's news on the phone; AP wants to move its story to members at 9:55 "hold for
# release". KLKN's live truck makes three for Lot C's three spaces. The photographer needs a brief, the CNO will
# accept the union's petition in front of cameras, and Ben needs talking points for managers before the Ledger story
# runs. PR Newswire reminds Erin to replace the file by 5 p.m.; the final release has been ready since 8:55 a.m.
#
# Arithmetic:
# - Live trucks: WKLN, NC9 (Tuesday) + KLKN (today) = 3 = Lot C east row capacity (3); KNEB has no truck.
#   Pre-registration: 20 names, unchanged (KLKN's two were already on the list).
# - AP's 9:55 a.m. hold-for-release move would be 5 minutes before the 10 a.m. CT embargo; 10 a.m. CT = 11 a.m. ET
#   (Central is UTC-6 and Eastern UTC-5 after the Nov. 1 change).
# - PR Newswire deadline: Wed 5:00 p.m. CT; the final release (Governor's corrected quote) existed from 08:55, 8 hours
#   5 minutes before it.
# - Inbound today (with day3.yaml): 115 emails (58 traffic) and 50 chat messages (21 traffic).

