     body: "Owen, Jenna: the ad is a lovely idea, but Thursday's print Ledger doesn't work. It's on doorsteps by 5:30 a.m., four and a half hours before the embargo lifts at 10 a.m. CT, so a 'Thank you, Kessler family' page would break the embargo for every outlet we've briefed. Could we run the print page Friday, Nov. 6, instead, and schedule Meta and Google to start at 10:00 a.m. CT Thursday, no earlier (please check the ad accounts are set to Central, since the clocks just changed)? Happy to look at the Friday proof. Erin"}
  - {id: a1b-social, at: "D1 10:00", kind: edit, target: doc-social-copy, summary: "fact-checked Priya's social copy",
     content: "# Kessler announcement: social copy (fact-checked by Erin, 11/2). Schedule for Thu 11/5 10:00 a.m. CT\n\nFacebook: Today we're announcing the largest gift in our history: $20 million from the Kessler Family Foundation toward the Kessler Children's Behavioral Health Hospital, a $64 million, 48-bed psychiatric hospital for children and teens on our Prairie Bend Medical Center campus. Opening 2029. (with the announcement video)\n\nInstagram (carousel of renderings): 48 beds. Close to home. The Kessler Children's Behavioral Health Hospital opens in 2029 thanks to the Kessler Family Foundation, the State of Nebraska and our donors.\n\nLinkedIn (quote card): \"This gift changes that.\" -- Dr. Raymond Ellison, president and CEO, Prairie Bend Health\n\nX: $20 million gift from the Kessler Family Foundation will help build a 48-bed children's psychiatric hospital in Lincoln, so Nebraska kids can get care close to home.\n\nErin's notes: project total updated to the board-approved $64 million (10/31); CEO name per house style. Nothing posts or previews before 10 a.m. CT Thursday."}
