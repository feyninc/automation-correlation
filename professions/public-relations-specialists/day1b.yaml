  - {id: a1b-ceo-note, at: "D1 15:30", kind: new, app: mail, path: sent/ceo-heads-up-ledger, target: m1b-ceo-note, to: [c_celeste], cc: [c_doug],
     subject: "For Dr. Ellison: heads-up on a Prairie Ledger story (likely Thursday morning)", summary: "wrote the CEO heads-up note for Celeste to forward",
     body: "Celeste, here's a note you can forward to Dr. Ellison.\n\nDr. Ellison, a heads-up before Thursday. Dana Corcoran of The Prairie Ledger is reporting on Margaret Hollis, 67, who her family says died Oct. 24 after about six hours in the PBMC emergency department. The family has hired an attorney. Dana's deadline is Wednesday 3 p.m., and she is aiming for Thursday's paper, the morning of the Kessler announcement.\n\nWhat we're doing: a written statement on the ED in general, approved by Legal (Steven Pike), Privacy (Nora Calloway) and Celeste, with Nursing's current numbers. We will not confirm or deny that Mrs. Hollis was a patient, discuss her care, or comment on personnel. Patient Relations (Gloria Benitez) handles any contact with the family.\n\nWhat this means for you: on Thursday you will likely be asked about it. Please don't discuss the case with reporters, the family or on social media, and nothing is off the record. We'll practice the answer at Wednesday's 2 p.m. prep, along with the nurses' rally (Wednesday 4 p.m.) and how we'll staff the new hospital. Erin Mathers"}
  - {id: a1b-runofshow, at: "D1 16:00", kind: edit, app: docs, path: announcements/kessler-gift/media-logistics, target: doc-media-logistics, title: "Media logistics for Thursday (for run of show v3)",
     summary: "wrote the media section for the run of show",
     content: "# Media logistics: Kessler announcement, Thursday, Nov. 5 (Erin, for run of show v3)\n\n- Parking: Lot C, reserved for media 8:30 a.m.-noon. Live trucks: Lot C east row (count with the RSVP list Wednesday).\n- Check-in: 9:00-9:40 a.m., table inside the atrium east doors. Every name pre-registered with Security by Wed 5 p.m.; photo ID checked (State Patrol). Media badges; PBH escort required anywhere beyond the atrium.\n- Press section: 16 x 8 ft riser, 18 in., at the back center of the atrium; 16-channel mult box at the riser (Capital AV); still photographers in the side aisles, not in front of the first row.\n- Embargo: the four embargoed outlets may file at 10:00 a.m. CT, not before. The release and fact sheet are handed out at 10:00; the newsroom page goes live at 10:00.\n- Patients: no filming or photos of patients or visitors in the atrium without a signed MC-7; the Garcias have signed. No close-ups of the Kessler grandchildren (family's request).\n- Interviews, 10:45-11:15, Conference Room B: Dr. Ellison (hard stop 11:15), Hannah Voss, Ruth Kessler (through Hannah), Maria Garcia (Erin present). The Governor's availability is through her press office (Jamal Ortiz). After 11:15: Dr. Leah Morrow from 1 p.m.\n- Escort plan: PR walks crews from Lot C to check-in and back (Erin plus a second escort; ask Jules); no crews in patient areas.\n- B-roll and renderings: link on the newsroom page at 10:00."}
  - {id: a1b-runofshow-send, at: "D1 16:05", kind: reply, target: t1b-mia, to: [c_mia], cc: [c_rick], summary: "sent Mia the media logistics",
