     subject: "Filming in the PICU Wednesday morning: any families willing to sign an MC-7?", summary: "asked the PICU manager about families who might consent to filming",
     body: "Hi Beth, Kyle would like to film b-roll in the PICU Wednesday morning for Thursday's announcement. We can only film a patient or family with a signed MC-7 in advance, blurred or not. Would you be comfortable asking whether any family would like to take part, with no pressure at all? If not, Kyle will shoot staff, equipment and empty rooms only, at a time that suits the unit. Erin"}
  - {id: a1b-web, at: "D1 17:10", kind: reply, target: t1b-derek, to: [c_derek], summary: "sent Derek the newsroom page copy and the go-live time",
     body: "Derek, copy for the hidden Kessler page below. Please keep it hidden until I message you Thursday; it goes live at 10:00 a.m. CT, Nov. 5, not before (no previews, no social cards, no sitemap).\n\nHeadline: Kessler family gives $20 million toward children's behavioral health hospital\n\nParagraph 1: The Kessler Family Foundation has given $20 million to Prairie Bend Health toward a $64 million, 48-bed psychiatric hospital for children and adolescents, the largest gift in the system's 110-year history. The Kessler Children's Behavioral Health Hospital will be built on the Prairie Bend Medical Center campus and is expected to open in 2029.\n\nParagraph 2: Funding includes the Kessler gift, a $12 million grant from the State of Nebraska, $28 million from PBH and $4 million from other donors. Today, children who need inpatient psychiatric care in southeast Nebraska are often sent out of state.\n\nCaptions: 'The Kessler Children's Behavioral Health Hospital, planned for the Prairie Bend Medical Center campus. Rendering: HDR.' B-roll: 'B-roll: Prairie Bend Medical Center campus and atrium (Prairie Bend Health video).'\n\nMedia contact: Erin Mathers, 402-555-0110. I'll add the full release, the fact sheet and Dr. Ellison's remarks Thursday morning."}
