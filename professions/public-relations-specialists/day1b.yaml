    app: docs
    path: announcements/kessler-gift/run-of-show-foundation
    title: "Run of show v2: Kessler announcement (Foundation events)"
    at: "D1 08:05"
    author: c_mia
    content: |
      # Run of show v2 (Mia Sorensen, 11/2). Thursday, Nov. 5, PBMC atrium

      - 08:00 AV load-in (Capital AV): podium, two lavalier mics, 16-channel press mult, livestream camera.
      - 09:00 Guest and media check-in opens (atrium east doors). Media parking: Lot C.
      - 09:15 Dr. Ellison arrives. 09:30 Kessler family and Garcia family to the green room (Conference Room A).
      - 09:45 Gov. Hartley arrives (east drive); greets the families in Conference Room A.
      - 10:00 Program (about 35 minutes): welcome, Hannah Voss; Dr. Raymond Ellison; Gov. Patricia Hartley;
        Ruth Kessler; Maria Garcia (90 seconds); rendering unveiling.
      - 10:35 Reception (atrium). 10:45-11:15 Interviews (Conference Room B).
      - 11:30 Dr. Ellison to board finance committee.
      - Open: press section layout and media check-in (Erin, by Wed noon); seating (Mia); rain plan n/a (indoor).
