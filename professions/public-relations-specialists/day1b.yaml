calls:
  - id: c1b-kneb
    path: 2026-11-02/1050-kneb-brandt
    title: Media line call, Shauna Pettit (KNEB 10), Tyler Brandt
    start: "D1 10:50:00"
    turns:
      - [c_shauna, "Hi Erin, Shauna at KNEB 10. Did you get anywhere on Tyler Brandt? Your weekend person told us no information on Saturday.", 5]
      - [worker, "I did. I checked with our house supervisor this morning, and Tyler Brandt is in fair condition."]
      - [c_shauna, "Thanks. Can you tell me what the injury was? Kids at school are saying it's his neck.", 5]
      - [worker, "I can't go beyond his condition. Anything more would have to come from his family or the school."]
      - [c_shauna, "Fair enough. For tonight we're doing a piece on football injuries in general. Could a doctor talk to us on camera this afternoon?", 5]
      - [worker, "Probably. Dr. Paul Nguyen, our trauma medical director, could talk generally about youth sports injuries, though not about Tyler. What time do you need him?"]
      - [c_shauna, "We'd shoot by three, at the hospital.", 3]
      - [worker, "Let me check his schedule, and I'll get back to you by noon."]
  - id: c1b-celeste
    path: 2026-11-02/1500-celeste-ledger
    title: Call from Celeste Varga (VP), Ledger inquiry
    start: "D1 15:00:00"
    turns:
      - [c_celeste, "Erin, it's Celeste. I read your note on the Ledger. How bad is Thursday morning going to be?", 6]
      - [worker, "Dana's aiming for Thursday's paper, so it likely lands a few hours before the announcement. The family has an attorney, so Legal and Privacy approve every word, and we can't confirm she was a patient. What we can give Dana is real numbers on the ED and what we've done on staffing."]
      - [c_celeste, "Could we ask Dana to hold it until Friday? She's in the embargo group. Maybe give her something extra on the gift.", 6]
      - [worker, "I'd advise against it. Trading access on the gift for holding her story isn't honest, and that kind of deal tends to end up in the story itself. We can ask about her timing, but we should plan for Thursday morning."]
      - [c_celeste, "All right. Does Ray need to know today?", 4]
      - [worker, "Yes. I'd brief him today so the ER question doesn't surprise him at Wednesday's prep. I'll send you a short note you can forward to him tonight."]
      - [c_celeste, "Do that. Thanks, Erin.", 2]

