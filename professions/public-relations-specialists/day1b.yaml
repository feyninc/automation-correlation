#   about 225 words (1.5 x 150). Erin's trim: 201 words = 80 seconds (201 / 150 x 60 = 80.4), room for applause.
# - Tyler Brandt, 16: hurt Fri 10/30; parents agreed to the directory listing Sun 11/1; listed fair Mon 11/2 10:35.
