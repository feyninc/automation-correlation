  - id: t1b-maria
    app: mail
    path: inbox/maria-garcia-remarks
    title: My remarks for Thursday
    x:
      - {at: "D1 11:10", from: c_maria, to: [worker], cc: [c_hannah], subject: "My remarks for Thursday",
         body: "Hi Erin, Hannah said I have about 90 seconds. Here is what I wrote. I think it's too long but I don't know what to cut. Maria\n\nGood morning. My name is Maria Garcia, and this is my son, Mateo. Last fall, when Mateo was 13, he went through the hardest months of his life, and of mine. One night in October he told me he didn't want to be alive anymore. I drove him to the emergency room here at Prairie Bend, and the doctors and nurses were so kind to us. But they told me there was no bed for him anywhere in Nebraska. We waited two days while they called hospitals in other states. Finally a hospital in Kansas City had a bed. I followed the ambulance for three hours in the dark. He was there for three weeks. I took unpaid leave from my job at the school district. My husband stayed home with our two little girls, and we saw each other on FaceTime. I drove down every weekend and slept in my car twice because we couldn't afford another hotel night. The people in Kansas City were wonderful, and I will always be grateful to them. But Mateo needed his family every day, not just on weekends. He needed his little sisters, his dog, and his grandma's cooking. Kids get better faster when their family can be there. When he came home, the hardest part was that the doctors who helped him were three hours away, and we had to start over with new people here. Today Mateo is 14. He's back at school, he plays trombone in the band, and he laughs again. I want every parent in Nebraska to hear this: you are not alone, and soon you won't have to leave home to get your child help. To the Kessler family, to Governor Hartley, and to everyone at Prairie Bend: thank you. You are keeping families together."}
