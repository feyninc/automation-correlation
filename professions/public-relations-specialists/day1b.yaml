  - {id: a1b-factsheet, at: "D1 12:45", kind: edit, app: docs, path: announcements/kessler-gift/fact-sheet, target: doc-factsheet, title: "Fact sheet: Kessler Children's Behavioral Health Hospital (embargoed)",
     summary: "wrote the embargoed fact sheet",
     content: "# EMBARGOED UNTIL 10 A.M. CT THURSDAY, NOV. 5, 2026\n\n## Fact sheet: Kessler Children's Behavioral Health Hospital\n\n- What: a 48-bed inpatient psychiatric hospital for children and adolescents on the Prairie Bend Medical Center campus, 2300 S. 16th St., Lincoln.\n- Why: PBH has no pediatric psychiatric beds today; children who need inpatient psychiatric care in southeast Nebraska are often sent out of state.\n- Timeline: groundbreaking spring 2027; opening 2029.\n- Cost: $64 million.\n- Funding: Kessler Family Foundation gift, $20 million (the largest gift in PBH's 110-year history); State of Nebraska grant (Department of Health and Human Services), $12 million; Prairie Bend Health capital, $28 million; other donors (campaign to date), $4 million.\n- About PBH: four hospitals and 30 clinics in southeast Nebraska, 6,400 employees.\n- Media contact: Erin Mathers, 402-555-0110."}
  - {id: a1b-maria, at: "D1 13:45", kind: reply, target: t1b-maria, to: [c_maria], cc: [c_hannah], summary: "trimmed Maria's remarks to 90 seconds",
     body: "Maria, thank you for this; it's beautiful, and it's yours. Read aloud it runs about two minutes, so here's a trim to about 90 seconds that keeps your words and only takes out some details (the leave, FaceTime, the follow-up doctors). Change anything that doesn't sound like you.\n\nGood morning. My name is Maria Garcia, and this is my son, Mateo. Last fall, when Mateo was 13, he went through the hardest months of his life, and of mine. One night in October he told me he didn't want to be alive anymore. I drove him to the emergency room here, and the doctors and nurses were so kind to us. But there was no bed for him anywhere in Nebraska. Finally a hospital in Kansas City had one. I followed the ambulance for three hours in the dark. He was there for three weeks. I drove down every weekend and slept in my car twice. The people in Kansas City were wonderful. But Mateo needed his family every day, not just on weekends. He needed his little sisters, his dog, and his grandma's cooking. Today Mateo is 14. He's back at school, he plays trombone in the band, and he laughs again. I want every parent in Nebraska to hear this: you are not alone, and soon you won't have to leave home to get your child help. To the Kessler family, to Governor Hartley, and to everyone at Prairie Bend: thank you. You are keeping families together.\n\nTwo things to think about, with no pressure either way. Reporters will likely quote the line about what Mateo told you that night, so please only keep it if you and Mateo are comfortable seeing it in print. And if you'd like, you could end with 'If your child is struggling right now, you can call or text 988'; many families find that meaningful. Would you like to practice it on the phone Wednesday? Erin"}
