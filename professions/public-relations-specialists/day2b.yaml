  - {id: a2b-allstaff, at: "D2 14:35", kind: edit, app: docs, path: announcements/kessler-gift/all-staff-email-draft, target: doc-allstaff, title: "All-staff email from Dr. Ellison, Thu 10:05 a.m. (draft)",
     summary: "drafted Dr. Ellison's all-staff email",
     content: "# All-staff email from Dr. Raymond Ellison (send Thursday, Nov. 5, 10:05 a.m. CT, not before). Subject: The largest gift in our history\n\nDear colleagues,\n\nA few minutes ago, with Gov. Patricia Hartley, Ruth Kessler and the Garcia family, we announced the largest gift in Prairie Bend Health's 110-year history. The Kessler Family Foundation has given $20 million toward the Kessler Children's Behavioral Health Hospital, a 48-bed psychiatric hospital for children and adolescents that we will build on the Prairie Bend Medical Center campus. With a $12 million grant from the state, $28 million from PBH and $4 million from other donors, the $64 million project is fully funded. We expect to break ground in spring 2027 and open in 2029.\n\nToday, when a child in southeast Nebraska needs inpatient psychiatric care, we too often have to send them out of state. Many of you have made those calls and comforted those families. This hospital will let us care for those children here, close to home.\n\nNone of this happens without you. Our caregivers, in every department and especially in an emergency department that is busier than ever, are the reason families trust us. Thank you.\n\nIf a reporter contacts you, please refer them to the media line at 402-555-0110.\n\nRay"}
