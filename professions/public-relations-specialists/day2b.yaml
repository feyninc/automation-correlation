  - {id: a2b-morrow-brief, at: "D2 16:25", kind: edit, app: docs, path: announcements/kessler-gift/morrow-media-brief, target: doc-morrow-brief, title: "Media brief: Dr. Leah Morrow (embargoed until Thu 10 a.m.)",
     summary: "wrote Dr. Morrow's media brief",
     content: "# Media brief: Dr. Leah Morrow, Medical Director, Child and Adolescent Psychiatry (embargoed until 10 a.m. CT Thu Nov. 5)\n\nYour role: the clinician who explains what the new hospital will mean for children and families. Interviews Thursday after 1 p.m., and follow-ups next week.\n\nThree messages:\n1. Children in southeast Nebraska who need inpatient psychiatric care are often sent out of state; PBH has no pediatric psychiatric beds today.\n2. The Kessler Children's Behavioral Health Hospital will have 48 beds on the PBMC campus, opening in 2029, so families can stay involved in their child's care.\n3. Help is available now: talk to your child's doctor, and anyone in crisis can call or text 988.\n\nFacts: $64 million project ($20 million Kessler gift, $12 million state grant, $28 million PBH, $4 million other donors); groundbreaking spring 2027.\n\nDon't: discuss any patient, including the Garcias beyond what Maria says publicly; speculate on staffing numbers or the opening date; answer questions about the ER story, legal matters or the nurses' contract (bridge: 'That's a question for the hospital's leadership; what I can tell you about children's care is...'). Nothing is off the record.\n\nLikely questions: How many Nebraska kids go out of state? (If you don't have a sourced number, say so.) How will you staff it? (Recruiting and training starts in 2027.) What will a stay look like? Why not outpatient care instead? (Both are needed.)\n\nLogistics: I'll be with you for every interview; TV likes 8-12 second answers; look at the reporter, not the camera."}
