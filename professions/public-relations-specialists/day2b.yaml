  - id: doc-hickman-release
    app: docs
    path: clinics/hickman-urgent-care-release-draft
    title: "Release draft: PBH Urgent Care Hickman opening (Tasha)"
    at: "D2 09:30"
    author: c_tasha
    content: |
      # FOR RELEASE MONDAY, NOV. 2 (draft, Tasha Greer)

      ## Prairie Bend Health to open urgent care in Hickman Monday, Nov. 10

      HICKMAN, Neb. -- Prairie Bend Health (PBH) will open PBH Urgent Care Hickman on Monday, Nov. 10 at 8am. The
      clinic, at 412 Locust St. next to PBH Heart and Vascular, will be open 8am-8pm, seven days a week, with no
      appointment needed.

      "Families in Hickman shouldn't have to drive to Lincoln for a sprained ankle or strep throat," said Amy Lund,
      medical director. "We are thrilled to be part of this community."

      The clinic treats minor illnesses and injuries, offers X-rays and lab tests on site, and accepts most insurance.
      The community is invited to a ribbon cutting Saturday, Nov. 14 at 10am.

      Media contact: Tasha Greer, tasha.greer@prairiebend.org

