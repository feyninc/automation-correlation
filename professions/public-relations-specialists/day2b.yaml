  - {id: a2b-hickman, at: "D2 11:05", kind: edit, target: doc-hickman-release, summary: "edited Tasha's Hickman urgent care release",
     content: "# FOR RELEASE (date to set with Tasha)\n\n## Prairie Bend Health to open urgent care in Hickman Monday, Nov. 9\n\nHICKMAN, Neb. -- Prairie Bend Health will open PBH Urgent Care Hickman at 8 a.m. Monday, Nov. 9. The clinic, at 412 Locust St. next to PBH Heart and Vascular, will be open 8 a.m. to 8 p.m. seven days a week, with no appointment needed.\n\n\"Families in Hickman shouldn't have to drive to Lincoln for a sprained ankle or strep throat,\" said Dr. Amy Lund, the clinic's medical director. \"We're glad to be part of this community.\"\n\nThe clinic treats minor illnesses and injuries, offers X-rays and lab tests on site and accepts most insurance. The community is invited to a ribbon cutting at 10 a.m. Saturday, Nov. 14.\n\nMedia contact: PBH media line, 402-555-0110\n\nEditor's notes (Erin): the opening is Monday, Nov. 9 (Nov. 10 is a Tuesday); 'PBH' on second reference only, no parenthetical; times as 8 a.m.; 'Dr.' on first reference; media contact is the media line. Send it the week of Nov. 9, after Thursday's announcement."}
