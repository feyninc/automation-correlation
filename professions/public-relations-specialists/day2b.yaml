  - {id: a2b-tom-send, at: "D2 12:20", kind: new, app: mail, path: sent/klkn-ed-figures, target: m2b-tom, to: [c_tom],
     subject: "PBMC emergency department figures, October 2026", summary: "sent KLKN the approved ED figures",
     body: "Tom, as promised, attributable to Prairie Bend Health: the PBMC emergency department had 6,840 visits in October, up 9% from October 2025. The median time from arrival to being seen by a provider was 34 minutes, and 3.1% of patients left without being seen. Since July we've hired 22 emergency nurses, added six travel nurses for respiratory season and, since Oct. 15, a second triage nurse on evening shifts; 14 of our 118 emergency nursing positions are open. As I said, we don't comment on personnel matters. Erin"}
  - {id: a2b-ceo-figures, at: "D2 12:30", kind: new, app: mail, path: sent/ceo-ed-figures, target: m2b-ceo-figures, to: [c_ceo], cc: [c_celeste, c_carol],
