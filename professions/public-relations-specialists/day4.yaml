  - {at: "D4 07:50", kind: read, target: t4-steven, summary: "read Legal's privileged hold notice"}
  - {id: a4-hold, at: "D4 07:55", kind: reply, target: t4-steven, to: [c_steven], summary: "confirmed receipt of the hold",
     body: "Received and understood, Steven. I'm keeping all media-line notes, drafts and messages, and won't forward. Erin"}
  - {at: "D4 08:35", kind: read, target: t4-celeste, summary: "read Celeste's decision"}
  - {at: "D4 08:55", kind: read, target: doc-wire-proof, summary: "opened the PR Newswire proof"}
  - {id: a4-wire, at: "D4 09:05", kind: new, app: mail, path: sent/prnewswire-replace-file, target: m4-wire, to: [c_prn], cc: [c_doug],
     subject: "PRN-883120: replace release file before 10:00 AM CT", summary: "replaced the wire file with the final release",
     body: "Hello, for order PRN-883120 please replace the release text with the attached final version (release-final: adds the Governor's approved quote). Release time unchanged: Nov 5, 10:00 AM CT. Please confirm the replacement and send a new proof. Erin Mathers, Prairie Bend Health", att: [doc-release]}
  - {id: a4-event, at: "D4 10:00", kind: noop, target: doc-gift-plan, summary: "ran media at the announcement"}
  - {at: "D4 10:40", kind: read, target: t4-luis, summary: "read NC9's interview request"}
  - {id: a4-luis-celeste, at: "D4 10:50", kind: forward, target: t4-luis, to: [c_celeste], cc: [c_doug], summary: "sent NC9's request to Celeste",
     body: "Celeste, NC9 wants 10 minutes on camera with Dr. Ellison by 2 about the ER death and staffing. Your call. My suggestion: decline the sit-down (we can't discuss the patient, so it would be 10 minutes of 'privacy law doesn't allow'), and offer Dr. Whitley for a general piece on ED volumes and staffing next week. I'll hold NC9 until I hear from you."}
  - {id: a4-luis, at: "D4 10:55", kind: reply, target: t4-luis, to: [c_luis], summary: "told NC9 she's checking",
     body: "Hi Luis, I'm checking on availability and will get back to you by 12:30. Erin"}
  - {id: a4-followup, at: "D4 11:15", kind: new, app: mail, path: sent/kessler-release-followup, target: m4-followup, to: [c_starherald, c_beckers], subject: "Kessler family gives $20 million toward children's behavioral health hospital",
     summary: "sent the release and b-roll to outlets that weren't there",
     body: "Hello, in case it's useful: today's release is below, with b-roll, renderings and photos at prairiebend.org/newsroom/kessler. Dr. Ellison and Hannah Voss are available for interviews this afternoon. Erin Mathers, 402-555-0110. [release]"}
  - {id: a4-luis-decline, at: "D4 12:25", kind: reply, target: t4-luis, to: [c_luis], summary: "declined NC9's CEO sit-down and offered Dr. Whitley",
     body: "Hi Luis, Dr. Ellison isn't available for a sit-down today. Because of privacy law we can't discuss any individual patient, but Dr. Sam Whitley, our ED medical director, can talk with you next week about ED volumes, wait times and staffing. Would Tuesday or Wednesday work? Our statement is below. Erin"}
  - {id: a4-dana, at: "D4 13:10", kind: reply, target: t4-dana, to: [c_dana], summary: "answered Dana's follow-up",
     body: "Hi Dana, Dr. Ellison was recognizing our emergency caregivers, who are seeing record volumes. As in our statement, privacy law doesn't allow us to confirm whether someone was a patient or discuss their care. Erin"}
  - {at: "D4 14:05", kind: read, target: t4-gloria, summary: "read Gloria's note about the Hollis authorization"}
  - {id: a4-gloria, at: "D4 14:15", kind: reply, target: t4-gloria, to: [c_gloria], cc: [c_steven, c_nora], summary: "routed the authorization question to Legal and Privacy",
     body: "Thanks, Gloria. Whether we'd use an authorization while a claim is pending is Steven's and Nora's call, so I'm copying them; PR won't share anything about her visit unless they decide we should. Please keep handling contact with the family. Erin"}
  - {id: a4-kim, at: "D4 16:40", kind: forward, target: t4-kim, to: [c_hannah], summary: "asked Hannah about Ruth for KPRB",
     body: "Hannah, KPRB would like Ruth Kessler for a 10-minute interview Monday for their weekly health segment. Would Ruth be open to it? I'd prep her and sit in. Erin"}
  - {id: a4-phi, at: "D4 11:50", kind: reply, target: t1-social, to: [c_priya], summary: "told Priya to hide the comment with patient details",
     body: "Hide that one: it shares someone's health information and room number, which breaks our community rules. Don't confirm anything in a reply. Post a general line instead: 'We'd like to help. Please contact Patient Relations at 402-555-0190 so we can connect with the family privately.' I'll let Gloria know."}
  - {id: a4-beckers, at: "D4 15:20", kind: reply, target: t4-beckers, to: [c_beckers], summary: "gave Becker's the funding breakdown",
     body: "Hello, the $64 million project is funded by the Kessler Family Foundation's $20 million gift, a $12 million state grant, $28 million from Prairie Bend Health and $4 million from other donors. The 48-bed hospital is expected to open in 2029. Erin Mathers, 402-555-0110"}

