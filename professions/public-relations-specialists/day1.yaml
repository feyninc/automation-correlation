actions:
  - {at: "D1 07:45", kind: read, target: t1-hannah, summary: "read Hannah's final figures"}
  - {id: a1-release, at: "D1 08:05", kind: edit, target: doc-release, summary: "updated the release to $64 million",
     content: "# EMBARGOED UNTIL 10 A.M. CT THURSDAY, NOV. 5, 2026 (draft v4)\n\n## Kessler family gives $20 million toward children's behavioral health hospital\n\nLINCOLN, Neb. -- The Kessler Family Foundation has given $20 million to Prairie Bend Health toward a $64 million, 48-bed psychiatric hospital for children and adolescents, the largest gift in the system's 110-year history.\n\nThe Kessler Children's Behavioral Health Hospital will be built on the Prairie Bend Medical Center campus and is expected to open in 2029. Funding includes the Kessler gift, a $12 million grant from the state, $28 million from PBH and $4 million from other donors.\n\n\"[Donor quote: pending Ruth Kessler]\"\n\n\"[Governor quote: pending Office of the Governor]\"\n\n\"Nebraska families wait too long, and travel too far, for psychiatric care for their children,\" said Dr. Raymond Ellison, PBH president and CEO. \"This gift changes that.\"\n\nToday, children who need inpatient psychiatric care in southeast Nebraska are often sent out of state; PBH has no pediatric psychiatric beds."}
  - {id: a1-qa, at: "D1 08:10", kind: edit, target: doc-qa, summary: "updated the Q&A cost line",
     content: "# Q&A for Dr. Ellison and Hannah Voss (v3, 11/2)\n\nQ: How much will it cost? A: $64 million: the $20 million Kessler gift, a $12 million state grant, $28 million from PBH and $4 million from other donors.\nQ: When will it open? A: 2029.\nQ: How will you staff it when you can't staff the ER? A: [NEEDS UPDATE: the 9% figure is June; ask Nursing for current]\nQ: Why children's behavioral health? A: Demand has doubled since 2019; families travel out of state.\n[No questions yet on: current ER concerns, the nurses' contract]"}
  - {at: "D1 08:20", kind: read, target: t1-kim, summary: "read Kim's expert request"}
  - {id: a1-okeke, at: "D1 08:35", kind: new, app: mail, path: sent/okeke-kprb, target: m1-okeke, to: [c_okeke], subject: "KPRB interview request: flu and RSV season (10 min, by phone)",
