# Monday 2026-11-02. Erin takes the media line. The Foundation raises the project to $64 million, so the release
# and Q&A are stale. A TV producer outside the embargo fishes for Thursday's news. Condition requests after a highway
# crash. Video wants to film in the PICU. At 14:05 the Ledger's health reporter asks about a woman who died after a
# six-hour ER wait, deadline Wednesday 3 p.m., story to run Thursday morning. The October report is due Tuesday 9 a.m.
#
# Arithmetic: project $64M = $20M Kessler + $12M state + $28M PBH + $4M other donors (v3 says $62M with $26M PBH).
# October clips: 54 stories, 29 positive (53.7%), 18 neutral, 7 negative, audience 2,201,000.

