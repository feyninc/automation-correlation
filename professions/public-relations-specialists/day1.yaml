     body: "Frank, Celeste, Doug: the Nebraska Nurses Association announced a safe-staffing rally Wednesday 4 p.m. outside PBMC. Expect media Wednesday, plus the Ledger's ER story Thursday morning and our announcement at 10. Could we have an approved line on the rally and contract talks by Wednesday noon? I'll add both to the CEO Q&A. Erin"}
  - {id: a1-october, at: "D1 16:50", kind: edit, app: docs, path: media-line/october-report, target: doc-october-report, title: October media report,
