     body: "Hi Dana, thanks for reaching out, and I've got your Wednesday 3 p.m. deadline. Privacy law doesn't let us confirm or discuss whether anyone was a patient without authorization, and we don't comment on personnel matters, but I'm working on a response on our emergency department, wait times and staffing for you by then. Erin"}
  - {id: a1-dana-esc, at: "D1 14:35", kind: new, app: mail, path: sent/ledger-inquiry-er-death, target: m1-dana-esc, to: [c_steven, c_nora, c_doug, c_celeste], cc: [c_gloria],
     subject: "Media inquiry: Prairie Ledger on an ER death (deadline Wed 3 p.m.)", summary: "escalated the Ledger inquiry to Legal, Privacy and the VP",
     body: "Steven, Nora, Doug, Celeste: Dana Corcoran (Prairie Ledger) is reporting on Margaret Hollis, 67, who her family says died Oct. 24 after about six hours in the PBMC ER. The son says they've hired an attorney. She asks us to confirm she was a patient and her wait, for current ER wait times and staffing, and whether anyone was disciplined. Deadline Wednesday 3 p.m.; she's aiming for Thursday's paper, the morning of the Kessler announcement. I've acknowledged and confirmed nothing. Plan: I'll draft a statement on the ED (no patient specifics) for Legal and Privacy by Tuesday noon, and ask Dr. Ambrose for current wait and staffing figures. Gloria, copying you in case the family has a grievance open. Erin"}
