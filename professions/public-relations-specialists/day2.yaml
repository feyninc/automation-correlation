     subject: "MEDIA ADVISORY: Prairie Bend Health announcement with Gov. Hartley, Thursday Nov. 5, 10 a.m. CT", summary: "sent the media advisory",
     body: "WHAT: Prairie Bend Health announcement with Gov. Patricia Hartley about the future of children's health care in Nebraska. WHEN: Thursday, Nov. 5, 10 a.m. CT (arrive by 9:40 a.m.). WHERE: Atrium, Prairie Bend Medical Center, 2300 S. 16th St., Lincoln; media parking in Lot C. WHO: Dr. Raymond Ellison; Gov. Patricia Hartley; community and family speakers. VISUALS: speakers, families, renderings; b-roll available. CONTACT: Erin Mathers, 402-555-0110."}
  - {id: a2-release-quote, at: "D2 13:40", kind: edit, target: doc-release, summary: "added Ruth Kessler's approved quote",
     content: "# EMBARGOED UNTIL 10 A.M. CT THURSDAY, NOV. 5, 2026 (draft v5)\n\n## Kessler family gives $20 million toward children's behavioral health hospital\n\nLINCOLN, Neb. -- The Kessler Family Foundation has given $20 million to Prairie Bend Health toward a $64 million, 48-bed psychiatric hospital for children and adolescents, the largest gift in the system's 110-year history.\n\nThe Kessler Children's Behavioral Health Hospital will be built on the Prairie Bend Medical Center campus and is expected to open in 2029. Funding includes the Kessler gift, a $12 million grant from the state, $28 million from PBH and $4 million from other donors.\n\n\"My father grew up in Beatrice and never forgot how far families had to go for help. Our family is proud to help bring this care home,\" said Ruth Kessler, a trustee of the Kessler Family Foundation.\n\n\"[Governor quote: pending Office of the Governor]\"\n\n\"Nebraska families wait too long, and travel too far, for psychiatric care for their children,\" said Dr. Raymond Ellison, PBH president and CEO. \"This gift changes that.\"\n\nToday, children who need inpatient psychiatric care in southeast Nebraska are often sent out of state; PBH has no pediatric psychiatric beds."}
  - {at: "D2 14:00", kind: noop, target: t2-okeke, minutes: 20, summary: "sat in on Dr. Okeke's KPRB interview"}
  - {at: "D2 15:01", kind: noop, target: c2-dana, summary: "took Dana's call"}
  - {id: a2-statement, at: "D2 15:40", kind: edit, app: docs, path: media-line/ledger-statement-draft, target: doc-statement, title: "Ledger statement draft v1 (for Legal and Privacy)",
     summary: "drafted the Ledger statement for Legal and Privacy",
     content: "# Statement to The Prairie Ledger (DRAFT v1 for Steven Pike and Nora Calloway)\n\nAttributable to Prairie Bend Health:\n\n\"Federal privacy law does not allow us to confirm whether someone was a patient or to discuss anyone's care without their authorization. We take every concern about care seriously, and when a concern is raised we review the care provided.\n\nOur emergency department is busier than ever: 6,840 visits in October, up 9% from a year ago. In October, the median time from arrival to being seen by a provider was 34 minutes. Since July we have hired 22 emergency nurses, added six travel nurses for respiratory season and, since Oct. 15, added a second triage nurse on evening shifts. Like hospitals across the country, we are still recruiting: 14 of our 118 emergency nursing positions are open.\n\nAnyone with a concern about their care or a family member's care can contact Patient Relations at 402-555-0190.\""}
  - {id: a2-statement-send, at: "D2 15:45", kind: new, app: mail, path: sent/ledger-statement-draft, target: m2-statement, to: [c_steven, c_nora], cc: [c_doug, c_celeste],
