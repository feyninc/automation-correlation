     body: "Thank you! Key points: (1) RSV and flu are rising in Nebraska; it's not too late for flu shots, and RSV protection is available for infants and older adults. (2) Signs a child needs care now: trouble breathing, not drinking, fewer wet diapers. (3) Most kids can be cared for at home; call your pediatrician first. If asked about ER waits or staffing, say it's not your area and I'll follow up. Kim will call at 2:00; I'll join."}
