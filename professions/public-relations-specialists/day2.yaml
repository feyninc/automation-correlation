# Tuesday 2026-11-03, Election Day (no pitching in the morning). The advisory draft has the old 10:30 time. Three
# outlets have signed the embargo; Dana hasn't but asks for the release anyway, and NC9 (excluded) asks too. Legal and
# Privacy set the rules for the Ledger statement; Nursing sends current numbers, which make the Q&A's June figure
# stale. The donor approves her quote; the Governor's office sends a quote with the wrong grant amount. Dana calls
# and asks for something "off the record". Dr. Okeke's KPRB interview is at 2 p.m.
#
# Arithmetic: ED RNs 14 open of 118 = 11.9%; system 127 of 1,214 = 10.5% (June: 109 of 1,214 = 9.0%; ED 8 of 118).

documents:
  - id: doc-advisory
    app: docs
    path: announcements/kessler-gift/media-advisory-draft
    title: "Media advisory draft (Doug)"
    at: "D2 09:15"
    author: c_doug
    content: |
      # MEDIA ADVISORY

      WHAT: Prairie Bend Health announcement with Gov. Patricia Hartley about the future of children's health care in
      Nebraska.
      WHEN: Thursday, Nov. 5, 10:30 a.m.
      WHERE: Atrium, Prairie Bend Medical Center, 2300 S. 16th St., Lincoln. Media parking in Lot C.
      WHO: Dr. Raymond Ellison, PBH president and CEO; Gov. Patricia Hartley; community and family speakers.
      VISUALS: speakers, families, architectural renderings. B-roll available.
      CONTACT: Erin Mathers, 402-555-0110.
  - id: doc-embargo-log
    app: docs
    path: announcements/kessler-gift/embargo-agreements
    title: Embargo agreements (Kessler gift)
    format: csv
    at: "D2 09:40"
    author: c_doug
    content: |
      outlet,reporter,agreement_signed,briefing
      Prairie Business Journal,Victor Pollard,2026-11-02 16:10,Wed 9:00
      Associated Press,Nate Okoye,2026-11-02 17:45,Wed 11:00
      KPRB Public Radio,Kim Halsey,2026-11-03 08:30,Wed 10:00
      The Prairie Ledger,Dana Corcoran,not yet,Wed 13:00 (pending)
  - id: doc-cno-figures
    app: docs
    path: nursing/ed-figures-2026-10
    title: ED figures, October 2026 (Nursing, for media use)
    at: "D2 12:00"
    author: c_cno
    content: |
      # Emergency Department, Prairie Bend Medical Center, October 2026 (approved for media use)

      - ED visits: 6,840 (up 9% from October 2025).
      - Median door-to-provider time: 34 minutes. Left without being seen: 3.1%.
      - ED RN positions: 118 budgeted, 14 open (11.9%) at Oct. 31. System RN positions: 1,214 budgeted, 127 open (10.5%).
      - Since July: 22 new ED nurses hired; 6 travel nurses added for respiratory season; second triage nurse added
        on evening shifts from Oct. 15.

