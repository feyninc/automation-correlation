calls:
  - id: c2-dana
    path: 2026-11-03/1500-dana-corcoran
    title: Media line call, Dana Corcoran (The Prairie Ledger)
    start: "D2 15:00:00"
    turns:
      - [c_dana, "Erin, it's Dana. Off the record, just between us: was Mrs. Hollis there that night? I'm not going to quote you.", 5]
      - [worker, "Dana, I don't do off the record, so anything I say is on the record. And I'm not able to confirm or discuss whether anyone was a patient. You'll have our statement on the emergency department by your 3 p.m. deadline tomorrow."]
      - [c_dana, "Can you at least tell me your average wait times now?", 4]
      - [worker, "Yes, that'll be in the statement, with our October numbers and what we've done on staffing."]
      - [c_dana, "OK. And I'll send the embargo agreement tonight.", 3]
      - [worker, "Great. Once it's signed I'll send the embargoed materials for your briefing Wednesday at 1."]

