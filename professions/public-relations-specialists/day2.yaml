  - {id: a2-victor, at: "D2 15:30", kind: reply, target: t2-victor, to: [c_victor], summary: "gave Victor cost per bed and PBH's share (embargoed)",
     body: "Hi Victor, under the same embargo (10 a.m. CT Thursday): $64 million for 48 beds is about $1.33 million a bed. PBH is putting in $28 million from capital; the rest is the $20 million Kessler gift, the $12 million state grant and $4 million from other donors. Erin"}

