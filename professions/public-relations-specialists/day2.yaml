     body: "Steven, Nora: draft v1 is in Docs > media-line (ledger-statement-draft). It confirms nothing about Mrs. Hollis, doesn't mention the letter, and uses only Nursing's approved October ED figures. Comments by Wednesday 11 a.m. would let Celeste approve before 2. Also FYI: Dana asked me 'off the record' today whether she was a patient; I said nothing is off the record and confirmed nothing. Erin"}
  - {id: a2-qa-staffing, at: "D2 16:05", kind: edit, target: doc-qa, summary: "updated the Q&A staffing answer",
     content: "# Q&A for Dr. Ellison and Hannah Voss (v4, 11/3)\n\nQ: How much will it cost? A: $64 million: the $20 million Kessler gift, a $12 million state grant, $28 million from PBH and $4 million from other donors.\nQ: When will it open? A: 2029.\nQ: How will you staff it when you can't staff the ER? A: We're hiring: 22 new emergency nurses since July, travel nurses for the season, a second evening triage nurse. About 11.9% of our ED nursing positions are open today, and we'll recruit and train specialized pediatric behavioral health staff starting in 2027.\nQ: Why children's behavioral health? A: Demand has doubled since 2019; families travel out of state.\n[To add after Legal: the Ledger ER question; the nurses' rally and contract (Labor Relations)]"}
  - {at: "D2 16:05", kind: read, target: t2-jamal, summary: "read the Governor's quote"}
  - {id: a2-jamal, at: "D2 16:20", kind: reply, target: t2-jamal, to: [c_jamal], cc: [c_hannah], summary: "asked the Governor's office to confirm the grant amount",
