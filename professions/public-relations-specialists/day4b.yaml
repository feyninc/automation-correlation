# Thursday 2026-11-05, the rest of the day: the Ledger story at 6:30, the announcement at 10. WKLN's morning producer
# wants someone on camera about the death and asks what the event is. Social needs approved pull quotes; the newsroom
# page goes live at 10:00 exactly. After the program KNEB wants Mateo Garcia (the family said no) and gets Dr. Morrow.
# The photographer's selects include a wide shot with a patient in an IV pole by the elevators. The nurses' union ties
# the death to staffing; a Reddit user who says she's an ER nurse posts what looks like Mrs. Hollis's triage level and
# a screenshot of the tracking board (a possible privacy breach for the Privacy Officer). The Ledger's managing editor
# asks Dr. Ellison for a Sunday interview.
#
# Arithmetic:
# - Media check-in: 20 pre-registered, KTWO's one reporter absent = 19 of 20 attended (95%), 10 outlets of which 9
#   came; live trucks 3 of 3 spaces.
# - Photo selects: 12 (KG-1105-01 to -12); 07 has a patient in the background (no MC-7): 11 usable, of which 09
#   (Mateo at the edge of frame) is held until Maria says yes: 10 to send now.
# - Digital ads (Owen's budget): Meta $2,500 + Google $1,500 = $4,000, starting 10:00 a.m. CT.
# - Inbound today (with day4.yaml): 119 emails (70 traffic) and 51 chat messages (21 traffic), plus 2 news items.

