     content: "# Media inquiry log, November 2026 (media line: Erin Mathers through 11/6). Legal hold (Hollis): keep every entry and note.\n\n| date | outlet | reporter | topic | response | status |\n| --- | --- | --- | --- | --- | --- |\n| 11/2-11/4 | see entries through Wednesday | | | | |\n| 11/2 | KNEB 10 | Shauna Pettit | Tyler Brandt condition; youth sports injuries | fair (listed); Dr. Nguyen, general only | closed |\n| 11/2 | Prairie Ledger | Dana Corcoran | ER death claim (Hollis) | approved statement sent 11/4 | closed; story ran 11/5 A1 |\n| 11/3 | KTWO Radio | Bill Haas | grain bin death near Crete | confirmed nothing; sheriff and county attorney (coroner) | closed |\n| 11/3 | KLKN 8 | Tom Albers | nurse fired over TikTok? | no comment on personnel; ED figures | closed |\n| 11/4 | AP | Nate Okoye | 9:55 hold-for-release | move at 10 a.m. CT | closed |\n| 11/4 | WKLN 7 | assignment desk | rally; Council member Dunleavy | approved union line; no information | closed |\n| 11/5 | WKLN 7 | Brad Keane | on-camera about the death | declined; statement and ED figures emailed 7:20 | closed |\n| 11/5 | NC9 | Luis Ferreira | Dr. Ellison sit-down | declined (Celeste); Dr. Whitley next week offered | open |\n| 11/5 | KNEB 10 | Shauna Pettit | Mateo Garcia; clinician | Mateo declined (family); Dr. Morrow 1:30 | closed |\n| 11/5 | WKLN, KLKN, KNEB, NC9 | desks | b-roll | newsroom link 11:35 | closed |\n| 11/5 | Healthcare Dive | Sam Oduya | release | newsroom link and text | closed |\n| 11/5 | DHHS Communications | | post release and photo | yes, credit Marco Ruiz | closed |\n| 11/5 | Prairie Ledger | Dana Corcoran | was the ED line about Mrs. Hollis? | recognized ED caregivers; statement | closed |\n| 11/5 | KLKN 8 | Tom Albers | NNA statement | approved union line plus statement | closed |\n| 11/5 | KPRB | Kim Halsey | ED vacancy, union response | 14 of 118; approved union line | closed |\n| 11/5 | Becker's | editors | funding breakdown | four sources, 2029 | closed |\n| 11/5 | Modern Healthcare | Rachel Stone | Hannah Voss interview | asking Hannah; answer by Fri noon | open |\n| 11/5 | Prairie Ledger | Ted Lowry | Dr. Ellison for Sunday | declined (Celeste); Dr. Whitley offered | open |\n| 11/5 | KPRB | Kim Halsey | Ruth Kessler Monday | asked Hannah | open |"}

