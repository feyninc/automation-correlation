calls:
  - id: c4b-brad
    path: 2026-11-05/0712-wkln-morning
    title: Media line call, Brad Keane (WKLN 7), Ledger story
    start: "D4 07:12:00"
    turns:
      - [c_brad, "Erin, Brad at WKLN. You saw the Ledger? We want someone from the hospital on camera for our eight o'clock about the woman who died. Who can we get?", 5]
      - [worker, "We're not doing interviews on that this morning. Our statement is that federal privacy law doesn't allow us to confirm whether someone was a patient or discuss anyone's care, and that we take every concern seriously and review it carefully. I'll email you the statement and our October emergency department figures right now."]
      - [c_brad, "Is today's event still happening, with all this?", 4]
      - [worker, "Yes. Ten a.m. Central in the atrium; please be in by nine-forty."]
      - [c_brad, "Can you at least tell me what it's about so I can pitch it in our meeting?", 4]
      - [worker, "Not before ten, Brad. It's worth the crew, and the release goes out the minute we start."]
  - id: c4b-shauna
    path: 2026-11-05/1120-kneb-after-event
    title: Media line call, Shauna Pettit (KNEB 10), after the event
    start: "D4 11:20:00"
    turns:
      - [c_shauna, "Erin, great event. Could we interview Mateo Garcia for the six o'clock? He was standing right there with his mom.", 5]
      - [worker, "Mateo isn't doing interviews; that's his family's choice. His mom, Maria, has done a few, and I can ask if she'll do one more with you."]
      - [c_shauna, "OK. And a doctor who'll actually work in the new hospital?", 4]
      - [worker, "Dr. Leah Morrow, our medical director of child and adolescent psychiatry. She's in clinic until one; I can bring you to her at one-thirty here."]
      - [c_shauna, "One-thirty works.", 2]
      - [worker, "Great. I'll meet you at the main entrance at one-twenty-five."]
  - id: c4b-ceo
    path: 2026-11-05/1430-ellison-ledger-editor
    title: Call from Dr. Raymond Ellison (CEO), Ledger editor's request
    start: "D4 14:30:00"
    turns:
      - [c_ceo, "Erin, Ray. Good morning's work. Ted Lowry from the Ledger called Carol asking for an interview with me for Sunday about the ER. I'm inclined to do it and set the record straight.", 6]
      - [worker, "Thank you. On the Ledger, that's Celeste's decision, and I'd like her to weigh in before anyone calls Ted back. My worry is the same as Tuesday: you can't discuss Mrs. Hollis's care, so the interview would be about what you can't say."]
      - [c_ceo, "So I just ignore him?", 3]
      - [worker, "No, we answer him today. I'll get Celeste's recommendation to you by four, and either way I'll call Ted back myself."]
      - [c_ceo, "All right. By four.", 2]

