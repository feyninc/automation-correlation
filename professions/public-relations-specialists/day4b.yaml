     body: "Not quite nothing, Dr. Whitley: be friendly and say, 'I can't talk about any patient, but our media team can help you,' and send them to me at 402-555-0110. Don't comment on the story, staffing or the family, even casually; nothing is off the record. You're doing NC9 next week, and we'll prep for exactly this."}
  - {id: a4b-morning, at: "D4 06:50", kind: new, app: mail, path: sent/morning-note-ledger-story, target: m4b-morning, to: [c_celeste, c_doug], cc: [c_carol],
     subject: "6:50 a.m.: the Ledger story and today", summary: "sent the morning note on the Ledger story",
     body: "Celeste, Doug (Carol, for Dr. Ellison's folder): the Ledger's story is on A1 and online since 6:30. It's the family's account: Mrs. Hollis, 67, about six hours with chest pain, collapsed; the son and the attorney are quoted. It uses our statement accurately (privacy, every concern taken seriously and reviewed, 6,840 visits, 34-minute median, 22 nurses hired), mentions yesterday's rally, and ends by noting our 10 a.m. announcement.\n\nWhat I expect today: TV morning producers asking for someone on camera (we decline, statement only), the question at the event (Q&A v5), the union reacting, and social comments on the announcement posts. Plan: the approved statement only; manager talking points go at 7 once you and Steven OK them; Priya's comment guidance stands; I'm on the media line all day. Nothing about any patient beyond the statement. Erin"}
  - {id: a4b-celeste-call, at: "D4 06:55", kind: noop, target: m4b-morning, minutes: 10, summary: "talked with Celeste about the story before her drive in"}
  - {id: a4b-brad-note, at: "D4 07:16", kind: update, target: c4b-brad, summary: "wrote the case note for WKLN's morning call",
     body: "WKLN 7 (Brad Keane, morning) wanted someone on camera at 8 about the death: declined, gave the approved statement, promised it and the ED figures by email. Confirmed the event is on (10 a.m. CT, in by 9:40); declined to say what it's about before 10."}
  - {id: a4b-brad-send, at: "D4 07:20", kind: new, app: mail, path: sent/wkln-statement-morning, target: m4b-brad, to: [c_brad],
     subject: "PBH statement and ED figures", summary: "emailed Brad the approved statement and ED figures",
     body: "Brad, as promised, attributable to Prairie Bend Health: \"Federal privacy law does not allow us to confirm whether someone was a patient or to discuss anyone's care without their authorization. We take every concern about care seriously, and when a concern is raised we review it carefully.\" October at the PBMC emergency department: 6,840 visits, up 9% from a year ago; median 34 minutes from arrival to a provider; 22 emergency nurses hired since July; 14 of 118 emergency nursing positions open. Anyone with a concern about their care can contact Patient Relations at 402-555-0190. See you at 9:40. Erin"}
  - {id: a4b-huddle, at: "D4 07:30", kind: noop, target: doc-teamcal, minutes: 30, summary: "morning huddle with Celeste and Doug"}
  - {id: a4b-mia-call, at: "D4 08:15", kind: noop, target: t1b-mia-dm, minutes: 5, summary: "call with Mia about the check-in table"}
  - {id: a4b-jenna, at: "D4 08:45", kind: reply, target: t4b-jenna, to: [c_jenna], cc: [c_owen], summary: "confirmed the digital launch time",
     body: "Thanks, Jenna. No changes: start at 10:00 a.m. Central, not a minute before, with the release creative. If the program runs long that's fine; the embargo lifts at 10 regardless. Comments go to Priya's team, so please don't reply to any from the ad accounts. Erin"}
  - {id: a4b-checkin, at: "D4 09:00", kind: noop, target: doc-media-logistics, minutes: 45, summary: "ran media check-in and set the press riser"}
  - {id: a4b-quotes, at: "D4 09:30", kind: reply, target: t1-social, to: [c_priya], summary: "sent Priya approved pull quotes for live posts",
     body: "Three approved quotes, word for word from the final release, to post live after each speaker (nothing before 10:00):\n1. Ruth Kessler: 'My father grew up in Beatrice and never forgot how far families had to go for help. Our family is proud to help bring this care home.'\n2. Gov. Patricia Hartley: 'Every Nebraska child deserves care close to home. This $12 million state investment will keep families together while their kids get well.'\n3. Dr. Raymond Ellison: 'Nebraska families wait too long, and travel too far, for psychiatric care for their children. This gift changes that.'\nNo photos of Mateo up close or the Kessler grandchildren."}
  - {id: a4b-brooke-call, at: "D4 09:47", kind: noop, target: t3b-brooke, minutes: 4, summary: "call with Brooke: the Governor is two minutes out"}
  - {id: a4b-web, at: "D4 10:00", kind: reply, target: t1b-derek-dm, to: [c_derek], summary: "told Derek to make the newsroom page live at 10:00",
     body: "Go: make it live now, and link Kyle's b-roll package. Thanks, Derek."}
  - {id: a4b-shauna-note, at: "D4 11:25", kind: update, target: c4b-shauna, summary: "wrote the case note for KNEB's call",
     body: "KNEB 10 (Shauna Pettit) asked to interview Mateo Garcia: declined, family's choice; offered to ask Maria. Booked Dr. Leah Morrow at 1:30 p.m. at PBMC (in clinic until 1); meeting the crew at the main entrance at 1:25."}
  - {id: a4b-morrow, at: "D4 11:28", kind: new, app: mail, path: sent/morrow-kneb-thursday, target: m4b-morrow, to: [c_morrow],
     subject: "KNEB 10 at 1:30 today (children's behavioral health, in general)", summary: "booked Dr. Morrow for KNEB",
     body: "Dr. Morrow, KNEB 10 (Shauna Pettit) would like 10 minutes at 1:30 today on why the new hospital matters for children and families. I'll bring the crew to your clinic office at 1:30. It's the brief we practiced: three messages, 988, and the bridge if she asks about the ER story or staffing. I'll be with you. Erin"}
  - {id: a4b-broll, at: "D4 11:35", kind: reply, target: t4b-broll, to: [c_wkln, c_tom, c_shauna, c_luis], summary: "sent the TV desks the b-roll and graphics link",
     body: "Hello, b-roll (campus, atrium, staff, renderings; 4:10), the fact board graphic and today's release are on the newsroom page: prairiebend.org/newsroom/kessler. Please don't use any shot that shows patients or visitors other than the speakers and families on stage. Erin Mathers, 402-555-0110"}
  - {id: a4b-hdive, at: "D4 11:40", kind: reply, target: t1b-sam, to: [c_sam], summary: "sent Healthcare Dive the release",
     body: "Hi Sam, the release, fact sheet and renderings are at prairiebend.org/newsroom/kessler; the release text is below. Hannah Voss (Foundation) and Dr. Leah Morrow can talk next week if you want more. Erin"}
  - {id: a4b-dhhs, at: "D4 12:00", kind: reply, target: t4b-dhhs, to: [c_dhhs], cc: [c_jamal], summary: "cleared DHHS to post the release with credit",
     body: "Hello, yes, please post it; the release is public. Photos of the Governor will be on prairiebend.org/newsroom/kessler by 1:30; please credit 'Photo: Marco Ruiz for Prairie Bend Health'. Erin Mathers"}
  - {id: a4b-kyle-call, at: "D4 12:15", kind: noop, target: t1-kyle, minutes: 6, summary: "call with Kyle about the TV b-roll package"}
  - {id: a4b-photos, at: "D4 12:50", kind: new, app: mail, path: sent/photo-selects-captions, target: m4b-photos, to: [c_derek, c_priya], cc: [c_marco, c_kyle],
     subject: "Kessler photos: 10 cleared, with captions (don't use KG-1105-07)", summary: "cleared ten photos with captions and pulled the one with a patient",
     body: "Derek, Priya: cleared for the newsroom and social, credit 'Photo: Marco Ruiz for Prairie Bend Health':\n01 Dr. Raymond Ellison, Prairie Bend Health president and CEO, speaks Thursday, Nov. 5, 2026, in the Prairie Bend Medical Center atrium.\n02 Gov. Patricia Hartley speaks at the announcement.\n03 Ruth Kessler, a trustee of the Kessler Family Foundation, speaks beside a photo of her father, Walter Kessler.\n04 Maria Garcia of Lincoln describes her family's search for psychiatric care for her son.\n05 From left, Hannah Voss, Ruth Kessler, Gov. Patricia Hartley and Dr. Raymond Ellison unveil a rendering of the Kessler Children's Behavioral Health Hospital.\n06 Gov. Patricia Hartley with members of the Kessler family.\n08 Hannah Voss, president of the Prairie Bend Health Foundation, welcomes guests.\n10 The fact board for the 48-bed hospital, expected to open in 2029.\n11 Ruth Kessler and Maria Garcia embrace after the program.\n12 Guests applaud in the atrium.\nDon't use KG-1105-07: there's a patient in a wheelchair with an IV pole by the elevators, and we have no MC-7; cropping isn't enough to be safe. Hold 09 (Mateo at the edge of the frame) until I've asked Maria. Erin"}
  - {id: a4b-escort, at: "D4 13:25", kind: noop, target: c4b-shauna, minutes: 30, summary: "escorted KNEB to Dr. Morrow's interview"}
  - {id: a4b-kim, at: "D4 13:55", kind: reply, target: t4b-kim-staffing, to: [c_kim], summary: "gave KPRB the approved staffing figure and the union line",
     body: "Hi Kim, from Nursing's October figures: 14 of our 118 emergency nursing positions are open, and since July we've hired 22 emergency nurses, added six travel nurses for respiratory season and a second evening triage nurse. On the union: 'We respect our nurses' right to express their views. We are bargaining in good faith and hope to reach an agreement before the contract expires Dec. 31.' Erin"}
  - {id: a4b-tom, at: "D4 14:00", kind: reply, target: t4b-tom-nna, to: [c_tom], summary: "answered KLKN on the union statement with approved lines only",
     body: "Tom, attributable to Prairie Bend Health: \"We respect our nurses' right to express their views. We are bargaining in good faith and hope to reach an agreement before the contract expires Dec. 31.\" On the Ledger story, our statement stands: federal privacy law does not allow us to confirm whether someone was a patient or to discuss anyone's care, and we take every concern seriously and review it carefully. Since July we've hired 22 emergency nurses. Erin"}
  - {id: a4b-nna, at: "D4 14:05", kind: new, app: mail, path: sent/nna-statement-heads-up, target: m4b-nna, to: [c_frank, c_celeste], cc: [c_doug],
     subject: "NNA statement ties the Hollis story to staffing", summary: "flagged the union's statement to Labor Relations and the VP",
     body: "Frank, Celeste: at noon the NNA posted a statement calling today's Ledger story 'heartbreaking' and saying emergency staffing at Prairie Bend is unsafe; it asks for enforceable staffing standards in the contract. KLKN and KPRB asked for a response; I gave only Frank's approved line plus our statement and the hiring figure. Expect it in tonight's TV coverage. If you want to say anything beyond the approved line, it needs your wording. Erin"}
  - {id: a4b-reddit, at: "D4 14:10", kind: new, app: mail, path: sent/reddit-possible-privacy-breach, target: m4b-reddit, to: [c_nora, c_steven], cc: [c_doug],
     subject: "Possible privacy breach: Reddit post claiming to be a PBMC ER nurse", summary: "reported the Reddit post to the Privacy Officer and Legal",
     body: "Nora, Steven: at about 1:30 a Reddit user on r/lincoln who says she's a PBMC ER nurse posted that 'the woman in the Ledger story was triaged level 3 and sat 5 hours,' with a screenshot that appears to show our ED tracking board. Priya has saved screenshots and the link; we have not replied, reported or tried to identify anyone, and we won't delete anything (hold). This may be a disclosure of patient information by a workforce member, so it's yours to assess; please tell me if you want us to report the post to Reddit or say anything publicly. Erin"}
  - {id: a4b-priya-reddit, at: "D4 14:12", kind: reply, target: t1-social, to: [c_priya], summary: "told Priya not to engage with the Reddit post",
     body: "Don't respond or comment, and don't report it yet: I've sent it to Nora and Steven as a possible privacy breach. Keep the screenshots and the link (we're under a legal hold, so nothing gets deleted), and tell me if it spreads or a reporter picks it up."}
  - {id: a4b-linda, at: "D4 14:25", kind: reply, target: t4b-linda, to: [c_linda], cc: [c_gloria], summary: "connected Linda Farris with Patient Relations",
     body: "Dear Ms. Farris, I'm sorry for what you and your husband went through, and thank you for telling us. I've asked Gloria Benitez, our Patient Relations manager, who is copied here, to call you today; she can look into your husband's visit with you and get you real answers, which I'm not able to do from the media office. You can also reach Patient Relations directly at 402-555-0190. Erin Mathers, Prairie Bend Health"}
  - {id: a4b-ceo-note, at: "D4 14:36", kind: update, target: c4b-ceo, summary: "wrote the note on Dr. Ellison's call",
     body: "Dr. Ellison: Ted Lowry (Ledger managing editor) asked Carol for a Sunday interview about the ER; he's inclined to do it. Said it's Celeste's decision, and the concern is that he can't discuss Mrs. Hollis's care. Agreed: Celeste's recommendation to him by 4; I'll call Ted back either way."}
  - {id: a4b-ceo-route, at: "D4 14:45", kind: new, app: mail, path: sent/ledger-editor-request, target: m4b-ceo-route, to: [c_celeste], cc: [c_doug],
     subject: "Decision needed by 4: Ledger managing editor wants Ray for Sunday", summary: "asked Celeste to decide on the Ledger editor's request",
     body: "Celeste, Ted Lowry, the Ledger's managing editor, called Carol asking Ray for an interview for Sunday about the ER. Ray is inclined to do it; I told him it's your call and promised him an answer by 4. My recommendation: decline the interview for Ray. He can't discuss Mrs. Hollis's care, there's a claim and a legal hold, and a Sunday sit-down would be about what he can't say. Instead: our statement again, and Dr. Whitley next week on ED volumes, waits and staffing in general, as we offered NC9. I'll call Ted myself either way. Erin"}
  - {id: a4b-rachel, at: "D4 15:00", kind: reply, target: t4b-rachel, to: [c_rachel], summary: "acknowledged Modern Healthcare",
     body: "Hi Rachel, thanks for your interest. I'm checking with Hannah Voss, president of the Prairie Bend Health Foundation, and will come back to you by Friday noon with a time Monday or Tuesday. Erin"}
  - {id: a4b-hannah-mh, at: "D4 15:05", kind: new, app: mail, path: sent/hannah-modern-healthcare, target: m4b-hannah-mh, to: [c_hannah],
     subject: "Modern Healthcare would like 20 minutes with you", summary: "asked Hannah about Modern Healthcare",
     body: "Hannah, Rachel Stone of Modern Healthcare is writing a feature next week on large gifts for pediatric behavioral health and would like 20 minutes with you Monday or Tuesday. Worth doing: it's a national trade outlet. Would you like to? Anything about the Kesslers beyond the release would be Ruth's call. I'd prep you and sit in. Erin"}
  - {id: a4b-ted, at: "D4 15:25", kind: new, app: mail, path: sent/ledger-editor-reply, target: m4b-ted, to: [c_ted], cc: [c_dana],
     subject: "Your request for Dr. Ellison", summary: "declined the Ledger editor's request for the CEO and offered Dr. Whitley",
     body: "Ted, thank you for reaching out to Dr. Ellison's office. He won't be available for an interview for Sunday. Our statement to Dana stands, and federal privacy law doesn't allow us to discuss any patient. Dr. Sam Whitley, medical director of our emergency department, can talk with the Ledger next week about ED volumes, wait times and staffing in general; I'd be glad to set that up with Dana. Erin Mathers, Prairie Bend Health, 402-555-0110"}
  - {id: a4b-ceo-back, at: "D4 15:28", kind: reply, target: t4b-carol, to: [c_carol], cc: [c_celeste], summary: "told Dr. Ellison's office Celeste's decision",
     body: "Carol, please let Dr. Ellison know: Celeste recommends he not do the Ledger interview, and I've told Ted Lowry he isn't available for Sunday and offered Dr. Whitley next week on the ED in general. He doesn't need to call Ted back. Thank you! Erin"}
  - {id: a4b-debrief, at: "D4 15:30", kind: noop, target: doc-teamcal, minutes: 45, summary: "announcement debrief with Celeste, Doug, Hannah and Priya"}
  - {id: a4b-hannah-call, at: "D4 16:20", kind: noop, target: t4b-hannah, minutes: 8, summary: "call with Hannah about donor follow-up and Ruth's thank-you"}
  - {id: a4b-hannah-garcia, at: "D4 16:25", kind: reply, target: t4b-hannah-ruth, to: [c_hannah], summary: "offered to pass Ruth's note to the Garcias instead of giving out their address",
     body: "What a kind thought. I'd rather not hand out the Garcias' home address without asking them. Could Ruth send the note to me (or to you at the Foundation), and I'll get it to Maria? I'll also ask Maria whether she'd like Ruth to have her address."}
  - {id: a4b-remarks, at: "D4 16:30", kind: reply, target: t1b-derek-dm, to: [c_derek], summary: "asked Derek to post the remarks as delivered and the event video",
     body: "Derek, please add Dr. Ellison's remarks as delivered (in Docs, ceo-remarks; it includes his line on our emergency caregivers) and Kyle's 0:58 cut and the full livestream to the page, under the release. Not Maria Garcia's remarks text: that's her family's story, and I'll ask her first."}
  - {id: a4b-eod, at: "D4 16:55", kind: new, app: mail, path: sent/kessler-end-of-day, target: m4b-eod, to: [c_celeste, c_doug, c_hannah], cc: [c_priya],
     subject: "Kessler announcement: end of day", summary: "sent the end-of-day coverage note",
     body: "Celeste, Doug, Hannah: AP moved at 10:00 and it's spreading (Healthcare Dive and others picked it up). Online so far: the Ledger, the Business Journal, KPRB, the Star Herald, KTWO, WKLN's noon show, the Patch; NC9, KNEB, KLKN and WKLN have evening pieces coming. The Ledger's online story and KTWO reference this morning's ER story; KPRB's evening piece pairs the gift with staffing after the union's noon statement. One error: the Star Herald says a $12.5 million state grant; I'll ask them to correct it to $12 million first thing tomorrow. Social: about 1,600 Facebook reactions, 40 ER-related comments answered or hidden per our rules. Open: a possible privacy issue on Reddit is with Nora and Steven; the Ledger's managing editor was declined for Ray and offered Dr. Whitley. Full coverage summary tomorrow by noon. Erin"}
