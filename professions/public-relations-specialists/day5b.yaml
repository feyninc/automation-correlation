calls:
  - id: c5b-pete
    path: 2026-11-06/0945-star-herald-correction
    title: Call from Pete Lindgren (Star Herald city desk), correction
    start: "D5 09:45:00"
    turns:
      - [c_starherald, "Hi Erin, Pete on the Star Herald city desk, about your correction request. Our reporter says the Governor said twelve and a half million at the podium.", 6]
      - [worker, "Thanks for calling, Pete. The grant is twelve million dollars: that's the figure in the grant agreement and in the Governor's approved quote in our release, and her press office confirmed it in writing this week."]
      - [c_starherald, "OK. If her office confirms it to us, we'll fix it online today.", 3]
      - [worker, "Great. I'll ask Jamal Ortiz in her press office to email you this morning."]
  - id: c5b-dana
    path: 2026-11-06/1105-dana-news-conference
    title: Media line call, Dana Corcoran (The Prairie Ledger), Hollis news conference
    start: "D5 11:05:00"
    turns:
      - [c_dana, "Erin, it's Dana. The Hollis family and their attorney are holding a news conference Monday at ten at the attorney's office. Will Prairie Bend have someone there, or respond?", 6]
      - [worker, "Thanks for letting me know, Dana. We won't have anyone there. Our statement stands, and if new questions come out of it, send them to me."]
      - [c_dana, "Can you confirm they've filed a lawsuit?", 3]
      - [worker, "We don't comment on legal matters."]
      - [c_dana, "Has anyone at the hospital met with the family?", 3]
      - [worker, "I can't discuss any patient or family. Our Patient Relations team is there for any family with a concern about care."]
  - id: c5b-tom
    path: 2026-11-06/1420-klkn-current-patient
    title: Media line call, Tom Albers (KLKN 8), children's mental health
    start: "D5 14:20:00"
    turns:
      - [c_tom, "Erin, Tom at KLKN. For tonight's piece on kids' mental health, can you connect us with a family whose child is in your hospital right now, waiting for a psychiatric bed?", 6]
      - [worker, "I can't connect you with current patients or their families. What I can offer is Dr. Leah Morrow, who directs our child and adolescent psychiatry, on the bed shortage in general, and I can ask Maria Garcia, who shared her family's story yesterday, if she'd talk with you."]
      - [c_tom, "Both would be great. By four?", 3]
      - [worker, "I'll check with both and call you back by two forty-five."]

actions:
  - {id: a5b-house, at: "D5 09:10", kind: noop, target: doc-directory, minutes: 4, summary: "condition check with the house supervisor before the handoff"}
  - {id: a5b-flu, at: "D5 09:30", kind: new, app: mail, path: sent/flu-clinic-pitch, target: m5b-flu, to: [c_wkln, c_shauna, c_tom, c_luis, c_kim, c_ktwo, c_starherald, c_patch],
     subject: "Free drive-through flu shots Saturday in Hickman (and 11/14 in Beatrice)", summary: "pitched the weekend flu clinics",
     body: "Hello, for your weekend planning: Prairie Bend Health is holding free drive-through flu shot clinics this Saturday, Nov. 7, 9 a.m. to noon at the Hickman Community Center, and next Saturday, Nov. 14, 9 a.m. to noon at PBH Beatrice. Anyone 6 months and older can get a shot; no insurance or appointment needed, and people stay in their cars. Visuals: nurses at car windows, families with kids. Lori Swanson, RN, our community health nurse, is available for interviews on site Saturday from 9 to 10 a.m. Contact me at 402-555-0110 to set it up. Erin Mathers, Prairie Bend Health"}
  - {id: a5b-pete-note, at: "D5 09:50", kind: update, target: c5b-pete, summary: "wrote the note on the Star Herald's call",
     body: "Star Herald city desk (Pete Lindgren) on the correction: reporter says the Governor said $12.5 million at the podium. Told him the grant is $12 million (grant agreement, approved quote, Governor's office confirmed in writing). He'll correct online if the Governor's office confirms; asking Jamal Ortiz to email him."}
  - {id: a5b-jamal, at: "D5 09:55", kind: new, app: mail, path: sent/jamal-star-herald-confirm, target: m5b-jamal, to: [c_jamal],
     subject: "Star Herald: could you confirm the $12 million?", summary: "asked Jamal to confirm the grant figure to the Star Herald",
     body: "Jamal, the Star Herald printed a $12.5 million state grant yesterday. Their city desk (Pete Lindgren, citydesk@starherald.example) will correct it online today if your office confirms the grant is $12 million. Their reporter thinks the Governor said 12.5 at the podium. Could you email Pete this morning? Thank you, and thanks again for Thursday. Erin"}
  - {id: a5b-hannah-call, at: "D5 10:30", kind: noop, target: t5-hannah, minutes: 6, summary: "call with Hannah about Monday's KPRB prep and Modern Healthcare"}
  - {id: a5b-dana-note, at: "D5 11:12", kind: update, target: c5b-dana, summary: "wrote the case note for Dana's call",
     body: "Dana Corcoran (Ledger): the Hollis family and their attorney hold a news conference Monday 11/9 at 10 a.m. at the attorney's office. Asked if PBH will attend or respond: no one attending, statement stands, new questions to me. Asked if a lawsuit has been filed: we don't comment on legal matters. Asked if anyone met with the family: can't discuss any patient or family; Patient Relations is there for families. Escalating to Legal."}
  - {id: a5b-presser, at: "D5 11:25", kind: new, app: mail, path: sent/hollis-news-conference, target: m5b-presser, to: [c_steven, c_celeste, c_doug], cc: [c_gloria],
     subject: "Hollis family news conference Monday 10 a.m.", summary: "escalated the Hollis family's Monday news conference",
     body: "Steven, Celeste, Doug: Dana Corcoran says the Hollis family and their attorney will hold a news conference Monday at 10 a.m. at the attorney's office. She asked whether we'll attend or respond (I said no one will be there and our statement stands), whether a lawsuit has been filed (no comment on legal matters) and whether anyone has met with the family (can't discuss any patient or family). Recommendation: nobody attends; the approved statement is our only response unless Steven approves more; any new question goes to Steven first. Jules has the media line from 4:30 today through the weekend and Monday morning while I'm on Ruth's KPRB interview, so he'll need this. Gloria, copying you so you're not surprised. Erin"}
  - {id: a5b-rachel, at: "D5 11:30", kind: reply, target: t4b-rachel, to: [c_rachel], summary: "booked Hannah for Modern Healthcare",
     body: "Hi Rachel, Hannah Voss can talk Tuesday, Nov. 10, at 10 a.m. CT by phone, 20 minutes; I'll send the dial-in and join. Background: the release and fact sheet are at prairiebend.org/newsroom/kessler. Erin"}
  - {id: a5b-wrap, at: "D5 11:35", kind: noop, target: doc-teamcal, minutes: 30, summary: "Kessler wrap-up with Hannah and Mia"}
  - {id: a5b-jen-call, at: "D5 12:10", kind: noop, target: t1b-jen, minutes: 5, summary: "call with Jen about Saturday's clinic interviews"}
  - {id: a5b-maria, at: "D5 12:15", kind: new, app: mail, path: sent/maria-thanks-photo, target: m5b-maria, to: [c_maria], cc: [c_hannah],
     subject: "Thank you, and two questions", summary: "thanked Maria and asked about her photo and remarks",
     body: "Maria, thank you. You were the heart of Thursday, and of course you can share the KNEB clip; it's your story. Two questions, and no is a fine answer to either: (1) Marco took a photo of your family with the Governor (Mateo is at the edge of the frame, not a close-up). May we use it on our website and social media? (2) May we post the text of your remarks on our newsroom page with the other speakers'? Erin"}
  - {id: a5b-kelsey, at: "D5 13:00", kind: reply, target: t1b-kelsey, to: [c_kelsey], summary: "sent NHA the public materials for the legislature",
     body: "Hi Kelsey, happy to help. Everything here is public: the release and fact sheet at prairiebend.org/newsroom/kessler (48 beds; $64 million; PBH has no pediatric psychiatric beds today, and children who need inpatient care in southeast Nebraska are often sent out of state), and Dr. Ellison's remarks. Maria Garcia told her family's story publicly on Thursday (her son spent three weeks in a psychiatric hospital in Kansas City last year); please don't quote her in NHA materials until I've asked her, which I'm glad to do. Dr. Leah Morrow can talk with your team about the need. Erin"}
  - {id: a5b-flu-mtg, at: "D5 13:30", kind: noop, target: doc-teamcal, minutes: 20, summary: "flu clinic media planning with Jen Alvarado"}
  - {id: a5b-tom-note, at: "D5 14:25", kind: update, target: c5b-tom, summary: "wrote the case note for KLKN's call",
     body: "KLKN 8 (Tom Albers) asked to be connected with a family whose child is a current patient waiting for a psychiatric bed: declined, we can't connect reporters with current patients or families. Offered Dr. Leah Morrow (bed shortage in general) and to ask Maria Garcia. Deadline 4 p.m.; promised a callback by 2:45."}
  - {id: a5b-morrow, at: "D5 14:28", kind: new, app: mail, path: sent/morrow-klkn-friday, target: m5b-morrow-klkn, to: [c_morrow],
     subject: "KLKN today: children's mental health in general", summary: "asked Dr. Morrow to do KLKN",
     body: "Dr. Morrow, KLKN 8 (Tom Albers) is doing a piece tonight on children's mental health and the bed shortage, deadline 4 p.m. Could you do 10 minutes at 3:30, in person or by Zoom? He asked to talk to a family with a child in the hospital now, which we declined, so he may ask you about current patients: 'I can't talk about any patient, but what families tell us is...' works. Same three messages and 988. Erin"}
  - {id: a5b-maria-klkn, at: "D5 14:32", kind: reply, target: m5b-maria, to: [c_maria], summary: "asked Maria whether she'd talk to KLKN",
     body: "Maria, one more, with no pressure at all: KLKN would like to talk with you for a piece tonight on children's mental health. Totally fine to say no. Erin"}
  - {id: a5b-maria-ok, at: "D5 14:48", kind: reply, target: m5b-maria, to: [c_maria], summary: "told Maria it's fine to decline",
     body: "Completely OK, Maria. You've done more than enough, and thank you for the yes on the photo and the remarks. Erin"}
  - {id: a5b-tom-call, at: "D5 14:50", kind: noop, target: c5b-tom, minutes: 4, summary: "called Tom back: Dr. Morrow at 3:30 by Zoom; Maria declined"}
  - {id: a5b-doug, at: "D5 15:00", kind: noop, target: doc-teamcal, minutes: 30, summary: "1:1 with Doug"}
  - {id: a5b-board, at: "D5 15:40", kind: reply, target: t5b-celeste, to: [c_celeste], cc: [c_doug], summary: "sent Celeste five lines for the board chair",
     body: "Celeste, five lines:\n1. The Kessler announcement drew 18 stories with an estimated audience of 591,000, including AP (picked up by more than 40 sites) and Becker's nationally; 15 positive, 3 neutral, none negative.\n2. Every story carried the $20 million gift; one outlet misreported the state grant and corrected it online Friday.\n3. Five of the 18 also referenced the Ledger's ER story; our approved statement was used accurately and we added no comment on the patient, the claim or personnel.\n4. Social and web: 2,300 Facebook reactions on the announcement and 8,400 newsroom page views on Thursday.\n5. Ahead: the Hollis family holds a news conference Monday at 10; Legal's guidance is no attendance and the statement only. Erin"}
  - {id: a5b-thanks, at: "D5 15:50", kind: new, app: mail, path: sent/thanks-morrow-nguyen, target: m5b-thanks, to: [c_morrow], cc: [c_nguyen],
     subject: "Thank you", summary: "thanked Dr. Morrow (and Dr. Nguyen) for their interviews",
     body: "Dr. Morrow, thank you for KNEB yesterday and KLKN today, on two days' notice and your first time on TV; you were clear and kind, and you handled the ER question exactly right. KNEB has already asked about a December piece on holiday stress and kids, if you're open to it. Dr. Nguyen, thank you again for Monday's KNEB interview. Erin"}
  - {id: a5b-aiden, at: "D5 16:00", kind: reply, target: t1b-aiden, to: [c_aiden], summary: "offered the student an interview time",
     body: "Hi Aiden, sorry for the slow reply, it was a big week. I'd be glad to: how about Thursday, Nov. 12, at 2 p.m., 20 minutes by phone or Zoom? Happy to talk about hospital media relations in general; I won't be able to discuss any patient or current news matters. Erin Mathers"}
  - {id: a5b-kyle, at: "D5 15:20", kind: reply, target: t1-kyle, to: [c_kyle], summary: "told Kyle where to archive the livestream",
     body: "YouTube is fine: archive the full stream there and link it from the newsroom page."}
