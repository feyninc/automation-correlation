# Friday 2026-11-06. Coverage: 18 announcement stories, one with the wrong grant figure; the ER story runs alongside
# in five of them. Thanks to the donor and the Governor's office. Marketing wants employee five-star reviews and an
# influencer filming in urgent care. A community coalition asks for a listening session. Doug wants a pitch calendar.
# The Pulse item is due at 2; the media-line handoff to Jules at 4:30.
#
# Arithmetic: announcement coverage 18 stories = 9 TV (432,000) + 5 print/online (111,000) + 4 radio (48,000) =
# 591,000; 15 positive, 3 neutral, 0 negative; 5 of the 18 also mention the ER story.

