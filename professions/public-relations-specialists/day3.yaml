actions:
  - {at: "D3 08:32", kind: read, target: t3-dana, summary: "received Dana's signed embargo agreement"}
  - {id: a3-gov, at: "D3 08:55", kind: edit, target: doc-release, summary: "added the Governor's corrected quote",
     content: "# EMBARGOED UNTIL 10 A.M. CT THURSDAY, NOV. 5, 2026 (final)\n\n## Kessler family gives $20 million toward children's behavioral health hospital\n\nLINCOLN, Neb. -- The Kessler Family Foundation has given $20 million to Prairie Bend Health toward a $64 million, 48-bed psychiatric hospital for children and adolescents, the largest gift in the system's 110-year history.\n\nThe Kessler Children's Behavioral Health Hospital will be built on the Prairie Bend Medical Center campus and is expected to open in 2029. Funding includes the Kessler gift, a $12 million grant from the state, $28 million from PBH and $4 million from other donors.\n\n\"My father grew up in Beatrice and never forgot how far families had to go for help. Our family is proud to help bring this care home,\" said Ruth Kessler, a trustee of the Kessler Family Foundation.\n\n\"Every Nebraska child deserves care close to home. This $12 million state investment will keep families together while their kids get well,\" said Gov. Patricia Hartley.\n\n\"Nebraska families wait too long, and travel too far, for psychiatric care for their children,\" said Dr. Raymond Ellison, PBH president and CEO. \"This gift changes that.\"\n\nToday, children who need inpatient psychiatric care in southeast Nebraska are often sent out of state; PBH has no pediatric psychiatric beds."}
  - {id: a3-dana, at: "D3 09:00", kind: reply, target: t3-dana, to: [c_dana], summary: "sent Dana the embargoed release",
     body: "Thanks, Dana. Embargoed release attached (embargo lifts Thursday, Nov. 5, 10 a.m. CT). See you at 1. Erin", att: [doc-release]}
  - {at: "D3 09:00", kind: noop, target: doc-embargo-log, summary: "embargoed briefing: Prairie Business Journal"}
  - {at: "D3 09:35", kind: read, target: doc-sprout, summary: "checked the Sprout schedule"}
  - {id: a3-sprout, at: "D3 09:45", kind: reply, target: t3-priya, to: [c_priya], summary: "caught the Sprout time-zone problem",
     body: "Priya, the Sprout profile is set to Eastern, so 10:00 AM there is 9:00 a.m. our time, an hour before the embargo lifts. Can you switch the profile to Central (or reschedule to 11:00 AM ET) and send me a screenshot? Copy looks good."}
  - {at: "D3 10:00", kind: noop, target: doc-embargo-log, summary: "embargoed briefing: KPRB"}
  - {at: "D3 11:00", kind: noop, target: doc-embargo-log, summary: "embargoed briefing: AP"}
  - {at: "D3 11:20", kind: read, target: t3-doug, summary: "read Doug's request for an options memo"}
  - {id: a3-options, at: "D3 12:40", kind: new, app: mail, path: sent/options-memo-thursday, target: m3-options, to: [c_celeste], cc: [c_doug],
     subject: "Options: Thursday's announcement and the Ledger ER story", summary: "sent Celeste the options memo",
     body: "Celeste, three options for your and Dr. Ellison's decision. (1) Proceed at 10 a.m. as planned: the Governor, donor and four embargoed outlets are set; the ER story and the gift will share coverage, and Dr. Ellison will likely be asked about the ER, so the Q&A gets the approved statement language. Risk: 'hospital celebrates while family grieves' framing. (2) Proceed, and have Dr. Ellison acknowledge ED pressures in one line in his remarks without referring to any patient: shows awareness; needs Legal's OK on the wording. (3) Postpone: needs the Governor's office and the Kesslers today, breaks embargo arrangements with four outlets, and the ER story runs anyway with 'announcement postponed' as a second story. My recommendation for discussion: option 1 or 2. Erin"}
  - {at: "D3 12:05", kind: read, target: t3-frank, summary: "read Frank's approved union line"}
  - {id: a3-qa, at: "D3 13:10", kind: edit, target: doc-qa, summary: "added the ER and union questions to the Q&A",
     content: "# Q&A for Dr. Ellison and Hannah Voss (v5, 11/4)\n\nQ: How much will it cost? A: $64 million: the $20 million Kessler gift, a $12 million state grant, $28 million from PBH and $4 million from other donors.\nQ: When will it open? A: 2029.\nQ: How will you staff it when you can't staff the ER? A: We're hiring: 22 new emergency nurses since July, travel nurses for the season, a second evening triage nurse. About 11.9% of our ED nursing positions are open today, and we'll recruit and train specialized pediatric behavioral health staff starting in 2027.\nQ: Why children's behavioral health? A: Demand has doubled since 2019; families travel out of state.\nQ: The Ledger reports a woman died after a long ER wait. Your response? A (approved statement only): Federal privacy law doesn't allow us to confirm whether someone was a patient or discuss their care. We take every concern seriously, and when a concern is raised we review it carefully. Then bridge to ED facts: 6,840 October visits, 34-minute median to a provider, 22 new ED nurses.\nQ: Is the hospital being sued? Settling? A: We don't comment on legal matters.\nQ: Nurses rallied yesterday. Your response? A (Labor Relations): We respect our nurses' right to express their views. We are bargaining in good faith and hope to reach an agreement before the contract expires Dec. 31.\nQ: Was anyone disciplined? A: We don't discuss personnel matters."}
  - {id: a3-remarks, at: "D3 13:30", kind: edit, app: docs, path: announcements/kessler-gift/ceo-remarks, target: doc-remarks, title: Dr. Ellison's remarks (draft for CEO prep),
     summary: "drafted the CEO's remarks",
     content: "# Remarks: Dr. Raymond Ellison, Thursday, Nov. 5 (about 4 minutes)\n\nGood morning, and thank you for being here: Gov. Hartley, Ruth Kessler and the Kessler family, the Garcia family, and our caregivers.\n\nToday, when a child in southeast Nebraska needs inpatient psychiatric care, we have to send them away, often out of state. Families drive hours to visit a child in crisis. That is not the care Nebraska's children deserve.\n\nThanks to the Kessler Family Foundation's $20 million gift, the largest in our 110-year history, and a $12 million investment from the state, that is going to change. The Kessler Children's Behavioral Health Hospital will have 48 beds, right here on this campus, when it opens in 2029. With $28 million from Prairie Bend Health and $4 million from other donors, the $64 million project is fully funded.\n\n[Garcia family story: 90 seconds, Maria Garcia]\n\nI also want to recognize the people who make every part of this hospital work, including our emergency department, which is busier than ever. Our caregivers are the reason families trust us, and we will keep investing in them.\n\nRuth, thank you. Governor, thank you. Let's bring this care home."}
  - {id: a3-remarks-note, at: "D3 13:35", kind: reply, target: t3-doug, to: [c_doug], summary: "sent Doug the remarks and Q&A for the 2 p.m. prep",
     body: "Remarks draft and Q&A v5 are in Docs for the 2 p.m. prep. The remarks have one optional line on the ED (option 2 in my memo), no patient reference; cut it if Celeste picks option 1. Q&A now has the Ledger, legal, union and personnel questions with approved language only."}
  - {at: "D3 13:00", kind: noop, target: doc-embargo-log, summary: "embargoed briefing: The Prairie Ledger"}
  - {id: a3-statement, at: "D3 13:40", kind: reply, target: t1-dana, to: [c_dana], summary: "sent Dana the approved statement",
     body: "Dana, our statement, attributable to Prairie Bend Health: \"Federal privacy law does not allow us to confirm whether someone was a patient or to discuss anyone's care without their authorization. We take every concern about care seriously, and when a concern is raised we review it carefully. Our emergency department is busier than ever: 6,840 visits in October, up 9% from a year ago. In October, the median time from arrival to being seen by a provider was 34 minutes. Since July we have hired 22 emergency nurses, added six travel nurses for respiratory season and, since Oct. 15, added a second triage nurse on evening shifts. Like hospitals across the country, we are still recruiting: 14 of our 118 emergency nursing positions are open. Anyone with a concern about their care or a family member's care can contact Patient Relations at 402-555-0190.\" Erin"}
  - {at: "D3 12:35", kind: read, target: t3-kyle, summary: "read Kyle's fact board request"}
  - {id: a3-factboard, at: "D3 13:50", kind: reply, target: t3-kyle, to: [c_kyle], summary: "sent Kyle the fact board text",
     body: "Fact board (3 lines): 'Kessler Children's Behavioral Health Hospital' / '48 beds for Nebraska's children and teens | Opening 2029' / '$20 million Kessler Family Foundation gift | $12 million State of Nebraska | $64 million project'."}
  - {at: "D3 14:00", kind: noop, target: cal-erin, summary: "CEO prep with Dr. Ellison, Celeste and Doug"}
  - {at: "D3 15:51", kind: noop, target: c3-wkln, summary: "took WKLN's call from the rally"}
  - {id: a3-victor, at: "D3 16:30", kind: reply, target: t3-victor, to: [c_victor], summary: "declined to comment on a claim",
     body: "Hi Victor, we don't comment on legal matters. Our statement on the emergency department is below, and I'm happy to get you ED volume and staffing figures for your brief. [statement] Erin"}
  - {id: a3-comments, at: "D3 16:55", kind: reply, target: t3-priya, to: [c_priya], summary: "advised Priya not to hide critical comments",
     body: "Let's not hide critical comments: it looks like we're silencing the family and people screenshot it. Hide only what breaks our posted community rules (threats, slurs, spam, someone's private health information). For ER comments, reply once per thread with the approved line and Patient Relations' number, and send me anything from a reporter or the family."}
  - {id: a3-hannah, at: "D3 10:35", kind: reply, target: t3-hannah, to: [c_hannah], summary: "gave Hannah a line for Ruth",
     body: "Hannah, Ruth doesn't need to answer it at all; it's a hospital question. Suggested line: 'That's a question for the hospital. I'm here because our family wants children to get care close to home.' Then back to her father's story. Dr. Ellison will take any ER question. I'm happy to do a 10-minute call with her this afternoon to practice."}
  - {id: a3-nate, at: "D3 11:55", kind: reply, target: t3-nate, to: [c_nate], summary: "gave Nate only what the Garcias agreed to",
     body: "Hi Nate, the Garcias agreed to share: Maria Garcia and her son Mateo, 14, of Lincoln, who spent three weeks in a psychiatric hospital in Kansas City last year because there were no beds in Nebraska. They asked us not to share his diagnosis. Maria will be available after the event. Erin"}

