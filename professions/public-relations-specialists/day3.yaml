# Wednesday 2026-11-04. Embargoed briefings (Victor 9, Kim 10, Nate 11, Dana 1). Dana signs at 08:30. The Governor's
# office fixes the grant figure. Sprout is set to Eastern time, which would post an hour before the embargo lifts.
# Legal, Privacy and the VP approve the Ledger statement for the 3 p.m. deadline. The VP asks for options on
# postponing Thursday. Labor Relations approves a union line for the 4 p.m. rally. CEO prep at 2 p.m. needs the
# remarks and the Q&A. A TV crew at the rally asks about a council member who opted out.
#
# Arithmetic: $64 million / 48 beds = $1.33 million a bed.

