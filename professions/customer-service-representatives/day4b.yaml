  - id: doc4b-v7-qref
    app: docs
    path: training/cancellations-v7-quick-reference
    title: Cancellations v7 quick reference
    at: "D4 08:40"
    author: c_jess
    content: |
      # Cancellations v7: quick reference (live 11/5 08:00, all states)

      1. Verify (PIN or OTP). A cancellation is a change to the account.
      2. Before any offer, say: "You can cancel at any time by telling me you want to cancel, and I'll take care of it on
         this call."
      3. At most one Offer Library offer, and only one that fits the reason (SAVE10 for price, SPEEDUP for speed on
         Fiber 300). No offer fits a move out of the area. If the customer says no, process it.
      4. Process it in the channel the customer used. Chat and email: put the sentence in your first reply.
      5. Final bill: prorated to the day, credited on the final bill. Gateway back within 30 days or $150.
      6. Voicemail requests: call back within one business day; note the voicemail time and the callback time.
  - id: doc4b-mnt
    app: docs
    path: noc/MNT-20261107-ALB2
    title: "Planned maintenance MNT-20261107-ALB2 (Albany)"
    at: "D4 13:45"
    author: c_kevin
    content: |
      # MNT-20261107-ALB2: planned maintenance, Albany segment ALB-2

      Window: Saturday 11/7 00:00-04:00 (overnight Friday into Saturday). Scope: replacing an aggregation switch serving
      ALB-2 (central and west Albany, about 2,300 customers). Impact: up to two interruptions of up to 30 minutes
      each inside the window. Home Phone, including 911, is unavailable during an interruption.
      Customers in ALB-2 were emailed on 11/5. This is planned work, not an incident. If it runs past 04:00, NOC opens
      an incident and posts it here.

