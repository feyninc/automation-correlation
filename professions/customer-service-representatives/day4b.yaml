      - [worker, "Thanks, Mr. Banerjee, you're verified, and your address is in the work area. It's planned for Saturday between midnight and 4 a.m., and you may see up to two interruptions of up to 30 minutes each in that window. During an interruption your Home Phone and 911 won't work, so keep a cell phone handy overnight."]
      - [c_tf_cliff, "Do we get a credit for it?", 4]
      - [worker, "No, outage credits are for confirmed outages of four hours or more, and this is planned work with short interruptions. If anything runs long, our network team opens an incident and credits apply by the usual rules."]
      - [c_tf_cliff, "Fair enough.", 2]

