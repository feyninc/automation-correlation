  - {id: a4b-macro, at: "D4 14:57", kind: edit, app: docs, path: team4/macros-cancellation-v7, target: doc4b-macro-v7, title: "Team 4 macro: cancellation (v7, chat and email)",
     summary: "drafted Team 4's v7 cancellation macro for chat and email",
     content: "# Cancellation reply (v7) - chat and email\n\nUse after you've verified (PIN, or OTP to the contact on file). Edit every bracket.\n\n## First reply\nHi [first name], thanks for letting us know. You can cancel at any time by telling us you want to cancel, and I can take care of it right here. [One Offer Library offer only if it fits the reason: SAVE10 for price, SPEEDUP for speed on Fiber 300. Skip it for moves out of the area.] Just reply with the date you'd like service to end.\n\n## Confirmation\nHi [first name], your service is scheduled to end on [date]. You've paid through [end of month], so the [N] days after that ([amount] = N x monthly price / 30) will be credited on your final bill. We'll email a prepaid box for your gateway; please send it back within 30 days of [date] to avoid the $150 equipment fee.\n\nNotes: process it in the channel the customer used; never ask them to call. Case note: verification method, statement given, offer and answer, end date, credit, equipment serial.\n"}
