calls:
  - id: c1-gary
    path: 2026-11-02/0901-gary-lindqvist
    title: Inbound call, Gary Lindqvist (bill went up)
    start: "D1 09:01:10"
    turns:
      - [c_gary, "Yeah hi, my bill this month is fifty-six bucks and it's always been thirty-six. What happened?", 5]
      - [worker, "I can look at that for you. Before I open the account, can you give me your six-digit account PIN?"]
      - [c_gary, "Uh, it's 4-1-8-2-2-0. Is that it? It's the one I set up when I signed up.", 6]
      - [worker, "Thank you, Mr. Lindqvist, you're verified. I see a twelve-month new-customer discount of twenty dollars that ended on October 31st. That's the difference: your plan is fifty-five dollars plus taxes and fees."]
      - [c_gary, "Nobody told me it was ending. Can you just keep the discount going?", 4]
      - [worker, "We did send a notice by email on October 1st, but I see we don't have an email on file, so you wouldn't have gotten it. I can't extend the promotion myself, but I can offer you ten dollars off a month for six months, or I can connect you with our loyalty team to look at other options."]
      - [c_gary, "Ten off for six months is fine. And put my email on there, it's gary.lindqvist@outlook.com.", 6]
      - [worker, "Done. I've added the ten-dollar discount starting with your December bill and I'll send a passcode to that email to confirm it. Anything else today?"]
      - [c_gary, "No, that's it. Thanks.", 3]
  - id: c1-doris
    path: 2026-11-02/0918-doris-whitaker
    title: Inbound call, Doris Whitaker (Home Phone and medical alarm)
    start: "D1 09:18:40"
    turns:
      - [c_doris, "Hello, this is Doris Whitaker. My son told me to call because there's going to be construction on our street and he's worried about my alarm.", 8]
      - [worker, "Of course, Mrs. Whitaker. Can I have your six-digit account PIN so I can open your account?"]
      - [c_doris, "Oh dear. I wrote it down. Here it is, 3-3-0-1-9-8.", 10]
      - [worker, "Thank you, you're verified. I see your medical alarm runs on your Home Phone line. What did your son hear about the construction?"]
      - [c_doris, "The city is digging on Fir Grove this week. If the internet goes out, does my alarm still work?", 8]
      - [worker, "That's a good question to ask. Your Home Phone runs over the fiber line, so if service goes out, the phone line and the alarm go out with it, including 911. Please keep your cell phone charged and nearby while they're digging. I'm putting a note on your account so you get a priority callback if there's ever an outage at your address."]
      - [c_doris, "Is there a battery or something so it keeps working?", 8]
      - [worker, "Your gateway doesn't have a battery backup. I can send a request to our technical team to see whether a backup battery unit is available for your alarm, and they'll call you about it. Would that help?"]
      - [c_doris, "Yes please, call me, not my son. Thank you, dear.", 6]
  - id: c1-kenji
    path: 2026-11-02/0941-kenji-mori
    title: Inbound call, Kenji Mori (slow Wi-Fi upstairs)
    start: "D1 09:41:05"
    turns:
      - [c_kenji, "Hi, it's Kenji Mori. The Wi-Fi in the upstairs office is still terrible. Somebody told me last week about an extender.", 6]
      - [worker, "Sorry it's still slow upstairs. For your security, I'll text a one-time passcode to the number on the account. Can you read it back to me?"]
      - [c_kenji, "Got it, 7-7-4-1-0-2.", 6]
      - [worker, "Thanks, you're verified. Your gateway shows online with full speed at the gateway, so the drop-off is the Wi-Fi reaching upstairs. An extender should fix that. The first Whole-Home Wi-Fi extender is free for twelve months, then eight dollars a month."]
      - [c_kenji, "Free for a year? OK, send one. Can you ship it to my work instead?", 6]
      - [worker, "I can only ship equipment to the service address, so it will go to 655 Cherry Ave. It should arrive in three to five business days with setup instructions."]
      - [c_kenji, "Fine. Thanks.", 3]
  - id: c1-frank
    path: 2026-11-02/1105-frank-ruiz
    title: Inbound call, Frank Ruiz (past due, payment arrangement)
    start: "D1 11:05:30"
    turns:
      - [c_frank, "Hi, Frank Ruiz. I got a bill for a hundred and twenty-three dollars and there's a late fee. I lost some hours at work. I can't pay it all right now.", 6]
      - [worker, "I'm sorry to hear that, Mr. Ruiz, let's see what we can do. Can I have your six-digit account PIN?"]
      - [c_frank, "1-1-8-4-0-7.", 5]
      - [worker, "Thank you, you're verified. Your October bill of fifty-six sixty-two wasn't paid, so there's a ten-dollar late fee and the November bill, for one hundred twenty-three twenty-four in total, due November 18th."]
      - [c_frank, "Can you split it up? I get paid the 13th and the 27th.", 5]
      - [worker, "Yes. I can waive the ten-dollar late fee once, which brings it to one hundred thirteen twenty-four, and set up two payments: fifty-six sixty-two on November 13th and fifty-six sixty-two on November 27th. That keeps your service on. Does that work?"]
      - [c_frank, "Yeah, that works. Do I need to call back to pay?", 5]
      - [worker, "You can pay each one in the app or by phone with our secure payment line. I'll text you a reminder link before each date."]
      - [c_frank, "OK, great, thanks.", 3]
  - id: c1-unverified
    path: 2026-11-02/1131-caller-for-doris
    title: Inbound call, caller asking about Doris Whitaker's account
    start: "D1 11:31:00"
    turns:
      - [c_ben, "Hi, I'm calling about my mother's account, Doris Whitaker. I need to know if her alarm line has had any outages this month and what calls she made.", 6]
      - [worker, "I can help with that. Are you listed on her account? I'll need the account PIN or a passcode sent to the contact on file."]
      - [c_ben, "I'm her son. I don't have the PIN. She's 81, she can't deal with this. Just tell me if there were outages and the calls.", 4]
      - [worker, "I understand, and I'm sorry this is hard. I can't share account details without verification. I can send a one-time passcode to the phone number on her account, or you can call together with her. I can tell you there were no network outages reported in her area this month."]
      - [c_ben, "Fine, I'll call with her later.", 3]

