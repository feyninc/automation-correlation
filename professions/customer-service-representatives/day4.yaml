calls:
  - id: c4-walter
    path: 2026-11-05/0821-walter-kim
    title: Inbound call, Walter Kim (cancel, price)
    start: "D4 08:21:00"
    turns:
      - [c_walter, "Good morning. I want to cancel my internet. It's too expensive for what I use it for.", 5]
      - [worker, "Good morning, Mr. Kim, I can help with that. First I need to verify the account: what's your six-digit PIN?"]
      - [c_walter, "7-3-0-6-1-4.", 5]
      - [worker, "Thank you, you're verified. You can cancel at any time by telling me you want to cancel, and I'll take care of it on this call. Before I do: you're on our 1 Gig plan at seventy-five dollars, and you use about sixty gigabytes a month, mostly light use. Our Fiber 300 plan is fifty-five dollars and is plenty for that. Would that help, or would you still like to cancel?"]
      - [c_walter, "Fifty-five. Hm. Yes, that's better. Let's do that.", 6]
      - [worker, "Done. I've moved you to Fiber 300 at fifty-five dollars a month starting with your December bill; your speed changes tonight. No equipment change is needed."]
      - [c_walter, "Good. Thank you, young lady.", 3]
  - id: c4-ruth
    path: 2026-11-05/0904-ruth-engel
    title: Inbound call, Ruth Engel (911 charge twice)
    start: "D4 09:04:00"
    turns:
      - [c_ruth, "Hello, I'm looking at my bill and it has a 911 charge on it twice. Seventy-five cents twice.", 5]
      - [worker, "Let me check that for you, Mrs. Engel. May I have your account PIN?"]
      - [c_ruth, "Oh dear. Is it 1-9-4-4-0-2?", 6]
      - [worker, "Yes, thank you, you're verified. You're right, it's on there twice. That happened on about a thousand Home Phone bills this month, and our billing team will take the extra seventy-five cents off automatically on November 9th. It doesn't change your due date, and you don't need to do anything."]
      - [c_ruth, "Well, all right. Thank you for explaining.", 4]
  - id: c4-tanya
    path: 2026-11-05/1018-tanya-brooks
    title: Inbound call, Tanya Brooks (calls to Jamaica)
    start: "D4 10:18:00"
    turns:
      - [c_tanya, "Hi, it's Tanya Brooks, I left a message this morning. I have thirty-eight dollars of calls to Jamaica on my bill.", 5]
      - [worker, "Hi Tanya, thanks for calling back. Can I have your PIN so I can open the account?"]
      - [c_tanya, "5-5-0-3-1-8.", 5]
      - [worker, "Thanks, you're verified. I see three calls in October to two numbers starting with 876, for sixty-four minutes. Do you remember calling them?"]
      - [c_tanya, "I got missed calls from those numbers, it rang once and stopped. I thought 876 was a US area code, so I called back and got hold music for ages.", 6]
      - [worker, "That sounds like a one-ring scam. 876 is Jamaica, even though it looks like a US number, and those calls are billed as international. Please don't call back numbers like that. I can't take the full amount off myself, so I'm sending it to our billing team today to review a credit for the thirty-eight forty; they'll contact you within one business day."]
      - [c_tanya, "OK. Can you stop it happening again?", 4]
      - [worker, "Yes. I can add a free block on international and Caribbean calls from your Home Phone; it stops calls to 876 and similar codes. Should I turn it on?"]
      - [c_tanya, "Yes please.", 3]
      - [worker, "It's on now. You can still call anywhere in the US and Canada."]
  - id: c4-amara
    path: 2026-11-05/1302-amara-okafor
    title: Inbound call, Amara Okafor (someone called asking for her PIN)
    start: "D4 13:02:00"
    turns:
      - [c_amara, "Hi. Someone called me last night saying they were Northbeam, that I was getting an outage refund, and they asked for my PIN. I gave it to them. Then I got a text with a code and I got suspicious and hung up. Was that you?", 6]
      - [worker, "Thank you for calling, Ms. Okafor. That wasn't us: we never call and ask for your PIN or a code. Because your PIN may be known, I'll verify you another way. I'm sending a code to the phone number on your account now; can you read it to me?"]
      - [c_amara, "It's 8-1-4-2-6-0.", 8]
      - [worker, "Thank you, you're verified. Someone called us yesterday at 5:41 using your PIN and tried to change your email. It needed the code we texted you, so nothing was changed. Let's set a new PIN now; please choose six digits you haven't used before."]
      - [c_amara, "OK. 3-0-7-7-5-9.", 6]
      - [worker, "Your new PIN is set. I'm also passing this to our account security team so they can watch your account. If anyone calls claiming to be us, hang up and call the number on your bill."]
  - id: c4-mike
    path: 2026-11-05/1340-mike-ostrowski
    title: Inbound call, Mike Ostrowski (wants to split a past-due balance)
    start: "D4 13:40:00"
    turns:
      - [c_mike, "Hey, I'm behind on my bill, I know. I can't do it all at once. Can you split it into three?", 5]
      - [worker, "Let's take a look. Can I have your PIN?"]
      - [c_mike, "2-6-6-0-1-9.", 5]
      - [worker, "Thanks, Mike, you're verified. You owe two hundred eighty dollars and forty-eight cents: October's bill, a ten-dollar late fee and November's. That's more than I can set up as an arrangement myself, so I'm sending it to our billing specialists, and they'll call you by tomorrow to set up the payments. Your service is not at risk before December 2nd."]
      - [c_mike, "Can you take the late fee off?", 4]
      - [worker, "I'm sorry, I can't: we waived one in March, and it's once a year. The billing specialist can look at it with the arrangement."]
      - [c_mike, "Alright.", 2]

