    title: Service area (counties)
    content: |
      # Northbeam Fiber service area

      Oregon: Marion, Polk, Yamhill, Linn, Benton and Lane counties (not every address; check serviceability in Beam360).
      Washington: Clark and Cowlitz counties. California: Siskiyou County.
      Not served: Portland metro (Multnomah, Washington, Clackamas), central and eastern Oregon, the coast.
  - id: doc-home-phone
    app: policies
    path: home-phone-features
    title: Home Phone features and international rates
    content: |
      # Home Phone features

      - Voicemail, caller ID, call waiting: included.
      - International and Caribbean call block: free. Blocks outbound calls to every international destination,
        including the +1 area codes billed at international rates (809, 829, 849 Dominican Republic; 876 Jamaica; 649
        Turks and Caicos; 284 British Virgin Islands; 473 Grenada; 268 Antigua; 664 Montserrat; 767 Dominica). A Tier 1
        rep may add or remove it after verification.
      - World 300: $5.00 a month for 300 minutes to 40 countries (list in Beam360).

      | Destination | Per minute |
      | --- | --- |
      | Canada | included |
      | Mexico | $0.03 |
      | India | $0.04 |
      | Philippines | $0.15 |
      | Dominican Republic | $0.25 |
      | Jamaica (mobile) | $0.60 |
