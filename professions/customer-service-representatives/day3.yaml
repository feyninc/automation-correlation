calls:
  - id: c3-greg
    path: 2026-11-04/1003-greg-halvorsen
    title: Inbound call, Greg Halvorsen (credit for KZN-3)
    start: "D3 10:03:00"
    turns:
      - [c_greg, "Hi, I was out from yesterday morning till this morning on Wheatland. I want my credit put on now, I don't trust it'll happen.", 5]
      - [worker, "I understand, Mr. Halvorsen. Let me open your account first. Can you give me your PIN?"]
      - [c_greg, "8-8-1-2-4-4.", 5]
      - [worker, "Thank you, you're verified. Your outage ran from 6:42 yesterday to 9:52 this morning, so that's two days of credit for your internet and your Home Phone, five dollars in total. As of this morning those credits are applied automatically in Friday's batch, so you'll see them on your December statement."]
      - [c_greg, "Five dollars. OK. And if it doesn't show up?", 5]
      - [worker, "Then call us after Friday and we'll send it to billing to correct. I've noted the amount on your account."]
  - id: c3-vera
    path: 2026-11-04/1110-vera-castellanos-callback
    title: Outbound callback, Vera Castellanos (cancellation, California)
    start: "D3 11:10:00"
    turns:
      - [worker, "Hi, may I speak with Vera Castellanos? This is Marisol from Northbeam Fiber returning your call about your account."]
      - [c_vera, "Yes, this is Vera. Thank you for calling back.", 6]
      - [worker, "Before I can make changes I need to verify you. I'll text a passcode to this number, can you read it to me?"]
      - [c_vera, "Just a moment. It says 2-0-9-9-1-4.", 10]
      - [worker, "Thank you, you're verified. You said you'd like to cancel at the end of the month. You can cancel at any time by telling me you want to cancel, and I can take care of it on this call. Before I do, would a lower price change your mind? I could take ten dollars off for six months."]
      - [c_vera, "No, dear, I'm moving to my daughter's. Please just cancel it for November 30th.", 8]
      - [worker, "Of course. I've scheduled the cancellation for November 30th. Your November bill is already paid, and service is billed in advance, so there's nothing more to pay. We'll email you a prepaid box to return the gateway; please send it back within 30 days of the 30th so there's no equipment fee."]
      - [c_vera, "Thank you, you've been very kind.", 6]
  - id: c3-ivy-call
    path: 2026-11-04/1545-ivy-tran
    title: Inbound call, Ivy Tran (credit amount)
    start: "D3 15:45:00"
    turns:
      - [c_ivy, "Hi, I sent a chat earlier. I just want to know how much my outage credit will be.", 5]
      - [worker, "Of course. Can I have your PIN first?"]
      - [c_ivy, "6-2-2-9-0-3.", 5]
      - [worker, "Thanks, Ivy, you're verified. You were out about seven hours yesterday, which is one day of credit on your 2 Gig plan: three seventeen. It'll be applied automatically on Friday and show on your December statement."]
      - [c_ivy, "Only three dollars? My neighbor got five.", 4]
      - [worker, "Credits depend on the plan and how long each address was out. Some areas north of Chemawa were out until this morning, so they get two days."]

