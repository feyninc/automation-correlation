    content: |
      # INC-20261103-0042: feeder fiber cut, north Keizer

      Status: resolved. KZN-1 and KZN-2 restored Tuesday 11/3 at 13:35. KZN-3 (north of Chemawa Rd) restored
      Wednesday 11/4 at 09:52 after a new splice case. Customers in KZN-3 still down: restart the gateway, then a Tier 2
      Technical ticket.
