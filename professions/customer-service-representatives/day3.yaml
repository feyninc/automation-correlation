    app: policies
    path: incident-credits-INC-20261103-0042
    title: Outage credits for INC-20261103-0042 (Billing Operations)
    at: "D3 09:45"
    author: c_wendy
    content: |
      # Outage credits for INC-20261103-0042

      - Credits for this incident are calculated by Billing Operations from the restoration times in the incident
        record and applied automatically in Friday's batch (11/6). They show on the December statement.
      - From 10:00 today, do not apply manual outage credits for this incident in Beam360.
      - If a customer says their credit is wrong after Friday's batch, submit the Credit Correction Form (Docs >
        billing-ops > credit-correction-form) with the account, segment, restoration time, the credit applied and the
        credit expected. Billing Operations reviews within 2 business days.
      - Customers who already got a manual credit before 10:00 today: the batch will not credit them again.
