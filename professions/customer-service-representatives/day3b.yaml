# Wednesday 2026-11-04 at volume. KZN-3 is still down until 09:52; the first three hours are "is it still 10?",
# medical-alarm and straggler calls, then credit questions under Billing Ops' 09:45 rule (automatic in Friday's batch,
# no manual credits from 10:00). 30 more live calls (33 for the day), an outbound callback or two, the smishing text that
# rides on the outage, a California cancellation, two moves, Home Phone call detail without a PIN. Digital block
# 14:00-15:00 (with Ivy's chat), QA calibration 15:00-15:45 (phones paused), lunch 12:15-12:45.
#
# Outage credit arithmetic (Outage Credits v3: monthly charge / 30 per started 24 h, internet and Home Phone separately,
# each rounded to the cent). KZN-1/2 out 06:42-13:35 Tue = 6 h 53 min -> 1 day; KZN-3 06:42 Tue to 09:52 Wed =
# 27 h 10 min -> 2 days.
#   Lam (KZN-1, Fiber 300 + Home Phone, 1 day): 1.83 + 0.67 = $2.50.
#   Oduya (KZN-2, 1 Gig + Home Phone, 1 day): 2.50 + 0.67 = $3.17.  Cruz (KZN-2, 300 + Home Phone, 1 day): $2.50.
#   Bellini (KZN-3, 2 Gig + Home Phone, 2 days): 6.33 + 1.33 = $7.66 (Omar asks the same case in #team4).
#   Szabo (KZN-3, 300 + Home Phone + an $8 extender, 2 days): 3.67 + 1.33 = $5.00; the extender is not credited.
#   Tess Navarro (KZN-3, 2 Gig, 2 days): $6.33.  Ruano (KZN-3, 1 Gig, 2 days): $5.00.  Amato (KZN-3, 300, 2 days): $3.67.
#   Larkin (KZS-1): not in the incident, no outage credit.
# Other arithmetic:
#   Mercer (CA, Fiber 300, billed in advance) cancels effective 11/24: 11/25-11/30 = 6 days x $55.00/30 = $11.00.
#   Petty (KZN-3, Fiber 1 Gig) cancels effective 11/4: 11/5-11/30 = 26 days x $2.50 = $65.00; outage credit separately.
#   Dizon: about 200 minutes a month to the Philippines x $0.15 = $30.00; World 300 is $5.00 for 300 minutes.
#   Moyer: October paid 11/3, $10.00 late fee posted 11/2; first in 12 months, so waived: November $77.21 remains.
#   Cárdenas: two payments of $56.62 on 10/30 (PMT-7790415 app, PMT-7790422 phone IVR); refund $56.62.

