# Tuesday 2026-11-03. At 06:42 a contractor boring for a water main cuts Northbeam's feeder fiber on River Rd N in
# Keizer. About 4,800 customers in north Keizer lose internet and Home Phone. NOC posts an ETR of 11:00, revises it to
# 14:00, and at 13:40 says segment KZN-3 (north of Chemawa Rd) needs a new splice case and won't be back until
# Wednesday 10:00. Digital blocks are cancelled; everyone is on phones.

