documents:
  - id: doc-incident
    app: docs
    path: noc/INC-20261103-0042
    title: "Incident INC-20261103-0042: fiber cut, north Keizer"
    versions:
      - at: "D2 07:05"
        author: c_kevin
        content: |
          # INC-20261103-0042: feeder fiber cut, north Keizer

          Status: confirmed. Cause: third-party boring damage on River Rd N at 06:42.
          Affected: about 4,800 internet and Home Phone customers, segments KZN-1, KZN-2, KZN-3 (Keizer north of
          Lockhaven Dr; map in the outage tool). Home Phone and 911 are down for affected Home Phone customers.
          ETR: 11:00.
      - at: "D2 10:20"
        author: c_kevin
        content: |
          # INC-20261103-0042: feeder fiber cut, north Keizer

          Status: crews splicing. Affected: about 4,800 customers, segments KZN-1, KZN-2, KZN-3.
          ETR revised: 14:00 (the cut is longer than first reported; 288-count cable).
          Home Phone and 911 are down for affected Home Phone customers.
      - at: "D2 13:40"
        author: c_kevin
        content: |
          # INC-20261103-0042: feeder fiber cut, north Keizer

          Status: KZN-1 and KZN-2 restored at 13:35. KZN-3 (north of Chemawa Rd, about 1,150 customers) needs a new
          splice case; ETR Wednesday 11/4 10:00. Customers in KZN-3 who need it can ask for a free mobile hotspot
          pickup at the Keizer store (River Rd N) until 19:00 today.
