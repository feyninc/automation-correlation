calls:
  - id: c2-jordan
    path: 2026-11-03/0811-jordan-mehta
    title: Inbound call, Jordan Mehta (outage, KZN-3)
    start: "D2 08:11:00"
    turns:
      - [c_jordan, "Finally. I've been on hold twenty minutes. My internet has been dead since before seven and I have a client deadline today. When is it coming back?", 4]
      - [worker, "I'm really sorry, Jordan, both for the outage and the wait. Let me pull up your account. Can I have your PIN?"]
      - [c_jordan, "1-9-3-3-0-5. So when?", 4]
      - [worker, "Thank you, you're verified. Your address is in the area of a fiber cut in north Keizer this morning; a contractor hit our main cable at 6:42. Repair crews are on it and our network team's current estimate is 11 a.m."]
      - [c_jordan, "That's ridiculous. I'm paying for this. I want a free month.", 3]
      - [worker, "I understand. I can't give a free month, but you will get an outage credit: for an outage of four hours or more, one day of your service for each 24 hours, and from tomorrow those are applied automatically after service is back."]
      - [c_jordan, "One day. Great. Fine.", 3]
  - id: c2-lou
    path: 2026-11-03/0838-lou-brenner
    title: Inbound call, Lou Brenner (Home Phone down, medical alarm)
    start: "D2 08:38:20"
    turns:
      - [c_lou, "Hello? I'm calling from my daughter's cell. My home phone has no dial tone and my wife has one of those medical alert buttons on it.", 8]
      - [worker, "Thank you for calling. I can help. Can you give me your account PIN?"]
      - [c_lou, "Yes, 7-2-2-0-6-1.", 8]
      - [worker, "Thank you, Mr. Brenner, you're verified. There's a fiber cut in north Keizer and your area is affected, so your Home Phone and the alert button won't work until it's repaired, and that includes 911. Please keep a cell phone with your wife until then."]
      - [c_lou, "Oh no. When will it work?", 8]
      - [worker, "The current estimate is 11 a.m. I'm putting you on our priority callback list, so a technician calls you on this cell number as soon as your line is back. What's the best number?"]
      - [c_lou, "This one, my daughter's, 503-555-0177.", 8]
  - id: c2-tess
    path: 2026-11-03/1045-tess-navarro
    title: Inbound call, Tess Navarro (asks for an ETR)
    start: "D2 10:45:00"
    turns:
      - [c_tess, "Hi, I'm in Keizer by Chemawa. The guy at nine o'clock told me eleven. Is it still eleven?", 5]
      - [worker, "Let me check that for you. Can I have your account PIN first?"]
      - [c_tess, "Sure, 5-5-0-8-1-2.", 5]
      - [worker, "Thanks, Tess, you're verified. I'm sorry, the network team updated the estimate at 10:20: it's now 2 p.m. The cut turned out to be longer than first reported."]
      - [c_tess, "Ugh. OK, thanks for being straight with me.", 3]
  - id: c2-harold
    path: 2026-11-03/1112-harold-price
    title: Inbound call, Harold Price (wants a technician)
    start: "D2 11:12:30"
    turns:
      - [c_harold, "My phone and internet are out on Shoreline Drive. I want a technician to come out today.", 5]
      - [worker, "I'm sorry about that, Mr. Price. Can I have your account PIN?"]
      - [c_harold, "My wife set it up. Carol. It's 2-9-1-1-0-0.", 6]
      - [worker, "Thank you, you're verified. Your address is in the outage from this morning's fiber cut; a technician at your house wouldn't fix it because the damage is on the main cable. The estimate is 2 p.m."]
      - [c_harold, "So nobody's coming?", 4]
      - [worker, "Not to your house, because the repair is at the cut. If your service isn't back after the area is restored, call us and we'll test your line and send someone."]
  - id: c2-sam
    path: 2026-11-03/1425-sam-whitfield
    title: Inbound call, Sam Whitfield (KZN-3 still down)
    start: "D2 14:25:00"
    turns:
      - [c_sam, "It's after two and my internet is still out, Wheatland Road. My neighbor across Chemawa has theirs back.", 5]
      - [worker, "I'm sorry, Sam. Let me look. Can I have your PIN?"]
      - [c_sam, "4-4-7-1-9-0.", 5]
      - [worker, "Thanks, you're verified. Your part of Keizer, north of Chemawa Road, needs a new splice case, so the network team expects it back tomorrow at 10 a.m. Your neighbor is in the part that came back at 1:35."]
      - [c_sam, "Tomorrow? I work from home. What am I supposed to do?", 4]
      - [worker, "I'm sorry. You can pick up a free mobile hotspot at our Keizer store on River Road until 7 tonight. Your outage credit will apply automatically once service is back."]
      - [c_sam, "Fine, I'll go get one.", 3]
  - id: c2-nina
    path: 2026-11-03/1505-nina-okoro
    title: Inbound call, Nina Okoro (slow, not in outage)
    start: "D2 15:05:10"
    turns:
      - [c_nina, "Hi, I live on Dearborn in Keizer. My internet is super slow today. Is that the outage?", 5]
      - [worker, "Let me check. Can I have your PIN?"]
      - [c_nina, "Sure, 6-0-3-3-7-1.", 5]
      - [worker, "Thanks, Nina, you're verified. Your address isn't in the outage area, and your connection looks healthy at the gateway, but there are 14 devices on your Wi-Fi right now. Let's try restarting the gateway and see if speeds come back."]

