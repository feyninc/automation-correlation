  - {at: "D1 14:04", kind: read, target: t1b-fairbanks, summary: "opened ticket #88444 (Leon Fairbanks, $150 gateway charge)"}
  - {id: a1b-fairbanks, at: "D1 14:09", kind: reply, target: t1b-fairbanks, to: [c_mw_fairbanks], summary: "replied to Leon Fairbanks about the $150 charge",
     update_state: {status: pending},
     body: "Hi Leon, thanks for writing, and I'm sorry for the surprise. I can see your old gateway (NBG7-40B771) arrived at our warehouse on October 9 with the return label from your upgrade, so it was not lost. It was logged as damaged, and that is why the $150.00 equipment fee posted. I've asked our billing team to review the fee with the return record, and you'll hear back within one business day. I'll update you here as soon as I hear back. The plan charges on the bill, $97.84, are due November 18 as usual. Marisol"}
  - {id: a1b-fairbanks-t2, at: "D1 14:12", kind: new, app: mail, path: sent/t2-billing-equipment-NB-40300612, target: m1b-fairbanks-t2, to: [c_lena],
     subject: "Equipment fee review: returned gateway logged damaged, NB-40300612", summary: "asked Tier 2 Billing to review Leon Fairbanks's $150 fee",
     body: "Lena, ticket #88444, NB-40300612 (Leon Fairbanks), written from the email on file. He upgraded to 2 Gig on 10/2 and returned the old gateway NBG7-40B771 with label 1Z9F44W20398830172; the October returns log shows it received 10/9, condition damaged. The 11/1 statement has a $150.00 unreturned-equipment fee for NBG7-40B771. The box was returned, so please review the fee (and whether damage applies). Customer told he'll hear back within one business day and that the $150.00 is under review. Marisol"}
  - {id: a1b-waters, at: "D1 14:16", kind: reply, target: t1b-waters, to: [c_mw_waters], summary: "replied to Priscilla Waters about her due date",
     update_state: {status: solved},
     body: "Hi Priscilla, I'm sorry, I can't move the due date: every bill is issued on the 1st and due on the 18th. You can pay any time after the bill comes out, and a $10 late fee only posts if a balance is still unpaid 15 days after the 18th. If a month is tight, message us before the 18th and I can set up a payment arrangement so your account stays in good standing. Marisol"}
  - {id: a1b-corwin, at: "D1 14:22", kind: reply, target: t1b-corwin, to: [c_mw_corwin], summary: "asked the writer on ticket #88453 to verify first",
     update_state: {status: pending},
     body: "Hello, thanks for your message. This email address isn't the one on the account, so before I can share account details or make changes (the balance, an extender order, or a new email address), I need to verify you. I've sent a one-time passcode to the phone number and email already on file for the account; please reply here with it, or call us at 1-800-555-0144 with your PIN. Marisol, Northbeam Fiber"}
  - {id: a1b-luna, at: "D1 14:30", kind: reply, target: t1b-luna, to: [c_mw_luna], summary: "replied to Alejandra Luna in Spanish about 1 Gig",
     body: "Hola Alejandra, gracias por escribir. No hay contrato con Northbeam. Fiber 1 Gig cuesta $75 al mes. Como su plan de 300 está lento cuando todos están conectados y no hay ninguna falla en su zona, le puedo ofrecer Fiber 1 Gig gratis por tres meses; después cuesta $75 al mes, o puede volver al plan de 300 antes. Para hacer el cambio necesito verificar su cuenta: le acabo de enviar un código por mensaje de texto al número registrado; respóndame aquí con el código. Marisol"}
  - {id: a1b-zhou, at: "D1 14:37", kind: reply, target: t1b-zhou, to: [c_mw_zhou], summary: "sent Mei Lin Zhou her statements",
     update_state: {status: solved},
     body: "Hi Mei Lin, I've emailed your August, September and October 2026 statements to this address; each shows your name and 1407 Electric Ave SE. You can also download any statement since May 2024 in the Northbeam app under Billing > Statements. Good luck with the new place! Marisol"}
  - {id: a1b-gilmore, at: "D1 14:43", kind: reply, target: t1b-gilmore, to: [c_mw_gilmore], summary: "replied to Dwayne Gilmore's complaint",
     update_state: {status: escalated},
     body: "Hi Mr. Gilmore, I'm very sorry. Asking for a supervisor should never end with the call being cut off. I can see your call on Friday, October 30 at 4:42 pm. I've asked a team lead to review the recording and call you back at 503-555-0156 within one business day. How we follow up with the rep stays internal, but your complaint will be reviewed. If your internet is still dropping, reply here and I'll look at your line today. Marisol"}
  - {id: a1b-gilmore-derek, at: "D1 14:45", kind: reply, target: t1-derek-1on1, to: [c_derek], summary: "asked Derek for a supervisor callback on Dwayne Gilmore's complaint",
     body: "Derek, supervisor callback request: ticket #88446, NB-40243376 (Dwayne Gilmore). He says a Team 2 rep hung up when he asked for a supervisor on Fri 10/30 about 16:40; Beam360 shows the call at 16:42 ended by agent disconnect, recording RC-1030-16422. Reason for the call was a dropping connection (gateway restart). I told him a team lead will review the recording and call him at 503-555-0156 within one business day, and that the rep follow-up stays internal."}
  - {id: a1b-derek-notices, at: "D1 14:52", kind: reply, target: t1-derek-1on1, to: [c_derek], summary: "sent Derek the promo roll-off accounts that never got the notice",
