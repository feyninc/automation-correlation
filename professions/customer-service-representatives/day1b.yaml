  - id: c1b-pruitt
    path: 2026-11-02/0702-dale-pruitt
    title: Inbound call, Dale Pruitt (bill up $20, wants to cancel)
    start: "D1 07:02:00"
    turns:
      - [c_mw_pruitt, "Yeah, good morning. My bill went from fifty-seven to seventy-seven dollars overnight. If that's what it costs now I'm going to cancel and go back to the cable company.", 5]
      - [worker, "Good morning, Mr. Pruitt, I can look at that with you. First, can you give me your six-digit account PIN?"]
      - [c_mw_pruitt, "2-7-7-0-4-1.", 5]
      - [worker, "Thank you, you're verified. Your plan price hasn't changed: Fiber 1 Gig is seventy-five dollars. What changed is that your twelve-month twenty-dollar new-customer discount ended on October 31st. We emailed you about it on October 1st."]
      - [c_mw_pruitt, "Yeah, I probably saw that and ignored it. Still, twenty bucks more. What can you do, or do I cancel?", 5]
      - [worker, "Since the price is the reason you're thinking of cancelling, I can offer ten dollars off a month for the next six months, starting with your December bill. That would make it sixty-seven twenty-one with taxes. If you'd still rather cancel, I can do that for you on this call."]
      - [c_mw_pruitt, "Ten off for six months. OK, I'll take that. Don't cancel.", 4]
      - [worker, "Done, I've added it, and you'll see it on the December 1st bill. Anything else I can help with?"]
      - [c_mw_pruitt, "No, that's it.", 3]
