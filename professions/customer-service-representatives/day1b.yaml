  # case notes, escalations, digital work
  - {id: a1b-pruitt-note, at: "D1 07:09", kind: update, target: c1b-pruitt, summary: "wrote the case note for Dale Pruitt's call",
     body: "Reason: bill up from $57.21 to $77.21, mentioned cancelling for price. Verified by PIN. NEW20 ($20) ended 10/31; 10/1 notice went to the email on file. Customer asked about cancelling because of price: offered SAVE10, accepted ($10 x 6 months from the 12/1 bill, $67.21 with taxes). Not cancelled. Next: none."}
  - {id: a1b-rosales-note, at: "D1 07:20", kind: update, target: c1b-rosales, summary: "wrote the case note for Lucía Rosales's call (Spanish)",
     body: "Llamada en español. Reason: bill $69.15, usually $56.62. Verified by PIN. EXT1 on the Wi-Fi extender ended 10/14: $4.53 for 10/15-10/31 plus $8.00 for November. The 9/14 offer-end text went out in English only. Customer keeps the extender ($8/month). Set language preference: Spanish for notices."}
  - {id: a1b-okonkwo-note, at: "D1 07:24", kind: update, target: c1b-okonkwo, summary: "wrote the case note for Chidi Okonkwo's call",
     body: "Reason: wanted to pay by card. Customer began reading his card number; stopped him before any digits beyond the brand. Verified by PIN. November $56.62 due 11/18. Transferred to Secure Pay IVR for the payment. No card data taken or noted."}
  - {id: a1b-vance-note, at: "D1 07:30", kind: update, target: c1b-vance, summary: "wrote the case note for Rob Vance's call",
     body: "Caller Rob Vance asked to upgrade NB-40355102 (holder Melissa Vance) to Fiber 2 Gig. Not the holder, not an authorized user, no PIN, OTP would go to the holder's phone. Not verified: no changes, no account details. Gave general price only (2 Gig $95). Told him Melissa can call or add him as an authorized user."}
  - {id: a1b-hutchins-note, at: "D1 07:37", kind: update, target: c1b-hutchins, summary: "wrote the case note for Carla Hutchins's call",
     body: "Reason: wants the $10 late fee (posted 10/3; September bill paid 10/6) removed. Verified by PIN. Courtesy waiver already used 5/7, inside 12 months, so not waived at Tier 1. Told her I'd ask the team lead to review today and she'd hear back by tomorrow. Balance $66.62, or $56.62 if waived, due 11/18."}
  - {id: a1b-delacruz-note, at: "D1 07:47", kind: update, target: c1b-delacruz, summary: "wrote the case note for Ramon Delacruz's call",
     body: "Reason: asked for the $30 government internet discount. Verified by PIN. Explained ACP ended nationwide 6/1/2024 (no funding); nothing to reapply. Changed plan Fiber 1 Gig ($75) to Fiber 300 ($55) from the 12/1 bill at his request, saving $20/month; usage about 212 GB/30 days. Confirmation email sent."}
  - {id: a1b-mcbride-note, at: "D1 07:54", kind: update, target: c1b-mcbride, summary: "wrote the case note for Owen McBride's call",
     body: "Reason: disputed Home Phone charges ($12.00 for 10/14-10/31 plus $20.00 November). Verified by PIN. Home Phone was added 10/14 in the app by authorized user Dana McBride, 911 notice acknowledged in the app. Explained; customer will keep it and talk with Dana. No credit."}
  - {id: a1b-lindgren-note, at: "D1 08:00", kind: update, target: c1b-lindgren, summary: "wrote the case note for Britt Lindgren's call",
     body: "Reason: add an authorized user. Verified by PIN. Added Erik Lindgren (son) as an authorized user. Told her Erik must still verify with the PIN or an OTP to her contact details when he calls."}
  - {id: a1b-morrow-note, at: "D1 08:16", kind: update, target: c1b-morrow, summary: "wrote the case note for Ethel Morrow's call",
     body: "Reason: scam call at about 07:00 claiming to be Northbeam, threatening shut-off at noon unless she paid $300 in gift cards; the caller knew her name and account number. Verified by PIN. Account current: autopay paid $56.62 on 10/18, nothing past due. Told her it was not us, we never take gift cards, not to buy any. She gave no PIN or bank details. Scammer callback number 888-555-0163. Referred to Account Security; added a caution note to the account."}
  - {id: a1b-morrow-sec, at: "D1 08:18", kind: new, app: mail, path: sent/security-referral-NB-40141209, target: m1b-morrow-sec, to: [c_ray],
     subject: "Referral: gift card shut-off scam targeting NB-40141209", summary: "referred Ethel Morrow's scam call to Account Security",
     body: "Ray, Ethel Morrow (NB-40141209, 84, autopay, nothing past due) got a call at about 07:00 today from someone claiming to be Northbeam who said she was two months behind and would be shut off at noon unless she paid $300 in Walgreens gift cards. The caller knew her name and account number. Callback number he gave: 888-555-0163. She gave no PIN or bank details. I verified her by PIN at 08:05 and told her it was a scam. Please review the account for exposure; I added a caution note. Marisol"}
