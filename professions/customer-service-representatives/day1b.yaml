# Monday 2026-11-02, the rest of the day at volume. The queue opens at 07:00 with statement calls (the 11/1 bills:
# NEW20 roll-offs, an extender promotion ending, Home Phone add-ons) and keeps Marisol on the phone back to back
# until the 10:00 digital block; phones again 11:00-14:00 (lunch 12:25-12:55), digital 14:00-15:00, phones to 15:30.
# 25 more live calls (30 for the day), the afternoon digital block's tickets, floor chat and system mail.
# This file also holds the week's new contacts, the D0 policy on the Home Phone 911 address, and every traffic
# template (Monday to Friday).
#
# Arithmetic (python3):
#   Rosales: EXT1 (first extender free 12 months) ended 10/14; Oct 15-31 = 17 days x $8.00/30 = $4.53, plus
#     November $8.00 = $12.53; statement 55.00 + 12.53 + 1.62 = $69.15 (was $56.62).
#   McBride: Home Phone added 10/14 by the authorized user; Oct 14-31 = 18 days x $20.00/30 = $12.00, plus November
#     $20.00; statement 55.00 + 12.00 + 20.00 + 3.11 = $90.11.
#   Pruitt: NEW20 ended 10/31; October 75.00 - 20.00 + 2.21 = $57.21, November 75.00 + 2.21 = $77.21; with SAVE10
#     ($10 x 6 months from December) 75.00 - 10.00 + 2.21 = $67.21.
#   Santos: NEW20 ended 10/31; October 55.00 - 20.00 + 1.62 = $36.62, November $56.62.
#   Hutchins: late fee $10.00 posted 10/3 (September bill paid 10/6) on the 11/1 statement with November's $56.62 =
#     $66.62; a courtesy waiver was used 5/7, inside 12 months, so the waiver is the team lead's.
#   Delacruz: Fiber 1 Gig $75.00 to Fiber 300 $55.00 saves $20.00 a month.
#   Quinn: cancels effective 11/15 on Fiber 1 Gig, billed through 11/30 in advance: 11/16-11/30 = 15 days x
#     $75.00/30 = $37.50 back on the final bill; gateway due back within 30 days (by 12/15).
#   Hale: closed 10/29; 30-day return window ends 11/28.
#   Whitcomb: Fiber 2 Gig $95.00 to Fiber 1 Gig $75.00 = $20.00 less a month; SAVE10 on 2 Gig would be $85.00.
#   Garza: Home Phone $20.00 a month; Mexico $0.03 a minute (Home Phone features policy): 120 min a month = $3.60.
#   Keller: do-not-call and SMS opt-out honored within 10 business days (47 CFR 64.1200); no date quoted, since it
#     depends on whether Veterans Day (Wed 11/11) counts as a business day (11/16 or 11/17).
#   Morrow: autopay paid $56.62 on 10/18; nothing past due; November's $56.62 is scheduled for autopay on 11/18; the
#     scam caller asked for $300 in gift cards.
#   Yee: 55.00 + 20.00 + 3.11 (taxes and fees, including the $0.75 911 surcharge) + duplicate 0.75 = $78.86.

sources:
  - "47 CFR 9.20, backup power obligations: providers of fixed voice service that is not line powered must offer subscribers the option to buy backup power (an 8-hour option, and a 24-hour option): https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-9/subpart-H/section-9.20"
  - "USAC, Affordable Connectivity Program ('The ACP ended on June 1, 2024, due to a lack of additional funding from Congress'): https://www.usac.org/about/affordable-connectivity-program/"
  - "FTC, Avoiding and reporting gift card scams ('No real business or government agency will ever tell you to buy a gift card to pay them'; utility shut-off threats are a scam): https://consumer.ftc.gov/articles/avoiding-and-reporting-gift-card-scams"
  - "47 CFR 64.1200(d)(3) and (a)(10) (company do-not-call requests and revocations of consent honored within a reasonable time, not more than 10 business days): https://www.law.cornell.edu/cfr/text/47/64.1200"
  - "47 CFR 64.2010(b) (call detail over the phone only after the customer gives a password; otherwise only to the address of record or by calling the number of record) and (f) (notice of changes to the address of record): https://www.law.cornell.edu/cfr/text/47/64.2010"
  - "47 U.S.C. 222(c)(1) (CPNI used or disclosed only as required by law or with the customer's approval): https://www.law.cornell.edu/uscode/text/47/222"
  - "47 CFR 9.11(b)(4)(ii)(B) and (b)(5) (interconnected VoIP: Registered Location obtained before service and updatable by the customer; subscribers advised that 911 may not work on broadband failure, power loss or relocation): https://www.law.cornell.edu/cfr/text/47/9.11"

