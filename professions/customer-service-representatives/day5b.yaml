  - {id: a5b-macro-es, at: "D5 15:58", kind: reply, target: t5b-jess-es, to: [c_jess], summary: "sent Jess corrections to the Spanish outage macro",
     body: "Hi Jess, three fixes before it goes out. (1) 'Su servicio quedará restablecido en un plazo de 24 horas' promises a restoration time; the English only gives one if NOC has posted it. Use: '[Si NOC publicó una hora estimada: Esperamos restablecer el servicio alrededor de las [hora].]' (2) The credit line is wrong: outages of 4 hours or more, applied automatically once service is back, not 'more than an hour on the next bill'. Use: 'Los créditos por la interrupción se aplican automáticamente cuando se restablece el servicio, si la falla dura 4 horas o más.' (3) The 911 line is dangerous: Home Phone goes down with the fiber, 911 included. Use: 'Si tiene Home Phone, use un teléfono celular para emergencias, incluido el 911, hasta que se restablezca el servicio.' The rest reads well. And the v7 sentence for the quick reference: 'Puede cancelar en cualquier momento con solo decirme que quiere cancelar, y yo lo hago en esta llamada.' For chat and email, end it with '...y yo lo hago aquí mismo.' Marisol"}
