     update_state: {status: pending},
     body: "Hi Lauren, I understand how worrying this is. For privacy I can't confirm or discuss anyone's account unless they're on it, but I can tell you about the outage: the part of Keizer north of Chemawa Rd, including Clear Lake Rd N, is still without service, and our current estimate is tomorrow, Wednesday, at 10 a.m. Home Phone lines in that area aren't working, including 911 and alarms that use them. If you're worried about your father's safety, please ask a neighbor to check on him or call Keizer police's non-emergency line for a welfare check, and call 911 in an emergency. If he calls us (from a mobile is fine), we can talk with him directly, and he can add you as someone we may speak with. Marisol"}
