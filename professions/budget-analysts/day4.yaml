# Thursday 2026-11-05. The decision package review at 10: the deputy director wants a 20% cushion added. The fiscal
# note goes to OFM by 17:00. Mara asks about the grant's meeting costs. OFM asks a follow-up question on the note.

threads:
  - id: t4-angela
    app: chat
    path: "@angela/dm"
    title: Angela Price (DM)
    x:
      - {at: "D4 11:00", from: c_angela, body: "Good review. On the navigator DP, add 20% on top of the corrected number as a cushion; OFM always cuts us."}
  - id: t4-mara
    app: mail
    path: inbox/re-dol-grant
    title: "Re: DOL grant budget"
    x:
      - {at: "D4 13:30", from: c_fednick, to: [worker], subject: "Re: DOL apprenticeship grant budget",
         body: "Fixed the rate to 16.9%, thanks! On the $12,000 advisory meetings line: four quarterly meetings, 30 people, lunch at each, plus room rental. Is lunch OK to keep?"}
  - id: t4-ofm
    app: mail
    path: inbox/hb1214-question
    title: HB 1214 question
    x:
      - {at: "D4 16:30", from: c_ofm, to: [worker], subject: "Re: HB 1214 fiscal note",
         body: "Received, thanks. Quick question: why isn't there any cost in FY2027? The bill passes in the 2027 session. Tom"}
  - id: t4-sam
    app: chat
    path: "@sam/dm"
    title: Sam Ortiz (DM)
    x:
      - {at: "D4 15:00", from: c_sam, body: "idea: Training Grants is way under. can we prepay next year's (FY28) Salesforce renewal now from this year's money?"}

actions:
  - {at: "D4 10:00", kind: noop, target: cal-imani, minutes: 60, summary: "decision package review with Angela"}
  - {at: "D4 11:05", kind: read, target: t4-angela, summary: "read Angela's request"}
  - {id: a4-angela, at: "D4 11:30", kind: reply, target: t4-angela, to: [c_angela], summary: "advised against a cushion",
     body: "I'd advise against it: OFM's instructions ask for costs we can support, and an unexplained 20% is exactly what they cut first, along with our credibility on the rest. A stronger approach is to state the assumptions they could challenge (an April start, the 33.5% benefits rate) and show the dropout data. If you want room, we could request the January start as an option ($237,600) with the April case ($118,800) as the base. Your call."}
  - {id: a4-submit, at: "D4 15:30", kind: new, app: mail, path: sent/hb1214-submitted, target: m4-submit, to: [c_ofm], cc: [c_robert], subject: "HB 1214 fiscal note submitted (DWT)",
     summary: "submitted the fiscal note to OFM",
     body: "Tom, DWT's HB 1214 note is in the Fiscal Note system: FY2028 $834,400, FY2029 $362,320 (2027-29 $1,196,720; 2029-31 $724,640), General Fund-State, 2.5 FTE in FY2028 and 2.0 ongoing. Imani"}
  - {at: "D4 13:35", kind: read, target: t4-mara, summary: "read Mara's question"}
  - {id: a4-mara, at: "D4 13:50", kind: reply, target: t4-mara, to: [c_fednick], summary: "advised on meeting meal costs",
     body: "Keep it, but justify it: under 2 CFR 200.432, meals at a meeting are allowable when they're necessary to carry out the meeting (e.g., a full-day working session where breaking for lunch isn't practical) and reasonable. Put the agenda length, the per-person cost (use the state lunch rate) and why lunch is needed in the narrative, and keep room rental separate. If the meetings are two hours, I'd drop the lunch."}
  - {at: "D4 16:35", kind: read, target: t4-ofm, summary: "read OFM's question"}
  - {id: a4-ofm, at: "D4 16:50", kind: reply, target: t4-ofm, to: [c_ofm], summary: "answered OFM's question on FY2027",
     body: "Tom, the bill's effective date is July 1, 2027 (section 4), which is the first day of FY2028, and DWT has no obligations under it before then; procurement and hiring start on the effective date. So no FY2027 costs. If the Legislature adds an emergency clause or an earlier date, we'd need about $480,000 earlier for implementation."}
  - {id: a4-sam, at: "D4 15:20", kind: reply, target: t4-sam, to: [c_sam], summary: "explained why prepaying next year isn't allowed",
     body: "No, for two reasons: Training Grants is 08F, which can't pay for agency IT at all; and appropriations pay for goods and services received in the fiscal period, so prepaying FY2028 services with FY2027 money isn't allowed even from the right fund. The FY2028 renewal belongs in next year's budget."}

