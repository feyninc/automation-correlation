calls:
  - id: c3b-daniel
    path: 2026-11-04/1320-daniel-whitford-foundation-grant
    title: Call with Daniel Whitford (Cascadia Workforce Foundation grant)
    start: "D3 13:20:00"
    turns:
      - [c_daniel, "Imani, it's Daniel. Good news: the Cascadia Workforce Foundation awarded us a hundred eighty thousand dollars for the regional wage study. I'd like to sign the sixty-thousand-dollar survey contract on Monday. We can charge it to the LMI budget, right?", 8]
      - [worker, "Congratulations, Daniel. But not yet: that money isn't in our enacted budget, so before we sign or spend anything against it, OFM has to approve it as an unanticipated receipt and give us expenditure authority."]
      - [c_daniel, "How long does that take? The survey firm wants to start in December.", 6]
      - [worker, "The packet has to reach OFM at least ten days before we commit funds, and once OFM has it there's a ten-day review for legislative fiscal staff. If I get it to OFM Friday, the earliest approval is mid-November, so a December start can still work, but nothing gets signed before the approval."]
      - [c_daniel, "Okay. What do you need from me?", 4]
      - [worker, "The award letter, the foundation's budget and payment terms, and your monthly spending plan. I'll draft the packet. It can only ask for what we'll spend by June 30; the rest of the grant goes into the 2027-29 budget."]
      - [c_daniel, "I'll send it this afternoon. Thanks, Imani.", 4]

