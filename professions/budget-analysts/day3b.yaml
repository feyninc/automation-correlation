# Wednesday 2026-11-04, the rest of the day. The Administration budget review with Sam and Robert, and OFM's
# follow-up questions working session. Robert approves the one-time navigator pilot. A reporter's public records
# request for the HB 1214 drafts lands in Imani's inbox; a look-alike "Lena Park" asks to change Sound Trades' bank
# account. The LMI manager has a $180,000 foundation grant he wants to spend now (he calls). The prior DOL award is in
# closeout. Angela wants a one-page brief for tomorrow's decision package review. Not caught: the navigator package
# doesn't fit OFM's limits for the 2027 supplemental.
#
# Computations (python3):
# - Public records: received Wed 11/4; five business days, skipping Wed 11/11 (Veterans Day, RCW 1.16.050): Thu 11/5,
#   Fri 11/6, Mon 11/9, Tue 11/10, Thu 11/12. Response due Thu 11/12.
# - Sound Trades corrected invoice: 47,830 - 6,450 = 41,380, received Wed 11/4; + 30 days = Fri 12/4/2026.
# - AP-27-012 certification: FY2027 7 x 8,000 = 56,000 (FY2028 40,000 subject to appropriation).
# - Prior DOL award closeout: period of performance ended 9/30/2026 + 120 calendar days = Thu 1/28/2027 (2 CFR 200.344).
# - Unanticipated receipt timing: packet to OFM Fri 11/6 + 10-calendar-day review = Mon 11/16 earliest approval.
# - Navigator DP brief: April 1 start 4 x 90,000 x 1.32 x 3/12 = 118,800; January 1 start x 6/12 = 237,600; ongoing at
#   OFM's 33.5%: 4 x 90,000 x 1.335 = 480,600; the program's draft 640,000 includes 164,800 of contingency.
# - OFM answers: Administration projection 7,019,600 vs 7,360,000 (Monday's run-rate figures); renewals 210,000.

