     content: "# OFM follow-up questions: answers 4 and 7 (draft for Hannah)\n\n4. Administration allotment. Yes: Administration's Q1 overages in FY2026 and FY2027 are the annual software renewals paid in September ($210,000 in FY2027: Microsoft, Salesforce, ServiceNow, Adobe, DocuSign). Without them Administration runs about $567,467 a month, which projects to $7,019,600 for FY2027 against the $7,360,000 allotment. DWT will allot the renewals in September in its 2027-29 allotments so the monthly plan matches the payment pattern; no supplemental need.\n\n7. Apprenticeship vacancies. The three consultant positions were held vacant through Q1. Position 70412 is being filled December 1, 2026, and the other two are planned for March 1, 2027. The one-time vacancy savings (about $180,180 in FY2027) fund a navigator pilot from March 1 to June 30 (two project positions, $79,200) approved by the budget director. The positions are needed for registration and sponsor workload; DWT is pricing 2027-29 reduction options, and the vacant positions are among the options under review."}
