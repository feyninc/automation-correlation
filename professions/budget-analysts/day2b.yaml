     body: "Nadia, funding confirmed for 70412 effective 12/1: budgeted position, Program C, fund 001-1. At $78,000 the cost is about $102,960 a year with benefits (32%), $60,060 for December-June in FY2027, which Apprenticeship's allotment covers. Luis, note this reduces the vacancy savings I estimated Monday. Imani"}
