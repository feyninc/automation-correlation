    title: "Apprenticeship reduction ideas for 2027-29 (Luis)"
    at: "D2 14:10"
    author: c_luis
    content: |
      Ideas for OFM's reduction options (ongoing, per year):
      (a) Eliminate the 3 vacant Apprenticeship Consultant positions ($78,000 salary each).
      (b) End the two sponsor outreach contracts ($90,000 a year combined).
      (c) Reduce in-state travel 30% (travel budget $80,000 a year).
      (d) Registration renewals online only: no printing or mailing ($18,500 a year).
      Luis's note: I'd rather not do (a), but it's the biggest.

