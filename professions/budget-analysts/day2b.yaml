    at: "D2 10:00"
    author: c_ofm
    content: |
      Z-0217.1/27, Employment Security Department agency request legislation: changes to the training benefits
      program. DWT is a secondary agency. Section 3: beginning July 1, 2027, DWT must send ESD, each quarter, a file of
      approved training programs with each program's completion and placement rates. (DWT already publishes the
