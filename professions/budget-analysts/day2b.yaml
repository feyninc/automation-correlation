# Tuesday 2026-11-03 (Election Day), the rest of the day. HR asks budget to confirm funding to fill one of the vacant
# consultant positions on December 1, which shrinks the vacancy savings Luis wants for a navigator pilot (he calls).
# The Apprenticeship ceremony catering PR can't be paid with state funds. Sound Trades' invoice still bills the week
# before its contract. OFM asks why the Training Grants 2027-29 base still carries a one-time FY2027 item and about the
# Q1 variance. Devon's fiscal note repeats a one-time cost. A vendor offers football tickets.
#
# Computations (python3):
# - Position 70412: 78,000 x 1.32 = 102,960 a year; 8,580 a month; FY2027 Dec-Jun 7 x 8,580 = 60,060.
# - Vacancy savings with 70412 filled 12/1: two positions x 8 months x 8,580 = 137,280 + one x 5 months (Jul-Nov) =
#   42,900; total 180,180 (was 205,920).
# - Pilot: 2 x 90,000 x 1.32 x 4/12 (Mar-Jun) = 79,200; 180,180 - 79,200 = 100,980 left.
# - Sound Trades: bill 47,830 - 6,450 (Sept 21-27, before the 9/28 start) = 41,380.
# - Training Grants 2027-29 base: 25,000,000 - 1,200,000 one-time = 23,800,000 a year; 47,600,000 a biennium, 2,400,000
#   below the 50,000,000 submitted.
# - Q1 Training Grants: 3,887,500 vs 6,250,000 = -2,362,500 (-37.8%).
# - Devon's Z-0115.1/27: 1.5 FTE x 88,000 = 132,000; benefits 33.5% = 44,220; goods and services 1.5 x 8,000 = 12,000;
#   one-time consultant 40,000 in FY2028 only. FY2028 228,220; FY2029 188,220 (his draft repeats 228,220); 2027-29
#   416,440 (not 456,440); 2029-31 2 x 188,220 = 376,440.
# - Workstations: 2 x 4,300 = 8,600; each unit under the 10,000 equipment threshold (2 CFR 200.1; SAAM 30.20.20).
# - Laptops PR-27-0423: 6 x 1,490 = 8,940.
# - Gift: 2 tickets x 340 = 680, over the 100-a-year limit from one source (RCW 42.52.150).

