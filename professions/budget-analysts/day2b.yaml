  - {id: a2b-luis-memo, at: "D2 12:20", kind: new, app: mail, path: sent/navigator-pilot-recommendation, target: t2b-sent-pilot, to: [c_robert], cc: [c_luis], subject: "Navigator pilot: numbers and recommendation",
     summary: "sent Robert the pilot costing and a recommendation",
     body: "Robert, Luis proposes two temporary navigators from March 1 to June 30 to test the dropout work before the decision package is decided. Cost: 2 x $90,000 x 1.32 x 4/12 = $79,200. Source: Apprenticeship vacancy savings, now about $180,180 for FY2027 since 70412 is being filled 12/1 (3 x $78,000 positions, benefits 32%). It's the same program and fund (001-1), so no allotment change is needed. I recommend approving it as one-time: project positions that end June 30, no ongoing cost, with continuation only through the decision package. Risk: if the other two vacancies fill earlier than March, the savings shrink by $8,580 a month each. Your call. Imani"}
  - {id: a2b-call-trevor, at: "D2 12:45", kind: noop, target: t2b-trevor, minutes: 15, summary: "call with Trevor about the LMI drawdown history"}
  - {id: a2b-tg-review, at: "D2 13:00", kind: noop, target: cal-imani, minutes: 60, summary: "Training Grants monthly contract review with Kristin and Bethany"}
  - {id: a2b-tg-base, at: "D2 14:30", kind: reply, target: t2b-tom-base, to: [c_ofm], cc: [c_hannah, c_robert], summary: "confirmed the one-time item comes out of the 2027-29 base",
     body: "Tom, confirmed. The $1,200,000 for college equipment grants was provided one time in FY2027 by proviso, so it shouldn't carry forward. The Training Grants base for 2027-29 is $23,800,000 a year, $47,600,000 for the biennium, $2,400,000 less than our request shows. Hannah will enter the technical correction in ABS before Thursday's snapshot. Imani"}
  - {id: a2b-kristin-equip, at: "D2 14:50", kind: reply, target: t2-kristin, to: [c_kristin], summary: "explained the equipment money lapses June 30",
     body: "Yes. The $1.2M is FY2027 money, and appropriations lapse at June 30 to the extent they aren't spent or lawfully obligated (RCW 43.88.140), so the colleges need their orders placed and the equipment received and billed by then. It's also one-time, so there's nothing for it in 2027-29; OFM just confirmed that. I'd give the three slow colleges a date in the spring, say April 30, after which we reallocate their share."}
  - {id: a2b-fn-coord, at: "D2 15:00", kind: noop, target: cal-imani, minutes: 45, summary: "fiscal note coordination with Erin, Devon and Priya"}
  - {id: a2b-erin-list, at: "D2 15:50", kind: reply, target: t2b-erin, to: [c_erin], cc: [c_devon, c_priya], summary: "sent Erin her fiscal note list with due dates",
     body: "Erin, mine from today's list: HB 1214 (DWT lead): draft to Robert Wednesday noon, due to OFM Thursday 11/5 at 5 p.m. Z-0217.1/27 (ESD agency request, DWT secondary): due in FNS Friday 11/6 at noon; DWT's piece is the quarterly training program file in section 3, small and likely absorbable. I'll tell you the moment either is submitted. Imani"}
  - {id: a2b-ofm-variance, at: "D2 15:55", kind: reply, target: t2b-tom-variance, to: [c_ofm], cc: [c_robert], summary: "explained the Q1 variance is timing",
     body: "Tom, it's timing. The community college contracts were signed 9/24, so their first billings come in October and Q1 shows mostly the continuing provider costs. Kristin is getting the colleges' billing forecast by month this week. If it shows the year's spending needs a different monthly pattern, we'll submit a quarterly allotment amendment by the 25th; the closed months stay as they are. Right now we don't expect a lapse. Imani"}
  - {id: a2b-gift, at: "D2 16:10", kind: reply, target: t2b-jared, to: [c_jared], summary: "declined the vendor's tickets",
     body: "Hi Jared, thank you, but I can't accept them. I certify funds for purchases from your company, and state ethics law doesn't allow gifts connected to official actions or more than $100 a year from one source (RCW 42.52.150). No offense taken, I hope none given. Imani"}
  - {id: a2b-call-marcus, at: "D2 16:25", kind: noop, target: t1b-owen, minutes: 12, summary: "took a call from Marcus Tran (Cascade Pathways) about AP-27-012's start date and the fiscal-year split"}
  - {id: a2b-pr0423, at: "D2 16:45", kind: reply, target: t2b-ana-pr, to: [c_ana], summary: "certified PR-27-0423",
     body: "Ana, certified: PR-27-0423, 6 laptops, $8,940, Program C, fund 001-1, within the allotment. They're under the $10,000 capitalization threshold, so IT will tag them as small and attractive assets. Imani"}

