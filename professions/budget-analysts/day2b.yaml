calls:
  - id: c2b-luis
    path: 2026-11-03/1045-luis-reyes-navigator-pilot
    title: Call with Luis Fernando Reyes (vacancy savings and navigator pilot)
    start: "D2 10:45:00"
    turns:
      - [c_luis, "Imani, it's Luis. Thanks for the vacancy numbers yesterday. One change: we're filling one of the three consultant positions December 1 after all; Nadia has the request. Does that change what we've got?", 8]
      - [worker, "It does. That position is vacant five months instead of eight, so the three positions save about $180,180 this fiscal year instead of $205,920. I confirmed the December funding with Nadia this morning."]
      - [c_luis, "Okay. For the pilot: two temporary navigators, March 1 through June 30, at the same ninety thousand as the decision package. What does that cost?", 8]
      - [worker, "Two people for four months at $90,000 with 32% benefits is $79,200, so it fits inside the savings with about $100,980 to spare."]
      - [c_luis, "Great. Can I tell Nadia to post them this week?", 5]
      - [worker, "Not yet. They'd be project positions that end June 30, paid one time from the savings, and Robert has to approve using the savings that way. Anything that continues after June depends on the decision package and the Legislature. I'll send Robert the numbers and my recommendation today."]
      - [c_luis, "Fair enough. Thanks, Imani.", 4]

actions:
  - {id: a2b-catering, at: "D2 09:15", kind: reply, target: t2b-catering, to: [c_ana], cc: [c_luis], summary: "declined to certify the ceremony catering",
     body: "Ana, I can't certify PR-27-0421. State rules (SAAM 70.15.20 and 70.10.30) don't allow agency funds for meals or refreshments at receptions and celebrations, or for food for people we aren't authorized to reimburse, which the guests at the ceremony are. That's the case whatever fund we use. The ceremony itself is fine to hold in the auditorium; it just can't include food paid by DWT. I'm sorry; I know it matters to the apprentices. Imani"}
