     body: "Daniel, at $4,300 each they aren't equipment: under 2 CFR 200.1 equipment is a unit cost at or above the lesser of our capitalization level or $10,000, and the state's threshold is $10,000 (SAAM 30.20.20). They're computing devices, which can be charged directly to the BLS agreement if they're essential and allocable to it (2 CFR 200.453) and in the work plan, which Mara can confirm. On our side: yes, put them on the inventory list as small and attractive assets so they're tagged. Imani"}
