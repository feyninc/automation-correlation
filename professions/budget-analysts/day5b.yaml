calls:
  - id: c5b-kevin
    path: 2026-11-06/1315-kevin-lindqvist-senate-wm
    title: Inbound call, Kevin Lindqvist (Senate Ways and Means staff), HB 1214
    start: "D5 13:15:00"
    turns:
      - [c_kevin, "Hi Imani, Kevin Lindqvist with Senate Ways and Means. I'm looking at the HB 1214 note that came out today. Why is the first year so much higher than the years after?", 8]
      - [worker, "FY2028 carries the one-time build of the vendor-hosted system, $480,000, and a half-time project manager for that year only. From FY2029 it's the two analysts, the $72,000 subscription and the $18,000 Employment Security wage match, so $362,320 a year."]
      - [c_kevin, "Did the agency look at building it in-house instead?", 6]
      - [worker, "We costed the vendor-hosted option because it's the least expensive way to implement the bill; an in-house build would need more IT staff than we have. I can send you the assumptions behind each line."]
      - [c_kevin, "That would help. Off the record, is the agency for this bill?", 6]
      - [worker, "I can only speak to the fiscal note. The agency's position on the bill comes from our legislative liaison, Erin Castillo, and I'll let her know you asked."]
      - [c_kevin, "Fair enough. Thanks, Imani.", 4]

