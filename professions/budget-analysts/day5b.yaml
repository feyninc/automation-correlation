     body: "Rachel, for planning: (1) FY2026, Training Grants spent $24,580,000 from 08F against a $25,000,000 allotment; the monthly detail will come from Enterprise Reporting. (4) None: FY2026 08F spending was within both the allotment and the $50,000,000 biennial appropriation, and $420,000 of authority stayed unallotted. For items 2 and 3, the TALS amendment history and our fund certification procedure will come to you with the rest through Gail, our audit liaison, before 11/17. Imani"}
  - {id: a5b-z0388, at: "D5 11:20", kind: edit, app: docs, path: fiscal-notes/z-0388-draft, target: doc-z0388-note, title: "Z-0388.1/27 fiscal note (DWT, secondary): draft",
     summary: "drafted DWT's note on Z-0388.1/27",
     content: "# Z-0388.1/27 (SBCTC agency request, apprenticeship instruction report): DWT fiscal note draft\n\nFiscal impact: greater than zero but less than $50,000 per fiscal year.\n\nWhat the bill does for DWT: section 2 requires a joint DWT-SBCTC annual report on related supplemental instruction for registered apprentices, starting December 1, 2028. DWT's share: matching apprentice registration records to SBCTC enrollment data and writing DWT's sections.\n\nAssumptions: 0.3 FTE Research Analyst ($84,000) from July 1, 2027, ongoing; benefits at OFM's standard 33.5%; goods and services $8,000 per FTE; a one-time sponsor survey in FY2028 ($12,000) to collect instruction costs not in either agency's data. Least-cost approach: existing systems, no new software.\n\nExpenditures, General Fund-State (001-1):\n| | FY2028 | FY2029 | 2027-29 | 2029-31 |\n| --- | --- | --- | --- | --- |\n| FTE | 0.3 | 0.3 | 0.3 | 0.3 |\n| Salaries | 25,200 | 25,200 | 50,400 | 50,400 |\n| Benefits | 8,442 | 8,442 | 16,884 | 16,884 |\n| Goods and services | 2,400 | 2,400 | 4,800 | 4,800 |\n| Sponsor survey (one time) | 12,000 | 0 | 12,000 | 0 |\n| Total | 48,042 | 36,042 | 84,084 | 72,084 |\n\nNo cash receipts. No capital impact."}
  - {id: a5b-reductions, at: "D5 12:00", kind: edit, app: docs, path: budget/2027-29-apprenticeship-reduction-options, target: doc-reductions, title: "Apprenticeship reduction options for 2027-29 (priced for Hannah)",
     summary: "priced Apprenticeship's reduction options",
     content: "# Apprenticeship (Program C) reduction options, 2027-29 (draft for Hannah)\n\nTarget: 5% of the FY2027 allotment ($8,440,000) = $422,000 a year. Benefits at OFM's 33.5% for 2027-29.\n\n| Option | Per year | 2027-29 |\n| --- | --- | --- |\n| (a) Eliminate the two consultant positions still vacant (2 x $78,000 x 1.335) | 208,260 | 416,520 |\n| (b) End the two sponsor outreach contracts | 90,000 | 180,000 |\n| (c) Reduce in-state travel 30% of $80,000 | 24,000 | 48,000 |\n| (d) Registration renewals online only (printing and mail) | 18,500 | 37,000 |\n| Total | 340,760 | 681,520 |\n\nThe options reach 4.04%, $81,240 a year short of 5%.\n\nNotes: Luis's list counted three vacant positions ($312,390), but position 70412 is being filled December 1, so only two remain, and those two are planned for hire March 1 (our answer to OFM question 7 says they're needed). Choosing (a) means cancelling those hires. The navigator pilot is one-time FY2027 money and isn't affected. (b) does not include AP-27-012 (Cascade Pathways), whose FY2028 $40,000 is subject to appropriation. Luis should add options to close the $81,240 gap or accept a smaller share."}
  - {id: a5b-erin, at: "D5 12:50", kind: reply, target: t5b-erin, to: [c_erin], summary: "confirmed the bill analysis matches the released note",
     body: "Yes, that matches the released note: $1,196,720 General Fund-State in 2027-29 ($834,400 in FY2028, $362,320 a year after) and $724,640 in 2029-31. Now that it's public you could use the exact figure. Imani"}
