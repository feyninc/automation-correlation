# Friday 2026-11-06, the rest of the day. The unanticipated receipt packet goes to Robert for signature and on to OFM.
# Priya's LMI paragraph treats a below-threshold variance as needing corrective action. The State Auditor's request
# list arrives. Imani prices Apprenticeship's reduction options (the vacancies are no longer all vacant) and drafts the
# Z-0388 note. After OFM releases HB 1214 at noon, Senate Ways and Means staff call with questions, including one about
# the agency's position. She pulls the records for the public records request.
#
# Computations (python3):
# - LMI Q1: 1,004,900 vs 980,000 = +24,900 (+2.5%), under both tests (5% and $25,000). After the November JV moving
#   12,144 to Program C: 992,756, +12,756 (+1.3%).
# - FY2026 08F: 24,580,000 spent against the 25,000,000 allotment; 420,000 unallotted; within the 50,000,000
#   appropriation.
# - Reductions (2027-29, benefits at 33.5%): 5% of the FY2027 Apprenticeship allotment 8,440,000 = 422,000 a year.
#   (a) the two consultant positions still vacant after 70412 fills: 2 x 78,000 x 1.335 = 208,260 (three would be
#   312,390); (b) outreach contracts 90,000; (c) travel 30% x 80,000 = 24,000; (d) printing and mailing 18,500.
#   Total 340,760 a year (4.04%), 681,520 a biennium; 422,000 - 340,760 = 81,240 short of 5%.
# - Z-0388.1/27: 0.3 FTE Research Analyst at 84,000 = 25,200; benefits 33.5% = 8,442; goods and services 0.3 x 8,000 =
#   2,400; one-time survey 12,000 in FY2028. FY2028 48,042; FY2029 36,042; 2027-29 84,084; 2029-31 72,084. Each fiscal
#   year under 50,000.
# - HB 1214 (released): FY2028 834,400 including the 480,000 one-time build and the 0.5 FTE project manager; FY2029 and
#   after 362,320 a year; 2027-29 1,196,720; 2029-31 724,640.
# - Unanticipated receipt: FY2027 147,250; 2027-29 32,750 (Thursday's packet).

