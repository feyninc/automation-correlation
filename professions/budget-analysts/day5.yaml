# Friday 2026-11-06. The Q1 variance report is due. Sam asks again about the Tableau purchase, now split by program.
# Robert asks for a one-paragraph Q1 summary for the director. Monday's plan.
#
# Variances over 5% and $25,000: only Training Grants (-$2,362,500, -37.8%). Administration (+$72,400, +3.9%),
# Apprenticeship (-1.8%) and LMI (+2.5%) are below the 5% threshold.
# Tableau split: 40 seats at $2,150: Admin 14 ($30,100), Training Grants 10 ($21,500), Apprenticeship 10 ($21,500),
# LMI 6 ($12,900).

threads:
  - id: t2-purchase
    x:
      - {at: "D5 09:30", from: c_sam, to: [worker], subject: "Re: Fund certification: PR-27-0418",
         body: "OK, split by program: Admin 14 seats, Training Grants 10, Apprenticeship 10, LMI 6, at $2,150 a seat. Mara says the LMI seats are in the BLS work plan. Can you certify now?"}
  - id: t5-robert
    app: chat
    path: "@robert/dm"
    title: Robert Nguyen (DM)
    x:
      - {at: "D5 11:00", from: c_robert, body: "with the Q1 report, give me a 4-5 sentence summary I can paste into the director's update"}
  - id: t5-ofm
    app: mail
    path: inbox/hb1214-released
    title: HB 1214 note released
    x:
      - {at: "D5 12:00", from: c_ofm, to: [worker, c_robert], subject: "HB 1214 fiscal note released",
         body: "The HB 1214 multi-agency fiscal note is released in the Fiscal Note system as of noon today. The House Appropriations work session is Monday 11/9 at 1:30. Tom"}
      - {at: "D5 12:30", from: c_robert, to: [worker], subject: "Re: HB 1214 fiscal note released",
         body: "I'll testify Monday. Can you give me three talking points and two likely questions with answers? Robert"}

actions:
  - {at: "D5 09:35", kind: read, target: t2-purchase, summary: "read Sam's split"}
  - {id: a5-purchase, at: "D5 10:00", kind: reply, target: t2-purchase, to: [c_sam], cc: [c_fednick], summary: "certified the split except the Training Grants seats",
     body: "Thanks Sam. I can certify Admin 14 seats ($30,100, 001-1), Apprenticeship 10 ($21,500, 001-1) and LMI 6 ($12,900, 001-2, per Mara's confirmation). The Training Grants 10 ($21,500) can go on 08F only if the seats are used to administer the grants (program staff tracking college contracts); if so, send me Kristin's confirmation and I'll certify those too. Total $86,000."}
  - {id: a5-report, at: "D5 14:00", kind: edit, app: docs, path: budget/fy27-q1-variance-report, target: doc-q1, title: FY2027 Q1 variance report,
     summary: "wrote the Q1 variance report",
     content: "# FY2027 Q1 (Jul-Sep) expenditure vs allotment\n\n| Program | Fund | Allotment | Actual | Variance | % |\n| --- | --- | --- | --- | --- | --- |\n| A Administration | 001-1 | 1,840,000 | 1,912,400 | +72,400 | +3.9% |\n| B Training Grants | 08F | 6,250,000 | 3,887,500 | -2,362,500 | -37.8% |\n| C Apprenticeship | 001-1 | 2,110,000 | 2,071,300 | -38,700 | -1.8% |\n| D Labor Market Information | 001-2 | 980,000 | 1,004,900 | +24,900 | +2.5% |\n| Total | | 11,180,000 | 8,876,100 | -2,303,900 | -20.6% |\n\nVariances over 5% and $25,000: Training Grants only. Community college contracts were signed 9/24, so first billings start in October. The colleges' forecast ($21.4M October-June) covers the $21.11M of allotment remaining, so no lapse is projected; monitor spring billing against the allotment.\nBelow threshold: Administration +3.9% (annual software renewals paid in September, timing); Apprenticeship -1.8%; LMI +2.5%.\nActions: none needed now; revisit Training Grants at the December report. No allotment amendment requested."}
  - {at: "D5 11:05", kind: read, target: t5-robert, summary: "read Robert's request"}
  - {id: a5-robert, at: "D5 14:15", kind: reply, target: t5-robert, to: [c_robert], summary: "sent Robert the director summary",
     body: "Q1 spending was $8.88M against $11.18M allotted (-20.6%), almost entirely Training Grants (-$2.36M), where college contracts were signed late in September. The colleges forecast $21.4M of billing October-June against $21.11M remaining, so no lapse is projected. Administration is 3.9% over on annual software renewals paid in September, a timing difference. The HB 1214 fiscal note was submitted Thursday (2027-29: $1.20M GF-S, 2.5 FTE in FY2028). The navigator decision package is being reworked to a partial-year cost for review next week."}
  - {id: a5-monday, at: "D5 16:00", kind: edit, app: docs, path: budget/monday-2026-11-09, target: doc-monday, title: "Monday 11/9 plan",
     summary: "left Monday's plan",
     content: "Monday 11/9: (1) navigator DP rework with Luis (April start base, 33.5% benefits, dropout evidence) for Angela; (2) Training Grants: Kristin's October billing actual vs the $1.6M forecast; (3) PR-27-0418: Kristin's confirmation for the 10 Training Grants seats; (4) any OFM follow-up on HB 1214."}
  - {id: a5-testimony, at: "D5 15:00", kind: reply, target: t5-ofm, to: [c_robert], summary: "prepared Robert's talking points",
     body: "Talking points: (1) HB 1214 costs $1,196,720 General Fund-State in 2027-29 ($834,400 in FY2028 with the one-time $480,000 system build, then $362,320 a year) and $724,640 in 2029-31. (2) 2.5 FTE in FY2028, 2.0 ongoing, to run the system, match wage records with ESD and write the annual report from December 2028. (3) No cost before the July 1, 2027 effective date. Likely questions: Why not build it in-house? A vendor-hosted system is cheaper to start and faster; an in-house build would need more IT staff we don't have. Can it be done with existing staff? No: current apprenticeship staff handle registrations; the wage matching and reporting are new work."}
  - {id: a5-jenna, at: "D5 15:10", kind: reply, target: t2-jenna, to: [c_jenna], summary: "pointed Jenna to the released note",
     body: "Hi Jenna, the HB 1214 note was released in the Fiscal Note system at noon today. Happy to walk through the assumptions before Monday's work session if useful. Imani"}

