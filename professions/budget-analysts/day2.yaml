# Tuesday 2026-11-03. Luis answers: Employment Security charges $18,000 a year for the wage match, and implementation
# needs a 0.5 FTE project manager in FY2028. A purchase request would charge state-only work to the federal LMI grant.
# Kristin asks whether the Training Grants underspend will lapse. House Appropriations staff ask for the HB 1214
# numbers before the note is filed.
#
# Revised note: FY2028 $749,440 + $18,000 + 0.5 x $126,720 ($63,360) = $830,800; FY2029 $341,440 + $18,000 = $359,440;
# 2027-29 $1,190,240; 2029-31 $718,880.

documents:
  - id: doc-purchase
    app: docs
    path: purchasing/pr-27-0418
    title: "Purchase request PR-27-0418 (Sam)"
    at: "D2 10:00"
    author: c_sam
    content: |
      Vendor: Tableau (Salesforce) licenses, 40 Creator seats for agency-wide dashboards (all programs), $86,000.
      Fund/program proposed: 001-2 / D Labor Market Information (federal BLS cooperative agreement), "has room".

threads:
  - id: t2-luis
    app: mail
    path: inbox/re-hb1214
    title: "Re: HB 1214"
    x:
      - {at: "D2 09:00", from: c_luis, to: [worker], subject: "Re: HB 1214: our assumptions",
         body: "Good questions. ESD charges $18,000 a year for the quarterly wage match (data-sharing agreement). And yes, we'd need a 0.5 FTE project manager for FY2028 only (same salary level as the analysts). Luis"}
  - id: t2-purchase
    app: mail
    path: inbox/pr-27-0418
    title: PR-27-0418 fund certification
    x:
      - {at: "D2 10:00", from: c_sam, to: [worker], subject: "Fund certification: PR-27-0418", body: "Please certify funds so we can order this week. Sam", att: [doc-purchase]}
  - id: t2-kristin
    app: chat
    path: "@kristin/dm"
    title: Kristin Lowe (DM)
    x:
      - {at: "D2 11:30", from: c_kristin, body: "are we going to lose the $2.3M we didn't spend in Q1? the colleges start billing in October"}
  - id: t2-jenna
    app: mail
    path: inbox/hb1214-house-staff
    title: HB 1214 numbers
    x:
      - {at: "D2 14:00", from: c_jenna, to: [worker], subject: "HB 1214: ballpark?",
         body: "Hi Imani, the sponsor wants a ballpark cost for HB 1214 before Thursday's work session. Can you give me your draft number? Jenna Wolfe, House Appropriations"}

actions:
  - {at: "D2 09:05", kind: read, target: t2-luis, summary: "read Luis's answers"}
  - {id: a2-fn, at: "D2 09:45", kind: edit, target: doc-fn, summary: "revised the fiscal note",
     content: "# HB 1214 fiscal note: DWT (draft 2 for Robert)\n\nSummary: HB 1214 requires DWT to build and run an apprentice tracking system and report annually from 12/1/2028. Effective 7/1/2027.\n\nExpenditures, General Fund-State (001-1):\n| | FY2028 | FY2029 | 2027-29 | 2029-31 |\n| --- | --- | --- | --- | --- |\n| FTE | 2.5 | 2.0 | 2.25 | 2.0 |\n| Salaries | 240,000 | 192,000 | 432,000 | 384,000 |\n| Benefits (32%) | 76,800 | 61,440 | 138,240 | 122,880 |\n| Goods and services ($8,000/FTE) | 16,000 | 16,000 | 32,000 | 32,000 |\n| Implementation (one time) | 480,000 | 0 | 480,000 | 0 |\n| Subscription | 0 | 72,000 | 72,000 | 144,000 |\n| ESD wage match | 18,000 | 18,000 | 36,000 | 36,000 |\n| Total | 830,800 | 359,440 | 1,190,240 | 718,880 |\n\nAssumptions: vendor-hosted system (program estimate); 2.0 FTE IT Business Analysts ongoing and a 0.5 FTE project manager in FY2028 only; goods and services for the 2.0 ongoing FTE; ESD data-sharing $18,000 a year. No revenue. No costs in 2025-27."}
  - {at: "D2 10:05", kind: read, target: doc-purchase, summary: "reviewed the purchase request"}
  - {id: a2-purchase, at: "D2 10:30", kind: reply, target: t2-purchase, to: [c_sam], cc: [c_fednick], summary: "declined to certify on the federal grant",
     body: "Sam, I can't certify PR-27-0418 on 001-2: that's the BLS cooperative agreement, which can pay only for the LMI work in its approved budget, and agency-wide Tableau seats for all programs aren't in it. Options: charge it to Admin (001-1), which is tight this year; or allocate seats by program and charge each program's share to its own fund, with the LMI share on 001-2 only if Mara confirms it's allowable. Want me to price the split?"}
  - {at: "D2 11:35", kind: read, target: t2-kristin, summary: "read Kristin's question"}
  - {id: a2-kristin, at: "D2 11:50", kind: reply, target: t2-kristin, to: [c_kristin], summary: "explained the underspend doesn't lapse yet",
     body: "No: unspent allotment carries forward within the fiscal year, so the Q1 underspend isn't lost; it only lapses if it's still unspent at June 30, 2027. The risk is pace: the year's Training Grants allotment is $25.0M; after Q1's $3.89M, the colleges need to bill about $2.35M a month for the next nine months instead of the planned $2.08M. Can you get me their expected billing by month? If it won't all be spent, we should ask OFM early to rephase the allotment."}
  - {at: "D2 14:05", kind: read, target: t2-jenna, summary: "read Jenna's request"}
  - {id: a2-jenna, at: "D2 14:20", kind: reply, target: t2-jenna, to: [c_jenna], cc: [c_ofm, c_robert], summary: "referred House staff to OFM",
     body: "Hi Jenna, thanks for reaching out. Our note is still in internal review, and fiscal notes are released through OFM's Fiscal Note system, so I can't share a draft number. I've copied Tom Rasmussen at OFM, who can tell you the release timing; the note is due Thursday at 5 p.m. Imani"}

