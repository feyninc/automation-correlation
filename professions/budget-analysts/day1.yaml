    check: {all: [{to_includes: c_fednick}, {number_equals: {value: 180830}}, {any: [{number_equals: {value: 16050}}, {number_equals: {value: 2500830}}]}]}
    must: ["16.9% of $1,070,000 MTDC = $180,830 (not 18.4%); total $2,500,830", "Meeting meal costs allowable only if necessary and budgeted"]
