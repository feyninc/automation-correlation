# Monday 2026-11-02. OFM assigns a fiscal note on HB 1214 (an apprenticeship tracking system); the program's
# assumptions arrive. The IT director wants $250,000 moved from Training Grants to cover IT overspending. A federal
# grant budget uses last year's indirect rate. The Q1 variance report is due Friday.
#
# Fiscal note: 2 FTE x ($96,000 + 32% benefits) = $253,440 a year; FY2028: $253,440 + $480,000 implementation +
# $16,000 goods and services = $749,440; FY2029 and later: $253,440 + $72,000 subscription + $16,000 = $341,440;
# 2027-29 biennium $1,090,880; 2029-31 $682,880. Indirect: MTDC = direct $2,320,000 less the subaward amounts over the
# first $50,000 of each (2 CFR 200.1: $1,450,000 - 4 x $50,000 = $1,250,000) = $1,070,000; x 16.9% = $180,830 (budget
# used 18.4% = $196,880; $16,050 too high). Total request $2,500,830, not $2,516,880.

documents:
  - id: doc-hb1214
    app: docs
    path: fiscal-notes/hb1214-request
    title: "OFM fiscal note request: HB 1214 (apprenticeship completion tracking)"
    at: "D1 08:30"
    author: c_ofm
    content: |
      HB 1214 (2027 session): requires DWT to build and maintain a statewide system tracking
      registered apprentices from enrollment to completion and wage outcomes, with an annual report to the
      Legislature beginning December 1, 2028. Effective date: July 1, 2027.
      Agency fiscal note due in the Fiscal Note system Thursday 11/5 by 5:00 p.m.
  - id: doc-hb1214-assumptions
    app: docs
    path: fiscal-notes/hb1214-program-assumptions
    title: HB 1214 cost assumptions (Apprenticeship program, Luis)
    at: "D1 11:00"
    author: c_luis
    content: |
      - Vendor-hosted tracking system: implementation $480,000 one time (FY2028), then a subscription of $72,000 a
        year from FY2029.
      - Staff: 2.0 FTE IT Business Analyst (salary $96,000 each), from July 1, 2027, ongoing: system administration,
        data matching with Employment Security wage records, the annual report.
      - Goods and services: $8,000 per FTE per year.
      - Benefits: use 32% of salary.
      - Fund: General Fund-State (001-1); no federal or fee revenue.
  - id: doc-grant-budget
    app: docs
    path: grants/dol-apprenticeship-expansion-budget-draft
    title: "US DOL apprenticeship expansion grant: budget draft (Mara)"
    at: "D1 13:00"
    author: c_fednick
    format: csv
    content: |
      line,amount
      personnel,620000
      fringe,198400
      travel,24000
      supplies,15600
      contractual (4 subawards; the first $50,000 of each counts toward MTDC),1450000
      other (advisory committee meeting costs),12000
      total direct,2320000
      MTDC base (direct less subaward amounts over $50,000 each),1070000
      indirect at 18.4% of MTDC,196880
      total request,2516880

threads:
  - id: t1-ofm
    app: mail
    path: inbox/hb1214-fiscal-note
    title: HB 1214 fiscal note
    x:
      - {at: "D1 08:30", from: c_ofm, to: [worker], cc: [c_robert], subject: "Fiscal note request: HB 1214 (due Thu 11/5 5 p.m.)", body: "Assigned to DWT. Request attached. Tom", att: [doc-hb1214]}
  - id: t1-sam
    app: mail
    path: inbox/it-overspend
    title: IT overspend
    x:
      - {at: "D1 10:00", from: c_sam, to: [worker], cc: [c_kristin], subject: "Move $250K from Training Grants to Admin?",
         body: "Imani, Admin is over in Q1 because of the annual software renewals, and Training Grants is $2.3M under. Can you just move $250,000 from Training Grants to Admin so we're not showing red? Kristin's OK with it. Sam"}
  - id: t1-luis
    app: mail
    path: inbox/hb1214-assumptions
    title: HB 1214 assumptions
    x:
      - {at: "D1 11:00", from: c_luis, to: [worker], subject: "HB 1214: our assumptions", body: "Here's what we think it takes. Luis", att: [doc-hb1214-assumptions]}
  - id: t1-mara
    app: mail
    path: inbox/dol-grant-budget
    title: DOL grant budget
    x:
      - {at: "D1 13:00", from: c_fednick, to: [worker], subject: "DOL apprenticeship grant: budget check before Friday submission", body: "Imani, can you check the budget before I submit Friday? Mara", att: [doc-grant-budget]}
  - id: t1-luis-vac
    app: mail
    path: inbox/apprenticeship-vacancies
    title: Apprenticeship vacancies
    x:
      - {at: "D1 15:00", from: c_luis, to: [worker], subject: "Vacancy savings?",
         body: "Imani, we have 3 vacant apprenticeship consultant positions ($78,000 salary each) that we won't fill until March 1. How much does that save this fiscal year, and can we use it for the navigator pilot? Luis"}

actions:
  - {at: "D1 08:35", kind: read, target: t1-ofm, summary: "read OFM's fiscal note request"}
  - {at: "D1 10:05", kind: read, target: t1-sam, summary: "read Sam's request"}
  - {id: a1-sam, at: "D1 10:30", kind: reply, target: t1-sam, to: [c_sam], cc: [c_kristin, c_robert], summary: "explained the transfer can't be done that way",
     body: "Sam, I can't do that one, for two reasons. Training Grants is the Workforce Training Account (08F), which by statute can only pay for training grants and their administration, not agency IT; and moving appropriation between programs needs an allotment amendment that OFM approves, not a budget office entry. The good news: Admin's Q1 overage ($72,400, 3.9%) is the annual renewals paid in September, so it's timing; it'll come back by Q2 if monthly spending holds. I'll explain it that way in the Q1 report. If Admin is really short for the year, let's look at a General Fund-State allotment amendment with Robert."}
  - {at: "D1 11:05", kind: read, target: doc-hb1214-assumptions, summary: "read the program's assumptions"}
  - {id: a1-luis, at: "D1 11:30", kind: reply, target: t1-luis, to: [c_luis], summary: "asked Luis two questions on the assumptions",
     body: "Thanks Luis. Two questions before I build the note: (1) Does the Employment Security wage match need a data-sharing agreement, and does ESD charge for it? (2) Is 2.0 FTE enough for the first annual report in December 2028, or does implementation in FY2028 need temporary help? I'll draft with your numbers today and update if needed."}
  - {at: "D1 13:05", kind: read, target: doc-grant-budget, summary: "checked the grant budget"}
  - {id: a1-mara, at: "D1 13:40", kind: reply, target: t1-mara, to: [c_fednick], summary: "corrected the indirect rate",
     body: "Mara, one fix: the budget uses 18.4%, which was the FY2026 rate. The current NICRA (7/1/2026-6/30/2027) is 16.9% of MTDC, so indirect is $1,070,000 x 16.9% = $180,830, not $196,880 ($16,050 less), and the total request becomes $2,500,830. The MTDC base (the first $50,000 of each subaward) is right. Also, the $12,000 for advisory committee meetings is fine if the meals are needed for the meetings and itemized in the narrative (2 CFR 200.432)."}
  - {id: a1-fn, at: "D1 16:00", kind: edit, app: docs, path: fiscal-notes/hb1214-draft, target: doc-fn, title: HB 1214 fiscal note (draft),
     summary: "drafted the HB 1214 fiscal note",
     content: "# HB 1214 fiscal note: DWT (draft for Robert)\n\nSummary: HB 1214 requires DWT to build and run an apprentice tracking system and report annually from 12/1/2028. Effective 7/1/2027.\n\nExpenditures, General Fund-State (001-1):\n| | FY2028 | FY2029 | 2027-29 | 2029-31 |\n| --- | --- | --- | --- | --- |\n| FTE | 2.0 | 2.0 | 2.0 | 2.0 |\n| Salaries (2 x $96,000) | 192,000 | 192,000 | 384,000 | 384,000 |\n| Benefits (32%) | 61,440 | 61,440 | 122,880 | 122,880 |\n| Goods and services ($8,000/FTE) | 16,000 | 16,000 | 32,000 | 32,000 |\n| Implementation (one time) | 480,000 | 0 | 480,000 | 0 |\n| Subscription | 0 | 72,000 | 72,000 | 144,000 |\n| Total | 749,440 | 341,440 | 1,090,880 | 682,880 |\n\nAssumptions: vendor-hosted system (program estimate); 2.0 FTE IT Business Analysts from 7/1/2027; wage data from Employment Security (data-sharing cost to confirm). No revenue. No costs in the 2025-27 biennium."}
  - {id: a1-vac, at: "D1 15:40", kind: reply, target: t1-luis-vac, to: [c_luis], cc: [c_robert], summary: "estimated the vacancy savings",
     body: "Luis, assuming the positions were budgeted for the full year: 3 x $78,000 x 1.32 = $308,880 a year; vacant July through February is 8 months, so about $205,920 in FY2027 savings (if they've been vacant since July 1). It's the same program and fund (001-1), so using it for a short pilot is possible within the allotment, but anything that creates ongoing positions needs the supplemental request, and Robert should approve the use. Want me to cost a pilot from March to June?"}

needs:
