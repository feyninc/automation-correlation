    check: {all: [{to_includes: c_sam}, {mentions_any: [08F, Workforce Training Account]}, {mentions_any: [allotment amendment, OFM]}]}
    must: ["08F can only fund training grants; program transfers need an OFM-approved allotment amendment", "Admin's +$72,400 is timing (annual renewals)"]
    must_not: ["Agrees to move the money"]
