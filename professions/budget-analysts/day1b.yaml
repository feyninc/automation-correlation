calls:
  - id: c1b-lena
    path: 2026-11-02/0940-lena-park-sound-trades
    title: Inbound call, Lena Park (Sound Trades Training Alliance, contract AP-27-009)
    start: "D1 09:40:00"
    turns:
      - [c_lena, "Hi Imani, it's Lena Park at Sound Trades. Ana said you're the person for money questions. Our contract was signed September 28th, but we ran orientation the week of the 21st. Can I put those days on the October invoice?", 8]
      - [worker, "Hi Lena. I'm sorry, no: the contract only covers costs from its start date, September 28th, so the orientation week before that can't be billed to AP-27-009. Please leave those days off the invoice."]
      - [c_lena, "Okay. If I send the invoice today, when will we actually get paid?", 6]
      - [worker, "We pay within 30 days of receiving a properly completed invoice, so if a complete invoice arrives today, by December 2nd. Complete means it covers only September 28th onward and has the backup the contract asks for; if Ana has to send it back, the 30 days start again."]
      - [c_lena, "That's fair. Last thing, and I know it's a big ask: payroll for our instructors is tight until that check arrives. Could DWT pay us two months ahead, about sixty thousand dollars?", 8]
      - [worker, "I can't do that one. State payments are made after the services are delivered, so there's no way to pay ahead of the work. What I can suggest is billing every month as soon as the month closes, and I'll ask Ana to turn your invoices around quickly."]
      - [c_lena, "Understood. Thanks for being straight with me.", 4]

