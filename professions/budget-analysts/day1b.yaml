     body: "Lena Park (Sound Trades, AP-27-009, executed 9/28/2026). (1) Asked to bill orientation week of 9/21: told her no, costs only from the 9/28 start date. (2) Payment timing: within 30 days of a properly completed invoice (by 12/2 if a complete invoice arrives 11/2). (3) Asked for a two-month advance (~$60,000): declined, we pay only after services are delivered; suggested prompt monthly billing. Follow-up: tell Ana to check the October invoice for pre-9/28 costs."}
  - {id: a1b-ana-travel, at: "D1 10:35", kind: reply, target: t1b-ana-dm, to: [c_ana], summary: "OK'd the Yakima travel within the allotment",
     body: "Yes from budget: Apprenticeship (001-1) finished Q1 $38,700 under its allotment, and $4,200 of in-state travel fits easily. Luis approves the travel authorizations; book at state rates and send me the final estimate when the TAs are in so I can plan January."}
  - {id: a1b-csc, at: "D1 11:00", kind: reply, target: t1b-csc, to: [c_priya], summary: "found the error in Priya's allocation",
     body: "Priya, one fix: LMI's share is the FY2026 16.40%, while the others are Q1 salary shares, so the shares add to 104% and the amounts to $1,335,360, $51,360 more than the $1,284,000 bill. On Q1 salary charges LMI is $335,000 of $2,700,000, 12.41%, which is $159,311. Using the same basis for all four: A $485,067, B $114,133, C $525,489, D $159,311, total $1,284,000. Otherwise it looks good."}
  - {id: a1b-erin, at: "D1 12:00", kind: reply, target: t1b-erin, to: [c_erin], summary: "told Erin when the fiscal summary will come",
     body: "Hi Erin, happy to. Robert reviews the draft note Wednesday, so I'll send you the summary sentence as soon as he signs off; I'd rather not send numbers that might still change. The note is due to OFM Thursday at 5. Imani"}
  - {id: a1b-call-ana, at: "D1 12:30", kind: noop, target: t1b-ana-dm, minutes: 10, summary: "called Ana about the Sound Trades start date (9/28) and the invoice check"}
  - {id: a1b-admin-proj, at: "D1 12:55", kind: new, app: mail, path: sent/admin-year-end-projection, target: t1b-sent-admin-proj, to: [c_robert], cc: [c_sam], subject: "Administration FY2027 projection (renewals pulled out)",
     summary: "sent Robert and Sam the Administration year-end projection",
     body: "Robert, Sam: Administration spent $1,912,400 in Q1, of which $210,000 was the once-a-year renewals Gail listed. Without them the run rate is about $567,467 a month; at that pace October-June is $5,107,200, so the year comes to about $7,019,600 against the $7,360,000 allotment, roughly $340,400 (4.6%) under. Assumptions: monthly spending holds at the Q1 pace and no other annual payments fall in the rest of the year. So Admin isn't headed over; the Q1 overage is timing. Imani"}
  - {id: a1b-kevin, at: "D1 13:50", kind: reply, target: t1b-kevin, to: [c_kevin], cc: [c_erin, c_robert], summary: "sent Senate staff the Q1 08F actuals",
     body: "Hi Kevin, Training Grants (Workforce Training Account, 08F), Q1 FY2027 (July-September) per AFRS: expenditures $3,887,500 against a Q1 allotment of $6,250,000. The gap is timing: the community college contracts were signed 9/24, so their billings start in October. The FY2027 allotment is $25,000,000. Imani Carter, DWT Budget Office"}
  - {id: a1b-appr-status, at: "D1 13:55", kind: edit, app: docs, path: budget/apprenticeship-status-2026-11-02, target: doc-appr-status, title: "Apprenticeship budget status for the 11/2 check-in",
     summary: "prepared the Apprenticeship status sheet for the check-in",
     content: "# Apprenticeship (Program C, 001-1): status for the 11/2 check-in\n\n| | Amount |\n| --- | --- |\n| Q1 allotment | 2,110,000 |\n| Q1 actual (AFRS) | 2,071,300 |\n| Q1 variance | -38,700 (-1.8%) |\n| FY2027 allotment | 8,440,000 |\n| Remaining for Oct-Jun | 6,368,700 |\n| Monthly allotment | 703,333 |\n| Spending pace available, Oct-Jun | 707,633 a month |\n\nVacancies: 3 consultant positions ($78,000), vacant since July; each saves about $8,580 a month with benefits (32%), $25,740 a month for the three.\nIn the pipeline: Sound Trades AP-27-009 (pre-apprenticeship, 9/28-6/30, max $412,000; first invoice due this week); Yakima sponsor meeting travel (~$4,200, January); completion ceremony 11/19 (PR coming).\nTo decide: timing of the vacancies; any one-time use of the savings needs Robert's approval."}
  - {id: a1b-appr-mtg, at: "D1 14:00", kind: noop, target: cal-imani, minutes: 45, summary: "Apprenticeship monthly budget check-in with Luis and Ana"}
  - {id: a1b-owen, at: "D1 15:15", kind: reply, target: t1b-owen, to: [c_owen], cc: [c_luis], summary: "asked Contracts to split AP-27-012 by fiscal year",
     body: "Owen, the scope and fund are fine, but the budget section can't say the full $96,000 is available. AP-27-012 runs past June 30, and General Fund-State is appropriated by fiscal year: I can certify $56,000 for December-June (7 months x $8,000) against FY2027. The $40,000 for July-November 2027 depends on the 2027-29 budget, which isn't enacted yet, so please state the amounts by fiscal year and add a subject-to-appropriation clause for the FY2028 portion. Luis, I'll make sure the $40,000 is in the 2027-29 base. Imani"}
  - {id: a1b-call-tom, at: "D1 15:25", kind: noop, target: t1-ofm, minutes: 12, summary: "call with Tom Rasmussen (OFM) about the HB 1214 assignment and the 2027-29 follow-up questions"}
  - {id: a1b-call-gail, at: "D1 16:15", kind: noop, target: t1b-renewals, minutes: 10, summary: "call with Gail on how the renewals post each September"}

