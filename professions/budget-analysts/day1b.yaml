# Monday 2026-11-02, the rest of the day. The budget office huddle, the Apprenticeship monthly check-in, and the
# ordinary load: a pre-apprenticeship provider (Sound Trades, contract AP-27-009, signed 9/28) calls to bill orientation
# days before the contract and to ask for an advance; Robert wants a year-end projection for Administration with the
# September renewals pulled out; Priya's central service charge allocation doesn't add up; Senate Ways and Means staff
# ask for Q1 actuals (public, unlike the pending note); a new outreach contract runs past June 30 on a fiscal-year
# appropriation; fund certifications. This file also holds the new contacts, policies, sources and every traffic
# template for the week.
#
# Computations (python3):
# - Payment clock: a properly completed invoice received Mon 11/2 + 30 days = Wed 12/2/2026 (RCW 39.76.011).
# - Administration: September renewals 96,400 + 18,200 + 12,600 + 58,300 + 24,500 = 210,000. Run rate without them
#   (1,912,400 - 210,000) / 3 = 567,466.67 a month; Oct-Jun 9 x 567,466.67 = 5,107,200; year 1,912,400 + 5,107,200 =
#   7,019,600 against the 7,360,000 allotment: 340,400 under (4.6%).
# - Apprenticeship: Q1 2,071,300 vs 2,110,000 = -38,700 (-1.8%); FY2027 8,440,000 - 2,071,300 = 6,368,700 left, or
#   707,633 a month for 9 months against a 703,333 monthly allotment. Each vacant consultant: 78,000 x 1.32 / 12 =
#   8,580 a month; three = 25,740 a month.
# - Central service charges FY2027 1,284,000 allocated by Q1 salary charges (A 1,020,000; B 240,000; C 1,105,000;
#   D 335,000; total 2,700,000): A 37.78% 485,067; B 8.89% 114,133; C 40.93% 525,489; D 12.41% 159,311 (sum
#   1,284,000). Priya's draft uses D 16.40% (the FY2026 share): D 210,576, shares sum to 104.0% and the amounts to
#   1,335,360, 51,360 more than the bill.
# - AP-27-012 (Cascade Pathways, 001-1, $8,000 a month, 12/1/2026-11/30/2027): FY2027 Dec-Jun 7 x 8,000 = 56,000;
#   FY2028 Jul-Nov 5 x 8,000 = 40,000; total 96,000.
# - Sound Trades invoice: 6,450 (Sept 21-27, before the 9/28 contract) + 41,380 (Sept 28-Oct 31) = 47,830.
# - Reference figures for the rest of the week: 08F 2025-27 biennial appropriation 50,000,000; FY2026 actual
#   24,580,000; unallotted 420,000; the FY2027 one-time college equipment grants 1,200,000 (2027-29 base 23,800,000 a
#   year, 47,600,000 a biennium, 2,400,000 less than 2 x 25,000,000).

