     body: "Jenna Wolfe (House Appropriations staff) asked again for the HB 1214 number, then for a yes or no on a dollar threshold, then for the cost drivers. Gave nothing before OFM's release; referred timing to Tom Rasmussen (OFM); offered a walk-through of the assumptions once released, Monday morning before the 1:30 work session. Robert and Erin to be told."}
