# Thursday 2026-11-05, the rest of the (long) day. Grants management committee, the decision package review and the
# Q1 pre-read with Robert. House staff call again for an HB 1214 number before it goes to OFM. October's preliminary
# close arrives. Two LMI economists' Q1 salaries were charged 100% to the BLS agreement though 20% of their time was
# state work, so the Q1 draw is now too high. Robert wants an Apprenticeship salary projection with the hiring plan;
# Kristin asks for room for a $350,000 college amendment; Mara wants to move DOL money into a new subaward. Imani
# drafts the Z-0217 note and the foundation grant's unanticipated receipt packet. Not caught: the HB 1214 note goes in
# without the 2031-33 biennium.
#
# Computations (python3):
# - LMI time and effort: 2 economists x 92,000 x 1.32 x 3/12 x 20% = 12,144 moved from 001-2 (Program D) to 001-1
#   (Program C). Q1 federal expenditures become 1,004,900 - 12,144 = 992,756; the Q1 draw (940,000 + 64,900 =
#   1,004,900) is 12,144 too high, so the next LMI draw is reduced by 12,144.
# - Z-0217.1/27: 174 hours a year / 2,088 = 0.08 FTE of a 96,000 IT Business Analyst: salary 8,000, benefits 33.5%
#   2,680, total 10,680 a year (FY2028 and FY2029); 2029-31 21,360. Under 50,000 every fiscal year.
# - Apprenticeship salaries and benefits FY2027: Q1 actual 1,644,000 + filled positions Oct-Jun 9 x 548,000 =
#   4,932,000 + 70412 Dec-Jun 7 x 8,580 = 60,060 + two consultants Mar-Jun 2 x 4 x 8,580 = 68,640 + two navigator
#   project positions Mar-Jun 2 x 4 x 9,900 = 79,200 + the economists' Q1 reallocation 12,144 = 6,796,044 against the
#   6,900,000 salaries-and-benefits allotment: 103,956 under.
# - Riverbend: FY2027 allotment left 25,000,000 - 3,887,500 = 21,112,500; forecast 21,400,000 is 287,500 over it.
#   Appropriation: 50,000,000 - FY2026 24,580,000 - FY2027 (3,887,500 + 21,400,000) = 132,500 left. A 350,000 amendment
#   exceeds the appropriation by 350,000 - 132,500 = 217,500.
# - DOL award budget revision: 10% of 1,800,000 = 180,000; cumulative transfers 110,000 + 95,000 = 205,000.
# - October preliminary (FM 16) vs monthly allotment (annual / 12): A 598,200 vs 613,333 (-15,133); B 1,581,400 vs
#   2,083,333 (-501,933; 18,600 under the colleges' 1,600,000 October forecast); C 702,900 vs 703,333 (-433);
#   D 331,600 vs 326,667 (+4,933).
# - Navigator DP revision: FY2027 4 FTE x 3/12 = 1.0 FTE (annual average); ongoing 4 x 90,000 x 1.335 = 480,600 (Luis
#   kept 1.32: 475,200).
# - Unanticipated receipt, FY2027 (Dec-Jun): analyst 0.5 x 90,000 x 1.32 = 59,400 a year, 4,950 a month, 7 months =
#   34,650; survey 60,000 (Jan-Mar, 20,000 a month); data 52,600 (Feb). FY2027 147,250 (Dec 4,950; Jan 24,950; Feb
#   77,550; Mar 24,950; Apr-Jun 4,950 each). July-November 2027: analyst 5 x 4,950 = 24,750 + report 8,000 = 32,750,
#   for the 2027-29 budget. 147,250 + 32,750 = 180,000. FY2027 FTE 0.5 x 7/12 = 0.29.
# - HB 1214 outyears: 2031-33 = 2 x 362,320 = 724,640.

