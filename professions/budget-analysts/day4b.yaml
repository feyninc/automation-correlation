     body: "Trevor, the charges have to follow the certifications (2 CFR 200.430(g)), so let's move 20% of their Q1 salaries and benefits off the BLS agreement: 2 x $92,000 x 1.32 x 3/12 x 20% = $12,144, from 001-2 (Program D) to 001-1 (Program C, the Apprenticeship analysis). Please do the JV in November. Because Mara's Q1 draw matched $1,004,900 of federal expenditures, we're now $12,144 over-drawn, so reduce the next LMI draw by $12,144 rather than holding the cash. Going forward, their timesheets should split the hours as they work them. Apprenticeship can absorb the $12,144. Imani"}
  - {id: a4b-z0217, at: "D4 12:10", kind: edit, app: docs, path: fiscal-notes/z-0217-draft, target: doc-z0217-note, title: "Z-0217.1/27 fiscal note (DWT, secondary): draft",
     summary: "drafted DWT's note on Z-0217.1/27",
     content: "# Z-0217.1/27 (ESD agency request, training benefits): DWT fiscal note draft\n\nFiscal impact: greater than zero but less than $50,000 per fiscal year.\n\nWhat the bill does for DWT: section 3 requires a quarterly file to ESD of approved training programs with completion and placement rates, from July 1, 2027. DWT already publishes the approved program list; the quarterly extract and the reconciliation with ESD's records are new.\n\nAssumptions: about 43.5 hours a quarter (174 hours a year) of an existing IT Business Analyst ($96,000), 0.08 FTE; benefits at OFM's standard 33.5%; no added goods and services or system changes.\n\nExpenditures, General Fund-State (001-1):\n| | FY2028 | FY2029 | 2027-29 | 2029-31 |\n| --- | --- | --- | --- | --- |\n| FTE | 0.08 | 0.08 | 0.08 | 0.08 |\n| Salaries | 8,000 | 8,000 | 16,000 | 16,000 |\n| Benefits | 2,680 | 2,680 | 5,360 | 5,360 |\n| Total | 10,680 | 10,680 | 21,360 | 21,360 |\n\nDWT would absorb this within existing IT resources by deferring planned enhancements to the provider performance dashboard; the costs are shown, as OFM's instructions require. No cash receipts. No capital impact."}
  - {id: a4b-call-kristin, at: "D4 12:00", kind: noop, target: t2-kristin, minutes: 15, summary: "call with Kristin about the colleges' forecast assumptions and the October billings"}
  - {id: a4b-call-tom, at: "D4 13:05", kind: noop, target: t4b-z0388, minutes: 10, summary: "call with Tom (OFM) about Z-0388's scope for DWT"}
  - {id: a4b-coffee, at: "D4 13:25", kind: reply, target: t4b-ana, to: [c_ana], summary: "explained coffee and cookies aren't allowed either",
     body: "Ana, I'm afraid it's the same rule: SAAM 70.10.30 doesn't allow agency money for coffee or light refreshments at celebrations or other hosting, however small the amount. The sponsors' own reception afterward at their hall is fine, as long as DWT isn't paying for it or running it. Imani"}
  - {id: a4b-salproj, at: "D4 13:50", kind: edit, app: docs, path: budget/apprenticeship-salaries-benefits-projection-fy27, target: doc-salproj, title: "Apprenticeship salaries and benefits, FY2027 projection",
     summary: "projected Apprenticeship salaries and benefits for the year",
     content: "# Apprenticeship (Program C) salaries and benefits, FY2027 projection (for the 11/5 pre-read)\n\n| Item | Amount |\n| --- | --- |\n| Q1 actual (Jul-Sep, AFRS objects A and B) | 1,644,000 |\n| Filled positions Oct-Jun (9 x $548,000, October payroll) | 4,932,000 |\n| Position 70412 from 12/1 (7 x $8,580) | 60,060 |\n| Two consultants from 3/1 (2 x 4 x $8,580) | 68,640 |\n| Navigator pilot, two project positions 3/1-6/30 (2 x 4 x $9,900) | 79,200 |\n| LMI economists' Q1 time moved to Program C (JV in November) | 12,144 |\n| Projected total | 6,796,044 |\n| Salaries and benefits allotment | 6,900,000 |\n| Projected under | 103,956 |\n\nAssumptions: payroll for filled positions stays at October's level; benefits at 32% for new hires; no further vacancies. If the economists keep doing Apprenticeship work, those hours charge to Program C too (not included). If the two consultant hires slip past March 1, each month saves $17,160."}
  - {id: a4b-preread, at: "D4 14:00", kind: noop, target: cal-imani, minutes: 30, summary: "Q1 variance report pre-read with Robert"}
  - {id: a4b-dolrev, at: "D4 14:40", kind: reply, target: t4b-mara, to: [c_fednick], summary: "advised the DOL budget revision needs prior approval",
     body: "Mara, yes, you need DOL's prior approval, for two reasons. (1) Cumulative transfers would be $110,000 + $95,000 = $205,000, more than the 10% of the $1,800,000 budget ($180,000) your award terms allow without approval (2 CFR 200.308(i)). (2) A subaward that wasn't in the approved application needs prior approval on its own (200.308(f)(6)). Send the request in the application's budget format and don't sign the subaward until DOL approves. One more thing: Cascade Pathways also has our state outreach contract AP-27-012, so the subaward's scope needs to be clearly different to avoid paying twice for the same outreach. Imani"}
  - {id: a4b-kristin, at: "D4 15:50", kind: reply, target: t4b-kristin, to: [c_kristin], cc: [c_robert], summary: "explained there's room for only $132,500",
     body: "Kristin, not for $350,000. After Q1, $21,112,500 of the FY2027 allotment is left and the colleges' forecast is $21.4 million, already $287,500 over it. The 08F appropriation for 2025-27 is $50.0 million; FY2026 spent $24.58 million, so once the forecast is covered only $132,500 of appropriation is left for the biennium. A $350,000 amendment would go $217,500 past the appropriation, which we can't do (RCW 43.88.260). Options: up to $132,500 this year, which would also need an allotment amendment through OFM since it's above the FY2027 allotment; or a smaller February-June cohort now with the rest in 2027-29, subject to appropriation. Robert decides; I'd watch the colleges' actual billing before committing even the $132,500. Imani"}
  - {id: a4b-dpcheck, at: "D4 16:05", kind: reply, target: t4b-luis, to: [c_luis], cc: [c_angela], summary: "sent Luis two fixes on the revised DP",
     body: "Luis, much better: the April start, no contingency and the dropout source are right, and $118,800 for FY2027 is correct. Two fixes: (1) FY2027 FTE is 1.0, not 4.0: four people for three months averages 1.0 FTE for the year, and OFM reads FTE as annual averages. (2) Ongoing cost should use OFM's standard 33.5% benefits rate for 2027-29: 4 x $90,000 x 1.335 = $480,600 a year, not $475,200. Imani"}
  - {id: a4b-oct-flash, at: "D4 16:20", kind: new, app: mail, path: sent/october-preliminary-flash, target: t4b-sent-oct, to: [c_robert], subject: "October preliminary: my programs",
     summary: "sent Robert an October preliminary flash for her programs",
     body: "Robert, October (FM 16) preliminary against monthly allotments: Training Grants $1,581,400 vs $2,083,333 (-$501,933), but only $18,600 under the colleges' $1.6M October forecast, and college invoices received after 11/4 post in the final close, so it's on track with the forecast. Administration $598,200 vs $613,333 (-$15,133), consistent with the run-rate projection now that the renewals are behind us. Apprenticeship $702,900 vs $703,333, on plan. LMI (Priya's, for completeness) $331,600 vs $326,667, +$4,933 federal. Nothing here changes the Q1 report's conclusions. Imani"}
  - {id: a4b-call-daniel, at: "D4 16:30", kind: noop, target: t4b-daniel, minutes: 10, summary: "call with Daniel on the foundation's payment terms and the project position"}
  - {id: a4b-ur, at: "D4 17:20", kind: edit, app: docs, path: grants/cascadia-unanticipated-receipt-request, target: doc-ur-cwf, title: "Unanticipated receipt request: Cascadia Workforce Foundation (draft for Robert)",
     summary: "drafted the unanticipated receipt packet for the foundation grant",
     content: "# Unanticipated receipt request: Cascadia Workforce Foundation, regional wage study (draft)\n\nAccount: General Fund-Private/Local, Program D (LMI). One grant, one packet.\n\nWhy it qualifies: not anticipated in the enacted 2025-27 budget; awarded 10/30/2026, after the 2026 session; the foundation restricts it to the regional wage study; outside source not controlled by DWT. No state match and no ongoing state commitment; the foundation pays the full $180,000 on countersignature, so expenditures never exceed cash received; no indirect costs.\n\nRequest for 2025-27 (FY2027, December-June): $147,250; 0.29 FTE.\n| Month | Analyst (0.5 FTE project) | Survey | Data | Total |\n| --- | --- | --- | --- | --- |\n| Dec | 4,950 | | | 4,950 |\n| Jan | 4,950 | 20,000 | | 24,950 |\n| Feb | 4,950 | 20,000 | 52,600 | 77,550 |\n| Mar | 4,950 | 20,000 | | 24,950 |\n| Apr | 4,950 | | | 4,950 |\n| May | 4,950 | | | 4,950 |\n| Jun | 4,950 | | | 4,950 |\n| FY2027 | 34,650 | 60,000 | 52,600 | 147,250 |\n\nJuly-November 2027 ($32,750: analyst $24,750, report $8,000) goes in the 2027-29 budget, not this request.\n\nTiming: to OFM Friday 11/6; nothing is committed until OFM approves after the 10-day legislative review (earliest Monday 11/16). Needs the agency head's (Robert's delegated) signature."}

