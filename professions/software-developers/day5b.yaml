documents:
  - id: repo-signing
    at: "D5 12:50"
    author: c_aisha
    content: |
      """Webhook signatures (BIL-1476): every delivery carries
      Tallyfin-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>" with the endpoint's signing secret>,
      where <body> is the exact bytes we send. Serialize once, sign those bytes, send those bytes.
      """
      import hashlib
      import hmac
      import json


      def prepare(secret: str, payload: dict, timestamp: int) -> tuple[bytes, dict]:
          """The request body and headers for one delivery."""
          body = json.dumps(payload, separators=(",", ":")).encode()
          mac = hmac.new(secret.encode(), str(timestamp).encode() + b"." + body, hashlib.sha256).hexdigest()
          return body, {"Content-Type": "application/json", "Tallyfin-Signature": f"t={timestamp},v1={mac}"}
  - id: repo-test-signing
    at: "D5 12:50"
    author: c_aisha
    content: |
      import hashlib
      import hmac
      import sys
      import types
      import unittest
      from unittest import mock

      from billing.signing import prepare


      def verify(secret: bytes, header: str, raw_body: bytes) -> bool:
          """What a tenant does: recompute the HMAC over the raw body it received."""
          parts = dict(p.split("=", 1) for p in header.split(","))
          want = hmac.new(secret, parts["t"].encode() + b"." + raw_body, hashlib.sha256).hexdigest()
          return hmac.compare_digest(want, parts["v1"])


      class FakeResponse:
          status_code = 200

          def __enter__(self):
              return self

          def __exit__(self, *exc):
              return False

          def iter_content(self, chunk_size):
              return iter([b"ok"])


      class TestSigning(unittest.TestCase):
          def test_signature_verifies_over_the_body(self):
              body, headers = prepare("whsec_test", {"type": "invoice.finalized", "id": "evt_1"}, 1762300000)
              self.assertTrue(verify(b"whsec_test", headers["Tallyfin-Signature"], body))
              self.assertTrue(headers["Tallyfin-Signature"].startswith("t=1762300000,v1="))

          def test_deliver_sends_the_signed_bytes(self):
              sent = {}

              def post(url, **kw):
                  sent.update(kw)
                  return FakeResponse()

              fake = types.ModuleType("requests")
              fake.post = post
              with mock.patch.dict(sys.modules, {"requests": fake}):
                  sys.modules.pop("billing.webhooks", None)
                  from billing import webhooks
                  webhooks.deliver("https://example.test/hook", {"type": "invoice.finalized", "id": "evt_2",
                                                                 "data": {"invoice": "in_42", "total": "135.00"}}, "whsec_test")
                  sys.modules.pop("billing.webhooks", None)
              self.assertNotIn("json", sent)
              self.assertTrue(verify(b"whsec_test", sent["headers"]["Tallyfin-Signature"], sent["data"]))


      if __name__ == "__main__":
          unittest.main()
  - id: repo-webhooks
    at: "D5 12:50"
    author: c_aisha
    content: |
      """Delivers webhooks to tenant-configured URLs and reads the response (streamed, capped at 64 KB) for the audit log."""
      import time

      import requests

      from billing.signing import prepare

      MAX_BODY = 64 * 1024


      def deliver(url: str, payload: dict, secret: str, timeout: float = 10.0) -> dict:
          data, headers = prepare(secret, payload, int(time.time()))
          with requests.post(url, data=data, headers=headers, timeout=timeout, stream=True) as r:
              body = b""
              for chunk in r.iter_content(chunk_size=8192):
                  body += chunk
                  if len(body) >= MAX_BODY:
                      break
              return {"status": r.status_code, "body": body[:MAX_BODY].decode(errors="replace")}
