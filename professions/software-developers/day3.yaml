actions:
  - {id: a3-merge1494, at: "D3 08:45", kind: noop, target: t1-pr1494, summary: "merged #1494 after Marcus's approval"}
  - {at: "D3 10:15", kind: read, target: t3-inc, summary: "joined #inc-0412"}
  - {id: a3-purge, at: "D3 10:21", kind: reply, target: t3-inc, summary: "stopped Ben from purging the queue",
     body: "Ben, please don't purge: purge deletes every queued task, including legitimate invoice finalizations and reminders, and they won't come back. The queue isn't stuck, it's redelivering. That runbook predates acks_late. Restart the workers instead (step 2) if needed."}
  - {at: "D3 11:06", kind: read, target: doc-dupes, summary: "read Tomasz's duplicate query"}
  - {id: a3-numbers, at: "D3 11:15", kind: reply, target: t3-inc, summary: "posted the impact numbers",
     body: "Impact (10:04-10:31 CT): 41 invoices finalized twice across 9 tenants. 41 duplicate invoice emails. 66 duplicate webhook deliveries (each tenant's invoices x enabled endpoints; Velmora has no webhooks). Largest: Larkfield 12 invoices / 24 webhooks, Tidelock 5 / 15. Tenants whose accounting systems ingest our webhooks may now hold duplicate invoices; Gabe has 2 such tickets."}
  - {at: "D3 11:35", kind: read, target: t3-pr1496, summary: "read Ben's hotfix"}
  - {id: a3-review1496, at: "D3 11:50", kind: reply, target: t3-pr1496, to: [c_ben], cc: [c_marcus], summary: "reviewed Ben's hotfix",
     body: "Thanks for jumping on it, but I don't think we should merge this. (1) The any() check then add is check-then-act: two workers handling the same redelivered task both see nothing and both send, which is exactly what happened at 10:04 (14 of the 41 were parallel). (2) The migration builds the unique index without CONCURRENTLY, which locks outbound_events (~40 writes/s) for the whole build, and it will fail anyway because the 41 duplicate rows already exist. #1496 (opened yesterday) does this properly: ON CONFLICT DO NOTHING on a unique key, deletes existing duplicates, then CREATE UNIQUE INDEX CONCURRENTLY in an autocommit block, with a parallel test. Marcus, can we take #1496 as the emergency change?"}
  - {at: "D3 12:05", kind: read, target: t3-ravi, summary: "read Ravi's request"}
  - {id: a3-ravi, at: "D3 12:10", kind: reply, target: t3-ravi, to: [c_ravi], cc: [c_marcus], summary: "routed Ravi to the IC for customer wording",
     body: "Ravi, customer comms go through Marcus as IC with CS sending; I'll give him the facts for a draft. Please don't say 'fixed' yet: the fix is merging this afternoon. I can tell you which tenants and how many invoices each: 9 tenants, 41 invoices; list in #inc-0412."}
  - {at: "D3 12:32", kind: read, target: t3-inc, summary: "read Marcus's approval of #1496"}
  - {id: a3-merge, at: "D3 14:45", kind: reply, target: t2-pr1497, to: [c_marcus], summary: "merged #1496 and ran the migration",
     body: "Merged #1496 (CI green, Marcus's approval as emergency change under INC-0412). Migration 0042 ran at 14:52: removed 107 duplicate rows (41 emails + 66 webhooks), unique index built concurrently and valid. Before the 18:00 cutoff."}
  - {at: "D3 13:00", kind: noop, target: cal-jordan, minutes: 60, summary: "system design interview with Ben"}
  - {at: "D3 14:32", kind: read, target: t3-ben-scorecard, summary: "read Ben's scorecard request"}
  - {id: a3-scorecard, at: "D3 14:40", kind: reply, target: t3-ben-scorecard, to: [c_ben], summary: "told Ben she'll write her own scorecard",
     body: "I'll write mine from my own notes before reading yours; that's the rule and it's fairer to the candidate. I'll have it in by 5."}
  - {at: "D3 16:32", kind: read, target: t3-nadia, summary: "read Nadia's question"}
  - {id: a3-nadia, at: "D3 16:40", kind: reply, target: t3-nadia, to: [c_nadia], summary: "gave Nadia the cutoff status",
     body: "INV-2240's migration (0042) landed at 14:52, before the cutoff, as the emergency change for INC-0412. #1494 (DST fix) is approved and merged this morning; the reminder backfill (CHG-3318) runs Thursday 06:00 with Marcus reviewing the dry run. #1490 is approved for Aisha to merge before Friday."}
  - {id: a3-scorecard-doc, at: "D3 16:55", kind: edit, app: docs, path: hiring/scorecard-candidate-k-jordan, target: doc-scorecard, title: "Scorecard: candidate K. (system design), Jordan",
     summary: "wrote her own scorecard from her notes",
     content: "# Scorecard: candidate K., system design (Jordan Ilic, 11/4)\n\nRecommendation: lean hire (senior), pending the coding and behavioral loops.\nRequirements and communication: strong. Clarified ordering, payload size and tenant isolation; structured and receptive to feedback.\nDesign: solid core (queue, workers, backoff with jitter, Postgres outbox, partitioning).\nGaps: idempotency and noisy-neighbor fairness only after prompting; no observability or dead-letter handling unprompted. For a senior bar these matter; probe operational depth in the next loop.\nWritten from my own notes before reading other feedback."}

