# Wednesday 2026-11-04. At 10:04 CT the auto-applied broker update fails the Redis primary over; Celery redelivers
# in-flight finalize_invoice tasks and, with INV-2240 unfixed, 41 invoices send duplicate webhooks and emails. Marcus
# is incident commander. Ben is about to purge the queue per a stale runbook, then posts a check-then-act hotfix
# with a locking migration. The CSM wants Jordan to email the tenants. An interview at 13:00, and Ben asks Jordan to
# copy his scorecard. The migration cutoff is 18:00.
#
# Duplicate deliveries: invoices x enabled endpoints: Larkfield 12x2 + Ostrander 7x1 + Tidelock 5x3 + Quenby 4x1 +
# Velmora 3x0 + Brennanvale 4x2 + Quillon 2x1 + Marrowgate 2x1 + Corriveau 2x2 = 66 webhooks; 41 emails; 9 tenants.

