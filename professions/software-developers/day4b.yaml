     summary: "wrote the webhook dispatch SLO and its burn-rate alerts",
     content: "# SLO: webhook dispatch (draft, Jordan, 11/5)\n\nSLI: share of webhook events whose first delivery attempt starts within 60 s of finalize_invoice committing. Measured on our side; tenant endpoint responses are excluded.\nSLO: 99.5% per calendar month. Error budget: 0.5% of events (October: 6,423 of 1,284,600; we used 4,980, 77.5%).\n\nAlerts (Google SRE workbook multiwindow burn rates, 30-day window):\n- Page: burn rate 14.4 over 1 h and 5 min, i.e. more than 7.2% of events late; 2% of the month's budget in an hour.\n- Page: burn rate 6 over 6 h and 30 min, i.e. more than 3.0% late; 5% of the budget.\n- Ticket: burn rate 1 over 3 days and 6 h, i.e. more than 0.5% late; 10% of the budget.\n\nWhy not 99.9% yet: October would have breached it (4,980 late vs 1,285 allowed), mostly 10/14's backlog (3,912). Revisit after the relay (RFC-031) and a month of data under these alerts.\nOwner: Billing. Datadog monitor to be created from this (Marcus's redelivery alert action can share the dashboard)."}
  - {id: a4b-leilani, at: "D4 08:40", kind: reply, target: t1-leilani, to: [c_leilani], summary: "told Leilani what to check on a dependency bump",
     body: "Good question. For a bump like this, check: (1) the advisory: affected < 2.8.0, fixed in 2.8.0, so 2.8.0 is the minimum; (2) that everything that depends on it allows the new version: requests 2.34.2 needs urllib3 >=1.26,<3 and botocore needs !=2.2.0,<3, both from PyPI; (3) that nothing else moved in the lock file; (4) that CI ran the webhook tests, since billing/webhooks.py is the code that streams responses. Then approve or ask."}
