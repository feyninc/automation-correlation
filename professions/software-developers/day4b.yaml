  - {id: a4b-review3812, at: "D4 14:05", kind: reply, target: t1b-pr3812, to: [c_sofia], summary: "reviewed Sofia's #3812: browser zone, pinned TZ in tests",
     body: "Thanks Sofia, nice and small. One real issue: toLocaleTimeString without a timeZone formats in the viewer's browser zone, not the tenant's, so the label can contradict the time. A Chicago tenant's 15:00 UTC send shows '3:00 PM' to Sam in Dublin, and a London tenant's 09:00 UTC send shows '3:00 AM' to Gabe in Chicago. The test passes only because jest.setup.ts pins TZ=America/Chicago; I ran it under TZ=UTC and got '3:00 PM'. Fix: pass timeZone: tenant.timeZone (and timeZoneName: 'short' if you want the abbreviation), and add London and Sydney cases. With that, all three give 9:00 under any TZ. Heads-up: en-US shows Sydney as 'GMT+11', not 'AEDT', so keep the zone name label too."}
  - {id: a4b-review1493, at: "D4 15:30", kind: reply, target: t1b-pr1493, to: [c_aisha], summary: "reviewed #1493: the signed bytes aren't the sent bytes",
     body: "Thanks for waiting, Aisha. The signing itself is right (HMAC-SHA256 over t.body, hex, t= and v1=). The bug is between signing and sending: signature_header signs json.dumps(payload, sort_keys=True, separators=(',', ':')), but deliver posts json=payload, which requests serializes itself with json.dumps defaults (insertion order, ', ' and ': ' separators). So tenants who verify over the raw request body, as your docs tell them to, will reject every delivery. I checked with a stub requests module: the bytes posted are {\"type\": \"invoice.finalized\", \"id\": \"evt_2\", ...}, the MAC is over {\"data\":...,\"id\":...,\"type\":...}, and verification fails.\n\nFix: serialize once to bytes, sign those bytes, post them with data= and Content-Type application/json. The current test can't catch this because it recomputes the MAC the same way the code does; test instead that the signature verifies over the exact bytes deliver() posts (stub requests in sys.modules, no network). Small extra: tell tenants to reject timestamps older than a few minutes, or a captured delivery can be replayed."}
  - {at: "D4 15:00", kind: noop, target: cal-jordan, minutes: 30, summary: "1:1 with Nadia"}
  - {id: a4b-kb, at: "D4 16:00", kind: edit, app: docs, path: support-kb/reminder-send-times, target: doc-kb-reminders, title: "Support KB: when will a tenant's reminders go out?",
     summary: "wrote a Support KB on reading reminder send times",
     content: "# When will a tenant's reminders go out? (Support KB, Billing, 11/5)\n\nRule: every payment reminder goes out at 09:00 in the tenant's time zone on its reminder date (3 days before the due date by default).\n\nHow to check one:\n1. Admin > Tenants > the tenant: the time zone is at the top (e.g. America/Chicago).\n2. Reminders tab: 'Remind on' is the local date; 'Send at (UTC)' is when it will go out, in UTC.\n3. Convert UTC to the tenant's zone. 09:00 local is 15:00 UTC for Chicago in winter (14:00 in summer), 14:00 UTC for New York in winter, 09:00 UTC for London and Dublin in winter, 16:00 UTC for Phoenix all year (no DST), and 22:00 UTC the previous day for Sydney in its summer (AEDT).\n4. The UTC hour moves when clocks change; the local time stays 09:00. That's expected.\n\nAs of Thu 11/5 06:04 CT (CHG-3318), every scheduled reminder is at 09:00 local, and new ones are computed correctly (#1494). If a scheduled reminder's Send at doesn't convert to 09:00 local, escalate to Billing on SUP with the tenant and reminder id. Don't edit send times in Admin."}

