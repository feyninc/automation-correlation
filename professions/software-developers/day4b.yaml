      - {at: "D4 16:30", from: c_aisha, to: [worker], subject: "Re: #1493",
         body: "Ouch, great catch, thank you. Pushed: signing.prepare(secret, payload, timestamp) serializes once (compact separators) and returns (body bytes, headers); deliver() posts data=body with Content-Type application/json; the test stubs requests and verifies the signature over the exact bytes posted (fails on my first version). Tenant docs now say 'raw request body'.\n\n```diff\n+def prepare(secret: str, payload: dict, timestamp: int) -> tuple[bytes, dict]:\n+    body = json.dumps(payload, separators=(\",\", \":\")).encode()\n+    mac = hmac.new(secret.encode(), str(timestamp).encode() + b\".\" + body, hashlib.sha256).hexdigest()\n+    return body, {\"Content-Type\": \"application/json\", \"Tallyfin-Signature\": f\"t={timestamp},v1={mac}\"}\n-    with requests.post(url, json=payload, headers=headers, timeout=timeout, stream=True) as r:\n+    data, headers = prepare(secret, payload, int(time.time()))\n+    with requests.post(url, data=data, headers=headers, timeout=timeout, stream=True) as r:\n```"}
