         body: "Adds billing/proration.py and tests for the cancellation credit. Could you review?\n\n```diff\n+++ billing/proration.py\n+\"\"\"Credit for a mid-period cancellation.\"\"\"\n+from datetime import date\n+from decimal import ROUND_HALF_UP, Decimal\n+\n+\n+def prorated_credit(price: str, period_start: date, period_end: date, cancel_on: date) -> Decimal:\n+    days = (period_end - period_start).days + 1\n+    remaining = (period_end - cancel_on).days\n+    return (Decimal(price) * remaining / days).quantize(Decimal(\"0.01\"), ROUND_HALF_UP)\n+++ tests/test_proration.py\n+    def test_mid_month(self):\n+        self.assertEqual(prorated_credit(\"499.00\", date(2026, 11, 1), date(2026, 11, 30), date(2026, 11, 18)),\n+                         Decimal(\"199.60\"))\n+\n+    def test_cancel_on_first_day(self):\n+        self.assertEqual(prorated_credit(\"300.00\", date(2026, 11, 1), date(2026, 11, 30), date(2026, 11, 1)),\n+                         Decimal(\"290.00\"))\n```\nCI: green."}
