     body: "Verification after 0042: outbound_events_dedupe is valid (pg_index.indisvalid true; \\d shows no INVALID), and a GROUP BY invoice_id, kind, target HAVING count(*) > 1 returns 0 rows, so no duplicate keys remain. No 'no unique or exclusion constraint' errors in Sentry since the deploy. Redelivery rate at baseline since 10:31; no lock waits on outbound_events during the build."}
  - {id: a3b-rebase, at: "D3 15:35", kind: edit, target: repo-mig-0043, summary: "rebased 0043 onto 0042", content: "\"\"\"PG17 safe search_path (Platform's PG17 checklist, item 1).\n\nThe reminders_local_day expression index (0031) calls reminder_local_day(), which calls canonical_tz() unqualified,\nwhich reads tz_aliases unqualified. PG17 runs ANALYZE, REINDEX, VACUUM and CREATE INDEX with search_path =\npg_catalog, pg_temp, so both lookups fail there. Pin each function's search path; no table is touched.\n\"\"\"\nfrom alembic import op\n\nrevision = \"0043\"\ndown_revision = \"0042\"\n\n\ndef upgrade():\n    op.execute(\"ALTER FUNCTION public.canonical_tz(text) SET search_path = public, pg_temp\")\n    op.execute(\"ALTER FUNCTION public.reminder_local_day(timestamptz, text) SET search_path = public, pg_temp\")\n\n\ndef downgrade():\n    op.execute(\"ALTER FUNCTION public.reminder_local_day(timestamptz, text) RESET search_path\")\n    op.execute(\"ALTER FUNCTION public.canonical_tz(text) RESET search_path\")\n"}
  - {id: a3b-0043, at: "D3 15:40", kind: reply, target: t1b-pr1495, to: [c_aisha], summary: "rebased #1495 onto 0042 and merged it",
     body: "Rebased: 0043's down_revision is now 0042, one Alembic head (0041 -> 0042 -> 0043). CI green; merged 15:40 and applied to prod (ALTER FUNCTION only, instant). ANALYZE reminders runs clean on prod. Before the 18:00 cutoff."}
  - {id: a3b-priya, at: "D3 15:45", kind: reply, target: t1b-platform-chat, summary: "told Priya 0043 is on prod",
     body: "Billing: 0043 merged at 15:40 and applied to prod; canonical_tz and reminder_local_day now have search_path = public, pg_temp. ANALYZE reminders is clean. That's everything from Billing's checklist."}
  - {id: a3b-rehearsal, at: "D3 16:00", kind: noop, target: t2-tomasz, minutes: 25, summary: "rehearsed the CHG-3318 dry run on the replica with Tomasz"}
  - {id: a3b-nadia, at: "D3 16:45", kind: reply, target: t3-nadia, to: [c_nadia], summary: "added the PG17 migration to the cutoff status",
     body: "One more for the freeze picture: 0043 (PG17 search_path fix, #1495) merged at 15:40, so Billing has nothing left for the cutoff."}
  - {id: a3b-timeline, at: "D3 17:00", kind: edit, target: doc-inc-timeline, summary: "wrote up the INC-0412 timeline as scribe",
     content: "# INC-0412 timeline (scribe: Jordan Ilic). IC: Marcus Lee. All times CT, Wed 11/4.\n\n- 10:04:41 billing-broker primary fails over to its replica (ElastiCache service update elasticache-20261015-002, auto-applied in the maintenance window).\n- 10:05 PagerDuty #4471 and Datadog: task redelivery rate 38x baseline. 10:07 Ben acknowledges.\n- 10:10 Tomasz sees invoices with two invoice.finalized rows in outbound_events.\n- 10:12 Marcus declares SEV-2, IC. Ben primary, Jordan secondary and scribe.\n- 10:20 Purge proposed per runbook step 3; 10:21 stopped (purge would delete legitimate queued tasks; the runbook predates acks_late).\n- 10:31 Redelivery back to baseline (27 minutes of redeliveries).\n- 10:40 Support: 6 tickets, 2 about duplicate invoices in accounting systems.\n- 11:06 Tomasz's duplicate query; 11:15 impact posted: 41 invoices, 9 tenants, 41 duplicate emails, 66 duplicate webhooks.\n- 11:20 Status page wording approved by Marcus for CS.\n- 11:30 Hotfix #1497 proposed (check-then-act, non-concurrent unique index); 11:50 review: not merged; 12:15 closed.\n- 12:30 #1496 (INV-2240) approved by Marcus as the emergency change.\n- 12:45 Ad-hoc DELETE on prod proposed; not run (0042 does it under the change).\n- 12:55 Support tickets reconciled: 5 of 6 are INC-0412; SUP-8833 (Hollis & Pike, 09:41) is unrelated.\n- 14:45 #1496 merged; 14:52 migration 0042 removes 107 duplicate rows (41 emails + 66 webhooks); 14:58 unique index built concurrently.\n- 15:20 Verified: index valid, 0 duplicate keys, redelivery at baseline, no lock waits.\n- 16:00-16:30 Finalize peak passes clean.\n- 16:50 Resolved by Marcus (6 h 46 min after the failover).\n\nNot part of the incident: 15:40 #1495 (0043, PG17 search_path) merged before the 18:00 schema cutoff."}
  - {id: a3b-evening, at: "D3 17:20", kind: reply, target: t2-billing-chat, summary: "left an evening note for the on-call",
     body: "Evening note for on-call: INC-0412 resolved 16:50. #1496 and 0042 are in, the dedupe index is valid, redelivery is safe now. 0043 is in too. Watch: redelivery rate and any finalize errors overnight. Tomorrow 06:00 CHG-3318 (reminder backfill) with Tomasz, Marcus reviewing; I'm on at 05:50. Ben has the pager."}

