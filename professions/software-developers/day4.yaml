actions:
  - {at: "D4 05:55", kind: read, target: doc-dryrun, summary: "checked the dry run with Marcus and Tomasz"}
  - {id: a4-backfill-note, at: "D4 06:15", kind: reply, target: t1-sup, to: [c_gabe], summary: "told Support the reminder correction is done",
     body: "Done: CHG-3318 corrected the send time on all 5,181 already-scheduled reminders at 06:04 (US, UK, Ireland and Sydney), verified by a second dry run showing 0 left. New reminders use the fixed code since Wednesday morning. You and Ravi can tell tenants that reminders from today go out at 9:00 local.",
     update_state: {status: resolved}}
  - {id: a4-ravi-ok, at: "D4 06:20", kind: new, app: chat, path: "@ravi/dm", target: t3-ravi, to: [c_ravi], summary: "told Ravi he can now reassure customers",
     body: "Reminder fix is complete as of 06:04: every scheduled reminder now goes out at 9:00 local. Safe to tell Larkfield and others."}
  - {id: a4-gabe, at: "D4 09:40", kind: reply, target: t4-gabe, to: [c_gabe], summary: "gave Support the duplicate event IDs per tenant",
     body: "Each duplicate webhook is the second delivery of an event pair, so customers can safely ignore or delete the second one. Per-tenant counts and event ID ranges are in Docs > data > inc-0412-duplicate-webhook-events (66 events across 8 tenants; Velmora has no webhooks). Integrations that check our event id for idempotency won't have duplicated; ones that don't will have. Want me to write a short customer-facing note for Marcus to approve?",
     update_state: {status: in progress}}
  - {id: a4-ravi-credit, at: "D4 10:45", kind: reply, target: t4-ravi, to: [c_ravi], summary: "told Ravi credits aren't engineering's to approve",
     body: "I can't approve credits; that's your CS Director with Finance. What I can give you for the request: 12 Larkfield invoices sent twice (24 duplicate webhooks, 12 duplicate emails) on 11/4 10:04-10:31, and their reminders were an hour early on 11/2 and 11/3; both are fixed. The postmortem will be shareable in summary next week."}
  - {at: "D4 11:05", kind: read, target: t4-hana, summary: "read Hana's question"}
  - {id: a4-hana, at: "D4 11:30", kind: reply, target: t4-hana, to: [c_hana], summary: "gave Security the remediation facts",
     body: "Merged #1498 (urllib3 2.6.3 -> 2.8.0) Thursday 10:10 after Leilani's review; deployed to billing-worker at 10:40 today. So: alert opened 9/30, SLA 10/30, remediated 11/5, 6 days late. Exposure: billing/webhooks.py streams responses from tenant-configured URLs, so a malicious endpoint could have sent a huge chunk-size line; I checked worker memory metrics for 9/30-11/5 and found no OOM kills or spikes on the webhook pool, so no sign of exploitation. Happy to write that up for the exception record."}
  - {id: a4-runbook, at: "D4 13:30", kind: edit, target: repo-runbook, summary: "rewrote the broker failover runbook",
     content: "# Runbook: Celery broker (ElastiCache Redis) failover\n\nLast reviewed: 2026-11-05 (after INC-0412)\n\nfinalize_invoice is acks_late: after a broker failover, in-flight tasks are redelivered. Since #1497 (INV-2240) redelivery is safe: side effects are deduplicated on (invoice_id, kind, target).\n\n1. Confirm the failover in the ElastiCache console (events tab) and in #inc channel.\n2. Watch the redelivery rate on the billing-worker dashboard; a spike that decays within ~30 minutes is expected.\n3. Restart workers only if they're not consuming: `ecs update-service --force-new-deployment` for billing-worker.\n4. Never purge the queue: `celery purge` deletes legitimate work (finalizations, reminders) that cannot be recovered.\n5. Schedule ElastiCache service updates yourself, off-peak (before 07:00 CT), never leave them to auto-apply.\n6. Post in #incidents when the redelivery rate is back to baseline."}
  - {id: a4-pm, at: "D4 16:30", kind: edit, app: docs, path: incidents/INC-0412-postmortem-draft, target: doc-postmortem, title: "INC-0412 postmortem (draft)",
     summary: "drafted the postmortem",
     content: "# INC-0412 postmortem (draft, blameless). SEV-2, Wednesday 2026-11-04\n\nSummary: an auto-applied ElastiCache service update failed over the Celery broker at 10:04 CT. finalize_invoice (acks_late) tasks were redelivered; side effects weren't deduplicated (INV-2240), so 41 invoices for 9 tenants sent duplicate invoice emails (41) and webhooks (66). Resolved 16:50 after #1497.\n\nTimeline (CT): 10/30 handoff notes the pending update and INV-2240. 11/2 10:00 AWS notice: auto-apply 11/4 10:00-11:00. 11/3 13:45 #1497 opened. 11/4 10:04 failover; 10:05 page; 10:12 SEV-2, Marcus IC; 10:20 queue purge proposed per stale runbook, stopped; 10:31 redeliveries end; 11:15 impact posted; 11:30 hotfix #1496 proposed, not merged (race, locking index); 12:30 #1497 approved as emergency change; 14:52 migration 0042 (107 duplicate rows removed, concurrent unique index); 16:50 resolved.\n\nImpact: 41 duplicate emails, 66 duplicate webhooks (8 tenants with webhooks), downstream duplicate invoices at 2+ tenants' accounting systems. No data loss.\n\nWhat went wrong: we let the maintenance auto-apply in peak hours; a known idempotency gap (INV-2240) sat as low priority since August; the runbook predated acks_late.\nWhat went right: purge was stopped; the proper fix was already in review; impact numbers were exact within an hour.\n\nActions: (1) schedule service updates ourselves off-peak (owner Ben, 11/13); (2) runbook rewritten (done 11/5); (3) alert on redelivery spikes (Marcus, 11/20); (4) audit other acks_late tasks for idempotency (Jordan, 12/4); (5) customer-facing summary via CS (Marcus)."}
  - {id: a4-note, at: "D4 12:40", kind: reply, target: t3-inc, to: [c_marcus], summary: "drafted the customer note for Marcus to approve",
     body: "Draft for CS (for your approval): 'On Wednesday, November 4, between 10:04 and 10:31 a.m. CT, a brief infrastructure failover caused some invoices to be finalized twice. If you were affected, your customers may have received the same invoice email twice, and webhook integrations may have received two invoice.finalized events for the same invoice. The invoices themselves are correct and were not charged twice. Each duplicate webhook carries the same event id as the first; you can safely ignore the second. We've fixed the cause so this can't recur. We're sorry for the confusion.' Per-tenant counts for CS are in Docs > data."}
  - {id: a4-1on1, at: "D4 14:40", kind: reply, target: t3-nadia, to: [c_nadia], summary: "sent Nadia a 1:1 list",
     body: "Short list: (1) INC-0412: I'd like us to treat known idempotency gaps like INV-2240 as risks, not low priority; (2) urllib3 missed the SLA by 6 days, I'll own triage of Dependabot Highs within a week; (3) Ben's hotfix and purge moments: let's make 'never purge' and 'no merge without tests during incidents' explicit in onboarding, blameless; (4) Leilani is doing well; I'm pairing with her on idempotency; (5) BIL-1512 estimate for Sprint 45."}

