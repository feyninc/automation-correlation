sources:
  - "PostgreSQL 17.0 release notes, 'Change functions to use a safe search_path during maintenance operations' (ANALYZE, CLUSTER, CREATE INDEX, CREATE MATERIALIZED VIEW, REFRESH MATERIALIZED VIEW, REINDEX, VACUUM; functions used by expression indexes that reference non-default schemas must specify a search path), adminpack removed, old_snapshot_threshold removed (checked 2026-10-27): https://www.postgresql.org/docs/release/17.0/"
  - "Python round(): 'round(2.675, 2) gives 2.67 instead of the expected 2.68' and ties round to the even choice (checked 2026-10-27): https://docs.python.org/3/library/functions.html#round"
  - "Python decimal, ROUND_HALF_UP and quantize: https://docs.python.org/3/library/decimal.html"
  - "Python zoneinfo, Data sources: Windows has no IANA database; declare a dependency on tzdata; otherwise ZoneInfo raises ZoneInfoNotFoundError (checked 2026-10-27): https://docs.python.org/3/library/zoneinfo.html#data-sources"
  - "RFC 9110, Retry-After (an HTTP-date or delay-seconds; with 503 and 3xx), 408 (the client MAY repeat the request), 410 Gone (no longer available and will not be available again): https://www.rfc-editor.org/rfc/rfc9110.html#name-retry-after"
  - "RFC 6585 section 4, 429 Too Many Requests MAY include Retry-After: https://www.rfc-editor.org/rfc/rfc6585.html#section-4"
  - "requests, PreparedRequest.prepare_body: json= is serialized with complexjson.dumps(json, allow_nan=False), content type application/json (checked 2026-10-27): https://github.com/psf/requests/blob/main/src/requests/models.py"
  - "PostgreSQL SELECT, the locking clause: SKIP LOCKED 'can be used to avoid lock contention with multiple consumers accessing a queue-like table': https://www.postgresql.org/docs/current/sql-select.html#SQL-FOR-UPDATE-SHARE"
  - "PostgreSQL CREATE INDEX CONCURRENTLY: a failed build (e.g. a uniqueness violation) leaves an INVALID index (shown by psql \\d): https://www.postgresql.org/docs/current/sql-createindex.html#SQL-CREATEINDEX-CONCURRENTLY"
  - "PostgreSQL pg_index catalog, indisvalid: https://www.postgresql.org/docs/current/catalog-pg-index.html"
  - "Google SRE workbook, Implementing SLOs: 'the error budget is 100% minus the SLO' (99.9% of 3,000,000 requests allows 3,000 errors) (checked 2026-10-27): https://sre.google/workbook/implementing-slos/"
  - "MDN, Intl.DateTimeFormat timeZone option (formatting defaults to the runtime's time zone): https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat/DateTimeFormat#timezone"

