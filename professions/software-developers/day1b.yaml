         body: "BIL-1476: HMAC-SHA256 signatures on every webhook (Tallyfin-Signature: t=...,v1=...), so tenants can verify deliveries are ours. No rush, the DST thing comes first; would like it in before Friday's freeze.\n\n```diff\n+++ billing/signing.py\n+def signature_header(secret: str, payload: dict, timestamp: int) -> str:\n+    body = json.dumps(payload, sort_keys=True, separators=(\",\", \":\"))\n+    mac = hmac.new(secret.encode(), f\"{timestamp}.{body}\".encode(), hashlib.sha256).hexdigest()\n+    return f\"t={timestamp},v1={mac}\"\n+++ billing/webhooks.py\n-def deliver(url: str, payload: dict, timeout: float = 10.0) -> dict:\n-    with requests.post(url, json=payload, timeout=timeout, stream=True) as r:\n+def deliver(url: str, payload: dict, secret: str, timeout: float = 10.0) -> dict:\n+    headers = {\"Tallyfin-Signature\": signature_header(secret, payload, int(time.time()))}\n+    with requests.post(url, json=payload, headers=headers, timeout=timeout, stream=True) as r:\n+++ tests/test_signing.py\n+    def test_header_format_and_mac(self): ...\n```\nCI green. Tenant docs for verifying: 'compute HMAC-SHA256 over <t>.<raw request body> with your signing secret'."}
