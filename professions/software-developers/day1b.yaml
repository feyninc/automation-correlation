# Code, run 2026-10-27 (copies of the repository in /tmp, python3 -m unittest, Python 3.12, stdlib only):
# - #1491 as opened (billing/totals.py, tests/test_totals.py): 4 tests OK. line_amount(2.5, 19.99) = 49.97 and
