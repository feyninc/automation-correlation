# totals in float, rounded with round()), Ben's #1492 (a webhook retry policy that retries every 4xx and ignores
# Retry-After) and Aisha's #1493 (webhook signatures; "no rush", reviewed Thursday). Platform's PostgreSQL 17 checklist
# asks each team for functions behind expression indexes that reference other schemas unqualified: billing's
# migration 0031 has two (canonical_tz, reminder_local_day), which PG17's safe search_path during ANALYZE/REINDEX
# breaks, so Jordan writes migration 0043 (#1495) before Wednesday's 18:00 schema cutoff. Jordan asks Tomasz for the
# query behind the backfill, adds weekly-update bullets, answers Support (Phoenix), Leilani (tzdata on Windows), Sofia
# (the settings preview reads the stored send time), Omar (no billing-worker calls to a legacy endpoint) and Olivia
# (changelog lines). Marcus's RFC-031 and Olivia's SLA question arrive for Tuesday. Eng all-hands, backlog refinement,
# a call with Priya.
