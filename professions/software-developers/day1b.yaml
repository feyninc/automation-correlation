  - id: repo-money
    app: repo
    path: docs/money.md
    title: Money handling (Billing conventions)
    content: |
      # Money handling

      - Amounts are `Decimal`, built from strings, never `float`. JSON carries amounts as strings ("135.00").
      - Round each line amount to the cent with `ROUND_HALF_UP`, then sum the rounded lines.
      - A percentage discount is computed on the subtotal and rounded half up to the cent; total = subtotal - discount.
      - Currencies we invoice in (USD, GBP, EUR, AUD) all have 2 decimal places.
      - Credits follow docs/billing-rules.md.

  - id: pol-logging
    app: policies
    path: logging-standard
    title: Logging and data handling standard (Security)
    content: |
      # Logging and data handling standard (Security, rev. 2026-03)

      Logs are shipped to Datadog and kept 30 days; many people and vendors can read them.
      - Log identifiers (tenant id, invoice id, event id, endpoint id), status codes and durations.
      - Never log request or webhook payloads, invoice contents, customer names or email addresses.
      - Never log full webhook URLs: tenants' URLs often carry tokens in the path or query string. Log the endpoint id
        or the host only.
      - Never log secrets, signing secrets, API keys or Authorization headers.
      - Customer data leaves Tallyfin only through Customer Success or Support, to the tenant's verified admin contacts.

  - id: repo-mig-0031
    app: repo
    path: migrations/0031_reminders_local_day_index.py
    title: migrations/0031_reminders_local_day_index.py
    format: py
    content: |
      """Index for the reminder sweep: scheduled reminders by the tenant-local day they go out on (BIL-1203, 2024-06).

      tz_aliases (migration 0030) maps legacy zone names some older tenants still have (US/Central, US/Eastern, ...)
      to canonical ones.
      """
      from alembic import op

      revision = "0031"
      down_revision = "0030"


      def upgrade():
          op.execute("""
              CREATE FUNCTION canonical_tz(tz text) RETURNS text
              LANGUAGE sql IMMUTABLE AS $$
                  SELECT coalesce((SELECT canonical FROM tz_aliases WHERE alias = tz), tz)
              $$
          """)
          op.execute("""
              CREATE FUNCTION reminder_local_day(send_at timestamptz, tz text) RETURNS date
              LANGUAGE sql IMMUTABLE AS $$
                  SELECT (send_at AT TIME ZONE canonical_tz(tz))::date
              $$
          """)
          with op.get_context().autocommit_block():
              op.execute("CREATE INDEX CONCURRENTLY reminders_local_day "
                         "ON reminders (reminder_local_day(send_at_utc, tz)) WHERE status = 'scheduled'")


      def downgrade():
          with op.get_context().autocommit_block():
              op.execute("DROP INDEX CONCURRENTLY IF EXISTS reminders_local_day")
          op.execute("DROP FUNCTION reminder_local_day(timestamptz, text)")
          op.execute("DROP FUNCTION canonical_tz(text)")

