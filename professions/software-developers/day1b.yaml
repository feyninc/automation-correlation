  - {id: a1b-0043, at: "D1 16:20", kind: edit, app: repo, path: migrations/0043_pg17_function_search_path.py, target: repo-mig-0043, title: migrations/0043_pg17_function_search_path.py, format: py,
     summary: "wrote migration 0043 pinning the search path of the two index functions",
     content: "\"\"\"PG17 safe search_path (Platform's PG17 checklist, item 1).\n\nThe reminders_local_day expression index (0031) calls reminder_local_day(), which calls canonical_tz() unqualified,\nwhich reads tz_aliases unqualified. PG17 runs ANALYZE, REINDEX, VACUUM and CREATE INDEX with search_path =\npg_catalog, pg_temp, so both lookups fail there. Pin each function's search path; no table is touched.\n\"\"\"\nfrom alembic import op\n\nrevision = \"0043\"\ndown_revision = \"0041\"\n\n\ndef upgrade():\n    op.execute(\"ALTER FUNCTION public.canonical_tz(text) SET search_path = public, pg_temp\")\n    op.execute(\"ALTER FUNCTION public.reminder_local_day(timestamptz, text) SET search_path = public, pg_temp\")\n\n\ndef downgrade():\n    op.execute(\"ALTER FUNCTION public.reminder_local_day(timestamptz, text) RESET search_path\")\n    op.execute(\"ALTER FUNCTION public.canonical_tz(text) RESET search_path\")\n"}
  - {id: a1b-pr1495, at: "D1 16:25", kind: new, app: reviews, path: "1495", target: t1b-pr1495, to: [c_aisha], summary: "opened PR #1495 for the PG17 search_path fix",
     body: "PR #1495 Pin search_path on the reminders_local_day index functions (PG17)\n\nMigration 0043: ALTER FUNCTION ... SET search_path = public, pg_temp on canonical_tz(text) and reminder_local_day(timestamptz, text), the two functions behind the reminders_local_day expression index (0031). Under PG17's safe search_path, ANALYZE reminders on pg17-staging fails with 'function canonical_tz(text) does not exist'; with 0043 applied it succeeds (checked with Priya). Function metadata only, no table lock beyond the functions. Must merge before Wed 18:00. Branches from 0041; if another migration lands on main first, I'll rebase the down_revision before merging."}
  - {id: a1b-pg17, at: "D1 16:30", kind: reply, target: t1b-pg17, to: [c_priya], cc: [c_nadia], summary: "sent Priya Billing's PG17 findings",
     body: "Priya, Billing's answers:\n1. One hit. The reminders_local_day expression index (migration 0031) uses reminder_local_day(timestamptz, text), which calls canonical_tz(text) unqualified, which reads tz_aliases unqualified. Under PG17's safe search_path (pg_catalog, pg_temp) your post-upgrade ANALYZE fails on reminders (we reproduced it on pg17-staging: 'function canonical_tz(text) does not exist'), and so would any REINDEX. Fix: migration 0043 sets search_path = public, pg_temp on both functions; PR #1495, merging before Wednesday 18:00. No other expression indexes or materialized views in billing-db.\n2. Extensions: confirmed pg_stat_statements and pgcrypto only.\n3. old_snapshot_threshold: default, nothing to do.\n4. Test suite against pg17-staging: tomorrow, I'll post results.\n5. Saturday owner: me (Jordan), phone in PagerDuty."}
  - {at: "D1 16:36", kind: read, target: t1b-aisha-dm, summary: "read Aisha's offer to review #1495"}
  - {id: a1b-aisha, at: "D1 16:38", kind: reply, target: t1b-aisha-dm, to: [c_aisha], summary: "thanked Aisha and pointed her at staging",
     body: "Thanks! Yes, pg17-staging (1Password). Run ANALYZE reminders before and after applying 0043; before should fail on canonical_tz."}
  - {id: a1b-relnote, at: "D1 16:50", kind: reply, target: t2-olivia, to: [c_olivia], summary: "gave Olivia two plain sentences for the changelog",
     body: "Draft: 'Payment reminders scheduled before a daylight-saving time change could go out an hour off after the change; this week some US customers' reminders arrived at 8:00 instead of 9:00 local time. We've fixed how send times are calculated and are correcting reminders that were already scheduled, so reminders go out at 9:00 in your time zone.' Please don't add a date for the correction yet; it needs a change ticket first."}

