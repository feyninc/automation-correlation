  - {id: a1b-review1491, at: "D1 15:20", kind: reply, target: t1b-pr1491, to: [c_leilani], summary: "reviewed Leilani's totals: float rounding",
     body: "Nice, small and readable, Leilani. One real issue, and it's the classic money one: float. round() works on binary approximations and rounds ties to even, so half-cent lines come out a cent low. With your code, 2.5 h x 19.99 = 49.975 gives 49.97 (should be 49.98), and 1.25 h x 130.10 = 162.625 gives 162.62 (should be 162.63). A 10% discount on 24.45 gives 2.44 (should be 2.45).\n\ndocs/money.md has the rule: Decimal built from strings, quantize each line to the cent with ROUND_HALF_UP, sum the rounded lines, discount on the subtotal also half up. proration.py in #1490 uses the same pattern. Your tests pass because none of them has a half cent; add those three cases (they fail on this branch). Want to pair on it tomorrow?"}
