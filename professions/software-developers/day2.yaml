  - {id: a2-script, at: "D2 12:30", kind: edit, app: repo, path: scripts/backfill_reminder_send_times.py, target: repo-backfill, title: scripts/backfill_reminder_send_times.py, format: py,
     summary: "wrote the backfill script", content: "\"\"\"CHG-3318: recompute send_at_utc for unsent reminders whose stored time doesn't match 09:00 local on remind_on.\n\nUsage: python3 scripts/backfill_reminder_send_times.py rows.csv [--apply]\nWithout --apply it prints what would change (dry run). Sent reminders are never touched.\n\"\"\"\nimport csv\nimport sys\nfrom datetime import date, datetime\n\nfrom billing.reminders import send_time_utc\n\n\ndef plan(rows):\n    changes = []\n    for r in rows:\n        if r[\"status\"] != \"scheduled\":\n            continue\n        want = send_time_utc(date.fromisoformat(r[\"remind_on\"]), r[\"tz\"])\n        have = datetime.fromisoformat(r[\"send_at_utc\"])\n        if have != want:\n            changes.append((r[\"id\"], have.isoformat(), want.isoformat()))\n    return changes\n\n\nif __name__ == \"__main__\":\n    rows = list(csv.DictReader(open(sys.argv[1])))\n    changes = plan(rows)\n    for c in changes:\n        print(\",\".join(c))\n    print(f\"{len(changes)} reminders to update\" + (\"\" if \"--apply\" in sys.argv else \" (dry run)\"))\n"}
