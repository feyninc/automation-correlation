  - {id: a2-dedupe, at: "D2 13:30", kind: edit, target: repo-emit, summary: "made invoice side effects idempotent (INV-2240)", content: "\"\"\"Invoice finalization side effects: one webhook per enabled endpoint and one email to the billing contact.\n\nfinalize_invoice runs as a Celery task with acks_late=True, so a broker failover can redeliver it, sometimes to two\nworkers at once. Every side effect is keyed (invoice_id, kind, target) and inserted with ON CONFLICT DO NOTHING, so a\nredelivered task records nothing new and sends nothing twice (INV-2240).\n\"\"\"\nfrom dataclasses import dataclass, field\n\n\n@dataclass\nclass Outbox:\n    events: list = field(default_factory=list)      # stands in for the outbound_events table\n    keys: set = field(default_factory=set)          # stands in for the unique index on (invoice_id, kind, target)\n\n    def add(self, invoice_id: str, kind: str, target: str) -> bool:\n        key = (invoice_id, kind, target)\n        if key in self.keys:                        # INSERT ... ON CONFLICT DO NOTHING\n            return False\n        self.keys.add(key)\n        self.events.append({\"invoice_id\": invoice_id, \"kind\": kind, \"target\": target})\n        return True\n\n\ndef finalize_invoice(invoice: dict, endpoints: list[str], outbox: Outbox) -> None:\n    for url in endpoints:\n        outbox.add(invoice[\"id\"], \"webhook\", url)\n    outbox.add(invoice[\"id\"], \"email\", invoice[\"billing_email\"])\n"}
  - {id: a2-migration, at: "D2 13:35", kind: edit, app: repo, path: migrations/0042_outbound_events_dedupe.py, target: repo-migration-0042, title: migrations/0042_outbound_events_dedupe.py, format: py,
     summary: "wrote the concurrent unique-index migration", content: "\"\"\"INV-2240: unique key on outbound events. Removes existing duplicates first, then builds the index without\nlocking the table (outbound_events takes ~40 writes a second).\"\"\"\nfrom alembic import op\n\nrevision = \"0042\"\ndown_revision = \"0041\"\n\n\ndef upgrade():\n    op.execute(\"\"\"\n        DELETE FROM outbound_events e USING outbound_events d\n        WHERE e.invoice_id = d.invoice_id AND e.kind = d.kind AND e.target = d.target AND e.id > d.id\n    \"\"\")\n    with op.get_context().autocommit_block():\n        op.execute(\"CREATE UNIQUE INDEX CONCURRENTLY IF NOT EXISTS outbound_events_dedupe \"\n                   \"ON outbound_events (invoice_id, kind, target)\")\n\n\ndef downgrade():\n    with op.get_context().autocommit_block():\n        op.execute(\"DROP INDEX CONCURRENTLY IF EXISTS outbound_events_dedupe\")\n"}
  - {id: a2-pr1497, at: "D2 13:45", kind: new, app: reviews, path: "1497", target: t2-pr1497, to: [c_marcus, c_ben], summary: "opened PR #1497 for INV-2240",
