    title: Accuracy root cause for the CFO question
    kind: doc
    task: 20699
    from: "D4 08:00"
    due: "D4 17:00"
    evidence: [doc-errors, doc-kpi-oct, t3-lisa]
    ref: a4-accuracy
    check: {all: [{to_includes: c_lisa}, {number_equals: {value: 312}}, {any: [{number_equals: {value: 55, tol: 0.6}}, {number_equals: {value: 99.9, tol: 0.006}}]}]}
    must: ["570 mis-picks, 312 (55%) in the re-slotted aisles; without them 99.90%", "Specific corrective actions and expected result"]
    minutes: [20, "a root cause from an extract"]
    intent: "It's the re-slot."
  - id: n4-agency
    title: Confirm the second class
    kind: reply
    task: 20705
    from: "D4 11:15"
    due: "D5 17:00"
    evidence: [t3-lisa, t3-agency]
    ref: a4-agency
    check: {all: [{to_includes: c_agency}, {mentions_any: ["11/16"]}, {number_equals: {value: 9}}]}
    must: ["Confirms 9 on 11/16 by Pinnacle's Friday deadline"]
    minutes: [2, "a short reply"]
    intent: "Approved."
  - id: n4-shawn
    title: No points while FMLA is pending
    kind: reply
    task: 20705
    from: "D4 13:00"
    due: "D4 17:00"
