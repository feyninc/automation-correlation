# Thursday 2026-11-05. The MBR: Lisa asks why accuracy missed. Inventory control's error data shows most mis-picks in
# the aisle that was re-slotted in October. The monthly safety walk. Shawn still wants to give Marlene points. Lisa
# approves the second agency class. The carrier answers the detention dispute.
#
# Accuracy: 253,460 - 252,890 = 570 mis-picked lines; 312 in aisles 14-15 (re-slotted 10/12): 55%.

documents:
  - id: doc-errors
    app: docs
    path: inventory/mispicks-october
    title: Mis-picks by area, October (Omar)
    format: csv
    at: "D4 08:00"
    author: c_omar
    content: |
      area,mispicked_lines,note
      aisles 14-15,312,re-slotted 10/12 (similar-looking fittings moved to adjacent faces)
      aisles 20-24,121,
      mezzanine,86,
      bulk,51,
      total,570,
  - id: doc-walk
    app: docs
    path: safety/monthly-walk-2026-11-05
    title: Monthly safety walk findings (11/5)
    at: "D4 15:00"
    author: c_beth
    content: |
      1. Dock 4: dock lock not engaged on a loaded trailer (driver had chocked wheels). 2. Aisle 9: two pallets
      overhanging the beam by 6 inches. 3. Battery room: eyewash station inspection tag last signed 9/12 (monthly).
      4. Mezzanine stairs: handrail loose at the top. 5. Good: horn use at intersections observed every time.

threads:
  - id: t3-lisa
    app: chat
    path: "@lisa/dm"
    title: Lisa Varnum (DM)
    x:
      - {at: "D4 11:15", from: c_lisa, body: "Good MBR. Approved: second Pinnacle class of 9 on 11/16. Can you send me the accuracy root cause today? 99.78 vs 99.8 will come up with the CFO."}
  - id: t2-shawn
    x:
      - {at: "D4 13:00", from: c_shawn, to: [worker], subject: "Re: Marlene Hughes: final warning?",
         body: "HR sent Marlene the FMLA paperwork. Can I still give her the points in the meantime? Otherwise others will say it's unfair."}
  - id: t4-carrier
    app: mail
    path: inbox/re-buckeye-detention
    title: "Re: Dispute BF-55102"
    x:
      - {at: "D4 14:00", from: c_carrier, to: [worker], subject: "Re: Dispute: invoice BF-55102",
         body: "We've reviewed the gate times. We'll credit 10/27 ($525), but 10/20's driver says he was told at the gate to wait. Revised invoice: $825. Buckeye billing"}
  - id: t4-led
    app: mail
    path: inbox/led-retrofit
    title: LED retrofit proposal
    x:
      - {at: "D4 16:00", from: c_dale, to: [worker], subject: "LED retrofit proposal",
         body: "Ronan, Brightside Energy quoted $42,000 to replace the 380 metal-halide high bays with LED and motion sensors; they estimate savings of $1,050 a month in electricity, and AEP Ohio's rebate would cover $9,500. Worth doing? Dale"}

actions:
  - {at: "D4 10:00", kind: noop, target: cal-ronan, summary: "monthly business review"}
  - {at: "D4 11:20", kind: read, target: t3-lisa, summary: "read Lisa's approval and question"}
  - {id: a4-agency, at: "D4 11:30", kind: reply, target: t3-agency, to: [c_agency], summary: "confirmed the second agency class",
     body: "Kelly, confirmed: second class of 9 on Monday 11/16, same 6:30 orientation. Thanks!"}
  - {id: a4-accuracy, at: "D4 12:30", kind: reply, target: t3-lisa, to: [c_lisa], summary: "sent Lisa the accuracy root cause",
     body: "Accuracy root cause: 570 mis-picked lines in October; 312 (55%) in aisles 14-15, which we re-slotted 10/12 and which now have look-alike fittings on adjacent faces. Without them we'd have been at 99.90%. Fix, starting today: Omar re-slots the 6 look-alike pairs apart this week, adds part photos to the scanner prompt for those SKUs, and we audit aisles 14-15 daily for two weeks. I expect us back above 99.8% in November."}
  - {at: "D4 14:00", kind: noop, target: doc-walk, summary: "monthly safety walk with Beth"}
  - {at: "D4 13:05", kind: read, target: t2-shawn, summary: "read Shawn's follow-up"}
  - {id: a4-shawn, at: "D4 13:20", kind: reply, target: t2-shawn, to: [c_shawn], summary: "told Shawn no points while FMLA is pending",
     body: "No points for those absences while HR reviews the FMLA paperwork; if it's approved, they're protected and points would be retaliation. If people ask, it's fair to say leave questions go through HR and that the same rules apply to everyone. Andrea will tell you the outcome."}
  - {id: a4-walk, at: "D4 15:30", kind: new, app: mail, path: sent/safety-walk-actions, target: m4-walk, to: [c_beth, c_dale, c_shawn, c_tina], subject: "Safety walk 11/5: actions",
     summary: "assigned the safety walk actions",
     body: "Actions from today's walk: (1) Dock 4 lock not engaged: Tina, re-brief all loaders today; Dale, check the lock indicator lights on docks 1-12 by Friday. (2) Aisle 9 overhanging pallets: Shawn, fix today and add a beam check to the 2 p.m. walk. (3) Eyewash tag not signed since 9/12: Beth, inspect and sign today; add to the monthly checklist. (4) Mezzanine handrail loose: Dale, tape off and repair by end of day tomorrow. Good catch on horn use, please tell the drivers."}
  - {at: "D4 14:05", kind: read, target: t4-carrier, summary: "read Buckeye's partial credit"}
  - {id: a4-carrier, at: "D4 14:30", kind: reply, target: t4-carrier, to: [c_carrier], cc: [c_jas], summary: "pushed back on the 10/20 charge",
     body: "Thanks for the 10/27 credit. On 10/20: the clock starts at the appointment only if the truck is on time, and BF-2214 arrived at 10:40 for an 08:00 appointment, so the 2 free hours start at arrival (10:40 to 12:40); it departed 13:15, 0.5 hour after, which our terms round to zero. Our gate staff don't tell late drivers detention applies. Please reissue for $375. Ronan"}
  - {id: a4-led, at: "D4 16:30", kind: reply, target: t4-led, to: [c_dale], cc: [c_lisa], summary: "assessed the LED proposal and routed it as a CER",
     body: "Worth pursuing: net cost $42,000 - $9,500 rebate = $32,500, savings $1,050 a month, so a ~31-month payback (about 37% a year), plus better light in the aisles where we have mis-picks. It's capital over my authority, so I'll put it in a CER for Lisa with the dock 7 one for January. Dale, can you get the savings estimate backed by our actual kWh from the AEP bills and confirm the rebate is pre-approved?"}

needs:
