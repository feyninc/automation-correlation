    minutes: [10, "an action list"]
    intent: "Owners and dates."
  - id: n4-carrier
    title: Push back on the remaining detention
    kind: reconcile
    task: 20702
    from: "D4 14:00"
    due: "D5 17:00"
    evidence: [t4-carrier, doc-detention]
    ref: a4-carrier
    check: {all: [{to_includes: c_carrier}, {mentions_any: ["10/20", BF-2214]}, {number_equals: {value: 375}}]}
    must: ["For a late truck the free time starts at arrival: 10:40-12:40, departed 13:15: nothing billable; reissue for $375"]
    minutes: [10, "a dispute follow-up"]
    intent: "Still not owed."
  - id: n4-led
    title: Assess the LED retrofit and route it
    kind: reply
    task: 19501
    from: "D4 16:00"
    due: "D5 17:00"
    evidence: [t4-led, pol-authority]
    ref: a4-led
    check: {all: [{to_includes: c_dale}, {number_equals: {value: 32500}}, {any: [{number_equals: {value: 31, tol: 1}}, {mentions_any: [payback]}]}]}
    must: ["Net $32,500 after the rebate, ~31-month payback; a CER to Lisa; verify the savings and rebate"]
    must_not: ["Approves $42,000 himself"]
    minutes: [10, "a quick payback analysis"]
