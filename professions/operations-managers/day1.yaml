         body: "Ronan, Ana went to the clinic this morning for her wrist from Friday. She's full duty, they just gave her a wrap and ibuprofen. Can we keep this as first aid? We're at 6 recordables and the peak safety bonus is on the line for the team. Shawn", att: [doc-clinic]}
