  - {id: a4b-plan, at: "D4 11:50", kind: edit, app: docs, path: planning/peak-labor-plan, target: doc-peak-plan,
     summary: "updated the peak labor plan for the second class",
     content: "# Groveport peak labor plan, 11/9-12/18 (updated 11/5)\n\nDemand: 13,200 lines a day average (peak day ~15,400). Productivity 7.65 lines per labor hour (October). Hours needed: 1,725 a day.\nCoverage: permanent 148 x 8 h x 95% = 1,125; overtime cap 10% of straight time = 112; agency 488 hours a day = 61 FTE.\nAgency: ~30 FTE on hand + 22 starting 11/9 (Pinnacle confirmed 22 of 24) = 52, a 9 FTE gap 11/9-11/13 covered by OT within the cap and the approved Saturday 11/7. Second class of 9 approved by Lisa 11/5, starts 11/16: 61 FTE, gap 0 from 11/16 (cost 9 x 8 h x $29.00 = $2,088 a day).\nTrainers: 11 (6 first shift, 5 second), no pick target Mon-Wed of a class week.\nRisks: peak days of ~15,400 lines (2,013 hours) still need Saturdays; Dayton's overflow (~196 hours a day) is not in this plan and is Lisa's decision Monday; RT-03 back 11/6; dock 7 repaired 11/5."}
  - {at: "D4 11:20", kind: read, target: t4b-lisa-actions, summary: "read Lisa's MBR actions"}
  - {id: a4b-ot, at: "D4 12:15", kind: reply, target: t4b-neil-ot, to: [c_fpa], cc: [c_lisa], summary: "split October overtime by cause",
     body: "Neil, October OT 3,120 hours by cause (from the supervisors' UKG comments): volume above plan 1,410 (45.2%); absence and vacancy cover 760 (24.4%); replenishment catch-up 420 (13.5%); equipment down 230 (7.4%); training and certification cover 160 (5.1%); other 140 (4.5%). What we can plan away in peak: most of the volume and vacancy OT, by covering the plan's hours with agency (the two Pinnacle classes bring us to 61 FTE from 11/16) and holding OT to the 10% cap; replenishment by staffing night replen; equipment by the RT-03 and dock 7 repairs done this week. I'd expect November near the 10% cap, about 560 hours a week, not October's ~710."}
  - {at: "D4 12:35", kind: noop, target: t4b-carmen-bonus, minutes: 25, summary: "met Carmen and Andrea on the peak bonus measures"}
  - {at: "D4 13:26", kind: noop, target: c4b-mike, minutes: 3, summary: "took Mike's call about the mis-pick claim"}
  - {id: a4b-mike-note, at: "D4 13:32", kind: update, target: c4b-mike, summary: "wrote the note on Mike's call",
     body: "Mike Okafor (Cincinnati), 11/5: Hamilton Mechanical lost half a day on the Mason hospital job from the 11/2 mis-pick (3/4 tee carton held 1/2 tees, face 14-03-C). Owned it; root cause the October re-slot look-alike pair; fixed 11/5 (pairs a bay apart, photo prompts, daily audit two weeks). $680 labor claim not approved on the call: routed to Megan (Customer Care). Root cause to Megan today."}
  - {id: a4b-megan, at: "D4 13:40", kind: new, app: mail, path: sent/hamilton-claim-root-cause, target: m4b-megan, to: [c_megan], cc: [c_mike], subject: "Root cause for Cincinnati's mis-pick (Hamilton Mechanical claim)",
     summary: "gave Customer Care the root cause for the claim",
     body: "Megan, for the Hamilton Mechanical claim: the error was ours. On 11/2 the carton picked from face 14-03-C was 1/2 inch tees in a 3/4 face; 14-03-C/D is one of six look-alike pairs our October re-slot put next to each other. Corrective action, done today: pairs separated by a bay, part photos at scanner confirmation, a daily audit of aisles 14-15 for two weeks (0 mis-picks so far). Whether to pay the $680 is yours under the claims policy; I'd support it given the hospital job. The returned carton arrived on today's backhaul for the credit."}
  - {at: "D4 13:45", kind: noop, target: t4b-rick, minutes: 8, summary: "called Rick about Friday's Saturday-delivery add-on"}
  - {at: "D4 15:06", kind: noop, target: c4b-brett, minutes: 3, summary: "took Brett's call about the $10 kit price"}
  - {id: a4b-brett-lisa, at: "D4 15:18", kind: new, app: mail, path: sent/scioto-kit-price-request, target: m4b-kit, to: [c_lisa], cc: [c_brett], subject: "Scioto kits: request to price below OPS-310",
     summary: "sent Lisa the below-formula price request with a recommendation",
     body: "Lisa, Scioto Health asks for $10 a kit on a one-year deal (120 kits a month). OPS-310 gives $12.74: (0.275 h x $33.50 + $1.40 materials) x 1.20. Our cost before margin is about $10.61, so $10 is $0.61 a kit (about 6%) below cost: $1,200 a month against $1,528.80. My recommendation is to hold $12.74 and offer a monthly batch build, which Kim can re-time; if the standard drops, the formula price drops with it. Below-formula pricing is your call; Brett is copied."}
