# first aid. Dayton wants to announce the overflow before Lisa decides. The CFO asks for October overtime by cause.
# The second agency class is approved, so the peak plan changes. Cincinnati's contractor claims labor for a mis-pick.
# The key account manager asks for a below-cost kit price. The spent-lamp box reaches its one-year limit and only
# Dale is told.
#
# OT by cause (doc-ot-oct, 3,120 hours): volume 1,410 (45.2%), absence and vacancy cover 760 (24.4%), replenishment
#   420 (13.5%), equipment down 230 (7.4%), training cover 160 (5.1%), other 140 (4.5%).
# Peak plan with both classes: agency on hand ~30 FTE + 22 on 11/9 = 52 (need 61, gap 9) until 11/16; + 9 on 11/16
