     body: "Paul Hendricks (Dayton), 11/5: wanted to tell his team the overflow to Groveport from 11/30 is set. Told him no: Lisa decides Monday. What it takes, as given to Lisa: ~196 labor hours a day, ~25 more agency FTE on top of 61, Saturdays, dock 7 replaced. Commitment: slotting of his 640 SKUs against our open locations (Omar runs it Friday from Paul's cube data) to Lisa Monday. He holds his team until then."}
