calls:
  - id: c4b-paul
    path: 2026-11-05/0920-paul-hendricks-dayton
    title: Inbound call, Paul Hendricks (Dayton overflow)
    start: "D4 09:20:00"
    turns:
      - [c_paul, "Ronan, Paul. I sent Hannah the 640 SKUs. Lisa's leaning toward Groveport for my overflow from 11/30. Can I tell my team it's set so they can start planning the moves?", 6]
      - [worker, "Not yet, Paul. Lisa hasn't decided. I've told her what it takes: about 196 more labor hours a day, roughly 25 more agency FTE on top of our 61, Saturday shifts and the dock 7 replacement. Once I've slotted your 640 SKUs against our open locations, she'll have what she needs."]
      - [c_paul, "When will you have the slotting?", 3]
      - [worker, "Monday. Your cube data came in this morning, so I'll have Omar run it Friday and bring it to Lisa Monday."]
      - [c_paul, "Okay. I'll hold my team until Monday.", 2]
  - id: c4b-mike
    path: 2026-11-05/1325-mike-okafor-cincinnati
    title: Inbound call, Mike Okafor (Cincinnati mis-pick)
    start: "D4 13:25:00"
    turns:
      - [c_mike, "Ronan, Mike in Cincinnati. The wrong tees on Monday's truck cost my contractor, Hamilton Mechanical, half a day on a hospital job. He's asking us to cover his crew's time, six hundred eighty dollars. Can you approve that, and tell me it won't happen again?", 8]
      - [worker, "I'm sorry, Mike. That one was ours: pick face 14-03-C is one of six look-alike pairs from our October re-slot. As of this morning they're a bay apart, the scanner shows a part photo at confirmation, and we're auditing those aisles daily for two weeks."]
      - [c_mike, "Good. And the six-eighty?", 3]
      - [worker, "That's a customer claim, so it goes to Megan in Customer Care, not me on the phone. Send her his invoice, and I'll give her our root cause today so she can decide quickly."]
      - [c_mike, "Fair. I'll send it now.", 2]
  - id: c4b-brett
    path: 2026-11-05/1505-brett-lyons
    title: Inbound call, Brett Lyons (kit price)
    start: "D4 15:05:00"
    turns:
      - [c_brett, "Ronan, Brett. Dana's at ten dollars a kit for a one-year deal. It's a hundred and twenty kits a month, small money. Can you just do ten?", 6]
      - [worker, "No. Ten dollars is below what a kit costs us, about $10.61 in labor and materials before any margin. Under OPS-310 any price under $12.74 needs Lisa, and I wouldn't recommend selling below cost. What could move it: if Scioto lets us build the month's kits in one batch, Kim can re-time it, and a lower standard lowers the price by the formula."]
      - [c_brett, "Okay. If they still want ten, will you send Lisa the numbers?", 4]
      - [worker, "Yes, today: the formula, the cost floor and the one-year volume, with my recommendation."]

