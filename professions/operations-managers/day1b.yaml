  - {id: a1b-exit, at: "D1 08:14", kind: reply, target: t1b-leads, to: [c_luis], cc: [c_shawn], summary: "had the pallets moved out of the exit route",
     body: "Luis, move them now, please: EX-3 is an exit route, and it has to be clear at all times, even for a few hours (OSHA 1910.37(a)(3)). Use the end of lane 12 or the bulk end caps, and tell me if we're out of staging space again; we'll mark a peak overflow lane."}
  - {id: a1b-purge, at: "D1 11:30", kind: reply, target: t1b-janelle-files, to: [c_janelle], cc: [c_beth], summary: "told Janelle which boxes may be shredded",
     body: "Janelle, not all of it. OSHA 300 logs and 301s have to be kept five years after the end of the year they cover: 2019 and 2020 can be shredded, but 2021 (kept through 12/31/2026) and 2022 (through 12/31/2027) stay. Please move those two boxes to Beth's EHS cabinet. The 2021-2022 timecard printouts are past the two-year rule and are in UKG, the party sign-ups can go, and Beth should confirm the SDS binders are superseded before they go."}
  - {id: a1b-accrual, at: "D1 12:30", kind: reply, target: t1b-neil-accrual, to: [c_fpa], cc: [c_rachel], summary: "told Neil to accrue the UKG figure",
     body: "Neil, accrue $152,540.00 (5,260 UKG hours x $29.00). I've disputed the other 150 hours ($4,350.00) with Pinnacle and asked for timesheet detail; if she documents them we'll true it up in November. Nothing else unbilled for October that I know of; I'll check with Dale for open repair invoices and tell you by 10 tomorrow."}
  - {id: a1b-replen, at: "D1 12:55", kind: reply, target: t2-omar, to: [c_omar], summary: "moved two pickers to replenishment",
     body: "Pull 2 of Shawn's pickers onto replen for the last 2 hours; empty faces cost us more than the picks. Tell Shawn I said so. If you're still behind at 3, Tina can give you one associate for the first 2 hours of her shift instead of OT."}
