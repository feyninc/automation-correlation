     body: "Not with the auto-deduct, Keisha. If they have to keep a radio on and answer it, they aren't completely relieved from duty, so the 30 minutes is work time and has to be paid. Better: have one loader hold the radio each lunch, on the clock (rotate it and cancel his deduction), and the rest are fully off. I'll ask Tina to set it up."}
