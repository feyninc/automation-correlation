calls:
  - id: c1b-buckeye
    path: 2026-11-02/0945-rick-dalton-buckeye
    title: Inbound call, Rick Dalton (Buckeye Columbus terminal)
    start: "D1 09:45:00"
    turns:
      - [c_rick, "Ronan, Rick Dalton, I run Buckeye's Columbus terminal. Jasmine sent me your log on the Lexington pickups. Tell me what you're seeing so I can fix it.", 6]
      - [worker, "Thanks for calling, Rick. Two of last week's five Lexington pickups missed the 4:00 window: Tuesday's GRV-88174 was picked up at 7:45 and Thursday's GRV-88290 at 8:30, so both delivered mid-afternoon instead of by 10. Friday's was on us. I need a 4:00 pickup we can count on, and a call by 3:30 if the driver is running late."]
      - [c_rick, "We lost two drivers on that run in October. What I can guarantee is a 5:30 pickup every day. Would that work for you?", 8]
      - [worker, "5:30 won't make a 10:00 delivery in Lexington reliably, so no. Keep the 4:00 pickup for this week, and send me in writing what you're changing to hold it. I'm also giving these dates to Scott Brenner for your quarterly review on 11/12."]
      - [c_rick, "Fair. I'll put a dedicated driver on the Lexington run starting today and email you the plan this afternoon.", 3]
  - id: c1b-brett
    path: 2026-11-02/1600-brett-lyons
    title: Inbound call, Brett Lyons (Scioto Health kits)
    start: "D1 16:00:00"
    turns:
      - [c_brett, "Ronan, it's Brett. Scioto Health wants us to kit their monthly PM parts, about 120 kits a month, fourteen lines a kit, bagged and labeled by building. Dana wants a number from me tomorrow. Can you just give me a ballpark per kit now? I'm thinking ten bucks.", 7]
      - [worker, "We can do it, but I won't guess a number. Under OPS-310 the price comes from a timed labor standard, so I'll have Kim time ten kits tomorrow and send you a written per-kit price by Wednesday. Please don't quote Dana anything before then."]
      - [c_brett, "Okay. Wednesday is fine, she can wait two days. Send me the sample kit list I emailed?", 3]
      - [worker, "Yes, send it to Kim and me tonight and she'll build the samples from it."]

