  - {id: a1b-pit, at: "D1 10:05", kind: reply, target: t1b-beth-pit, to: [c_beth], cc: [c_shawn, c_tina], summary: "kept the three-year evaluations on their due dates",
     body: "Beth, I can't wait for January: the three-year evaluation is a hard date under 1910.178(l)(4)(iii), and four operators fall due before then. Dwayne Fisher's was due 10/27, so he's already 6 days over: Shawn, take him off the trucks today until Beth evaluates him (tomorrow if possible). Lena Ortiz is due Wednesday 11/4 (Kenny's refresher morning works), Tom Becker by Thursday 11/12 and Gina Russo by Tuesday 12/15. Everyone else is 2027 or later. Please add a 60-day look-ahead to the tracker so we see these coming."}
