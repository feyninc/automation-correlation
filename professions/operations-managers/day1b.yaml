  - {id: a1b-bonus, at: "D1 11:50", kind: new, app: mail, path: sent/peak-safety-bonus, target: m1b-bonus, to: [c_lisa], cc: [c_ehsdir, c_hr], subject: "Peak safety bonus: change the measure before peak",
     summary: "proposed changing the peak safety bonus to leading indicators",
     body: "Lisa, this morning Shawn asked me to keep a prescription case off the log because the team's peak safety bonus is tied to recordables. I said no, but the bonus itself is the problem: an incentive that pays for fewer reported injuries discourages reporting, which OSHA's 1904.35 rules prohibit, and it costs us the early warnings. Proposal for peak: pay the same pool on leading indicators: safety huddles held, near misses reported, 5S and forklift pre-shift checks completed. Carmen and Andrea are copied; can we decide before the 11/9 start?"}
  - {id: a1b-fiber, at: "D1 16:12", kind: reply, target: t1b-fiber, to: [c_fiber], cc: [c_dale], summary: "claimed the rebate floor from Franklin Fiber",
     body: "Amy, thanks for the statement. Under FF-2025-118 the rebate is the posted price but not less than $60.00 a ton through 12/31/2026, so October's 41.6 tons should pay $2,496.00, not $2,288.00 at $55. Please send a supplemental check for $208.00 and apply the floor to November as well. Ronan"}
  - {id: a1b-staging, at: "D1 16:22", kind: edit, app: docs, path: transport/outbound-staging-and-cutoffs, target: doc-staging, title: Outbound staging and cutoff schedule (Groveport),
     summary: "set the outbound staging times by route",
     content: "# Groveport outbound staging and cutoffs (from 11/2)\n\n| Route | Carrier | Staged by | Supervisor check | Pickup | Promise |\n| --- | --- | --- | --- | --- | --- |\n| Columbus city | Calder truck | 06:45 | 06:50 (1st shift) | 07:30 | same day |\n| Lexington KY | Buckeye (dedicated driver) | 15:00 | 15:30 (1st shift) | 16:00 | next day 10:00 |\n| Cincinnati OH | Calder truck | 20:30 | 20:45 (2nd shift) | 21:00 | next day 07:00 |\n| Indianapolis IN | Calder truck | 21:30 | 21:45 (2nd shift) | 22:00 | next day 08:00 |\n| Louisville KY | Buckeye | 21:30 | 21:45 (2nd shift) | 22:00 | next day 10:00 |\n\nRules: a load not staged by its time is escalated to the shift supervisor at once, not at the pickup. Hot orders that compete with a staging time go to the supervisor, who decides which route waits and tells transportation. Buckeye calls Jasmine by 15:30 if the Lexington driver is late."}

