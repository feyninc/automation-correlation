sources:
  - "29 CFR 1910.178(l)(4)(iii) (operator evaluation at least once every three years) and (q)(1), (q)(7) (unsafe trucks removed from service; examined before use, at least daily): https://www.law.cornell.edu/cfr/text/29/1910.178"
  - "29 CFR 1910.37(a)(3) (exit routes free and unobstructed; no materials placed in them, even temporarily): https://www.law.cornell.edu/cfr/text/29/1910.37"
  - "29 CFR 785.19 (a meal period is unpaid only if the employee is completely relieved from duty): https://www.law.cornell.edu/cfr/text/29/785.19"
  - "29 CFR 785.27 (training is unpaid only if outside hours, voluntary, not job-related and no productive work): https://www.law.cornell.edu/cfr/text/29/785.27"
  - "29 CFR 778.207(b) (night-shift differentials are included in the regular rate for overtime): https://www.law.cornell.edu/cfr/text/29/778.207"
  - "29 CFR 570.58 (Hazardous Occupations Order No. 7: no minor 16-17 operates a forklift or other high-lift truck): https://www.law.cornell.edu/cfr/text/29/570.58"
  - "29 CFR 1904.33 (OSHA 300, 300A and 301 kept five years after the end of the calendar year they cover): https://www.law.cornell.edu/cfr/text/29/1904.33"
  - "29 CFR 1904.7(b)(5)(ii) (first aid includes a non-prescription medication at non-prescription strength and hot or cold therapy; full duty is not restricted work): https://www.law.cornell.edu/cfr/text/29/1904.7"
  - "29 CFR 516.5 (payroll records three years) and 516.6 (time cards two years): https://www.law.cornell.edu/cfr/text/29/516.6"
  - "40 CFR 273.14(e) and 273.15 (universal waste lamps labeled; a small quantity handler accumulates no longer than one year from the date on the container): https://www.law.cornell.edu/cfr/text/40/273.15"

