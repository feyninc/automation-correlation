     body: "Brett Lyons, 11/2: Scioto Health wants about 120 PM kits a month, 14 lines each, bagged and labeled by building. Asked for a ballpark (he suggested $10); none given. Price per OPS-310 from a timed standard: Kim to time 10 sample kits Tuesday; written price to Brett by Wednesday. Brett sends the sample kit list tonight. He won't quote Dana before then."}
