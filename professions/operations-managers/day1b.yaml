     summary: "had the resigned associate's badge disabled and footage pulled",
     body: "Kyle, badge 20417 (Travis Wilkins, resigned, last day 10/23) opened the employee entrance Sunday 11/1 at 02:14 and left at 02:23, per Ironside. Please disable it now and pull Sunday's camera clips for E1 and aisle 31 (we're investigating brass shrink there). Janelle, his separation didn't reach IT: can you check why, and run every October separation against the active badge list? Andrea, FYI; I'll tell you what the footage shows before anyone contacts him."}
