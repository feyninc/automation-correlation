  - {id: a1b-scanners, at: "D1 12:15", kind: reply, target: t1b-kyle-scanners, to: [c_kyle], cc: [c_shawn, c_tina], summary: "gave Kyle the peak scanner need",
     body: "Kyle, plan on 24 new associates on 11/9 (Pinnacle's class) and possibly a second class later in November. With 14 spares we're 10 short for the first class, so yes, please borrow 10 from Dayton and have them enrolled before Friday; the 3 in repair cover the second class only if they're back 11/13. And the 22 failed spare batteries need to be replaced before the 9th, not after."}
