     summary: "drafted the LED retrofit CER",
     content: "# CER: Groveport LED high-bay retrofit (draft for the January capital review)\n\nScope: replace 380 metal-halide high bays with LED fixtures and motion sensors (Brightside Energy quote, $42,000).\nApprover: Regional VP (FIN-104, capital up to $50,000).\nNet cost: $42,000 - $9,500 AEP Ohio rebate = $32,500. The rebate needs AEP pre-approval before purchase; Brightside applied 11/5, decision in about 30 days. Without it, $42,000.\nSavings: $1,000 a month from our last 12 AEP bills (Brightside estimated $1,050). Payback 32,500 / 1,000 = 32.5 months (42 months without the rebate).\nOther benefits: better light in the picking aisles (accuracy), less re-lamping.\nDisposal: the 380 metal-halide lamps go to a universal-waste lamp recycler (Brightside's subcontractor), with the certificate of recycling in our file; our current lamp box ships separately before its one-year date.\nTiming: install in January after peak, aisle by aisle on weekends.\nRecommendation: approve for January, subject to the AEP pre-approval."}
