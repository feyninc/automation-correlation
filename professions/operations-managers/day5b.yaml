    start: "D5 08:35:00"
    turns:
      - [c_agency, "Ronan, Kelly. I found the 150 hours. 120 of them are your 10/24 physical count crew, 15 people for 8 hours. The UKG kiosk was down that night, so they signed paper sheets, and Omar signed them. The other 30 I can't support. Can we just settle on the 150 so I can close October?", 7]
      - [worker, "If they worked, we pay for it. Send me the sheets this morning; once Omar confirms them, reissue the invoice for 5,380 hours, $156,020.00, and credit the other 30 hours. I won't approve the full 150."]
