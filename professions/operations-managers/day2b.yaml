     body: "Brian Kowalski (Central Ohio Lift), 11/3 PM: RT-03 lift chains past wear limit, mast sheave bearing rough. He offered to leave it in service on light loads until Friday; declined. RT-03 tagged out of service until repaired. Repair approved $2,140 (chains, sheave, labor), install Fri 11/6 AM; quote to Dale for the PO. RT-01, RT-02, RT-04 fine."}
  - {id: a2b-trainers, at: "D2 09:15", kind: reply, target: t1b-staff, to: [c_tina, c_shawn], summary: "set the trainer pick targets for class weeks",
     body: "Tina, on your question about trainers: no pick target for trainers Monday through Wednesday of a class week (Mon-Wed), and 50% of standard Thursday and Friday. Code their time as indirect 'training' in the LMS so it doesn't count against them. Same for both shifts and for the 11/16 class if we get one."}
  - {id: a2b-diff-tina, at: "D2 09:30", kind: reply, target: t1-tina, to: [c_tina], summary: "told Tina the differential belongs in the OT rate",
     body: "You're right. The $1.00 night differential is part of their regular rate, so overtime is 1.5 x $21.60 = $32.40 an hour, not $30.90. Darnell is short $12.00 for last week. I'm asking Denise to correct it for everyone on second shift and pay it on the next check."}
  - {id: a2b-diff, at: "D2 09:35", kind: new, app: mail, path: sent/second-shift-ot-rate, target: m2b-diff, to: [c_denise], cc: [c_hr, c_tina], subject: "Second-shift overtime is missing the night differential",
     summary: "asked payroll to correct the second-shift overtime rate and back-pay",
     body: "Denise, second shift's overtime is being paid at 1.5 x the $20.60 base ($30.90) with the $1.00 night differential paid only on straight hours. The differential has to be included in the regular rate for overtime (29 CFR 778.207(b)), so their OT rate is 1.5 x $21.60 = $32.40, $1.50 an hour more. For the week of 10/25 UKG shows 212 OT hours on second shift: $318.00 owed (example: Darnell, 8 OT hours, short $12.00). Please correct the pay rule, pay the difference on the next check, and check back to when the rule started so we pay every affected week. Thanks."}
  - {id: a2b-voters, at: "D2 10:24", kind: reply, target: t1b-leads, to: [c_deanna], cc: [c_shawn], summary: "no points for the voters",
     body: "Deanna, no points for anyone who went to vote today, the 10:30 ones included: Ohio law and our HR-110 give them reasonable time without penalty, and Janelle has coded it so nothing generates. The time is unpaid, that's all. If someone's absence wasn't about voting, that's a separate conversation for Shawn and HR, not a point today."}
  - {at: "D2 10:30", kind: noop, target: t2b-kim-kits, minutes: 30, summary: "watched Kim build and time the Scioto sample kits at the pack bench"}
  - {id: a2b-orient, at: "D2 11:50", kind: reply, target: t2b-marcus-orient, to: [c_marcus], cc: [c_agency], summary: "told Pinnacle orientation is paid and billable",
     body: "Marcus, no: orientation is required, during their scheduled shift and about this job, so it's paid work time (29 CFR 785.27), whatever other clients do. Please pay the associates and bill it at the regular rate: 24 x 4 hours = 96 hours, $2,784. Same for the second class if we add one."}
  - {id: a2b-tasha, at: "D2 12:35", kind: reply, target: t2b-tasha, to: [c_tasha], cc: [c_beth, c_omar], summary: "set up a look at the aisle 14-15 top levels",
