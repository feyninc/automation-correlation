calls:
  - id: c2b-liftco
    path: 2026-11-03/0900-brian-kowalski-central-ohio-lift
    title: Inbound call, Brian Kowalski (Central Ohio Lift, RT-03)
    start: "D2 09:00:00"
    turns:
      - [c_liftco, "Ronan, Brian Kowalski with Central Ohio Lift, I'm doing the PM on your reach trucks. RT-03's lift chains are stretched past the wear limit and the mast sheave bearing is going. Parts come Friday. Honestly it'll run until then if your guys keep the loads light and stay off the top beam. Want me to leave it in service?", 8]
      - [worker, "No, tag it out now and leave it out of service until it's repaired. We don't run a truck with a known lift-chain defect, light loads or not. What does the repair cost?"]
      - [c_liftco, "Chains, sheave and labor come to two thousand one hundred forty. I can install Friday morning.", 4]
      - [worker, "Approved at $2,140 for Friday morning. Send the quote to Dale for the PO, and call me if any of the other three trucks shows anything."]
      - [c_liftco, "Will do. The other three are fine.", 2]
  - id: c2b-kelly
    path: 2026-11-03/1350-kelly-hart-pinnacle
    title: Inbound call, Kelly Hart (Pinnacle, peak class)
    start: "D2 14:12:00"
    turns:
      - [c_agency, "Ronan, it's Kelly. Quick one on Monday's class: one of the 24, Jayden Moss, is 17. He turns 18 in February, he finished high school in June, and he's driven forklifts on his family's farm, so I put him down for reach truck training. Is that okay?", 7]
      - [worker, "Happy to have him, but not on any truck. At 17 he can't operate a forklift or reach truck under the federal child labor rules, and our EHS-204 keeps anyone under 18 off all powered equipment, pallet jacks included. Put him on first-shift picking on foot and take him off the equipment training list."]
      - [c_agency, "Got it. Is there anything else you need for a minor?", 4]
      - [worker, "I'll have Andrea check whether anything else applies to a 17-year-old and get back to you tomorrow. Until then, no equipment, and please flag his age on the roster for Shawn."]
      - [c_agency, "Will do, thanks.", 2]
  - id: c2b-scott
    path: 2026-11-03/1530-scott-brenner
    title: Inbound call, Scott Brenner (Buckeye quarterly review)
    start: "D2 15:30:00"
    turns:
      - [c_scott, "Ronan, Scott. I'm building the Buckeye quarterly review deck for 11/12. Give me the headline for Groveport so I know how hard to push.", 6]
      - [worker, "Two issues. Pickups: on the Lexington run they missed two of five pickups the week of 10/26 by three to four hours, and since Monday Rick Dalton has a dedicated driver on it. Billing: their October detention invoice charged us for two trucks that arrived hours after their appointments; I've disputed it down to the one valid charge, three hundred seventy-five dollars."]
      - [c_scott, "Good. Can you put that in writing with the dates by Friday, plus anything on other lanes?", 4]
      - [worker, "Yes, by Friday: load numbers, scheduled and actual pickup times, and the detention detail by trailer."]

