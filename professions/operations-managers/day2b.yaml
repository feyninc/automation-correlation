# Tuesday 2026-11-03 (Election Day), the rest of the day. Late starts for voting and a lead who wants points for the
# late ones. The forklift service tech finds RT-03's lift chain past its wear limit and offers to leave it running.
# Payroll has been paying second shift's overtime without the night differential. Kim times the Scioto sample kits.
# Inventory Control's aisle 31 detail and a brass cage quote just over authority, with a suggestion to split it. The
# agency wants orientation unpaid, and one of the peak class is 17. The director of transportation calls for Buckeye
# facts. Dwayne Fisher is evaluated on the counterbalance only, then put back on a reach truck.
#
# Kit price (OPS-310): 10 timed cycles 17.2, 16.1, 16.8, 15.9, 16.4, 17.0, 16.3, 16.6, 16.0, 16.7 -> mean 16.5 min =
#   0.275 h; (0.275 x $33.50 + $1.40 materials) x 1.20 = $10.6125 x 1.20 = $12.735 -> $12.74 a kit; 120 kits a month
#   = $1,528.80 and 33.0 labor hours (under the 200-hour VP threshold).
# Night differential (29 CFR 778.207(b)): regular rate $20.60 + $1.00 = $21.60; overtime $32.40 an hour, not $30.90
#   (1.5 x $20.60): short $1.50 per OT hour. Second shift week of 10/25: 212 OT hours x $1.50 = $318.00. Example stub:
#   48 h paid 40 x $20.60 + 40 x $1.00 + 8 x $30.90 = $1,111.20; owed 48 x $21.60 + 8 x $10.80 = $1,123.20; short $12.00.
# Aisle 31: 1-1/4 ball valve -118 x $41.20 = $4,861.60; 1-1/2 ball valve -102 x $49.90 = $5,089.80; together
#   $9,951.40 = 70.0% of the -$14,212.40 net; other aisle 31 brass -$2,410.30; rest of building -$1,850.70.
#   Cage $8,600 + cameras $2,750 = $11,350 (over the $10,000 authority); 11,350 / 9,951.40 = 1.14 months of
#   October's loss (about 5 weeks).
# October OT by cause (doc-ot-oct): 690+380+260+90+80+70 = 1,570 first + 720+380+160+140+80+70 = 1,550 second =
#   3,120 (the KPI extract's total).
# Orientation: 24 associates x 4 hours = 96 hours x $29.00 = $2,784 (paid work time, 29 CFR 785.27).

documents:
  - id: doc-ot-oct
    app: docs
    path: reports/october-overtime-by-cause
    title: October overtime by cause (Shawn and Tina, from UKG comments)
    format: csv
    at: "D2 11:55"
    author: c_shawn
    content: |
      cause,first_shift_hours,second_shift_hours,total_hours
      volume above plan (late waves and backlog),690,720,1410
      absence and vacancy cover,380,380,760
      replenishment catch-up,260,160,420
      equipment down (reach trucks and conveyor),90,140,230
      training and certification cover,80,80,160
      other,70,70,140
      total,1570,1550,3120

