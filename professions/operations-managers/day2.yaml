    title: Possible FMLA leave, not a final warning
    kind: escalate
    task: 20705
    from: "D2 08:15"
    due: "D2 12:00"
    evidence: [t2-shawn, pol-people]
    ref: a2-fmla
    check: {"all": [{"to_includes": "c_hr"}, {"mentions_any": ["FMLA", "family and medical leave", "protected leave"]}, {"mentions_any": ["dialysis", "parent", "mother", "mom"]}]}
    must: ["Caring for a parent may be FMLA-protected; she needn't name it; HR notified the same day; notice within 5 business days", "No points or warning meanwhile"]
    must_not: ["Approves the final warning"]
    minutes: [8, "a reply and an HR referral"]
    intent: "That's protected, probably."
  - id: n2-staffing
    title: Peak labor plan with the gap
    kind: doc
    task: 20701
    from: "D2 08:00"
    due: "D3 17:00"
    evidence: [doc-forecast, doc-kpi-oct, t2-lisa, pol-authority]
    ref: a2-staffing
    check: {all: [{number_equals: {value: 1725, tol: 3}}, {number_equals: {value: 61, tol: 1}}, {any: [{number_equals: {value: 7}}, {mentions_any: [seven]}]}]}
    must: ["Hours from forecast and October productivity: ~1,725 a day", "Coverage by permanent, OT and agency; ~61 agency FTE needed vs ~54: a ~7 FTE gap", "Options with cost; Lisa approves beyond the plan"]
    minutes: [40, "a staffing plan (estimate)"]
    intent: "Find the gap now."
  - id: n2-detention
    title: Dispute the invalid detention charges
    kind: reconcile
    task: 20702
    from: "D2 09:30"
    due: "D2 17:00"
    evidence: [doc-detention, t2-jas]
    ref: a2-detention
    check: {"all": [{"any": [{"to_includes": "c_carrier"}, {"to_includes": "c_rick"}]}, {"number_equals": {"value": 375}}, {"mentions_any": ["appointment", "appointments", "appt", "arrived late", "arrived after", "late arrival"]}]}
    must: ["Two trucks arrived after their appointments; only 10/13 ($375) is valid; corrected invoice"]
    must_not: ["Pays $1,350"]
    minutes: [25, "an invoice dispute (estimate)"]
    intent: "Late trucks don't get detention."
  - id: n2-dock
    title: Repair within authority, replacement by CER
    kind: reply
    task: 20703
    from: "D2 11:00"
    due: "D2 17:00"
    evidence: [t2-dale, pol-authority]
    ref: a2-dock
    check: {"all": [{"any": [{"to_includes": "c_dale"}, {"to_includes": "c_lisa"}]}, {"mentions_any": ["6,800", "$6,800", "repair"]}, {"mentions_any": ["CER", "Lisa", "capital"]}]}
    must: ["Approves the $6,800 repair (under $10,000) to have 12 doors for peak", "Replacement $18,500 needs a CER to Lisa"]
    must_not: ["Approves the $18,500 replacement himself"]
    minutes: [6, "a decision reply"]
    intent: "Repair now, replace later."
  - id: n2-midstate
    title: Hold Midstate to the supply agreement
    kind: follow_up
    task: 20702
    from: "D2 14:00"
    due: "D3 17:00"
    evidence: [t2-omar, doc-midstate]
    ref: a2-midstate
    check: {"all": [{"to_includes": "c_packvend"}, {"mentions_any": ["SA-221", "rebate"]}, {"mentions_any": ["PO-7913", "PO-7740", "PO-7802", "PO-7861", "7913", "4 of", "four of", "four late", "4 late", "late deliveries", "deliveries late", "days late", "delivered late"]}]}
    must: ["Four late of nine with dates; the SA-221 rebate terms; a concrete recovery plan before peak"]
    minutes: [12, "a supplier escalation"]
    intent: "We can't run out in December."

traps:
