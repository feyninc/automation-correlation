# Tuesday 2026-11-03 (Election Day). A supervisor wants a final warning for an associate whose absences were to take
# her mother to dialysis. Lisa wants the peak staffing plan. The carrier bills detention for trucks that arrived
# outside their appointments. The corrugated supplier keeps delivering late. A dock leveler fails: repair within
# authority or a replacement that needs a CER.
#
# Peak plan: 13,200 lines a day / 7.65 lines per labor hour (October) = 1,725 hours a day; permanent 148 x 8 h x 95%
# attendance = 1,125; overtime at 10% = 112; agency needed 488 hours = 61 FTE; on hand about 30 + class of 24 = 54,
# so about 7 FTE short. Detention: 3 events billed 9 hours, $1,350; two trucks arrived 2-3 hours after their
# appointments, so only 1 event (2.5 hours billable after the 2 free hours = $375) is valid.

documents:
  - id: doc-forecast
    app: docs
    path: planning/q4-peak-forecast
    title: Q4 peak forecast (Demand Planning)
    at: "D2 08:00"
    author: c_fpa
    content: |
      Groveport order lines, peak weeks 11/9-12/18 (30 shipping days): average 13,200 lines a day (October 11,521).
      Peak day estimate 15,400 (week of 11/30). Plan labor at October productivity unless you have a better number.
  - id: doc-detention
    app: docs
    path: transport/buckeye-invoice-BF-55102
    title: Buckeye Freightways invoice BF-55102 (detention)
    at: "D2 09:30"
    author: c_carrier
    content: |
      Detention at Groveport DC, October. Terms: 2 hours free from appointment time, then $150/hour.
      | Date | Trailer | Appointment | Arrived | Departed | Billed hours | Amount |
      | --- | --- | --- | --- | --- | --- | --- |
      | 10/13 | BF-2210 | 08:00 | 07:55 | 12:30 | 2.5 | $375 |
      | 10/20 | BF-2214 | 08:00 | 10:40 | 13:15 | 3.0 | $450 |
      | 10/27 | BF-2231 | 13:00 | 15:50 | 19:20 | 3.5 | $525 |
      Total $1,350.00
  - id: doc-midstate
    app: docs
    path: suppliers/midstate-packaging-deliveries-q3q4
    title: Midstate Packaging deliveries, September-October (receiving log)
    format: csv
    content: |
      po,promised,received,days_late
      PO-7712,2026-09-03,2026-09-03,0
      PO-7740,2026-09-10,2026-09-14,4
      PO-7781,2026-09-17,2026-09-17,0
      PO-7802,2026-09-24,2026-09-29,5
      PO-7830,2026-10-01,2026-10-01,0
      PO-7861,2026-10-08,2026-10-12,4
      PO-7890,2026-10-15,2026-10-15,0
      PO-7913,2026-10-22,2026-10-27,5
      PO-7947,2026-10-29,2026-10-29,0
      contract,"supply agreement SA-221: delivery on the promised date; 3 late deliveries in a quarter allow a 5% rebate on that quarter's purchases",,

threads:
  - id: t2-shawn
    app: mail
    path: inbox/hughes-attendance
    title: Marlene Hughes attendance
    x:
      - {at: "D2 08:15", from: c_shawn, to: [worker], subject: "Marlene Hughes: final warning?",
         body: "Ronan, Marlene Hughes hit 6 points in October (3 full-day absences). She told me she's been taking her mom to dialysis on Tuesdays and Thursdays and her sister usually covers but couldn't. She's a good worker but policy is a final warning at 6. OK to issue it today? Shawn"}
  - id: t2-lisa
    app: mail
    path: inbox/peak-staffing
    title: Peak staffing plan
    x:
      - {at: "D2 08:00", from: c_lisa, to: [worker], cc: [c_fpa], subject: "Peak staffing plan by Wednesday",
         body: "Ronan, please send me the peak labor plan for 11/9-12/18 with Wednesday's pages: hours per day, how we cover them (permanent, OT, agency), and any gap. Forecast attached. Lisa", att: [doc-forecast]}
  - id: t2-jas
    app: chat
    path: "@jasmine/dm"
    title: Jasmine Clay (DM)
    x:
      - {at: "D2 09:35", from: c_jas, body: "Buckeye billed us $1,350 detention for October. pay it? the gate log has arrival times if you want to check"}
  - id: t2-dale
    app: mail
    path: inbox/dock-7
    title: Dock leveler 7
    x:
      - {at: "D2 11:00", from: c_dale, to: [worker], subject: "Dock 7 leveler failed",
         body: "Ronan, dock 7's hydraulic leveler failed this morning (cylinder leak). Quotes from Rite-Hite: repair $6,800 (new cylinder and seals, 2 days, should get us 2-3 years); full replacement $18,500 (new leveler, 5 days). It's 19 years old. We're down to 11 of 12 doors for peak. Dale"}
  - id: t2-omar
    app: chat
    path: "@omar/dm"
    title: Omar Reyes (DM)
    x:
      - {at: "D2 14:00", from: c_omar, body: "Midstate was late again last week (5 days). we nearly ran out of 16x12x12 boxes. what do you want to do with them?"}

actions:
  - {at: "D2 08:20", kind: read, target: t2-shawn, summary: "read Shawn's request"}
  - {id: a2-fmla, at: "D2 08:40", kind: reply, target: t2-shawn, to: [c_shawn], cc: [c_hr], summary: "stopped the warning and sent the case to HR",
     body: "Hold the warning, Shawn. Taking a parent to dialysis may be FMLA-protected (caring for a parent with a serious health condition), and she doesn't have to say 'FMLA' for us to be on notice. Under our policy those absences don't count as points until HR decides. Andrea, can you send Marlene the FMLA eligibility notice? We learned about it today, so it's due within five business days. Shawn, please don't discuss it further with her until Andrea reaches out."}
  - {at: "D2 08:05", kind: read, target: t2-lisa, summary: "read Lisa's request and the forecast"}
  - {at: "D2 09:40", kind: read, target: doc-detention, summary: "checked the detention invoice against the gate log"}
  - {id: a2-detention, at: "D2 10:10", kind: new, app: mail, path: sent/buckeye-detention-dispute, target: m2-detention, to: [c_carrier], cc: [c_jas], subject: "Dispute: invoice BF-55102 (detention, October)",
     summary: "disputed two of the three detention charges",
     body: "Hello, we dispute part of BF-55102. Detention runs from the appointment time when the truck arrives on time. 10/20 BF-2214 had an 08:00 appointment and arrived 10:40; 10/27 BF-2231 had a 13:00 appointment and arrived 15:50 (gate log attached), so neither qualifies. 10/13 BF-2210 is valid: $375.00. Please reissue for $375.00. Ronan Pierce, Operations Manager, Groveport DC"}
  - {id: a2-jas, at: "D2 10:15", kind: reply, target: t2-jas, to: [c_jas], summary: "told Jasmine to pay only the valid charge",
     body: "Only the 10/13 one is valid ($375). The other two trucks were 2-3 hours late for their appointments. I've disputed it with Buckeye; please hold payment until the corrected invoice comes."}
  - {at: "D2 11:05", kind: read, target: t2-dale, summary: "read Dale's dock leveler quotes"}
  - {id: a2-dock, at: "D2 11:30", kind: reply, target: t2-dale, to: [c_dale], cc: [c_lisa], summary: "approved the repair and planned a CER for replacement",
     body: "Approve the $6,800 repair now (within my authority) so we have 12 doors for peak. Please book Rite-Hite for this week. The leveler is 19 years old, so I'll put the $18,500 replacement into a CER for Lisa for the January capital review rather than replacing it in the middle of peak."}
  - {id: a2-staffing, at: "D2 15:00", kind: edit, app: docs, path: planning/peak-labor-plan, target: doc-peak-plan, title: Peak labor plan 11/9-12/18 (draft),
     summary: "built the peak labor plan",
     content: "# Groveport peak labor plan, 11/9-12/18 (draft for Lisa)\n\nDemand: 13,200 lines a day average (peak day ~15,400).\nProductivity: 7.65 lines per labor hour (October: 253,460 lines / 33,120 hours).\nHours needed: 13,200 / 7.65 = 1,725 a day.\nCoverage: permanent 148 associates x 8 h x 95% attendance = 1,125; overtime capped at 10% of straight time = 112; agency 488 hours a day = 61 agency FTE.\nAgency on hand: ~30 FTE (5,260 hours in October / 22 days / 8) + peak class of 24 on 11/9 = 54. Gap: ~7 FTE (56 hours a day).\nOptions: a second Pinnacle class of 8 by 11/16 (preferred: 56 h x $29.00 = $1,624 a day), or 56 more overtime hours a day (OT ~15% of straight time; 56 h x $30.90 = $1,730 a day, plus fatigue risk in peak), or both on peak days. Either is beyond the approved plan, so it needs your approval.\nPeak days (~15,400 lines, 2,013 hours) need the second class plus Saturday shifts."}
  - {at: "D2 14:05", kind: read, target: t2-omar, summary: "read Omar's note"}
  - {id: a2-midstate, at: "D2 14:40", kind: new, app: mail, path: sent/midstate-late-deliveries, target: m2-midstate, to: [c_packvend], cc: [c_omar], subject: "Late deliveries and SA-221 rebate",
     summary: "raised late deliveries with Midstate",
     body: "Joe, four of Midstate's last nine deliveries to Groveport were 4-5 days late (PO-7740, 7802, 7861, 7913), and we nearly ran out of 16x12x12 boxes last week, right before peak. Under SA-221, three late deliveries in a quarter qualify for the 5% rebate on the quarter's purchases; Q3 had two, and Q4 has two already. I need a recovery plan this week: confirmed delivery dates for November, and a safety stock of two weeks of our top 5 sizes on your floor. Ronan"}

needs:
