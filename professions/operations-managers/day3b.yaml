calls:
  - id: c3b-terri
    path: 2026-11-04/1045-terri-sandoval-indianapolis
    title: Inbound call, Terri Sandoval (Indianapolis promotion)
    start: "D3 10:45:00"
    turns:
      - [c_terri, "Ronan, Terri in Indy. For the winter-readiness week, 11/16 to the 20th, I have 28 SKUs where we expect three to four times normal: heat tape, backflow repair kits, boiler valves. I'd like all of it on one extra truck Friday 11/13 so it's on my floor Monday morning. Can you do that?", 7]
      - [worker, "Yes. An extra truck Friday 11/13 for a Monday 7:00 delivery works. Email me the 28 SKUs with quantities today; I'll get them to Hannah so Demand Planning can buy for it, and Omar will check stock and reserve it. If anything's short, I'll tell you by Monday."]
      - [c_terri, "Great. And Louisville has two pallets of heat tape on order. Can you just hold those for me?", 5]
      - [worker, "I can't move Louisville's allocation; that's Demand Planning's call. Put the heat tape on your list and Hannah will decide the split."]
      - [c_terri, "Fair enough. List within the hour.", 2]
  - id: c3b-andrea
    path: 2026-11-04/1235-andrea-fulton
    title: Inbound call, Andrea Fulton (HR)
    start: "D3 12:35:00"
    turns:
      - [c_hr, "Ronan, it's Andrea. Two things. Counsel confirmed Jayden's fine on first-shift picking as long as he's off powered equipment. And Derek Simms on second shift brought in a note from his own doctor: no lifting over 25 pounds for 8 weeks, a back condition, not work-related. Before I meet him for the interactive process, which jobs here stay under 25 pounds?", 8]
      - [worker, "Thanks on Jayden. For Derek: mezzanine small-parts picking, returns processing, and the pack bench, including the Scioto kits from December, all stay under 25 pounds. Bulk, aisles 14 and 15, and receiving don't. The decision and the conversation with him are yours; I'll make sure Tina doesn't move him or change his schedule until you've met him."]
      - [c_hr, "Perfect. I'll meet him tomorrow at 3.", 2]
  - id: c3b-tristate
    path: 2026-11-04/1400-jordan-pike-tri-state
    title: Inbound call, Jordan Pike (Tri-State Xpress)
    start: "D3 14:00:00"
    turns:
      - [c_tristate, "Ronan, Jordan Pike, Tri-State Xpress. I'll be quick. We can run Columbus to Lexington with a four o'clock pickup and next-morning delivery at twelve percent under what you pay Buckeye. Commit the lane to us starting Monday and I'll lock that rate through peak. Can we shake on it today?", 7]
      - [worker, "Thanks, Jordan, but I can't commit a lane. Carrier contracts go through Scott Brenner in Transportation, with Procurement. Send Scott your rate sheet and service terms, and I'll give him our Lexington lane data so he can compare."]
      - [c_tristate, "Understood. Can you at least tell me what you pay Buckeye now?", 4]
      - [worker, "No, that's covered by our agreement with them. Scott will take it from here."]
      - [c_tristate, "Okay. I'll email Scott today.", 2]

