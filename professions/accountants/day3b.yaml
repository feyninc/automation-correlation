  - {id: a3b-vince, at: "D3 11:32", kind: new, app: mail, path: sent/bbc-early-request, target: m3b-bbc, to: [c_vince], cc: [c_rachel],
     subject: "Commerce Union wants the October borrowing base early", summary: "told Vince the bank is asking for the borrowing base early",
     body: "Vince, Greg Hollis called: their credit team saw the revolver higher in October and wants the October borrowing base certificate early, with preliminary numbers. I told him the certificate comes from you after review (due by 11/20) and gave no numbers. I can prepare the BBC for your review Friday once the AR rec ties and Nadia's inventory rec is reviewed. Separately, he's sending enrollment forms for payee positive pay on x4425 and an ACH debit block on x4433 for Rachel to sign. Elena"}
  - {id: a3b-call-andre, at: "D3 09:20", kind: noop, target: t3b-andre, minutes: 10, summary: "call with Andre about validating Kessel's certificate before the credit memos"}
  - {id: a3b-ken, at: "D3 12:00", kind: reply, target: t3b-ken, to: [c_ken], summary: "told Ken the one-offs come with tomorrow's flux",
     body: "I'll list them in tomorrow's flux to Rachel (bank fee catch-up, the trade show deposit, the laptops), and you'll see the final list after Friday's review."}
  - {id: a3b-paul, at: "D3 13:00", kind: reply, target: t3b-paul, to: [c_paul], cc: [c_rachel], summary: "sent Paul test cases for the approval workflow fix",
     body: "Paul, test cases I'd want to pass in the sandbox before production: (1) I create a JE and Tom is out of office: it must route to Rachel, never to me as his delegate. (2) Any preparer, any amount: the creator can never approve their own entry, directly or through a delegation. (3) Staff entry of 49,999.99 routes to me; 50,000.01 routes to Tom, or to Rachel when Tom is out. (4) Rachel's own entries route to Vince. (5) A preparer edits an entry after approval: it goes back to pending. (6) The approval history shows the approver's name and timestamp on the JE listing saved search (the auditors use it for PBC 7). Could you also run a one-time report of every JE this year where creator = approver, so we have the full list? Elena"}
  - {id: a3b-call-hector, at: "D3 14:20", kind: noop, target: t3b-hector-comm, minutes: 10, summary: "call with Hector about how the commission report is pulled (invoice date vs. recognized revenue)"}
  - {id: a3b-forms, at: "D3 14:40", kind: forward, target: t3b-greg-forms, to: [c_rachel], summary: "sent the bank's enrollment forms to Rachel to sign",
     body: "Rachel, the payee positive pay (x4425) and ACH debit block (x4433) forms from Greg need an authorized signer, so they're yours. With 48213 altered and 48195 missing, I'd sign them this week; setup takes two business days. Elena"}
  - {id: a3b-commission, at: "D3 14:50", kind: new, app: mail, path: sent/je-10311-commissions, target: m3b-commission, to: [c_rachel], cc: [c_hector],
     subject: "JE-10311 October commission accrual for your approval (185,177.14)", summary: "sent Rachel the commission accrual adjusted for cutoff",
     body: "Rachel, JE-10311 October commissions (my entry, Tom is out, so it needs you): the NetSuite report Hector pulled 11/2 is by invoice, so it still has two invoices our cutoff moved to November: INV-77190 Valley Lift 34,210.00 (Dave Kurtz) and INV-77195 Kessel 28,947.25 (Lisa Fenn). The plan pays on recognized revenue, so they come out; Arbor Crane was a house account anyway. Commissionable revenue 12,345,142.75 x 1.5% = 185,177.14 (Kurtz 61,294.35, Fenn 59,358.79, Webb 64,524.00), not the report's 186,124.50. Dr 6200 / Cr 2240, payable 11/20. Brett asked me to include Cascade for Marcus; I haven't: under the plan it's earned when the revenue is recognized, on delivery in December. Elena"}
  - {id: a3b-brett, at: "D3 15:05", kind: reply, target: t3b-brett-comm, to: [c_brett], cc: [c_hector], summary: "told Brett Cascade's commission comes when the revenue is recognized",
     body: "Brett, I can't include Cascade in October. The commission plan pays 1.5% on revenue in the month it's recognized under ACCT-500, and Cascade will be recognized on delivery in December, so Marcus earns it then (and it counts in Q4). For the same reason, Dave's Valley Lift and Lisa's Kessel invoices from 10/29-10/30 move to November, when they were delivered. October's accrual is in Rachel's queue. Elena"}
  - {id: a3b-jacks, at: "D3 15:30", kind: new, app: mail, path: sent/pbc-2-floor-jacks, target: m3b-jacks, to: [c_rachel], cc: [c_marco],
     subject: "PBC 2 review: floor jacks capitalized below the per-item threshold", summary: "flagged the capitalized floor jacks to Rachel",
     body: "Rachel, reviewing Marco's PBC 2 additions list: FA-2188 is six floor jacks at 2,150.00 each (Grainger 9877-12, June), capitalized together as 12,900.00 in 1540. Under ACCT-410 the threshold is per item, so each jack should have been expensed, the same call we made on Monday's laptops. Depreciation July-October is 860.00, so net book value is 12,040.00. It's small and within the year; my suggestion is to write it off to 6450 small tools in November (Dr 6450 12,040.00, Dr accumulated depreciation 860.00 / Cr 1540 12,900.00), since October closes today, and to tell Brightline when we upload the list rather than change it. The rest of the list is right. Your call. Elena"}
  - {id: a3b-marco, at: "D3 15:50", kind: reply, target: t1-marco, to: [c_marco], summary: "told Marco to upload the list as booked",
     body: "Yes: upload it exactly as it is in the books, with the invoices Kevin asked for (everything over $25,000). If Rachel approves the jacks correction, we'll note it on the request so Brightline sees both. Never edit the list to make it look cleaner."}
  - {id: a3b-tax-rec, at: "D3 16:10", kind: edit, app: docs, path: close/2026-10/rec-2310-2330-taxes-payable, target: doc-tax-rec, title: "Taxes payable 2310-2330 reconciliation at 10/31 (Elena)",
     summary: "reconciled the tax payables and booked the CAT accrual",
     content: "# Taxes payable at 10/31/2026 (prepared Elena Moretti 11/4; reviewer Rachel Okafor)\n\n2310 Use tax payable: 3,297.62 = Avalara October consumer's use tax 225.62 (Uline, McMaster-Carr) + Hoosier HMT-20419 3,072.00 (38,400.00 x 8.0%, JE-10310 line 3, not in Avalara because the bill has no tax code). Ties. The October return must be filed at 3,297.62, not Avalara's 225.62.\n2320 Sales tax payable: 152,336.80 = October tax on NetSuite invoices; ties to Jade's tie-out after INV-77060 was voided in AvaTax. Kessel credit memos CM-2210/2211 (3,060.90) are dated 11/4 and go on the November return.\n2330 CAT payable: 9/30 56,900.00 - Q3 true-up 1,299.91 (return 55,600.09, payment scheduled 11/9) + October accrual on Ohio-sitused receipts 7,140,232.18 x 0.26% = 18,564.60 -> 74,164.69. JE-10317 (for Rachel's approval): Dr 6960 CAT expense 17,264.69 / Cr 2330 17,264.69.\nAll three accounts reconciled; no unexplained differences."}
  - {id: a3b-payroll-rec, at: "D3 16:50", kind: edit, app: docs, path: close/2026-10/rec-2210-2220-payroll-bonus, target: doc-payroll-rec, title: "Accrued payroll and bonus 2210-2220 reconciliation at 10/31 (Elena)",
     summary: "reconciled accrued payroll and bonus",
     content: "# Accrued payroll and bonus at 10/31/2026 (prepared Elena Moretti 11/4; reviewer Rachel Okafor)\n\n2210 Accrued payroll: September accrual 355,987.79 reversed 10/1; October accrual JE-10310 line 1 (policy 3.2: 1,118,640.00 x 5/10 = 559,320.00 + FICA 42,787.98) = 602,107.98, reverses 11/1. Ties.\nReasonableness: Priscilla's 11/13 estimate 1,162,420.00 x 5/10 = 581,210.00, 21,890.00 above the accrued wages because of October overtime; under the 50,000 level for flagging, so no change to the policy accrual.\n2220 Accrued bonus: 900,000.00 (Jan-Sep) + JE-10312 100,000.00 (approved by Rachel 11/4) = 1,000,000.00 = 10/12 of the 1,200,000.00 pool. Ties."}
  - {id: a3b-fraud, at: "D3 17:15", kind: reply, target: t2b-lauren-fraud, to: [c_audit_mgr], summary: "answered the auditors' fraud inquiry questions",
     body: "Lauren, my answers. (1) Attempts this year that I know of: check 48213 (18,240.00, mailed 10/30) was stolen and presented with the payee altered; the bank returned it on positive pay (11/2), we stopped and reissued it, and IT Security filed a postal inspection report. Check 48195 to Eaton (63,210.00, mailed 10/27) never arrived; stopped 11/4 and being reissued by ACH in Friday's run. On 11/2 an email from a look-alike domain (parkerfluid-connectors.com) asked us to change Parker Fluid Connectors' bank details; nothing was changed and IT blocked the domain. I'm not aware of any actual fraud. (2) I was asked to do things I declined or escalated: posting an unexplained bank rec difference to suspense, and booking a December delivery (Cascade) as October bill-and-hold revenue; I sent the latter to Rachel with my analysis, and nothing has been booked. (3) Controls not working as designed: NetSuite's delegate setting routed my own JE to me for approval this week (I sent it to Rachel; Paul is fixing the workflow and pulling every past case where the creator approved); a bank feed rule auto-created a duplicate customer payment (18,430.00, corrected); and a June accrual was never reversed (24,880.00, corrected). Happy to go through any of it Thursday. Elena"}

