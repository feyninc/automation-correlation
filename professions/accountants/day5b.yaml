# Friday 2026-11-06 (WD5), the rest of the day. After the close review Elena prepares the October borrowing base
# certificate for Vince, reviews Jade's accrual package for the auditors (three balances are pre-adjustment), uploads
# the Jan-Sep sales and use tax returns, answers the insurance broker's equipment question, and takes a call from the
# audit manager about the missing checks and the bank confirmation. Rachel decides the floor jacks.
#
# Arithmetic (python3):
# - Borrowing base at 10/31: AR 17,560,484.55 (aging rerun, ties to 1200) - over 90 days 41,300.00 (all Brennan, also
#   in bankruptcy) = eligible 17,519,184.55 x 85% = 14,891,306.87. Inventory: raw 9,884,300.00 + finished goods
#   14,212,600.00 - reserve 1,126,400.00 = 22,970,500.00 (WIP 2,410,500.00 and in transit 58,420.00 excluded) x 60%
#   = 13,782,300.00, under the 15,000,000.00 cap. Borrowing base 28,673,606.87 (under the 40,000,000.00 commitment)
#   - revolver 11,500,000.00 = availability 17,173,606.87.
# - Jade's PBC 5 draft vs the final balances: 2200 185,798.33 vs 160,918.33 (JE-10319, 24,880.00); 2250 322,450.00
#   vs 333,388.33 (JE-10307 as corrected); 2240 186,124.50 vs 185,177.14 (JE-10311 after cutoff).
# - Property schedule (additions over 25,000 since July): FA-2266 hydraulic press rebuild 64,200.00 (9/21); FA-2291
#   Hoosier fixture 41,472.00 (10/27, incl. 3,072.00 use tax); on order: Rexroth test bench PO-4486 46,500.00.
#   FA-2203 dock leveler 18,450.00 is under 25,000.
# - Friday run: 161,889.59 approved = Eaton 63,210.00 + Columbus Steel Fab 18,240.00 sent earlier as separate ACHs
#   (81,450.00) + 80,439.59 released with the run.

