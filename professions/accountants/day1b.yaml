     content: "# Ohio commercial activity tax, Q3 2026 (prepared Elena Moretti 11/2; for Rachel's approval; due 11/10)\n\nGross receipts Q3 (NetSuite revenue by ship-to state): July 19,120,400.00 + August 19,604,300.00 + September 18,905,100.00 = 57,629,800.00 (ties to the September YTD P&L).\nOhio-sitused (received by the purchaser in Ohio, ORC 5751.033(E)): 21,384,650.40. Receipts shipped to other states are not taxable gross receipts.\nExclusion: the $6,000,000 annual exclusion was applied in full on the Q1 return (ORC 5751.03); none applies to Q3.\nTaxable gross receipts 21,384,650.40 x 0.26% (2.6 mills) = 55,600.09.\nAccrual: 2330 estimate at 9/30 56,900.00; true-up in October: Dr 2330 1,299.91 / Cr 6960 CAT expense 1,299.91.\nPayment 55,600.09 by 11/10, after Rachel approves."}
