# Monday 2026-11-02 (WD1), the rest of the day. Rachel asks Elena to rebalance Tom's Wed-Fri reviews in FloQast and
# to prepare the Q3 Ohio CAT return Tom usually does. Marco's money market interest entry has two digits transposed.
# Jade's Amex rec leaves unsubmitted card charges as a reconciling item. AP's 1099 cleanup uses last year's $600
# threshold. Elena searches for unrecorded liabilities (bills entered in November for October services). A customer
# check deposited 10/29 comes back NSF on 11/2. Paul Brandt explains the bank-feed rule behind the Hartline duplicate.
# Midwest Bearing's statement shows an invoice already paid by a check still in the mail. Plus the ordinary traffic
# of a close Monday: NetSuite, FloQast, the bank, vendor statements, calendar replies, newsletters, team chatter.
#
# Arithmetic (python3):
# - Money market x4441: 3,512,406.18 + interest 8,921.44 = 3,521,327.62. JE-10297 keyed 8,912.44, so GL after the
#   JE is 3,521,318.62 and the difference is 9.00 (divisible by 9: the 21/12 transposition). Implied yield
#   8,921.44 / 3,512,406.18 x 365/31 = 2.99%.
# - Amex 2050: statement 48,612.90 - GL 46,766.78 = 1,846.12 = Delta 642.30 + Marriott 811.42 + Hertz 392.40.
# - Unrecorded liabilities (ACCT-240 threshold $2,500): Kettering Lane WIP 14,820.00 + Buckeye Staffing week
#   10/26-11/1 9,744.00 + Columbus Crane inspection 10/28 3,950.00 = 28,514.00. Ohio Industrial Gases 1,180.00 is
#   under the threshold; Brightline's 32,000.00 progress bill is already in October.
# - Ohio CAT Q3: revenue Jul 19,120,400.00 + Aug 19,604,300.00 + Sep 18,905,100.00 = 57,629,800.00; by ship-to state
#   OH 21,384,650.40 + IN 9,812,440.10 + MI 11,206,880.25 + KY 4,118,206.00 + IL 6,401,995.70 + PA 3,412,330.10 +
#   other 1,293,297.45 = 57,629,800.00. Tax on Ohio-sitused receipts 21,384,650.40 x 0.0026 = 55,600.09 (the $6M
#   exclusion was used on the Q1 return). Wrong ways: all receipts x 0.0026 = 149,837.48; exclusion applied again
#   (21,384,650.40 - 6,000,000.00) x 0.0026 = 40,000.09. 2330 estimate at 9/30 56,900.00 - 55,600.09 = 1,299.91
#   over-accrued. Q2 (Tom): 22,018,400.00 x 0.0026 = 57,247.84.
# - Valley Lift check 20417 14,500.00, part of the 10/29 lockbox deposit of 214,662.18, returned NSF 11/2.

sources:
  - "Ohio Revised Code 5751.03 (CAT rate 2.6 mills; full exclusion applied on the first quarterly return of the year): https://codes.ohio.gov/ohio-revised-code/section-5751.03"
  - "Ohio Revised Code 5751.01(R) (exclusion amount $6,000,000 beginning in 2025): https://codes.ohio.gov/ohio-revised-code/section-5751.01"
  - "Ohio Revised Code 5751.051 (quarterly CAT return due the tenth day of the second month after the quarter): https://codes.ohio.gov/ohio-revised-code/section-5751.051"
  - "Ohio Revised Code 5751.033(E) (receipts from tangible personal property sitused where the purchaser receives it): https://codes.ohio.gov/ohio-revised-code/section-5751.033"
  - "IRS, Instructions for Forms 1099-MISC and 1099-NEC (Dec 2026): $2,000 threshold for payments after 2025; legal services to corporations still reported: https://www.irs.gov/instructions/i1099mec"
  - "Ohio Revised Code 5739.03(B) (exemption certificate within 90 days after the sale, otherwise tax presumed to apply): https://codes.ohio.gov/ohio-revised-code/section-5739.03"
  - "11 U.S.C. 362(a)(6) (automatic stay of any act to collect a pre-petition claim): https://www.law.cornell.edu/uscode/text/11/362"

