  - id: tf-news
    app: mail
    path: inbox/newsletters
    from: c_jofa
    per_day: 3
    items:
      - {from: c_jofa, subject: "JofA Daily: closing the books faster without cutting corners", body: "Today: what a close calendar and reconciliation ownership do for close speed; reviewing staff work without redoing it; Excel: dynamic arrays for reconciliations. Read more at journalofaccountancy.com."}
      - {from: c_oscpa, subject: "OSCPA member news: November CPE and events", body: "This month: accounting and auditing update webinars, a fraud and ethics session, and local chapter events in Columbus and Cincinnati. Register in the member portal."}
      - {from: c_closedigest, subject: "The Close: three reconciliation habits worth keeping", body: "This week: explain every reconciling item with a date and owner; never let 'timing' stand alone; review the oldest items first. Plus reader questions on accrual thresholds."}
      - {from: c_jofa, subject: "JofA Daily: 1099 reporting changes for 2026 payments", body: "Today: the information-return thresholds for Forms 1099-NEC and 1099-MISC rose to $2,000 for payments made after 2025; what that means for W-9 collection and backup withholding. Read more at journalofaccountancy.com."}
      - {from: c_closedigest, subject: "The Close: when NetSuite approves its own entries", body: "This week: approval delegation, the self-approval gap auditors keep finding, and how to test a workflow change before it goes live."}
      - {from: c_oscpa, subject: "OSCPA Tax Alert: Ohio CAT reminders", body: "Quarterly CAT filers: the third-quarter return is due November 10. A reminder that the annual exclusion is taken on the first return of the year."}
      - {from: c_jofa, subject: "JofA Daily: revenue recognition questions for manufacturers", body: "Today: bill-and-hold under ASC 606, shipping terms and control, and what auditors ask about month-end shipments."}
      - {from: c_closedigest, subject: "The Close: the flux commentary your CFO actually reads", body: "This week: lead with the driver, quantify it, and separate one-offs from run rate. Reader question: what threshold to use for balance sheet flux."}
      - {from: c_jofa, subject: "JofA Daily: business email compromise is still winning", body: "Today: vendor bank-change fraud, look-alike domains, and why the callback to a known number is still the control that works."}
      - {from: c_oscpa, subject: "OSCPA member news: volunteer for the student case competition", body: "Members are needed as judges for the spring student case competition. Two-hour commitment; sign up in the member portal."}
      - {from: c_closedigest, subject: "The Close: borrowing base certificates without surprises", body: "This week: eligibility rules people forget, tying the certificate to the aging and the inventory report, and who should sign."}
      - {from: c_jofa, subject: "JofA Daily: preparing for interim fieldwork", body: "Today: building a PBC tracker, assigning owners, and keeping sensitive data off email."}
      - {days: [5], from: c_closedigest, subject: "The Close: Friday reading", body: "This week's reader survey: how many days does your close take, and what would cut one day? Results next week."}
      - {from: c_oscpa, subject: "OSCPA: Accounting and Auditing Update registration", body: "Registration is open for the winter Accounting and Auditing Update. Early pricing ends 11/30."}
      - {days: [5], from: c_jofa, subject: "JofA Daily: the weekly roundup", body: "This week's most read: 1099 thresholds, the self-approval gap, and a manufacturer's guide to cutoff testing."}
