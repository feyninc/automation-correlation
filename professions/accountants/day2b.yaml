  - {id: a2b-hanover, at: "D2 15:55", kind: reply, target: t1b-rosa, to: [c_rosa], summary: "told Rosa how to code the 2027 D&O renewal",
     body: "Not to expense: it's next year's coverage. Book it in November to 1400 prepaid insurance; Jade will add it to the prepaid schedule and amortize 1,650.00 a month starting January 2027. Nothing touches October."}
  - {id: a2b-credit-review, at: "D2 16:00", kind: noop, target: cal-elena, minutes: 30, summary: "AR and credit review with Rachel and Monique"}
