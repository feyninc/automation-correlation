     body: "Hi Kevin, September's reconciliations for all four bank accounts (x4417, x4441, x4425, x4433), as reviewed, are uploaded to request 1 in Suralink. October's follow after Friday's review. Elena"}
  - {id: a2b-2200-rec, at: "D2 17:30", kind: edit, app: docs, path: close/2026-10/rec-2200-accrued-liabilities, target: doc-2200-rec, title: "GL 2200 accrued liabilities reconciliation at 10/31 (Elena)",
     summary: "reconciled 2200 and found a June accrual never reversed",
     content: "# GL 2200 Accrued liabilities at 10/31/2026 (prepared Elena Moretti 11/3; reviewer Rachel Okafor)\n\nSupported open items:\n- Franklin County real property tax 2026, 9,250.00 x 10 months (paid in arrears in 2027): 92,500.00\n- JE-10308 utilities October (Grove City, at September's bill; reverses 11/1): 12,604.33\n- JE-10309 unbilled services October (Kettering 14,820.00, Buckeye 9,744.00, Columbus Crane 3,950.00; reverses 11/1): 28,514.00\n- JE-10310 line 2 Northfield Freight October (carrier report, 61 shipments; reverses 11/1; pending approval): 27,300.00\nSupported total: 160,918.33\n\nGL 2200 at 10/31 including pending entries: 185,798.33\nDifference: 24,880.00 = JE-08756 (6/30) accrued June legal fees for Kettering Lane, never reversed. The June invoice KL-2219 (24,880.00) was coded straight to 6810 and paid 7/24 (check 47502), so the June expense is in the books twice and the accrual is stale.\nCorrection JE-10319 (for Rachel's approval): Dr 2200 24,880.00 / Cr 6810 legal fees 24,880.00, October, with the KL-2219 bill and JE-08756 attached. Out of period but within the year and immaterial.\nAfter JE-10319: 160,918.33, no difference."}
  - {id: a2b-2200-mail, at: "D2 17:45", kind: new, app: mail, path: sent/rec-2200-stale-accrual, target: m2b-2200, to: [c_rachel],
     subject: "2200 rec: stale June legal accrual (JE-10319 for approval)", summary: "sent Rachel the 2200 rec and the correcting entry",
     body: "Rachel, the 2200 rec is in Docs > close. Every open item ties to support except 24,880.00: JE-08756, the June accrual for Kettering Lane's legal fees, was never reversed, and the actual June invoice (KL-2219, 24,880.00) went straight to 6810 in July. So legal fees are overstated by 24,880.00 year to date. JE-10319 reverses it (Dr 2200 / Cr 6810) in October; it's my entry, so it needs your approval. After it, 2200 is 160,918.33 and fully supported. Worth setting a reversal date on every manual accrual going forward. Elena"}

  - {id: a2b-mm-ok, at: "D2 09:58", kind: reply, target: t1-marco, to: [c_marco], summary: "approved the corrected interest entry and the 1020 rec",
     body: "Approved JE-10297 at 8,921.44 and signed off the 1020 rec as reviewer: 3,521,327.62 to the statement, no difference."}
  - {id: a2b-route-interest, at: "D2 12:40", kind: reply, target: t1-jade, to: [c_jade], cc: [c_tom], summary: "routed Jade's interest entry to Tom: over her limit",
     body: "Thanks Jade, the math is right now. At 333,388.33 it's over my 50,000 approval limit, so I've reassigned JE-10307 to Tom (he's in today)."}
  - {id: a2b-greg, at: "D2 15:35", kind: reply, target: t2b-greg, to: [c_greg], summary: "agreed to Greg's call tomorrow",
