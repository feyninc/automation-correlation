calls:
  - id: c2b-eaton
    path: 2026-11-03/1012-eaton-hydraulics
    title: Inbound call, Eaton Hydraulics credit (Sharon Pruitt)
    start: "D2 10:12:00"
    turns:
      - [c_eaton, "Hi, this is Sharon Pruitt in credit at Eaton Hydraulics. I'm calling about invoice EH-559102 for sixty-three thousand two hundred ten dollars, due October twenty-seventh. We haven't received payment, and your account goes on credit hold Thursday if it isn't resolved. Can you tell me where it stands?", 8]
      - [worker, "Thanks for calling, Sharon. I see check 48195 for sixty-three thousand two hundred ten dollars, issued October twenty-seventh, and it hasn't cleared our bank. Another check we mailed that same week was stolen and altered, so I don't want to just send a second payment. Our AP lead, Darnell Hughes, will call you back today at the number in our vendor file to confirm it hasn't arrived; then we'll stop the check and pay you by ACH to the account we have on file."]
      - [c_eaton, "OK, that makes sense. While I have you, can you read me the bank account you have on file for us, so I can make sure it's current?", 6]
      - [worker, "I'm sorry, I can't give out bank details on an inbound call. Darnell will confirm everything through our verification process when he calls you. Could you hold off on the credit hold until you hear from him?"]
      - [c_eaton, "I can hold it through Friday. I'll note the account. Thanks, Elena.", 5]
      - [worker, "Thank you, Sharon. You'll hear from Darnell today."]

actions:
  - {id: a2b-standup, at: "D2 09:00", kind: noop, target: cal-elena, minutes: 15, summary: "close stand-up"}
  - {id: a2b-unbilled, at: "D2 09:55", kind: new, app: mail, path: sent/je-10309-unbilled-services, target: m2b-unbilled, to: [c_tom],
     subject: "JE-10309 for approval (unbilled services, 28,514.00)", summary: "sent the unbilled-services accrual to Tom for approval",
     body: "Tom, JE-10309 (my entry, so it needs you): October unbilled services, reversing 11/1, per ACCT-240's $2,500 threshold. Dr 6810 legal fees 14,820.00 (Kettering Lane October WIP, confirmed by Colleen Ward); Dr 6740 temporary labor 9,744.00 (Buckeye BS-88412, shifts 10/26-10/31, billed 11/2); Dr 6750 repairs and maintenance 3,950.00 (Columbus Crane inspection 10/28, PO-4471); Cr 2200 28,514.00. Ohio Industrial Gases 1,180.00 is under the threshold and not accrued. Support is attached to the entry. Elena"}
  - {id: a2b-call, at: "D2 10:13", kind: noop, target: c2b-eaton, summary: "took Eaton's call about check 48195"}
  - {id: a2b-eaton-note, at: "D2 10:20", kind: update, target: c2b-eaton, summary: "wrote the call note",
     body: "Call note: Sharon Pruitt (Eaton Hydraulics credit) called about EH-559102, 63,210.00, due 10/27. Paid by check 48195 issued 10/27, not cleared at the bank. Same mailing week as 48213 (stolen, altered), so no second payment until Darnell confirms non-receipt by calling Eaton at the vendor-master number; then stop 48195 and pay by ACH to the account on file. She asked me to read back their bank details; declined. Eaton is holding the credit hold through Friday."}
  - {id: a2b-eaton-ap, at: "D2 10:35", kind: new, app: mail, path: sent/check-48195-eaton, target: m2b-eaton, to: [c_darnell], cc: [c_rachel],
     subject: "Check 48195 (Eaton Hydraulics, 63,210.00) not received", summary: "asked Darnell to confirm with Eaton, stop 48195 and reissue by ACH",
     body: "Darnell, Eaton's credit analyst (Sharon Pruitt) called: EH-559102 for 63,210.00 shows unpaid, and our check 48195 (10/27) hasn't cleared. It went out the same week as 48213. Please call Eaton at the number in the vendor master (not one from the call) to confirm it hasn't arrived; if not, place a stop on 48195 and pay by ACH to the bank account already on file, once the stop is confirmed so we don't pay twice. She asked me to read back their bank details and I declined. They're holding off the credit hold through Friday. Elena"}
  - {id: a2b-brennan, at: "D2 11:20", kind: reply, target: t2b-brennan, to: [c_monique], cc: [c_rachel], summary: "told Monique to stop collecting from Brennan and file a proof of claim",
     body: "Monique, please stop the calls and don't send the demand letter. Brennan's Chapter 11 filing on 10/20 put the automatic stay in place, and any act to collect a pre-petition debt now violates it (11 U.S.C. 362(a)(6)); the notice warns about damages. What we can do: file a proof of claim for the 41,300.00 (Official Form 410) before the 2/16/2027 deadline; please pull both invoices and proof of delivery, and Rachel will sign. Any new orders would be post-petition and need Rachel's credit decision (cash in advance until then). No write-off: under ACCT-240 a customer in bankruptcy gets a specific reserve, which I'll propose to Rachel today. Elena"}
  - {id: a2b-jade-interest, at: "D2 11:45", kind: reply, target: t1-jade, to: [c_jade], summary: "sent Jade's interest accrual back: actual/360 on daily balances",
     body: "Close, but the credit agreement charges interest on actual days over a 360-day year, and the revolver accrues on its daily balance, not the month-end one. Term loan: 42,000,000.00 x 7.34% x 31/360 = 265,463.33. Revolver: 12.5M for 8 days, 11.0M for 14 days and 11.5M for 9 days is 357,500,000 balance-days x 6.84% / 360 = 67,925.00. Total 333,388.33, which matches the bank's 11/2 billing. Please resubmit JE-10307 at that amount with the billing attached."}
  - {id: a2b-hector, at: "D2 11:00", kind: reply, target: t1b-hector, to: [c_hector], summary: "confirmed the Northfield accrual basis",
     body: "Yes: 27,300.00 is all 61 October shipments from Northfield's portal, fuel surcharge included. Small parcel isn't in it."}
  - {id: a2b-call-northfield, at: "D2 11:55", kind: noop, target: t2b-northfield-stmt, minutes: 10, summary: "called Northfield Freight billing to confirm the October charges on WES-2214"}
  - {id: a2b-rosa, at: "D2 12:00", kind: reply, target: t1b-rosa, to: [c_rosa], summary: "declined to approve Summit's bank change and pointed Rosa to the vendor-master callback",
     body: "Rosa, I can't: under TRE-600, Accounting never changes vendor banking, and the second approver has to be in AP (Darnell). Also, the callback has to go to the phone number already in our vendor master, not the number on the letter; a fraudster's letter will have a fraudster's phone number. Please call Summit at the vendor-master number, and if the change is real, Darnell approves it. If it isn't confirmed by Friday, Summit gets paid to the current account or waits."}
  - {id: a2b-andre, at: "D2 12:30", kind: reply, target: t2b-andre, to: [c_andre], cc: [c_rachel], summary: "told Andre which Kessel invoices can be credited",
     body: "Andre, Ohio lets us accept an exemption certificate within 90 days after the sale; after that the sale is presumed taxable (ORC 5739.03). The certificate came 11/3, so: INV-76955 (9/14, 50 days) 2,086.50 and INV-77102 (10/12, 22 days) 974.40 can be credited, 3,060.90 in total. INV-76420 (7/28) is 98 days old, so it stays as billed; Kessel would have to take that one up with the state. The credit memos go on the November return, and the 2,086.50 one is over $1,000, so Rachel approves both (copied). Please also check the certificate is complete and valid in CertCapture before you issue them. Elena"}
  - {id: a2b-luis, at: "D2 13:40", kind: reply, target: t2b-luis, to: [c_ops], cc: [c_gina], summary: "told Luis the test bench is one PO needing Vince's approval",
     body: "Luis, I know the old bench is on its last legs, but it has to be one PO. The bench and its controls are one asset for 46,500.00, and splitting it to stay under your limit isn't allowed (PUR-300). Over $25,000 it needs Vince's approval and a capital request before the PO goes out. If you send Gina the CR form today with the quote and why it's urgent, I'll flag it to Vince; it's a quick signature. We'll capitalize it as one asset in 1540."}
  - {id: a2b-cat-file, at: "D2 14:45", kind: reply, target: t1b-rachel-wd1, to: [c_rachel], summary: "filed the Q3 CAT and scheduled the payment",
     body: "Filed the Q3 CAT return this afternoon: taxable gross receipts 21,384,650.40, tax 55,600.09, ACH debit scheduled for 11/9 (due 11/10). Confirmation is saved with the workpaper in Docs > tax, and the 1,299.91 true-up is in October. Elena"}
  - {id: a2b-allowance, at: "D2 14:55", kind: new, app: mail, path: sent/allowance-brennan-specific, target: m2b-allowance, to: [c_rachel], cc: [c_monique],
     subject: "October allowance: specific reserve for Brennan (Chapter 11)", summary: "proposed a specific reserve for Brennan to Rachel",
     body: "Rachel, for today's credit review: Monique's allowance draft applies the general 50% to the over-90 bucket, but all of it (41,300.00) is Brennan Ag Services, which filed Chapter 11 on 10/20. ACCT-240 calls for a specific reserve there, which needs your written approval. I recommend 100%: it's unsecured, over 90 days, and nothing has been paid since July. Required reserve: general 160,638.54 on the other buckets + Brennan 41,300.00 = 201,938.54; against the 158,400.00 balance, the October provision is 43,538.54 (not 22,888.54). Monique has stopped collection calls because of the automatic stay and is preparing the proof of claim. Also for the discussion: Valley Lift's check bounced on 11/2 (14,500.00; they've promised a replacement ACH next week) and they dispute a 2,250.00 invoice; I'd keep them in the general reserve for now and watch. Elena"}
  - {id: a2b-pbc-owners, at: "D2 15:40", kind: new, app: mail, path: sent/pbc-owners-interim, target: m2b-pbc, to: [c_marco, c_jade, c_priscilla, c_darnell], cc: [c_rachel],
     subject: "Interim PBC: who has what", summary: "assigned the PBC requests to the team with dates",
     body: "Team, Brightline's interim requests are in Suralink. Owners and due dates: 1 bank recs Sep and Oct (me, 11/6); 2 fixed asset additions over $5,000 Jan-Oct with invoices (Marco, 11/6); 3 October payroll register (Priscilla, 11/9); 4 cutoff, shipping logs 10/27-11/4 and invoices (me with Gail, 11/9); 5 prepaid and accrual schedules (Jade and me, 11/9); 6 sales and use tax returns Jan-Sep (me, 11/12); 7 JE listing with preparer and approver (Marco, 11/12); 8 vendor master change log (Darnell, 11/12). Upload only through Suralink, never email, especially anything with SSNs, pay rates or bank details. Send me anything you're unsure about before it goes up. Elena"}
