# Tuesday 2026-11-03 (WD2), the rest of the day. Accruals: Elena books the unbilled services from Monday's search
# and reconciles 2200, which turns up a June legal accrual that was never reversed. Jade's interest accrual uses
# 30/360 on the month-end balance. A customer in Chapter 11 sits in the over-90 bucket while AR keeps calling it.
# Eaton calls about a $63,210.00 check mailed the same week as the stolen one. Rosa asks Elena to approve a vendor bank
# change she verified at the number on the vendor's own letter. Luis wants the test bench on two POs. Kessel's
# exemption certificate arrives for three invoices, one of them past 90 days. The CAT is approved and filed.
#
# Arithmetic (python3):
# - JE-10309 unbilled services: 14,820.00 + 9,744.00 + 3,950.00 = 28,514.00.
# - Interest, actual/360: term loan 42,000,000.00 x 7.34% x 31/360 = 265,463.33. Revolver balance-days
#   12,500,000 x 8 (10/1-10/8) + 11,000,000 x 14 (10/9-10/22) + 11,500,000 x 9 (10/23-10/31) = 357,500,000;
#   x 6.84% / 360 = 67,925.00 (average 11,532,258.06). Total 333,388.33 = the bank's 11/2 billing. Jade's draft (30/360,
#   month-end balance): 42,000,000 x 7.34% / 12 = 256,900.00 + 11,500,000 x 6.84% / 12 = 65,550.00 = 322,450.00,
#   short by 10,938.33.
# - Allowance (ACCT-240): current 14,218,400.65 x 0.5% = 71,092.00; 1-30 2,810,455.20 x 2% = 56,209.10; 31-60
#   402,118.70 x 5% = 20,105.94; 61-90 88,210.00 x 15% = 13,231.50; general 160,638.54. Monique's draft adds 50% of
#   the 41,300.00 over 90 = 181,288.54 (provision 22,888.54 over the 158,400.00 balance). Brennan (all of the over-90,
#   18,900.00 + 22,400.00) reserved specifically at 100%: 201,938.54, provision 43,538.54. 61-90 = Valley Lift 2,250.00
#   + Orchard Hill 40,180.00 + Delmar 45,780.00 = 88,210.00.
# - Kessel certificate received 11/3: INV-76420 7/28 is 98 days old (outside 90); INV-76955 9/14 is 50 days; INV-77102
#   10/12 is 22 days. Credit 2,086.50 + 974.40 = 3,060.90 (all three would be 4,473.15).
# - Hanover D&O 2027: 19,800.00 / 12 = 1,650.00 a month from January 2027.
# - 2200 at 10/31: property tax 10 x 9,250.00 = 92,500.00 + utilities 12,604.33 + JE-10309 28,514.00 + Northfield
#   27,300.00 = 160,918.33 supported; GL with pending entries 185,798.33; difference 24,880.00 = JE-08756 (June legal
#   accrual, Kettering Lane) never reversed after invoice KL-2219 was expensed in July.

