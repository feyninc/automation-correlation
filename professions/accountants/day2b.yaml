  - {id: a2b-gail, at: "D2 17:00", kind: reply, target: t2b-gail-cutoff, to: [c_gail], cc: [c_marco], summary: "told Gail what the auditors need for cutoff",
     body: "Good instinct, Gail. For request 4 they need every shipment from 10/27 through 11/4: ship date, invoice number, customer, shipping terms and the proof of delivery date, and they'll pick a sample to see the PODs and invoices. Pricing isn't needed; the invoice amounts come from our side. Please send the extract to me and I'll check it ties to Wednesday's cutoff log before I upload it to Suralink."}
  - {id: a2b-je10313, at: "D2 17:35", kind: reply, target: t2-monique, to: [c_monique], summary: "approved Monique's revised allowance entry",
     body: "Approved JE-10313 at 43,538.54, matching Rachel's approval of the Brennan specific reserve (her email is attached to the entry as support). Thanks."}
  - {id: a2b-je10308, at: "D2 17:50", kind: reply, target: t1-jade, to: [c_jade], summary: "approved Jade's utilities accrual",
     body: "Approved JE-10308: September's Grove City bill (check 48190) is a fair estimate for October usage, and it reverses 11/1."}

  - {id: a2b-priscilla-ot, at: "D2 13:30", kind: reply, target: t2b-priscilla-ot, to: [c_priscilla], cc: [c_rachel], summary: "told Priscilla the accrual stays on policy 3.2 and how overtime is caught",
     body: "Thanks Priscilla, useful. The accrual stays on policy 3.2 (last period's gross x 5/10 plus FICA) so it's consistent month to month. The overtime gets caught when the 11/13 payroll posts against the reversal: if the real October share is far off, it shows as a November variance. Could you send me the 11/13 gross once it's previewed? If the October portion is more than about 50,000 above the estimate, I'll flag it to Rachel for the package. Elena"}

