     body: "Hello, thank you for checking. That credit was our error: your 10/29 wire of $18,430.00 for invoice 77120 was recorded twice in our system, so the statement showed it once as applied and once as unapplied. We corrected it on 11/4, so there's no overpayment and nothing to refund. Your current statement shows invoice 77193 for $22,104.50, due 11/29. Monique will send the corrected statement. Elena Moretti, Westerby Fluid Systems"}
