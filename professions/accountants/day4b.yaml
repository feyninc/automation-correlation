     subject: "October balance sheet flux (10/31 vs 9/30)",
     body: "Rachel, balance sheet flux on the lines over 100,000, or over 10% with a change of at least 10,000. Cash x4417 +830,202.34 (35.5%): lockbox collections ran ahead of disbursements in the last week (deposits 10/29-10/31 alone were 546,679.09, including the two in transit), after a net 1,000,000.00 paydown of the revolver. AR +578,174.15: higher October billing; Cascade's 96,214.00 of September invoices paid 11/2, after month end; the duplicate Hartline import is gone. Allowance +43,538.54: Brennan's Chapter 11, reserved specifically at 100% (41,300.00), per your approval. Inventory +567,300.00: the 12 HPU-40s built for Cascade (159,300.00) are in finished goods until December, plus Q4 raw material buys. In transit +58,420.00 (new): JE-10314, FOB Destination goods delivered in November; reverses 11/1. Prepaids -11,520.84: amortization, including the FabTech deposit expensed; Avalara fully amortized (renewal books in November). Accumulated depreciation +212,580.00, which becomes 211,940.00 once Marco removes the 640.00 of October depreciation on the Hoosier fixture. AP +493,785.35: late-October inventory receipts and the Hoosier invoice (paid Friday with the discount). Accrued liabilities +14,707.93 (10.1%): unbilled services JE-10309 28,514.00, property tax 9,250.00, Northfield and utilities 1,823.93 higher, less the stale June accrual reversed 24,880.00. Accrued payroll +246,120.19: five working days accrued vs three at September. Accrued bonus +100,000.00: the monthly accrual. CAT payable +17,264.69: October accrual 18,564.60 less the Q3 true-up 1,299.91; Q3 is paid 11/9. Revolver -1,000,000.00: paydown 1,500,000.00 on 10/9, advance 500,000.00 on 10/23. Everything else is under the threshold. Elena"}

