     subject: "October gross margin: mix vs rate",
     body: "Rachel, gross margin went from 27.998% in September to 27.818% in October, down 0.18 points, and it's mix, not pricing or cost. Mix: -0.24 points. Power units, our lowest-margin line (24.0% both months), rose from 36.0% to 38.6% of revenue (7,466,300 vs 6,800,000), while valves (about 33%) and service (38-39%) shrank. Rate: +0.06 points. Line margins were flat or slightly better: power units 24.0% both months, valves 32.9% vs 33.0%, pumps 25.1% both months, service 39.0% vs 38.0%. In October dollars, mix cost about 47,000 of margin and rate added about 12,000. Calculation (weights times September margins, then October weights times the margin change) and the product-line data are in Docs > close. Elena"}
