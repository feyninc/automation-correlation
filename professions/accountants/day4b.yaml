# Thursday 2026-11-05 (WD4), the rest of the day. Audit kickoff at 9 and the P&L flux by noon (day4.yaml); Rachel
# also wants the balance sheet flux for the package and, after a walkthrough, a mix-versus-rate bridge for the gross
# margin. Nadia can't place 58,420.00 on the inventory rec. Darnell's Friday payment run carries a re-sent Midwest
# Bearing invoice that check 48182 already paid. Paul's sandbox test fails one of Elena's cases. Kevin calls about the
# Hoosier fixture's cost and asks to borrow Elena's NetSuite login.
#
# Arithmetic (python3):
# - Balance sheet 10/31 vs 9/30 (threshold: over 100,000, or over 10% when the change is at least 10,000):
#   cash 1010 3,165,821.02 - 2,335,618.68 = +830,202.34 (35.5%); AR 17,560,484.55 - 16,982,310.40 = +578,174.15;
#   allowance -43,538.54 (27.5%); inventory +567,300.00 (12 HPU-40 for Cascade 159,300.00); in transit +58,420.00
#   (new); prepaids -11,520.84 (21.6%); accumulated depreciation -212,580.00 (211,940.00 after Marco removes the
#   640.00); AP -493,785.35; 2200 -14,707.93 (10.1%) = JE-10309 28,514.00 + property tax 9,250.00 + Northfield
#   (27,300.00 - 25,900.00) 1,400.00 + utilities (12,604.33 - 12,180.40) 423.93 - stale accrual 24,880.00; 2210
#   -246,120.19 (602,107.98 vs 355,987.79: 5 working days vs 3); 2220 -100,000.00; 2330 -17,264.69 (18,564.60 -
#   1,299.91); revolver +1,000,000.00 (paydown 1,500,000.00, advance 500,000.00). Deposits 10/29-10/31: 214,662.18 +
#   166,204.90 + 88,317.45 + 52,118.40 + 25,376.16 = 546,679.09. Below threshold: 1020 +8,921.44,
#   FA cost +41,472.00, Amex -4,492.54, 2240 -3,937.14, 2250 -11,828.33 (3.7%), 2310 -2,884.82, 2320 -3,434.65.
# - Gross margin bridge (weights w = line revenue / total; m = line margin): September 27.998%, October 27.818%,
#   change -0.180 pts. Mix = sum((w_oct - w_sep) x m_sep) = -0.243 pts; rate = sum(w_oct x (m_oct - m_sep)) =
#   +0.063 pts. Power units 35.97% -> 38.62% of revenue at 24.0% margin both months. In October dollars: mix
#   -46,961.50, rate +12,182.68.
# - Inventory: perpetual 9,884,300.00 + 2,410,500.00 + 14,212,600.00 = 26,507,400.00 = GL 1300; GL 1310 58,420.00 is
#   JE-10314 (cost of the three FOB Destination shipments delivered in November: 24,730.00 + 20,955.00 + 12,735.00).
# - Friday run: 63,210.00 + 18,240.00 + 37,632.00 + 8,415.75 + 22,915.40 + 6,112.80 + 826.84 + 9,744.00 + 3,208.55 =
#   170,305.34; without the duplicate MBS-44120A (8,415.75) 161,889.59. Hoosier 38,400.00 x 98% = 37,632.00.
# - Hoosier fixture: 38,400.00 + use tax 3,072.00 = 41,472.00; / 60 = 691.20 a month from November.

