     body: "Call note: Kevin Doyle (Brightline). (1) Hoosier fixture at 41,472.00 vs invoice 38,400.00: explained the 3,072.00 Ohio use tax (8.0%, Indiana vendor, none charged), capitalized under ACCT-410; in service 10/27, depreciation from November at 691.20 a month. (2) He asked for NetSuite read-only access, or to use my login: declined the login; access is Rachel's decision, Paul would set up an auditor role. Asking Rachel today."}
