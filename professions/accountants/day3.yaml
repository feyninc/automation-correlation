  - {id: a3-billhold, at: "D3 11:40", kind: new, app: mail, path: sent/cascade-bill-and-hold, target: m3-billhold, to: [c_rachel], cc: [c_brett],
     subject: "Cascade PO 88120 ($212,400): bill-and-hold assessment", summary: "sent Rachel the bill-and-hold analysis",
     body: "Rachel, Brett asked to invoice Cascade PO 88120 ($212,400.00) in October as bill-and-hold. Against ASC 606-10-55-83: (a) substantive reason: met, Cascade asked in writing on 10/28 to hold until their plant is ready; (b) identified separately as Cascade's: not met, the 12 units are in general finished goods, not tagged or segregated; (c) ready for transfer: yes; (d) we can't use them or send them elsewhere: not met, 2 of the 12 were picked for Pemberton on 11/2. So it doesn't qualify for October, and the terms are FOB Destination anyway. My recommendation: no October revenue. If Cascade wants the arrangement going forward, we'd need segregated, tagged units and your written approval before month end. Your call. Elena"}
  - {at: "D3 11:05", kind: read, target: t2-monique, summary: "read Monique's question about the Hartline credit"}
  - {id: a3-monique, at: "D3 11:15", kind: reply, target: t2-monique, to: [c_monique], summary: "told Monique to reverse the duplicate import",
     body: "Yes, it's a duplicate: the bank imported the same 18,430.00 wire as CR-55102 on 10/30 after Marco's manual JE-10288 on 10/29. Please don't apply it to November; reverse/delete CR-55102 dated 10/30 so both cash and AR come out. That clears the last item on the bank rec. And let's switch the import to auto-match against manual wire entries."}
  - {id: a3-owen, at: "D3 14:15", kind: reply, target: t3-owen, to: [c_owen], cc: [c_rachel, c_vince], summary: "redirected the sponsor's request to Vince and Rachel",
