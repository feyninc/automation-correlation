     summary: "wrote the revenue cutoff and its entry",
     content: "# October revenue cutoff (shipping log 10/29-11/3)\n\nFOB Destination invoices dated October, delivered November (control passes on delivery, ACCT-500):\n- INV-77190 Valley Lift Trucks, delivered 11/2: revenue 34,210.00, cost 24,730.00\n- INV-77195 Kessel Mobile Equipment, delivered 11/2: revenue 28,947.25, cost 20,955.00\n- INV-77199 Arbor Crane, delivered 11/3: revenue 17,662.50, cost 12,735.00\nTotal: revenue 80,819.75, cost 58,420.00, margin 22,399.75.\nJE-10314 (reverses 11/1): Dr 4000 revenue 80,819.75 / Cr 2400 deferred revenue 80,819.75; Dr 1310 inventory in transit 58,420.00 / Cr 5000 COGS 58,420.00.\nOK as recorded: INV-77188, 77193 (Shipping Point), INV-77200 (Destination, delivered 10/31), INV-77204 (November)."}
