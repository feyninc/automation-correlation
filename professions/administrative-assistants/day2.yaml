    title: "Legal hold notice: project 14-208 (Hartwell Commons)"
    at: "D2 11:00"
    author: c_martin
    content: |
      # LEGAL HOLD: project 14-208, Hartwell Commons site drainage

      Effective immediately. Hartwell Developers LLC has notified us of a claim concerning the site drainage design.
      Preserve every record relating to project 14-208, paper and electronic: drawings, calculations, correspondence,
      as-builts, field notes, email, Teams messages. Suspend all routine destruction of those records, including
      scheduled shredding. Do not discuss the matter or release any 14-208 records outside the firm; send any request
      to me. This hold stays until I release it in writing. Martin Keough, General Counsel

