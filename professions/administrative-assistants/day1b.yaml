    content: |
      # Delaware County Regional Sewer District: notice of entry for survey

      (Letterhead of the District. Address block and salutation from the parcel list.)

      The Delaware County Regional Sewer District is planning the Alum Creek interceptor sewer. Under Ohio Revised
      Code 163.03, the District gives notice that survey crews from Corwin Leffel Engineers, working for the
      District, will enter your property on or after Monday, December 7, 2026, between 7:30 a.m. and 5:00 p.m., to
      survey the proposed sewer route. Crews will carry identification, stay on foot where possible, and leave gates
      as they find them. The District will repair or pay for any damage caused by the survey.

      Questions: Andrea Kowal, Project Engineer, 740-555-0123, akowal@delco-sewer.example.

      Signed for the District: Michael Tran, P.E., Sanitary Engineer (signature on file; the District approved this
      text on 10/29/2026).

