    content: |
      # Statement of Qualifications: submittal requirements (RFQ section 5)

      - Due Friday, November 6, 2026, 12:00 p.m. local time, at the City of Upper Arlington Engineering Division
        (Municipal Services Center front counter). Late submittals will not be opened. Emailed or faxed submittals
        are not accepted.
      - Five (5) bound copies and one (1) unbound original bearing original signatures, plus one USB drive with a
        single PDF of the complete SOQ, in a sealed envelope marked "SOQ: Stormwater Master Plan Update".
      - The transmittal letter is signed by an officer or authorized principal (Corwin Leffel: Maren Holt, Group
        Manager, under the firm's signature authority list).
      - Form C, Affidavit of Non-Collusion, signed by the same person and notarized, included in the original.
      - Page limit 40, excluding cover, tabs, resumes and Form C.

