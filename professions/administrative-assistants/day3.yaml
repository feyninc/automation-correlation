    title: CTP options for CTP-88412 (Charlotte 11/12-11/13)
    at: "D3 08:40"
    author: c_sasha
    content: |
      # CTP-88412 options (Maren Holt, Greg Tobin)

      Air: AA 5112 Thu 11/12 CMH 07:05 -> CLT 08:41; AA 5139 Fri 11/13 CLT 13:20 -> CMH 14:55. Change fee: fare
      difference $46.00 per traveler. 11/10 flights cancelled on rebooking.
      Hotel (11/12, 1 night; GSA Charlotte $143):
      1. Hampton Inn Charlotte Uptown, $139 + tax, 1.4 miles from 1300 S Tryon (about 6 minutes by car; free shuttle
