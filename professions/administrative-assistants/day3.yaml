# Wednesday 2026-11-04. The day before the review. Dan adds Maya (room, lunch, pass, tour) and wants Sharon and Kevin
# on the tour, which takes it past Bramhall's 8-visitor cap. Maren asks for an above-GSA Charlotte hotel and a split
# P-card purchase. Visitor names are due to Bramhall by 13:30, the lunch increase by 12:30, the site rules to the
# visitors before they travel. Agenda packets include a compensation worksheet.
#
# Arithmetic: tour: 4 HQ (Tom, Felicia, Owen, Maya) + Dan, Maren, Greg + Sharon + Kevin = 9 against 8 per escort.
# Lunch back to 13: $370.98. Ivey on Tryon $219 vs the $143 GSA cap: $76 over per room-night, $152 for two rooms.
# Chairs 6 x $130 = $780 (over the $500 P-card limit).

