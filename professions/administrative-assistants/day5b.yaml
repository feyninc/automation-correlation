     summary: "wrote the Q1 review checklist with lessons from Q4",
     content: "# Q1 Regional Ops Review, Thursday 2/4/2027: planning checklist\n\nLessons from 11/5 are marked (Q4).\n\n- [ ] Book Scioto 08:30-12:30 and check the room calendar for clashes before inviting (Q4: Kevin's 10:00 call was double-booked).\n- [ ] Hotel: Lennox block of 5 for Wed 2/3 at $136 (agreement with Dan); rooming list by 1/13; cancellations before 18:00 the day before; check the folio against cancellations (Q4: a cancelled room was billed).\n- [ ] Garage passes 48 hours ahead through the portal; late additions get a paper pass from Brookside (Q4: Maya).\n- [ ] Envoy pre-registration for every visitor the day before.\n- [ ] Catering: final count 48 hours ahead, increases until 24 hours; dietary notes; driver to the Mound St dock and freight elevator.\n- [ ] Site visit: get the contractor's visitor rules when the date is set; send boots, long pants, photo ID and the orientation video to everyone, including late additions (Q4: Maya and Sharon were added after the notice); names 24 hours ahead; 8 visitors per escort, so ask for a second escort for more than 8; ask about crane lifts or other work that day (Q4: the tour moved for a lift).\n- [ ] Van: check the fleet calendar for the hours after the tour too (Q4: Laura's 16:00 booking).\n- [ ] Packets: confidential attachments in sealed copies for the closed-session members only; collect them afterwards.\n- [ ] Minutes: decisions and actions only; the chair reviews before distribution; the closed session is not minuted; outside guests get an approved summary only.\n- [ ] Records: minutes permanent, visitor log 2 years."}
